<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<title>Fortress — Debt &amp; Margin Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --delta-good:#006300;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
    --delta-good:#0ca30c;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:76px;max-width:760px;margin:0 auto}
header{padding:18px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
header .stamp{font-size:11px;color:var(--muted)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:40;max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.hero{font-size:34px;font-weight:700;letter-spacing:-.02em}
.hero-sub{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile .l{font-size:11px;color:var(--muted);margin-top:2px}
.tile .d{font-size:11px;margin-top:2px;color:var(--ink2)}
.pos{color:var(--delta-good)} .neg{color:var(--critical)}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.banner b{display:block;font-size:14px}
.banner .ic{font-size:16px;line-height:1.3}
.b-good{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.b-warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.b-serious{background:color-mix(in srgb,var(--serious) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--serious) 45%,transparent)}
.b-critical{background:color-mix(in srgb,var(--critical) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--critical) 45%,transparent)}
.gauge{margin:6px 0 2px}
.gauge .track{position:relative;height:22px;border-radius:6px;background:var(--grid);overflow:visible}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--s1)}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.gauge .mark.actual{background:var(--critical);width:3px}
.gauge .mlab{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.gauge .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px;gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)} .kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;fill:var(--muted);font-size:10px}
svg.chart .lab{fill:var(--ink2);font-size:10.5px}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .axisline{stroke:var(--axis);stroke-width:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--page);border:none;border-radius:12px;padding:12px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
input[type=number],input[type=text]{width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
label.fld{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
table.hist{width:100%;border-collapse:collapse;font-size:12px}
table.hist th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--axis);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
table.hist td{padding:8px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
table.hist th:first-child,table.hist td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--page);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin-bottom:10px}
.hidden{display:none !important}
.spin{width:18px;height:18px;border:2px solid var(--page);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-left:6px;vertical-align:middle}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:10px;font-size:12px;margin:8px 0}
.fine{font-size:10.5px;color:var(--muted);line-height:1.5;margin:14px 4px 20px}
</style>
</head>

<script>
'use strict';
/* ================= constants / helpers ================= */
const VERSION = 'v2026:AUG:22-17:16';
const PDFJS_URL = 'pdf.min.js';           // vendored — no CDN dependency
const PDFJS_WORKER = 'pdf.worker.min.js';
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';  // fallback only
const ILLUSTRATIVE_LV = [50,60,70]; // % — labelled illustrative, NOT DBS figures

const fmt = (n,dp=0)=> n===null||n===undefined||isNaN(n) ? '—' :
  n.toLocaleString('en-SG',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money = (n,dp=0)=> n===null||n===undefined||isNaN(n) ? '—' : (n<0?'-':'')+'S$'+fmt(Math.abs(n),dp);
const pct = (n,dp=2)=> n===null||n===undefined||isNaN(n) ? '—' : fmt(n,dp)+'%';
const esc = s=> String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const monthLabel = iso=>{ const [y,m]=iso.split('-'); return new Date(+y,+m-1,1).toLocaleString('en',{month:'short'})+'-'+y.slice(2); };
const daysUntil = iso=>{ if(!iso) return null; return Math.ceil((new Date(iso+'T00:00:00')-new Date())/86400000); };
const dayLabel = iso=>{ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return (+d)+' '+new Date(+y,+m-1,1).toLocaleString('en',{month:'short'})+' '+y; };

/* ================= storage (guarded — works without localStorage) ================= */
const memStore = {};
const store = {
  get(k,fb){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return memStore[k]??fb; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ memStore[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
};
/* migrate data saved under the app's former name — runs once, keeps your history */
(function migrate(){
  try{
    ['snapshots','manual','income','mrtl','lv','reported','rateChanges','settings'].forEach(key=>{
      const oldK='dw.'+key, newK='fortress.'+key;
      if(localStorage.getItem(oldK) && !localStorage.getItem(newK)){
        localStorage.setItem(newK, localStorage.getItem(oldK));
      }
    });
  }catch(e){}
})();

/* ================= seed: parsed from the 31-Jul-2026 DBS statement ================= */
const SEED = {"statementDate":"2026-07-31","source":"DBS eStatement S/N S-6075227990332902 (seeded)","portfolios":[{"id":"S-607522-0","refCurrency":"SGD","totalAssets":2697000.94,"totalCash":58732.22,"totalEquity":2638268.72,"netAssets":2129445.83,"totalLoans":-567555.11,"loans":[{"ccy":"SGD","principal":-565472.93,"description":"MRTL SGD, 2.10%, 28/05/2026-31/08/2026","ratePct":2.1,"startDate":"2026-05-28","maturityDate":"2026-08-31","accrIntSGD":-2082.18,"valueSGD":-565472.93}],"ccyAlloc":{"USD":2002259.39,"SGD":454608.92,"HKD":191043.71,"JPY":28128.14,"EUR":20960.78},"perf":{"startMtd":2200678.77,"startYtd":1981070.61,"addWithMtd":1585.34,"addWithYtd":-127104.04,"end":2130397.76,"plMtd":-71866.35,"plYtd":276431.19,"pctMtd":-3.27,"pctYtd":15.06},"income":{"divMtd":876.86,"divYtd":17054.57,"intRecMtd":1.56,"intRecYtd":1426.33},"expenses":{"custodyMtd":0,"custodyYtd":1962.31,"txnMtd":146,"txnYtd":1827.52,"intPaidMtd":0,"intPaidYtd":8354.34},"leverageFactor":1.3,"leverageThreshold":6,"riskRating":4.2,"riskThreshold":5,"fxForwards":[{"buyCcy":"SGD","buyAmt":568563.67,"pair":"CHF/SGD","contractRate":1.6334936,"maturityDate":"2026-08-31","sellCcy":"CHF","sellAmt":-348066.05,"mtmSGD":15387.54}]},{"id":"S-607522-1","refCurrency":"SGD","totalAssets":40157.73,"totalCash":2.67,"totalEquity":40155.06,"netAssets":40157.73,"totalLoans":0,"loans":[],"ccyAlloc":{"USD":40155.07,"SGD":2.66},"perf":{"startMtd":40379.45,"startYtd":360839.25,"addWithMtd":-1585.25,"addWithYtd":-355972.7,"end":40157.73,"plMtd":1363.53,"plYtd":35291.18,"pctMtd":3.38,"pctYtd":13.71},"income":{"divMtd":125.7,"divYtd":429.77,"intRecMtd":0.04,"intRecYtd":6706.31},"expenses":{"custodyMtd":0,"custodyYtd":227.48,"txnMtd":0,"txnYtd":458.06,"intPaidMtd":0,"intPaidYtd":0},"leverageFactor":1,"leverageThreshold":6,"riskRating":4,"riskThreshold":5,"fxForwards":[]}],"fxRates":{"AUD":0.901837,"CAD":0.914943,"CHF":1.58766,"EUR":1.476189,"GBP":1.723823,"HKD":0.1635941503966831,"JPY":0.008003,"USD":1.28275}};

/* ================= other-bank debts (manual) — seeded from CK's UOB screenshots ================= */
const MANUAL_SEED = {
  "2026-05": { mortgageBalance:1347500.00, deposits:25073.57 },
  "2026-06": { mortgageBalance:1343116.85, deposits:25387.90 },
  "2026-07": { mortgageBalance:1338729.99, deposits:17702.23, mortgageRatePct:1.13, mortgagePayment:5485.67 },
  "2026-08": { mortgageBalance:1334490.74, mortgageRatePct:1.13, mortgagePayment:5485.67, nextDue:"2026-09-01",
               note:"Balance after the 03-Aug-2026 instalment (UOB app) — not a month-end statement figure" }
};
const MORTGAGE_META = { bank:'UOB', account:'168-821-222-2', original:1347500.00, tenorMonths:276, type:'SGD Housing Loan, floating rate' };

/* recurring income — seeded from the GIRO credits in CK's UOB statements */
const INCOME_SEED = [{
  id:'rent-atelier', label:'Rent — The Atelier', payer:'PLOETNER MATHIAS ALE',
  amount:5800.00, ccy:'SGD', frequency:'monthly', dayOfMonth:11,
  account:'UOB 372-304-221-4', startMonth:'2026-05', endMonth:null,
  source:'Inward CR - GIRO, observed on the May and Jun 2026 UOB statements'
}];

/* DBS's own wording for its two capacity figures — verbatim from the app's (i) tooltips.
   They are NOT the same quantity, which is why they don't reconcile. */
const CAPACITY_DEFS = {
  borrowingPotential:'This is the indicative amount you can borrow based on your current assets, subject to credit approval. It’s not an offer or a commitment to provide you credit facilities. To assess your actual credit limit, we’ll consider your account diversification needs, concentration limits, availability of qualifying collateral, and more.',
  availableForDrawdown:'This is the maximum you can draw down on your MRTL (Multi-Currency Revolving Term Loan). It’s an indicative amount based on your existing portfolio.'
};

/* DBS MRTL facility + live portfolio position — from the iBanking Portfolio Summary screen */
const MRTL_SEED = { '2026-08-19': {
  asOf:'2026-08-19', portfolioId:'S-607522-0',
  borrowingPotential:1240212.07, creditLimit:3000000.00,
  amountDrawn:567326.23, availableForDrawdown:1120577.90,
  totalAssets:2789261.47, totalLoans:568140.72, totalDerivatives:0,
  riskRating:4.2, riskThreshold:5.0, leverageFactor:1.2, leverageThreshold:6.0,
  source:'DBS iBanking — Portfolio Summary, 19-Aug-2026 12:05'
}};

/* Lending value (advance ratio) per portfolio.
   Derived = borrowing potential ÷ total assets, both read off the SAME screen at the SAME time. */
const LV_SEED = {
  'S-607522-0': { asOf:'2026-08-19', borrowingPotential:1240212.07, totalAssets:2789261.47,
                  basis:'derived', pledged:true, hasFacility:true,
                  source:'DBS iBanking Portfolio Summary 19-Aug-2026 12:05 — shows the MRTL facility and "Contact RM to draw down"' },
  'S-607522-1': { asOf:'2026-08-19', borrowingPotential:22970.17,   totalAssets:41085.73,
                  basis:'derived', pledged:false, hasFacility:false,
                  source:'DBS iBanking Portfolio Summary 19-Aug-2026 12:05 — "Your borrowing potential (indicative)" with "Apply with RM"; no MRTL facility on this account' }
};

/* Floating-rate revisions, from UOB's "Update to your loan" letters */
const RATE_CHANGE_SEED = [{
  id:'rc-2026-08', lender:'UOB', ratePct:1.13020, previousRatePct:1.02980,
  rateEffective:'2026-08-04', instalment:5546.93, instalmentEffective:'2026-10-01',
  recordedOn:'2026-08-20', source:'UOB letter "Update to your loan", dated 04/08/2026'
}];

/* Returns exactly as DBS reports them, each stamped with its metric AND its period.
   The same portfolio reads very differently over different windows, so a return is
   never stored without the dates that give it meaning. */
const REPORTED_SEED = [
  { id:'rep-0-1y-0818', portfolioId:'S-607522-0', metric:'TWRR', pct:34.93,
    from:'2025-08-18', to:'2026-08-18', capturedOn:'2026-08-19',
    source:'DBS app → Portfolio details → Performance, 1Y, TWRR' },
  { id:'rep-0-1y', portfolioId:'S-607522-0', metric:'TWRR', pct:32.91,
    from:'2025-08-19', to:'2026-08-19', capturedOn:'2026-08-20',
    source:'DBS app → Portfolio details → Performance, 1Y, TWRR' },
  { id:'rep-1-1y', portfolioId:'S-607522-1', metric:'TWRR', pct:27.19,
    from:'2025-08-19', to:'2026-08-19', capturedOn:'2026-08-20',
    source:'DBS app → Portfolio details → Performance, 1Y, TWRR' },
  { id:'rep-0-ytd', portfolioId:'S-607522-0', metric:'TWRR', pct:20.69,
    from:'2026-01-01', to:'2026-08-19', capturedOn:'2026-08-20',
    source:'DBS app → Portfolio details → Performance, Year to date (YTD), TWRR' },
  { id:'rep-1-ytd', portfolioId:'S-607522-1', metric:'TWRR', pct:22.97,
    from:'2026-01-01', to:'2026-08-19', capturedOn:'2026-08-20',
    source:'DBS app → Portfolio details → Performance, Year to date (YTD), TWRR' }
];
const METRIC_NOTE = {
  TWRR:'Time-weighted: strips your deposits and withdrawals out, so it measures how the holdings performed.'
};

/* ================= state ================= */
let state = {
  snapshots: store.get('fortress.snapshots', null),
  manual: store.get('fortress.manual', null),
  income: store.get('fortress.income', null),
  mrtl: store.get('fortress.mrtl', null),
  lv: store.get('fortress.lv', null),
  reported: store.get('fortress.reported', null),
  rateChanges: store.get('fortress.rateChanges', null),
  settings: store.get('fortress.settings', { lendingValue:null, ltvAlert:35, homeValue:null, tab:'dash', fxCcy:'USD', fxBars:250 })
};
if(!state.snapshots){ state.snapshots = { [SEED.statementDate]: SEED }; store.set('fortress.snapshots', state.snapshots); }
if(!state.manual){ state.manual = MANUAL_SEED; store.set('fortress.manual', state.manual); }
if(!state.income){ state.income = INCOME_SEED; store.set('fortress.income', state.income); }
if(!state.mrtl){ state.mrtl = MRTL_SEED; store.set('fortress.mrtl', state.mrtl); }
if(!state.lv){ state.lv = LV_SEED; store.set('fortress.lv', state.lv); }
if(!state.reported){ state.reported = REPORTED_SEED; store.set('fortress.reported', state.reported); }
if(!state.rateChanges){ state.rateChanges = RATE_CHANGE_SEED; store.set('fortress.rateChanges', state.rateChanges); }

/* ---- seed migrations ----------------------------------------------------
   A first install copies the seeds above. But an app that keeps gaining seeded
   readings needs those to reach devices that already installed an older build,
   WITHOUT touching anything the user entered. Each migration is additive and
   idempotent: it fills gaps and repairs missing fields, and never deletes.  */
const SEED_VERSION = 4;
function runSeedMigrations(){
  const from = store.get('fortress.seedVersion', 0);
  if(from >= SEED_VERSION) return 0;
  let changed = 0;

  // v2 — readings seeded after the first build (all four TWRR windows)
  state.reported = state.reported || [];
  REPORTED_SEED.forEach(seed=>{
    const dup = state.reported.some(r =>
      r.id===seed.id || (r.portfolioId===seed.portfolioId && r.metric===seed.metric && r.from===seed.from && r.to===seed.to));
    if(!dup){ state.reported.push({...seed, seeded:true}); changed++; }
  });

  // v3 — older MRTL entries predate portfolioId, which the advance-ratio lookup needs
  Object.values(state.mrtl||{}).forEach(m=>{
    if(!m.portfolioId){
      const withFacility = Object.keys(state.lv||{}).find(pid=>(state.lv[pid]||{}).hasFacility);
      m.portfolioId = withFacility || MRTL_SEED[Object.keys(MRTL_SEED)[0]].portfolioId;
      changed++;
    }
  });
  // v3 — older LV entries predate the pledged / hasFacility flags
  Object.keys(LV_SEED).forEach(pid=>{
    const cur=(state.lv||{})[pid], seed=LV_SEED[pid];
    if(!cur) return;
    if(cur.pledged===undefined){ cur.pledged = seed.pledged; changed++; }
    if(cur.hasFacility===undefined){ cur.hasFacility = seed.hasFacility; changed++; }
  });

  // v4 — rate-revision letters seeded after the first build
  state.rateChanges = state.rateChanges || [];
  RATE_CHANGE_SEED.forEach(seed=>{
    const dup = state.rateChanges.some(r =>
      r.id===seed.id ||
      (r.lender===seed.lender && r.rateEffective===seed.rateEffective && r.instalmentEffective===seed.instalmentEffective));
    if(!dup){ state.rateChanges.push({...seed, seeded:true}); changed++; }
  });

  store.set('fortress.seedVersion', SEED_VERSION);
  if(changed) saveAll();
  return changed;
}
function saveAll(){
  if(typeof cryptoKey!=='undefined' && cryptoKey){ persistVault(); return; }   // encrypted: one blob, no plaintext
  store.set('fortress.snapshots', state.snapshots); store.set('fortress.manual', state.manual);
  store.set('fortress.income', state.income); store.set('fortress.mrtl', state.mrtl);
  store.set('fortress.lv', state.lv); store.set('fortress.reported', state.reported);
  store.set('fortress.rateChanges', state.rateChanges); store.set('fortress.settings', state.settings); }

/* lending value per portfolio: an entered ratio wins; otherwise derive it from
   borrowing potential ÷ total assets read off the same screen at the same time. */
function lvFor(pid){
  const e=(state.lv||{})[pid]; if(!e) return null;
  if(e.ratioPct!=null) return {pct:e.ratioPct, basis:'entered', asOf:e.asOf, source:e.source};
  if(e.borrowingPotential!=null && e.totalAssets>0)
    return {pct:e.borrowingPotential/e.totalAssets*100, basis:'derived', asOf:e.asOf, source:e.source,
            borrowingPotential:e.borrowingPotential, totalAssets:e.totalAssets};
  return null;
}

/* ---- income + MRTL helpers ---- */
const monthlyIncome = ()=> (state.income||[]).filter(i=>i.endMonth==null)
  .reduce((s,i)=> s + (i.frequency==='monthly'? i.amount : i.frequency==='quarterly'? i.amount/3 : i.amount/12), 0);
const latestDate = ()=>{ const d=dates(); return d[d.length-1]; };
/* Borrowing capacity across EVERY portfolio, pledged or not — answers "how much could I
   borrow in total". Kept separate from the margin basis, which may only count pledged assets. */
function groupCapacity(){
  const ids=Object.keys(state.lv||{});
  if(!ids.length) return null;
  let total=0, assets=0, pledged=0, pledgedAssets=0, parts=[];
  ids.forEach(pid=>{
    const e=state.lv[pid]; const bp=e.borrowingPotential; if(bp==null) return;
    const p=(latest().portfolios||[]).find(x=>x.id===pid);
    const isP=isPledged(pid,p);
    total+=bp; assets+=e.totalAssets||0;
    if(isP){ pledged+=bp; pledgedAssets+=e.totalAssets||0; }
    parts.push({pid, bp, assets:e.totalAssets, pledged:isP});
  });
  if(!parts.length) return null;
  return { total, assets, pledged, pledgedAssets, parts,
           groupLvPct: assets>0? total/assets*100 : null,
           unpledged: total-pledged };
}
/* Net assets across both banks. DBS net assets (from the statement) + UOB cash − UOB home loan.
   Property is excluded unless you enter a value — it is never estimated. */
function netWorth(a){
  const ms=manualMonths();
  const balMonth=ms.slice().reverse().find(m=>state.manual[m].mortgageBalance!=null)||null;
  const mortgage=balMonth? state.manual[balMonth].mortgageBalance : 0;
  const cashMonth=ms.slice().reverse().find(m=>state.manual[m].deposits!=null)||null;
  const uobCash=cashMonth? state.manual[cashMonth].deposits : 0;
  const fwdMtm=(a.forwards||[]).reduce((s,f)=>s+(f.mtmSGD||0),0);
  return { dbs:a.net, uobCash, cashMonth, mortgage, balMonth, fwdMtm,
           dbsUob:a.net + uobCash - mortgage, hasUob: !!balMonth || !!cashMonth };
}
/* "1 Jan – 31 Jul 2026" style labels, so every % on screen names its own window */
const dayMon = iso=>{ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+d.toLocaleString('en',{month:'short'}); };
const dayMonYr = iso=>{ const d=new Date(iso+'T00:00:00'); return dayMon(iso)+' '+d.getFullYear(); };
function rangeLabel(fromIso,toIso){
  if(!fromIso||!toIso) return '';
  return fromIso.slice(0,4)===toIso.slice(0,4) ? dayMon(fromIso)+' – '+dayMonYr(toIso) : dayMonYr(fromIso)+' – '+dayMonYr(toIso);
}
function periodOf(statementDate, period){
  if(!statementDate) return null;
  const y=statementDate.slice(0,4), m=statementDate.slice(5,7);
  return period==='mtd' ? {from:y+'-'+m+'-01', to:statementDate} : {from:y+'-01-01', to:statementDate};
}
const monthsBetween=(a,b)=> (new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000/30.4375;
const mrtlDates = ()=> Object.keys(state.mrtl||{}).sort();
const latestMrtl = ()=>{ const d=mrtlDates(); return d.length? state.mrtl[d[d.length-1]] : null; };
// conservative: a call bites when drawn exceeds the collateral's lending value.
// DBS gives two candidate capacity figures that don't agree — always use the smaller.
function mrtlCapacity(m){
  if(!m) return null;
  // Two different quantities, per DBS's own tooltips:
  //  A) borrowing potential — asset-based, "subject to credit approval"; ignores the approved facility
  //  B) available for drawdown + already drawn — total drawable on the EXISTING approved MRTL
  const A=m.borrowingPotential;
  const B=(m.availableForDrawdown!=null&&m.amountDrawn!=null)? m.availableForDrawdown+m.amountDrawn : null;
  const cands=[A,B].filter(v=>v!=null&&v>0);
  if(!cands.length) return null;
  return { capacity:Math.min(...cands), optimistic:Math.max(...cands),
           assetBased:A, facilityBased:B, differ:cands.length>1 && Math.abs(A-B)>1 };
}
const dates = ()=> Object.keys(state.snapshots).sort();
const latest = ()=> state.snapshots[dates()[dates().length-1]];
const manualMonths = ()=> Object.keys(state.manual).sort();
const latestManual = ()=>{ const m=manualMonths(); return m.length? {month:m[m.length-1], ...state.manual[m[m.length-1]]} : null; };
// implied interest for a month = that month's payment − principal reduction vs previous month (both stated; no estimates)
function impliedMortgageInterest(month){
  const ms=manualMonths(); const i=ms.indexOf(month);
  if(i<1) return null;
  const cur=state.manual[ms[i]], prev=state.manual[ms[i-1]];
  if(cur.mortgagePayment==null || cur.mortgageBalance==null || prev.mortgageBalance==null) return null;
  return cur.mortgagePayment - (prev.mortgageBalance - cur.mortgageBalance);
}

/* Floating-rate revisions. A letter can announce a rate that bites today and an
   instalment that only starts months later, so each leg carries its own date and
   is either "in force" or "upcoming" — never averaged, never assumed. */
function rateChangesSorted(){
  return (state.rateChanges||[]).slice().sort((x,y)=>
    String(x.rateEffective||x.instalmentEffective||'').localeCompare(String(y.rateEffective||y.instalmentEffective||'')));
}
function effectiveLoanTerms(onDate){
  const d = onDate || new Date().toISOString().slice(0,10);
  const out = { ratePct:null, rateFrom:null, instalment:null, instalmentFrom:null };
  rateChangesSorted().forEach(rc=>{
    if(rc.ratePct!=null && rc.rateEffective && rc.rateEffective<=d){ out.ratePct=rc.ratePct; out.rateFrom=rc.rateEffective; }
    if(rc.instalment!=null && rc.instalmentEffective && rc.instalmentEffective<=d){ out.instalment=rc.instalment; out.instalmentFrom=rc.instalmentEffective; }
  });
  return out;
}
function pendingRateChanges(){
  const d = new Date().toISOString().slice(0,10);
  return rateChangesSorted().filter(rc=>
    (rc.ratePct!=null && rc.rateEffective && rc.rateEffective>d) ||
    (rc.instalment!=null && rc.instalmentEffective && rc.instalmentEffective>d));
}

function rateChangeBlock(mm, instNow){
  const list = state.rateChanges||[];
  if(!list.length) return '';
  const today = new Date().toISOString().slice(0,10);
  const rentM = monthlyIncome();
  const rows = list.map((rc,ix)=>({rc,ix}))
    .sort((a,b)=>String(b.rc.rateEffective||b.rc.instalmentEffective||'').localeCompare(String(a.rc.rateEffective||a.rc.instalmentEffective||'')))
    .map(({rc,ix})=>{
      const instPending = rc.instalment!=null && rc.instalmentEffective && rc.instalmentEffective>today;
      const ratePending = rc.ratePct!=null && rc.rateEffective && rc.rateEffective>today;
      const pending = instPending || ratePending;
      // the instalment in force the day before this one starts
      const prevInst = rc.instalmentEffective
        ? (effectiveLoanTerms(new Date(new Date(rc.instalmentEffective+'T00:00:00')-86400000).toISOString().slice(0,10)).instalment ?? instNow ?? mm.mortgagePayment)
        : (instNow ?? mm.mortgagePayment);
      const d = (rc.instalment!=null && prevInst!=null) ? rc.instalment-prevInst : null;
      const days = rc.instalmentEffective? daysUntil(rc.instalmentEffective) : null;
      // the letter's "previous rate" is a fact worth checking against what Fortress already held
      const heldBefore = rc.rateEffective ? (()=>{ const ms=manualMonths().filter(m=>m<rc.rateEffective.slice(0,7));
        for(let i=ms.length-1;i>=0;i--){ if(state.manual[ms[i]].mortgageRatePct!=null) return {m:ms[i], v:state.manual[ms[i]].mortgageRatePct}; } return null; })() : null;
      const conflict = heldBefore && rc.previousRatePct!=null && Math.abs(heldBefore.v-rc.previousRatePct)>0.005;
      return `
      <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px">
        <div class="kv"><span class="k"><b>${esc(rc.lender||'Lender')} revision</b> <span class="pill">${!pending?'in force':(ratePending&&instPending?'upcoming':(instPending?'instalment upcoming':'rate upcoming'))}</span></span>
          <span class="v"><button class="btn ghost" style="padding:2px 8px;font-size:11px" onclick="delRateChange(${ix})">Remove</button></span></div>
        ${rc.ratePct!=null?`<div class="kv"><span class="k">Interest rate${ratePending?' (from '+esc(dayLabel(rc.rateEffective))+')':''}</span><span class="v">${rc.previousRatePct!=null?pct(rc.previousRatePct,5)+' → ':''}<b>${pct(rc.ratePct,5)}</b>${!ratePending&&rc.rateEffective?` <span class="k" style="font-size:11px">since ${esc(dayLabel(rc.rateEffective))}</span>`:''}</span></div>`:''}
        ${rc.instalment!=null?`<div class="kv"><span class="k">Monthly instalment${instPending?' (from '+esc(dayLabel(rc.instalmentEffective))+(days!=null&&days>=0?', in '+days+' days':'')+')':''}</span><span class="v">${prevInst!=null?money(prevInst,2)+' → ':''}<b>${money(rc.instalment,2)}</b></span></div>`:''}
        ${d!=null?`<div class="kv"><span class="k">Change</span><span class="v ${d>=0?'neg':'pos'}">${d>=0?'+':''}${money(d,2)}/mo · ${d>=0?'+':''}${money(d*12,2)}/yr</span></div>`:''}
        ${(rentM>0&&rc.instalment!=null)?`<div class="kv"><span class="k">Rent cover of the instalment</span><span class="v">${prevInst!=null?pct(rentM/prevInst*100,1)+' → ':''}<b class="${rentM>=rc.instalment?'pos':'neg'}">${pct(rentM/rc.instalment*100,1)}</b></span></div>`:''}
        ${conflict?`<div class="warnbox" style="margin-top:6px"><b>Two different "previous" rates.</b> The letter says the old rate was ${pct(rc.previousRatePct,5)}, but Fortress holds ${pct(heldBefore.v,2)} for ${esc(monthLabel(heldBefore.m))}. The letter states the rate that applied up to ${esc(dayLabel(rc.rateEffective))}, so it is the stronger evidence for ${esc(monthLabel(heldBefore.m))} — but check the UOB app before changing it.
          <button class="btn ghost" style="margin-top:8px;padding:4px 10px;font-size:12px" onclick="usePrevRate('${esc(heldBefore.m)}',${rc.previousRatePct})">Use ${pct(rc.previousRatePct,5)} for ${esc(monthLabel(heldBefore.m))}</button></div>`:''}
        <p class="note" style="margin-top:4px">${esc(rc.source||'')}</p>
      </div>`;
    }).join('');
  return `<div class="card" style="margin:12px 0 0"><h2>Rate revisions</h2>${rows}
    <p class="note">A floating loan reprices against the bank's benchmark. The rate can bite before the instalment catches up — until the new instalment starts, the extra interest comes out of the principal portion, so the balance falls more slowly.</p></div>`;
}

/* ================= derived metrics ================= */
/* Is this portfolio's collateral actually securing the margin loan?
   Explicit setting wins; otherwise: it carries loans, or it has an MRTL facility on record. */
function isPledged(pid, p){
  const e=(state.lv||{})[pid];
  if(e && typeof e.pledged==='boolean') return e.pledged;
  if(p && Math.abs(p.totalLoans||0)>0) return true;
  return Object.values(state.mrtl||{}).some(m=>m.portfolioId===pid && (m.amountDrawn!=null||m.creditLimit!=null));
}
function agg(snap){
  const a = { assets:0, cash:0, equity:0, net:0, debt:0, plMtd:0, plYtd:0,
    divMtd:0, divYtd:0, intRecMtd:0, intRecYtd:0, intPaidMtd:0, intPaidYtd:0, feesYtd:0,
    loans:[], forwards:[], ccy:{}, pledgedCcy:{}, pledgedAssets:0, unpledgedAssets:0, unpledgedIds:[] };
  for(const p of snap.portfolios){
    a.assets += p.totalAssets||0; a.cash += p.totalCash||0; a.equity += p.totalEquity||0;
    a.net += p.netAssets||0; a.debt += Math.abs(p.totalLoans||0);
    a.plMtd += p.perf.plMtd||0; a.plYtd += p.perf.plYtd||0;
    a.divMtd += p.income.divMtd||0; a.divYtd += p.income.divYtd||0;
    a.intRecMtd += p.income.intRecMtd||0; a.intRecYtd += p.income.intRecYtd||0;
    a.intPaidMtd += p.expenses.intPaidMtd||0; a.intPaidYtd += p.expenses.intPaidYtd||0;
    a.custodyYtd = (a.custodyYtd||0)+(p.expenses.custodyYtd||0);
    a.custodyMtd = (a.custodyMtd||0)+(p.expenses.custodyMtd||0);
    a.txnYtd = (a.txnYtd||0)+(p.expenses.txnYtd||0);
    a.feesYtd += (p.expenses.custodyYtd||0)+(p.expenses.txnYtd||0);
    a.loans.push(...p.loans.map(l=>({...l, pf:p.id})));
    a.forwards.push(...p.fxForwards.map(f=>({...f, pf:p.id})));
    for(const [c,v] of Object.entries(p.ccyAlloc||{})) a.ccy[c]=(a.ccy[c]||0)+v;
    // currency mix of the PLEDGED collateral only — the stress test must not mix bases
    if(isPledged(p.id,p)) for(const [c,v] of Object.entries(p.ccyAlloc||{})) a.pledgedCcy[c]=(a.pledgedCcy[c]||0)+v;
    // Only collateral that actually secures the margin loan belongs in the LTV denominator.
    // DBS assesses each portfolio standalone: the -0 screen's asset total excludes -1,
    // and -1 offers "Apply with RM" (no facility) rather than "Contact RM to draw down".
    if(isPledged(p.id, p)) a.pledgedAssets += p.totalAssets||0;
    else { a.unpledgedAssets += p.totalAssets||0; a.unpledgedIds.push(p.id); }
  }
  a.ltv = a.pledgedAssets>0 ? a.debt/a.pledgedAssets*100 : null;
  a.ltvAllAssets = a.assets>0 ? a.debt/a.assets*100 : null;
  a.estMonthlyInterest = a.loans.reduce((s,l)=> s + Math.abs(l.principal||0)*(l.ratePct||0)/100/12, 0);
  a.carryYtd = a.divYtd + a.intRecYtd - a.intPaidYtd - a.feesYtd;
  a.gainsVsInterest = a.intPaidYtd>0 ? a.plYtd/a.intPaidYtd : null;
  a.divCover = a.intPaidYtd>0 ? a.divYtd/a.intPaidYtd : null;
  return a;
}
// drawdown (%) until debt exceeds lendingValue% of remaining assets
function drawdownToTrigger(debt, assets, lvPct){
  if(!debt || !assets || !lvPct) return null;
  const trigAssets = debt/(lvPct/100);
  return Math.max(0,(1 - trigAssets/assets)*100);
}
function marginStatus(a){
  const lv = state.settings.lendingValue;
  if(a.debt<=0) return {cls:'b-good', ic:'✔', title:'No outstanding loans', body:'No margin-call exposure this month.'};
  // DBS's own borrowing-potential figure beats any assumed ratio — use it when we have it
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  if(mr && cap && mr.amountDrawn!=null){
    const util=mr.amountDrawn/cap.capacity*100, fall=100-util;
    const body=`Drawn ${money(mr.amountDrawn,0)} against DBS's assessed capacity of ${money(cap.capacity,0)} (as of ${mr.asOf}). Your collateral's lending value can fall ${pct(fall,1)} before the loan exceeds it.`;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Drawn amount exceeds capacity', body};
    if(util>=85)  return {cls:'b-serious',  ic:'⚠', title:'Margin buffer thin', body};
    if(util>=65)  return {cls:'b-warn',     ic:'⚠', title:'Watch the buffer', body};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body};
  }
  if(lv){
    const dd = drawdownToTrigger(a.debt,a.assets,lv);
    const util = a.ltv/lv*100;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Loan exceeds lending value', body:`LTV ${pct(a.ltv,1)} is above your configured lending value of ${lv}%. Expect a margin call — contact your RM.`};
    if(util>=85) return {cls:'b-serious', ic:'⚠', title:'Margin buffer thin', body:`LTV ${pct(a.ltv,1)} is at ${fmt(util,0)}% of your ${lv}% lending value. A further ${pct(dd,1)} portfolio fall triggers a call.`};
    if(util>=65) return {cls:'b-warn', ic:'⚠', title:'Watch the buffer', body:`LTV ${pct(a.ltv,1)} vs lending value ${lv}%. Portfolio can fall ${pct(dd,1)} before a margin call.`};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body:`LTV ${pct(a.ltv,1)} vs your configured lending value ${lv}%. Portfolio would need to fall ${pct(dd,1)} before a call.`};
  }
  // no configured LV — use conservative illustrative 50%
  const dd50 = drawdownToTrigger(a.debt,a.assets,50);
  return {cls: a.ltv<35 ? 'b-good':'b-warn', ic: a.ltv<35?'✔':'⚠',
    title: a.ltv<35 ? 'No margin-call risk in sight' : 'Leverage building — verify buffer',
    body:`LTV ${pct(a.ltv,1)}. DBS lending values are not in the statement — even at an illustrative 50% lending value the portfolio must fall ${pct(dd50,1)} before a call. Enter the actual ratio from your RM in Settings for a precise trigger.`};
}

/* ================= SVG chart helpers (hand-rolled, dataviz method) ================= */
function svgEl(w,h){ return `viewBox="0 0 ${w} ${h}" class="chart" role="img"`; }
function niceTicks(min,max,n=4){
  if(min===max){ max=min+1; }
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)|| step0;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+1e-9;v+=step) t.push(+v.toFixed(10));
  return t;
}
// series: [{name,color,values:[{x:label,y}] }] — single shared y axis
function lineChart(series, {h=190, yFmt=v=>fmt(v), refLines=[]}={}){
  const W=340, padL=44, padR=12, padT=14, padB=26;
  const labels = series[0].values.map(v=>v.x);
  const all = series.flatMap(s=>s.values.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  refLines.forEach(r=>all.push(r.y));
  if(!all.length) return '<p class="note">No data yet.</p>';
  let ticks = niceTicks(Math.min(...all,0), Math.max(...all));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const X=i=> labels.length===1 ? (padL+(W-padL-padR)/2) : padL + i*(W-padL-padR)/(labels.length-1);
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  labels.forEach((l,i)=>{ if(labels.length<=8 || i%Math.ceil(labels.length/8)===0) g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`; });
  refLines.forEach(r=>{ g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-padR}" y="${Y(r.y)-4}" text-anchor="end" style="fill:${r.color}">${r.label}</text>`; });
  for(const s of series){
    const pts=s.values.map((v,i)=>[X(i),Y(v.y)]);
    if(pts.length>1) g+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length===1?5:3.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.name)} ${labels[i]}: ${yFmt(s.values[i].y)}</title></circle>`; });
    const lp=pts[pts.length-1];
    g+=`<text class="lab" x="${Math.min(lp[0]+6,W-padR-2)}" y="${lp[1]-7}" text-anchor="${lp[0]>W-70?'end':'start'}">${yFmt(s.values[s.values.length-1].y)}</text>`;
  }
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// diverging / grouped bars: groups=[{x, vals:[{name,color,y}]}]
function barChart(groups,{h=190,yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=10, padT=14, padB=26;
  const all=groups.flatMap(gr=>gr.vals.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  if(!all.length) return '<p class="note">No data yet.</p>';
  const ticks=niceTicks(Math.min(...all,0),Math.max(...all,0));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  const gw=(W-padL-padR)/groups.length, n=groups[0].vals.length;
  const bw=Math.min(26,(gw-8)/n);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  g+=`<line class="axisline" x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  groups.forEach((gr,gi)=>{
    const cx=padL+gw*gi+gw/2;
    gr.vals.forEach((v,vi)=>{
      if(v.y===null||isNaN(v.y)) return;
      const x=cx-(n*bw+(n-1)*2)/2+vi*(bw+2);
      const yA=Y(Math.max(0,v.y)), yB=Y(Math.min(0,v.y));
      const hh=Math.max(2,yB-yA);
      const rTop=v.y>=0?4:0, rBot=v.y<0?4:0;
      g+=`<path d="M${x},${yA+rTop} q0,-${rTop} ${rTop},-${rTop} h${bw-2*rTop} q${rTop},0 ${rTop},${rTop} v${hh-rTop-rBot} q0,${rBot} -${rBot},${rBot} h-${bw-2*rBot} q-${rBot},0 -${rBot},-${rBot} z" fill="${v.color}"><title>${esc(v.name)} ${esc(gr.x)}: ${yFmt(v.y)}</title></path>`;
    });
    if(groups.length<=8 || gi%Math.ceil(groups.length/8)===0) g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${esc(gr.x)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// horizontal bars for currency exposure
function hBars(items,{yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=54, rowH=26, padT=4;
  const max=Math.max(...items.map(i=>Math.abs(i.v)));
  const h=padT+items.length*rowH+4;
  let g='';
  items.forEach((it,i)=>{
    const y=padT+i*rowH, bw=Math.max(6,Math.abs(it.v)/max*(W-padL-padR));
    g+=`<text class="lab" x="${padL-6}" y="${y+15}" text-anchor="end" style="font-weight:600">${esc(it.label)}</text>`;
    g+=`<path d="M${padL},${y+4} h${bw-4} q4,0 4,4 v8 q0,4 -4,4 h-${bw-4} z" fill="${it.color}"><title>${esc(it.label)}: ${yFmt(it.v)} (${pct(it.pct,1)})</title></path>`;
    g+=`<text x="${padL+bw+5}" y="${y+15}">${pct(it.pct,1)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}

/* ================= passcode lock =================
   The passphrase derives an AES-GCM key (PBKDF2-SHA256, 310k iterations) that
   encrypts the whole data blob in localStorage. Without it the stored data is
   unreadable. This protects DATA AT REST on this device; it is not a server
   login, and the app's own code is public on GitHub Pages. */
const LOCK_KEY='fortress.lock', VAULT_KEY='fortress.vault', PBKDF2_ITER=310000;
var cryptoKey=null;   // var, not let: saveAll() may run before this line executes
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const lockCfg=()=>{ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); }catch(e){ return null; } };
const isLocked=()=>!!lockCfg();

async function deriveKey(pass, saltB64, iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:unb64(saltB64),iterations:iter||PBKDF2_ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptBlob(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decryptBlob(blob){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},cryptoKey,unb64(blob.ct));
  return JSON.parse(dec.decode(pt));
}
const DATA_KEYS=['snapshots','manual','income','mrtl','lv','reported','rateChanges','settings'];
function collectState(){ const o={}; DATA_KEYS.forEach(k=>o[k]=state[k]); return o; }

async function persistVault(){
  if(!cryptoKey) return;
  try{ localStorage.setItem(VAULT_KEY, JSON.stringify(await encryptBlob(collectState()))); }
  catch(e){ console.error('vault write failed', e); }
}
async function setupLock(pass){
  if(!pass || pass.length<6) throw new Error('Use at least 6 characters.');
  if(!crypto.subtle) throw new Error('This browser cannot encrypt here — needs HTTPS (or localhost).');
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  cryptoKey=await deriveKey(pass,salt,PBKDF2_ITER);
  localStorage.setItem(LOCK_KEY, JSON.stringify({salt,iter:PBKDF2_ITER,v:1}));
  await persistVault();
  DATA_KEYS.forEach(k=>store.del('fortress.'+k));   // remove the plaintext copies
  store.del('dw.'+ 'snapshots');
}
async function unlock(pass){
  const cfg=lockCfg(); if(!cfg) return false;
  cryptoKey=await deriveKey(pass,cfg.salt,cfg.iter);
  const raw=localStorage.getItem(VAULT_KEY);
  if(!raw){ return true; }                          // locked but empty — treat as fresh
  const obj=await decryptBlob(JSON.parse(raw));     // throws on wrong passphrase
  DATA_KEYS.forEach(k=>{ if(obj[k]!==undefined) state[k]=obj[k]; });
  return true;
}
async function removeLock(){
  if(!cryptoKey) throw new Error('Unlock first.');
  DATA_KEYS.forEach(k=>store.set('fortress.'+k, state[k]));
  localStorage.removeItem(LOCK_KEY); localStorage.removeItem(VAULT_KEY);
  cryptoKey=null;
}
function lockScreen(err){
  document.getElementById('main').innerHTML=`
  <div class="card" style="margin-top:60px;text-align:center">
    <div style="font-size:44px;line-height:1">🛡️</div>
    <h2 style="margin-top:10px">Fortress is locked</h2>
    <p class="note">Enter your passphrase to decrypt this device's data.</p>
    ${err?`<div class="warnbox">${esc(err)}</div>`:''}
    <input type="password" id="lockPass" placeholder="Passphrase" style="margin-top:10px;text-align:center"
      onkeydown="if(event.key==='Enter')doUnlock()">
    <button class="btn" style="margin-top:12px" onclick="doUnlock()">Unlock</button>
    <p class="note">Forgotten it? There is no recovery — the passphrase is never stored, only a value derived from it. Restore from a JSON backup instead.</p>
  </div>`;
  document.getElementById('tabs').innerHTML='';
  setTimeout(()=>document.getElementById('lockPass')?.focus(),60);
}
async function doUnlock(){
  const el=document.getElementById('lockPass'); const pass=el?el.value:'';
  if(!pass) return;
  try{ await unlock(pass);
    try{ window.__seedFixes = runSeedMigrations(); }catch(e){ console.error('seed migration failed', e); }
    booted=true; render(); }
  catch(e){ lockScreen('That passphrase did not work. Try again.'); }
}
async function enableLock(){
  const p1=document.getElementById('lkPass').value, p2=document.getElementById('lkPass2').value;
  if(p1!==p2){ alert('The two entries do not match.'); return; }
  try{ await setupLock(p1); alert('Lock enabled. Fortress will ask for this passphrase from now on. There is no recovery — keep a JSON backup.'); render(); }
  catch(e){ alert(e.message); }
}
async function disableLock(){
  if(!confirm('Turn the lock off? Your data goes back to being stored unencrypted in this browser.')) return;
  try{ await removeLock(); render(); }catch(e){ alert(e.message); }
}

/* ===== Fortress strength: how much punishment can this structure absorb? ===== */
const HIST_DRAWDOWNS=[{y:'2022',pct:25.4},{y:'2020 COVID',pct:33.9},{y:'2000-02 dot-com',pct:49.1},{y:'2008 GFC',pct:56.8}];
function fortressStrength(snap,a){
  const m=latestMrtl(), c=mrtlCapacity(m), w=netWorth(a), mm=latestManual();
  if(!m||!c||m.amountDrawn==null) return null;
  const P=[];
  const band=(v,t)=>{ for(let i=0;i<t.length;i++) if(v>=t[i][0]) return t[i][1]; return t[t.length-1][1]; };

  // A — how far markets can fall before a call
  const buf=100-m.amountDrawn/c.capacity*100;
  const survives=HIST_DRAWDOWNS.filter(d=>d.pct<buf), breaks=HIST_DRAWDOWNS.filter(d=>d.pct>=buf);
  P.push({k:'Market shock',score:band(buf,[[50,4],[35,3],[25,2],[15,1],[0,0]]),
    v:pct(buf,1)+' fall absorbed',
    d:`Survives ${survives.map(d=>d.y).join(', ')||'no historical analogue'}${breaks.length?'; breached by '+breaks.map(d=>d.y+' (−'+d.pct+'%)').join(', '):''}.`});

  // B — can income service the debt without selling anything
  const marginInt=a.estMonthlyInterest*12;
  const mortInt=(impliedMortgageInterest(mm&&mm.month)??0)*12;
  const inst=(mm&&mm.mortgagePayment?mm.mortgagePayment:0)*12;
  const months=snap.statementDate?(+snap.statementDate.slice(5,7)):12;
  const income=monthlyIncome()*12 + (a.divYtd+a.intRecYtd)*12/months;
  const intOnly=marginInt+mortInt, fullSvc=marginInt+inst;
  const cover=intOnly>0?income/intOnly:null, svcCover=fullSvc>0?income/fullSvc:null;
  P.push({k:'Debt service',score:band(cover||0,[[3,4],[2,3],[1.5,2],[1,1],[0,0]]),
    v:fmt(cover,2)+'× interest cover',
    d:`Income ${money(income,0)}/yr against ${money(intOnly,0)} of interest. Including mortgage principal the cover is ${fmt(svcCover,2)}×, a surplus of ${money(income-fullSvc,0)}/yr — nothing has to be sold to stay current.`});

  // C — dry powder that is not pledged
  const reserve=(a.unpledgedAssets||0)+(w.uobCash||0);
  const mo=fullSvc>0?reserve/(fullSvc/12):null;
  P.push({k:'Free reserves',score:band(mo||0,[[24,4],[12,3],[6,2],[3,1],[0,0]]),
    v:money(reserve,0),
    d:`Unencumbered assets DBS has no claim on: ${fmt(mo,1)} months of full debt service. This is what you sell in a call instead of liquidating pledged collateral at the worst possible prices.`});

  // D — concentration
  const top=Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
  const share=top?top[1]/a.pledgedAssets*100:0;
  P.push({k:'Concentration',score:band(100-share,[[60,4],[45,3],[35,2],[25,1],[0,0]]),
    v:top?pct(share,1)+' '+top[0]:'—',
    d:top?`${top[0]} is ${pct(share,1)} of the collateral. It would have to fall ${pct(buf/(share/100),1)} alone to cause a call, so this is a wealth risk more than a margin risk — but it is one bet, not five.`:''});

  // E — floating-rate headroom
  const rentY=monthlyIncome()*12, mtg=mm&&mm.mortgageBalance?mm.mortgageBalance:0;
  const mortBreak=mtg>0?rentY/mtg*100:null;
  const divY=a.divYtd*12/months, mp=Math.abs((a.loans[0]||{}).principal||0);
  const marginBreak=mp>0?divY/mp*100:null;
  P.push({k:'Rate rises',score:band(Math.min(mortBreak||0,marginBreak||0),[[5,4],[4,3],[3,2],[2,1],[0,0]]),
    v:'safe to ~'+fmt(Math.min(mortBreak||99,marginBreak||99),1)+'%',
    d:`Rent covers the mortgage until its rate passes ${pct(mortBreak,2)} (now ${mm&&mm.mortgageRatePct?pct(mm.mortgageRatePct,2):'—'}); dividends cover the margin loan until ${pct(marginBreak,2)} (now ${a.loans[0]?pct(a.loans[0].ratePct,2):'—'}). Both are floating, and that gap is the real cushion.`});

  // F — rollover
  const L=a.loans[0], dd=L?daysUntil(L.maturityDate):null;
  P.push({k:'Rollover',score:dd==null?2:band(dd,[[90,4],[30,3],[14,2],[0,1]]),
    v:dd==null?'—':dd+' days',
    d:L?`The ${money(Math.abs(L.principal),0)} MRTL matures ${L.maturityDate} and is revolving — it depends on DBS renewing, not on your solvency. Facility limit ${money(m.creditLimit,0)} is not the constraint; renewal is. Cheap to eliminate: repay from the unpledged reserve if you ever want the dependency gone.`:''});

  const tot=P.reduce((s,p)=>s+p.score,0), max=P.length*4;
  const grade = tot/max>=0.85?'Very strong': tot/max>=0.7?'Strong': tot/max>=0.55?'Solid': tot/max>=0.4?'Adequate':'Fragile';
  const weakest=P.slice().sort((x,y)=>x.score-y.score)[0];
  return {P,tot,max,grade,weakest,buf,breaks};
}

/* ===== FX candlestick + moving averages (hand-rolled SVG) ===== */
function sma(arr, n){
  const out=new Array(arr.length).fill(null); let sum=0;
  for(let i=0;i<arr.length;i++){ sum+=arr[i]; if(i>=n) sum-=arr[i-n]; if(i>=n-1) out[i]=sum/n; }
  return out;
}
function candleChart(series, opts){
  opts=opts||{};
  const W=760, H=340, L=8, R=62, T=10, B=26;
  const n=series.dates.length;
  const show=Math.min(opts.bars||250, n);
  const s0=n-show;                                   // first visible index
  const ma50=sma(series.c,50), ma150=sma(series.c,150), ma200=sma(series.c,200);
  let lo=Infinity, hi=-Infinity;
  for(let i=s0;i<n;i++){ lo=Math.min(lo,series.l[i]); hi=Math.max(hi,series.h[i]); }
  [ma50,ma150,ma200].forEach(m=>{ for(let i=s0;i<n;i++) if(m[i]!=null){ lo=Math.min(lo,m[i]); hi=Math.max(hi,m[i]); } });
  const pad=(hi-lo)*0.06||hi*0.01; lo-=pad; hi+=pad;
  const x=i=>L+(i-s0)*(W-L-R)/Math.max(show-1,1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const bw=Math.max(1.2,(W-L-R)/show*0.62);
  const dp = hi<10 ? 4 : (hi<100 ? 3 : 2);

  let bars='';
  for(let i=s0;i<n;i++){
    const up=series.c[i]>=series.o[i];
    const col=up?'var(--delta-good)':'var(--critical)';
    const yo=y(series.o[i]), yc=y(series.c[i]);
    const top=Math.min(yo,yc), h=Math.max(Math.abs(yc-yo),0.8);
    bars+=`<line x1="${x(i).toFixed(1)}" y1="${y(series.h[i]).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(series.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
        + `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
  }
  const path=(m,col,w)=>{
    let d='',started=false;
    for(let i=s0;i<n;i++){ if(m[i]==null) continue; d+=(started?'L':'M')+x(i).toFixed(1)+','+y(m[i]).toFixed(1); started=true; }
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`:'';
  };
  // gridlines + right-hand price axis
  let grid='',ticks=5;
  for(let t=0;t<=ticks;t++){
    const v=lo+(hi-lo)*t/ticks, yy=y(v);
    grid+=`<line class="grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`
        + `<text x="${W-R+5}" y="${(yy+3).toFixed(1)}">${v.toFixed(dp)}</text>`;
  }
  // date labels
  let xlab='';
  for(let k=0;k<=4;k++){
    const i=Math.round(s0+(n-1-s0)*k/4);
    const d=series.dates[i];
    xlab+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===4?'end':'middle')}">${d.slice(2,7)}</text>`;
  }
  const last=series.c[n-1], first=series.c[s0];
  const chg=(last/first-1)*100;
  return {
    svg:`<svg ${svgEl(W,H)}>${grid}${bars}${path(ma50,'var(--s1)',1.8)}${path(ma150,'var(--s4)',1.8)}${path(ma200,'var(--s2)',1.8)}
      <line class="axisline" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>${xlab}</svg>`,
    last, first, chg, from:series.dates[s0], to:series.dates[n-1],
    ma:{ m50:ma50[n-1], m150:ma150[n-1], m200:ma200[n-1] }, dp
  };
}

  </div>
  ${(()=>{ const reps=(state.reported||[]).filter(r=>r.metric==='TWRR');

            <span class="v ${r.pct>=0?'pos':'neg'}">${r.pct>=0?'+':''}${pct(r.pct,2)}${gap!=null?`<br><span style="font-size:11px;font-weight:400;color:var(--ink2)">${gap>=0?'ahead of':'behind'} S&P by ${fmt(Math.abs(gap),2)} pts</span>`:''}</span></div>`;
        }).join('')}
        ${bm?`<div class="kv"><span class="k" style="color:var(--muted)">S&P 500 · total return in SGD<br><span style="font-size:11px">price ${bm.priceRet>=0?'+':''}${fmt(bm.priceRet,2)}% · USD total return ${bm.totalRet>=0?'+':''}${fmt(bm.totalRet,2)}%</span></span>
          <span class="v" style="font-weight:400">${bm.sgdTotalRet>=0?'+':''}${pct(bm.sgdTotalRet,2)}</span></div>`

      </div>`;
    }).join('')}
    ${missing?`<p class="note" style="margin-top:10px"><b>${missing} reading${missing>1?'s are':' is'} missing above.</b> Fortress will not fill a gap with an estimate. To close one: DBS app → switch to that portfolio → Performance → set the same range → TWRR → then Add data → Paste text.</p>`:''}
    <p class="note" style="margin-top:14px"><b>TWRR</b> — ${esc(METRIC_NOTE.TWRR)} It is the fair way to judge the holdings, and the only basis Fortress reports.</p>
    <p class="note">Readings are grouped by window because that is the only way they mean anything — the same portfolio reads 32.91% over one year and 20.69% year-to-date, and a single day's shift in the endpoints moved the 1Y figure by two points. The S&P line is dividend-reinvested total return converted to SGD at spot, which is what a Singapore investor actually banks.</p>
    <p class="note"><b>Two caveats before you feel too good.</b> Your returns are struck on <em>net</em> assets and are therefore levered; the index is not. And a portfolio that is ${pct((a.pledgedCcy.USD||0)/a.pledgedAssets*100,0)} USD will track US equities closely by construction — beating the index by a few points is a stock-selection result, not proof of diversification.</p>
  </div>`; })()}
  <div class="card">
    <h2>Interest vs portfolio gains${(()=>{const p=periodOf(snap.statementDate,'ytd');return p?' · '+esc(rangeLabel(p.from,p.to)):' (YTD)';})()}</h2>
    <div class="kv"><span class="k">Portfolio P&L</span><span class="v ${a.plYtd>=0?'pos':'neg'}">${money(a.plYtd)}</span></div>
    <div class="kv"><span class="k">Dividends + interest received</span><span class="v">${money(a.divYtd+a.intRecYtd,0)}</span></div>
    <div class="kv"><span class="k">Margin loan interest paid</span><span class="v">${money(-a.intPaidYtd,0)}</span></div>
    <div class="kv"><span class="k">DBS custody fees</span><span class="v">${money(-a.custodyYtd,0)}</span></div>
    <div class="kv"><span class="k">Transaction costs</span><span class="v">${money(-a.txnYtd,0)}</span></div>
    <div class="kv"><span class="k">Gains ÷ margin interest</span><span class="v">${a.gainsVsInterest===null?'—':fmt(a.gainsVsInterest,1)+'×'}</span></div>
    <div class="kv"><span class="k">Dividend cover of margin interest</span><span class="v">${a.divCover===null?'—':fmt(a.divCover,1)+'×'}</span></div>
    ${(()=>{ const mm=latestManual(); if(!mm) return '';
      const impInt = impliedMortgageInterest(mm.month);
      const annAllIn = (a.estMonthlyInterest + (impInt ?? (mm.mortgageRatePct!=null&&mm.mortgageBalance!=null? mm.mortgageBalance*mm.mortgageRatePct/100/12 : 0)))*12;
      return `<div class="kv"><span class="k">Gains ÷ all-in interest (incl. mortgage, annualised)</span><span class="v">${annAllIn>0?fmt(a.plYtd/annAllIn,1)+'×':'—'}</span></div>`; })()}
    ${(()=>{ const gv=a.intPaidYtd>0?a.plYtd/a.intPaidYtd:null, dc=a.intPaidYtd>0?a.divYtd/a.intPaidYtd:null;
      if(gv==null) return '';
      return `<p class="note"><b>Are these coverage ratios good?</b> There is no household benchmark for them — the concept comes from corporate credit, where an <em>interest cover</em> of 3× or more is usually considered comfortable and under 1.5× is a warning. Yours are far above that, but read them for what they are.
        <b>Dividend cover of ${fmt(dc,1)}×</b> is the durable one: it says your cash income alone pays the margin interest ${fmt(dc,1)} times over without selling anything or relying on prices. That is the ratio that keeps you solvent in a bad year, and above 1× is the line that matters.
        <b>Gains ÷ interest of ${fmt(gv,1)}×</b> is flattering and fragile: it divides a volatile mark-to-market gain by a near-fixed cost, so it soars in a good year and goes <em>negative</em> in a bad one. July alone was ${money(a.plMtd,0)} — on a full month like that the ratio is meaningless. Treat ${fmt(gv,1)}× as evidence the strategy is working this year, not as a safety margin.</p>
      <p class="note">These are struck on the statement's own P&L for the window in the heading. For percentage returns see the Returns card, which uses DBS's time-weighted figures.</p>`; })()}
  </div>
  ${(()=>{ const mm=latestManual(); if(!mm) return '';
    const impInt = impliedMortgageInterest(mm.month);
    const paidOff = MORTGAGE_META.original && mm.mortgageBalance!=null ? MORTGAGE_META.original - mm.mortgageBalance : null;
    const eff = effectiveLoanTerms();
    const rateNow = eff.ratePct!=null ? eff.ratePct : mm.mortgageRatePct;
    const instNow = eff.instalment!=null ? eff.instalment : mm.mortgagePayment;
    return `
  <div class="card">
    <h2>Home loan — ${esc(MORTGAGE_META.bank)} ${esc(MORTGAGE_META.account)}<span class="pill">manual entry</span></h2>
    <div class="kv"><span class="k">Outstanding balance (${esc(mm.month)})</span><span class="v">${money(mm.mortgageBalance,2)}</span></div>
    <div class="kv"><span class="k">Original / repaid so far</span><span class="v">${money(MORTGAGE_META.original,0)} / ${paidOff!==null?money(paidOff,0):'—'}</span></div>
    <div class="kv"><span class="k">Rate</span><span class="v">${rateNow!=null?pct(rateNow,rateNow%1===0?2:5)+' p.a. float':'—'}${eff.rateFrom?` <span class="k" style="font-size:11px">since ${esc(dayLabel(eff.rateFrom))}</span>`:''}</span></div>
    <div class="kv"><span class="k">Monthly instalment</span><span class="v">${instNow!=null?money(instNow,2):'—'}${eff.instalmentFrom?` <span class="k" style="font-size:11px">since ${esc(dayLabel(eff.instalmentFrom))}</span>`:''}</span></div>
    <div class="kv"><span class="k">Interest portion this month (implied)</span><span class="v">${impInt!==null?money(impInt,2):'— (needs prior month + instalment)'}</span></div>
    <div class="kv"><span class="k">UOB deposits</span><span class="v">${mm.deposits!=null?money(mm.deposits,2):'—'}</span></div>
    ${mm.nextDue?`<div class="kv"><span class="k">Next payment due</span><span class="v">${esc(mm.nextDue)}</span></div>`:''}
    ${mm.note?`<p class="note" style="margin-top:6px">${esc(mm.note)}</p>`:''}
    ${rateChangeBlock(mm, instNow)}
    ${state.settings.homeValue?`<div class="kv"><span class="k">Mortgage LTV vs your entered property value</span><span class="v">${pct(mm.mortgageBalance/state.settings.homeValue*100,1)}</span></div>`:''}
    <p class="note">Implied interest = instalment − principal reduction between your two latest entries (pure arithmetic from UOB statements, no assumptions). A property loan has no market-linked margin call, but its interest is part of the hurdle your portfolio must beat. Update monthly in Settings → Home loan.</p>
  </div>`; })()}
  ${a.loans.map(l=>{const d=daysUntil(l.maturityDate);return `
  <div class="card">
    <h2>Loan — ${esc(l.pf)}</h2>
    <div class="kv"><span class="k">Description</span><span class="v">${esc(l.description||'')}</span></div>
    <div class="kv"><span class="k">Principal</span><span class="v">${l.ccy} ${fmt(Math.abs(l.principal),2)}</span></div>
    <div class="kv"><span class="k">Rate</span><span class="v">${pct(l.ratePct,2)} p.a.</span></div>
    <div class="kv"><span class="k">Accrued interest</span><span class="v">${money(Math.abs(l.accrIntSGD||0),2)}</span></div>
    <div class="kv"><span class="k">Maturity</span><span class="v">${l.maturityDate||'—'}${d!==null?` (${d>=0?d+' days':'past due'})`:''}</span></div>
  </div>`;}).join('')}
  ${alertList(snap,a).map(x=>`<div class="banner ${x.cls}"><span class="ic">${x.ic}</span><div><b>${x.t}</b>${x.b}</div></div>`).join('')}
  <button class="btn" onclick="startImport()">⤒ Add data — statement, screenshot or text</button>
  <p class="note" style="text-align:center">Read entirely on this device — nothing is uploaded.</p>`;
}

function viewTrends(){
  const ds=dates(); const snaps=ds.map(d=>({d, a:agg(state.snapshots[d])}));
  const lv=state.settings.lendingValue;
  const one = ds.length===1;
  const ltvSeries=[{name:'LTV',color:'var(--s1)',values:snaps.map(s=>({x:monthLabel(s.d),y:+s.a.ltv.toFixed(2)}))}];
  const refs = lv? [{y:lv,color:'var(--critical)',label:`LV ${lv}%`}] : [{y:50,color:'var(--muted)',label:'50% (illustrative)'}];
  return `
  ${one?'<div class="banner b-warn"><span class="ic">ℹ</span><div><b>One month of data so far</b>Trends build as you import each monthly statement.</div></div>':''}
  <div class="card"><h2>Loan-to-assets over time</h2>${lineChart(ltvSeries,{yFmt:v=>fmt(v,0)+'%',refLines:refs})}</div>
  <div class="card"><h2>Monthly portfolio P&L (S$)</h2>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[{name:'Monthly P&L',color:s.a.plMtd>=0?'var(--div-pos)':'var(--div-neg)',y:Math.round(s.a.plMtd)}]})),{yFmt:v=>fmt(v/1000,0)+'k'})}
    <p class="note">Blue = gain, red = loss. Compare against ~${money(agg(latest()).estMonthlyInterest)} of monthly interest — the bar you can barely see.</p></div>
  <div class="card"><h2>Income vs debt cost (YTD, S$)</h2>
    <div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Dividends + interest received</span><span><span class="sw" style="background:var(--s2)"></span>Interest paid + fees</span></div>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[
      {name:'Income YTD',color:'var(--s1)',y:Math.round(s.a.divYtd+s.a.intRecYtd)},
      {name:'Debt cost YTD',color:'var(--s2)',y:Math.round(s.a.intPaidYtd+s.a.feesYtd)}]})),{yFmt:v=>fmt(v/1000,1)+'k'})}
    <p class="note">Positive carry = the portfolio's cash income alone outruns all financing and account costs.</p></div>
  <div class="card"><h2>Net assets (S$)</h2>${lineChart([{name:'Net assets',color:'var(--s3)',values:snaps.map(s=>({x:monthLabel(s.d),y:Math.round(s.a.net)}))}],{yFmt:v=>fmt(v/1e6,2)+'M'})}</div>
  ${(()=>{ const mm=manualMonths(); if(!mm.length) return '';
    const withBal=mm.filter(m=>state.manual[m].mortgageBalance!=null);
    if(withBal.length<2) return '';
    const series=[{name:'Home loan balance',color:'var(--s2)',values:withBal.map(m=>({x:monthLabel(m+'-01'),y:Math.round(state.manual[m].mortgageBalance)}))}];
    const first=state.manual[withBal[0]].mortgageBalance, last=state.manual[withBal[withBal.length-1]].mortgageBalance;
    return `
  <div class="card"><h2>Home loan balance (S$)</h2>
    ${lineChart(series,{yFmt:v=>fmt(v/1e6,3)+'M'})}
    <p class="note">Down ${money(first-last,0)} across ${withBal.length} months — amortising, and it shrinks whether or not markets cooperate. Add each month in Settings → Home loan.</p></div>`; })()}`;
}

function viewFX(){
  const snap=latest(), a=agg(snap);
  const ccys=Object.entries(a.pledgedCcy).sort((x,y)=>y[1]-x[1]);
  const palette=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--muted)','var(--axis)'];
  const items=ccys.map(([c,v],i)=>({label:c,v,pct:v/a.assets*100,color:palette[Math.min(i,palette.length-1)]}));
  const loanCcy={}; a.loans.forEach(l=>{loanCcy[l.ccy]=(loanCcy[l.ccy]||0)+Math.abs(l.principal);});
  const rates=snap.fxRates||{};
  const shocks=[-10,-5,5,10];
  const nonSgd=ccys.filter(([c])=>c!=='SGD');
  // margin-call proximity, not just LTV: a shock shrinks the collateral, which shrinks its
  // lending value proportionally, which eats into the buffer between drawn and capacity.
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  const baseBuf = (mr&&cap&&mr.amountDrawn!=null) ? 100-mr.amountDrawn/cap.capacity*100 : null;
  const bufAfter = drop => (baseBuf==null)?null:100-mr.amountDrawn/(cap.capacity*(1-drop))*100;
  const stressRows=nonSgd.map(([c,v])=>{
    const cells=shocks.map(s=>{
      const dA=v*s/100, ltv2=a.debt/(a.pledgedAssets+dA)*100;
      const nb=bufAfter(-dA/a.pledgedAssets);
      return `<td>${money(dA/1000,0).replace('S$','')}k<br><span style="color:var(--muted)">LTV ${fmt(ltv2,1)}%</span>${nb!=null?`<br><span style="color:${s<0?'var(--serious)':'var(--delta-good)'}">buf ${fmt(nb,1)}%</span>`:''}</td>`;
    }).join('');
    return `<tr><td><b>${c}</b><br><span style="color:var(--muted)">${pct(v/a.pledgedAssets*100,1)} of collateral</span></td>${cells}</tr>`;
  }).join('');
  const killRows=nonSgd.map(([c,v])=>{
    const share=v/a.pledgedAssets;
    const need=baseBuf==null?null:baseBuf/share;
    return `<div class="kv"><span class="k"><b>${c}</b> · ${pct(share*100,2)} of collateral</span><span class="v ${need!=null&&need>100?'pos':''}">${need==null?'—':(need>100?'cannot — would need −'+fmt(need,0)+'%':'falls −'+fmt(need,1)+'%')}</span></div>`;
  }).join('');
  const allShare=nonSgd.reduce((t,[,v])=>t+v,0)/a.pledgedAssets;
  const FXS = window.FX_SERIES||{}, avail=Object.keys(FXS);
  const sel = avail.includes(state.settings.fxCcy)? state.settings.fxCcy : avail[0];
  const held = new Set(Object.keys(a.pledgedCcy));
  const chartCard = (()=>{
    if(!sel) return '';
    const bars = state.settings.fxBars||250;
    const ch = candleChart(FXS[sel], {bars});
    const above = k=> ch.ma[k]!=null ? (ch.last>=ch.ma[k]) : null;
    const badge = (k,lbl,col)=> ch.ma[k]==null? '' :
      `<span><span class="sw" style="background:${col}"></span>${lbl} ${ch.ma[k].toFixed(ch.dp)} <b class="${above(k)?'pos':'neg'}">${above(k)?'above':'below'}</b></span>`;
    return `
  <div class="card">
    <h2>1 SGD = ${esc(sel)}<span class="pill">daily · ${esc(ch.from)} → ${esc(ch.to)}</span></h2>
    <select onchange="setFxCcy(this.value)" style="width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px;margin-bottom:4px">
      ${avail.map(c=>`<option value="${esc(c)}"${c===sel?' selected':''}>${esc(c)} — 1 SGD = ${FXS[c].c[FXS[c].c.length-1]} ${esc(c)}${held.has(c)?'  ·  you hold '+money(a.pledgedCcy[c],0):''}</option>`).join('')}
    </select>
    <div class="row2" style="margin:8px 0 6px">
      ${[[120,'6M'],[250,'1Y'],[400,'Max']].map(([b,l])=>`<button class="btn ghost" style="padding:6px 0;font-size:12px;${bars===b?'border-color:var(--ink)':''}" onclick="setFxBars(${b})">${l}</button>`).join('')}
    </div>
    <div class="legend">${badge('m50','MA50','var(--s1)')}${badge('m150','MA150','var(--s4)')}${badge('m200','MA200','var(--s2)')}</div>
    ${ch.svg}
    <div class="kv" style="margin-top:6px"><span class="k">Close · change over window</span><span class="v">${ch.last.toFixed(ch.dp)} <span class="${ch.chg>=0?'pos':'neg'}">${ch.chg>=0?'+':''}${fmt(ch.chg,2)}%</span></span></div>
    <div class="kv"><span class="k">Inverse (1 ${esc(sel)} = ? SGD)</span><span class="v">${(1/ch.last).toFixed(5)}</span></div>
    ${held.has(sel)?`<div class="kv"><span class="k">Your ${esc(sel)} collateral</span><span class="v">${money(a.pledgedCcy[sel],0)} · ${pct(a.pledgedCcy[sel]/a.pledgedAssets*100,1)}</span></div>`:''}
    <p class="note">Quoted as <b>1 SGD = X ${esc(sel)}</b>, so a <b>rising</b> line means SGD strengthening — which makes your ${esc(sel)} assets worth <em>less</em> in SGD. Candles are daily open/high/low/close; green closes up, red closes down. ${esc((window.FX_META||{}).source||'')}. This is an embedded snapshot, not a live feed.</p>
  </div>`;
  })();
  return `
  ${chartCard}
  <div class="card"><h2>Currency exposure (collateral, SGD-equivalent)</h2>
    ${hBars(items,{yFmt:v=>money(v)})}
    <p class="note">Loans by currency: ${Object.entries(loanCcy).map(([c,v])=>`${c} ${money(v)}`).join(', ')||'none'}. ${(()=>{const usd=a.pledgedCcy.USD||0; return usd/a.pledgedAssets>0.5 && !loanCcy.USD ? `Mismatch: ${pct(usd/a.pledgedAssets*100,1)} of assets are USD while the loan is ${Object.keys(loanCcy).join('/')||'—'} — a USD fall shrinks assets but not the debt, so LTV and net worth both take the hit.`:''})()}</p>
  </div>
  ${baseBuf!=null?`<div class="card"><h2>What would actually trigger a margin call?</h2>
    <div class="banner b-good" style="margin:0 0 10px"><span class="ic">✔</span><div>
      <b>Today's buffer: ${pct(baseBuf,1)}</b>
      Your collateral's lending value can fall that far before the drawn ${money(mr.amountDrawn,0)} exceeds it. FX is only dangerous to the extent it moves that number.</div></div>
    <p class="note" style="margin-top:0">If <b>only</b> this currency moved and everything else held still, here is the fall it would take — on its own — to consume the entire buffer:</p>
    ${killRows}
    <div class="kv"><span class="k"><b>All non-SGD together</b> · ${pct(allShare*100,2)}</span><span class="v">falls −${fmt(baseBuf/allShare,1)}%</span></div>
    <p class="note">This is why a −10% USD move and a −10% EUR move land so differently. Both cut the collateral by the same <em>proportion of their own exposure</em>, but USD is ${pct((a.pledgedCcy.USD||0)/a.pledgedAssets*100,1)} of the collateral and EUR is ${pct((a.pledgedCcy.EUR||0)/a.pledgedAssets*100,2)} — so the USD move is roughly ${fmt((a.pledgedCcy.USD||0)/Math.max(a.pledgedCcy.EUR||1,1),0)}× the size in dollars, and it eats ${fmt((a.pledgedCcy.USD||0)/Math.max(a.pledgedCcy.EUR||1,1),0)}× as much buffer. Currency risk here is really <b>one</b> risk — USD — wearing five labels.</p>
  </div>`:''}
  <div class="card"><h2>FX stress — collateral, LTV and buffer</h2>
    <table class="hist"><tr><th>vs SGD</th>${shocks.map(s=>`<th>${s>0?'+':''}${s}%</th>`).join('')}</tr>${stressRows}</table>
    <p class="note">Each cell: change in collateral value (S$ thousands), the resulting LTV, and the remaining margin-call buffer${baseBuf!=null?' (from '+pct(baseBuf,1)+' today)':''}.
    <b>Why the LTV barely moves:</b> LTV is debt ÷ collateral, and the debt is only ${pct(a.ltv,1)} of the collateral to begin with — so even a large loss moves the ratio by a point or two. The buffer line is the one to watch, because it measures distance to an actual call rather than a ratio. Loan held constant; computed from this statement's currency allocation at DBS's printed indicative rates.</p>
  </div>
  ${a.forwards.length?`<div class="card"><h2>FX forwards</h2>
    ${a.forwards.map(f=>{
      const d=daysUntil(f.maturityDate);
      const spot=rates[f.sellCcy]||null;
      const sellAbs=Math.abs(f.sellAmt);
      const shock=spot? [5,10].map(s=>`${f.sellCcy} +${s}% → MTM ${money(f.buyAmt - sellAbs*spot*(1+s/100),0)}`).join(' · ') : '';
      const loan=a.loans[0];
      const fundsLoan = loan && f.buyCcy===loan.ccy && Math.abs(f.buyAmt-(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0)))<Math.abs(loan.principal)*0.02 && f.maturityDate===loan.maturityDate;
      return `<div class="kv"><span class="k">Position</span><span class="v">Sell ${f.sellCcy} ${fmt(sellAbs,0)} / Buy ${f.buyCcy} ${fmt(f.buyAmt,0)}</span></div>
      <div class="kv"><span class="k">Contract rate</span><span class="v">${f.contractRate}</span></div>
      <div class="kv"><span class="k">Settles</span><span class="v">${f.maturityDate}${d!==null?` (${d>=0?d+' days':'settled'})`:''}</span></div>
      <div class="kv"><span class="k">Mark-to-market</span><span class="v ${f.mtmSGD>=0?'pos':'neg'}">${money(f.mtmSGD,0)}</span></div>
      ${shock?`<div class="kv"><span class="k">Sensitivity</span><span class="v" style="font-weight:400;font-size:12px">${shock}</span></div>`:''}
      ${fundsLoan?`<p class="note">This forward's ${f.buyCcy} leg (${money(f.buyAmt)}) matches the ${loan.ccy} loan + accrued interest (${money(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0))}) and settles on the loan's maturity date — it looks structured to fund the loan repayment. Confirm the ${f.sellCcy} you must deliver at settlement is available, since this statement shows no ${f.sellCcy} assets.`:''}`;
    }).join('')}
  </div>`:''}
  <div class="card"><h2>Indicative FX rates (statement)</h2>
    ${Object.entries(rates).sort().map(([c,v])=>`<div class="kv"><span class="k">1 ${c}</span><span class="v">${fmt(v,c==='JPY'||c==='HKD'?4:4)} SGD</span></div>`).join('')}
  </div>`;
}

function saveSettings(){

  state.settings.lendingValue = lv===''?null:Math.min(95,Math.max(1,+lv));

  if(hv) state.settings.homeValue = hv.value===''?null:Math.max(0,+hv.value);

}
function saveManual(){
  const m=document.getElementById('mMonth').value.trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM, e.g. 2026-08'); return; }
  const num=id=>{ const v=document.getElementById(id).value; return v===''?null:+v; };
  const bal=num('mBal');
  if(bal===null){ alert('Outstanding balance is required — without it there is nothing to track.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev, mortgageBalance:bal,
    mortgagePayment:num('mPay') ?? prev.mortgagePayment ?? null,
    mortgageRatePct:num('mRate') ?? prev.mortgageRatePct ?? null,
    deposits:num('mDep') ?? prev.deposits ?? null };
  saveAll(); go('dash');
}
function delManual(m){
  if(confirm('Delete home-loan entry '+m+'?')){ delete state.manual[m]; saveAll(); render(); }
}
function addIncome(){
  const label=(document.getElementById('incLabel').value||'').trim();
  const amt=document.getElementById('incAmt').value;
  if(!label || amt===''){ alert('Label and monthly amount are both needed.'); return; }
  state.income=state.income||[];
  state.income.push({ id:'inc-'+state.income.length, label, amount:+amt, ccy:'SGD', frequency:'monthly',
    payer:(document.getElementById('incPayer').value||'').trim()||null, endMonth:null, source:'manual entry' });

}
function saveLvOverrides(){
  Object.keys(state.lv||{}).forEach(pid=>{
    const el=document.getElementById('lvo_'+pid.replace(/[^A-Za-z0-9]/g,'_'));
    if(!el) return;
    if(el.value===''){ delete state.lv[pid].ratioPct; state.lv[pid].basis='derived'; }

    if(pl) state.lv[pid].pledged=pl.checked;
  });
  saveAll(); go('dash');

  const pct_=document.getElementById('repPct').value;
  const from=(document.getElementById('repFrom').value||'').trim();
  const to=(document.getElementById('repTo').value||'').trim();

function importData(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t);
    if(!d.snapshots) throw new Error('not a Fortress backup');
    state.snapshots=d.snapshots; if(d.manual) state.manual=d.manual; if(d.income) state.income=d.income; if(d.mrtl) state.mrtl=d.mrtl; if(d.lv) state.lv=d.lv; if(d.reported) state.reported=d.reported; if(d.rateChanges) state.rateChanges=d.rateChanges; if(d.settings) state.settings={...state.settings,...d.settings};
    saveAll(); render(); alert('Backup restored: '+Object.keys(d.snapshots).length+' snapshot(s).');
  }).catch(e=>alert('Could not restore: '+e.message));
  inp.value='';
}

/* ================= PDF import flow ================= */
let pdfjsReady=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  const tryLoad=(src,worker)=>new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker; res(); };
    s.onerror=()=>rej(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
  pdfjsReady=tryLoad(PDFJS_URL,PDFJS_WORKER)
    .catch(()=>tryLoad(PDFJS_CDN+'pdf.min.js',PDFJS_CDN+'pdf.worker.min.js'))
    .catch(()=>{ pdfjsReady=null; throw new Error('Could not load the PDF engine. If you opened index.html without the pdf.min.js files beside it, re-download the full app folder.'); });
  return pdfjsReady;
}
