        `<b>At ${RR.payoutAge}</b> the monthly payments can start. You can put them off to ${RR.payoutLatest} and each year of waiting adds up to ${RR.deferMaxPct}% — but you get nothing while you wait, so it is a bet on living long, not free money.`,
        `<b>You own a property</b>, which lets you keep only the smaller Basic Retirement Sum in CPF and take about <b>${Rt?M(Rt.freed):'—'}</b> more in cash. The catch: that money stops earning ${pct(CPF_RULES.raPct,1)} for life and stops paying you monthly, forever.`,
        `<b>A myth worth killing:</b> topping up to the Enhanced Retirement Sum does <em>not</em> get you a tax deduction. The relief stops at the Full Retirement Sum. Do it for the bigger payout, never for the tax.`,
        (()=>{ const shut=LL.filter(x=>!x.open&&!x.unknown);
          const byAge=shut.filter(x=>/age/i.test(x.test)).length, bySavings=shut.length-byAge;
          return `<b>Most of the usual retirement tips do not apply to you</b> — ${fmt(shut.length,0)} of the ${fmt(LL.length,0)} levers are shut: ${fmt(bySavings,0)} because you have already saved more than the schemes are built for, ${byAge?`and ${fmt(byAge,0)} because you are not 55 yet`:''}. Fortress tests each one against your own balances instead of repeating advice written for someone else.`; })(),
        (()=>{ const e=(typeof cpfLifeEstimate==='function'&&Rt)?cpfLifeEstimate(Rt.F.value):null;
          return e?`<b>Roughly ${M(e.lo)}–${M(e.hi)} a month</b> from 65 if you do nothing and the Full Retirement Sum is set aside. That is worked out from CPF's own published example for people a few years older than you — <b>it is a ballpark, not your number</b>, and CPF's own planner is the place to get the real one.`:null; })(),
        (()=>{ const S=(typeof srsPosition==='function')?srsPosition():null;
          return (S&&S.beat)?`<b>You got lucky, or you were sharp.</b> You put ${M(S.totalContributed)} into an SRS account on ${esc(dayLabel(S.firstContribution))} — ${fmt(S.daysSpare,0)} days before the retirement age went from ${S.lockedAge} to ${S.currentAge}. That fixes your SRS withdrawal age at <b>${S.lockedAge}</b> for life. A year of earlier access, for one dollar.`:null; })(),
        (()=>{ const S=(typeof srsPosition==='function')?srsPosition():null;
          return (S&&S.headroom>0)?`You have <b>${M(S.headroom)}</b> of this year's SRS allowance left. It does not roll over — unused room disappears on 31 December. Every dollar comes off your taxable income, though Fortress does not know your tax rate so it cannot say what that is worth.`:null; })()
      ]}; })(),
    al: {
      lead:p?`You own <b>${fmt(p.total,0)}</b> Air Liquide shares worth <b>${M(p.sgd)}</b>. They came from working there, not from buying them.`:'No Air Liquide holding is loaded.',
      points:p?[
        C?`This is <b>${pct(C.pctOfNet,0)}</b> of everything you own. Your salary, your CPF contributions and these shares all depend on the same company. If it has a bad decade, three things go wrong at once.`:null,
        `Hold shares in registered form for two full calendar years and Air Liquide pays you <b>10% extra</b> dividend on them, and extra free shares too. ${p.byBonus.filter(b=>!b.qualified).length?`<b>${fmt(p.byBonus.filter(b=>!b.qualified).reduce((t,b)=>t+b.qty,0),0)}</b> of your shares are still waiting for that clock to finish.`:''}`,
        D?`Dividends paid you <b>&euro;${fmt(D.last.net,0)}</b> last year after tax. Over ${D.rows.length} years the total is <b>&euro;${fmt(D.totalNet,0)}</b>.`:null,
        BA?`The performance shares cost you nothing — they were granted. They are worth <b>&euro;${fmt(BA.val,0)}</b> today against a tax cost base of <b>&euro;${fmt(BA.cost,0)}</b>.`:null,
        `These shares are <b>not</b> pledged to DBS, so they cannot be seized in a margin call — but they also cannot help you survive one.`,
        `<b>Not known:</b> what tax you would pay if you sold. Fortress refuses to guess it.`
      ]:[]},
    trends: {
      lead:`This tab answers one question: is the money growing, and how much of that is skill versus simply adding more money?`,
      points:[
        `<b>Time-weighted return</b> ignores your deposits and withdrawals. It measures how the <em>investments</em> did.`,
        `<b>Money-weighted return</b> counts your timing too. If you added money right before a rise, it looks better.`,
        `The two differ whenever you move money in or out. Neither is wrong — they answer different questions.`,
        `Interest paid on the margin loan is a real drag on returns. It comes out whether the market rises or not.`,
        `<b>Care needed:</b> these numbers come from month-end snapshots only, so short periods are rough, not exact.`
      ]},
    fx: {
      lead:X?`<b>${pct(X.nonSgdWealthPct,0)}</b> of your wealth is in foreign currencies, while every bill you pay is in Singapore dollars.`:'No currency data loaded.',
      points:X?[
        `If the Singapore dollar gets stronger, your foreign assets are worth <em>less</em> in SGD — even if their price abroad never moved.`,
        `<b>US dollars</b> are the big one: ${M(X.rows.find(r=>r.ccy==='USD')?.total||0)}, about ${pct(X.rows.find(r=>r.ccy==='USD')?.pctOfWealth||0,0)} of your wealth.`,
        X.eur?`<b>Euros</b> are ${M(X.eur.total)} once the Air Liquide shares are counted — <b>${fmt(X.eurMultiple,0)} times</b> the euro sitting at DBS. The stress tables below only see the DBS part, because only that part can be caught in a margin call.`:null,
        `A currency fall and a margin call are different dangers. A fall makes you poorer; only the pledged investments can trigger a call.`,
        `<b>Not known:</b> what hedging would cost. Fortress can show the risk but not price the insurance.`
      ]:[]},
    hist: {
      lead:`This is the raw record — one row per bank statement Fortress has read. Everything else in the app is built from these rows.`,
      points:[
        `<b>${fmt(dates().length,0)}</b> monthly statements are loaded${dates().length?`, from ${esc(dates()[0])} to ${esc(dates()[dates().length-1])}`:''}.`,
        `Nothing here was typed by hand — the figures are parsed straight out of each statement, and an import is refused outright if the numbers do not add up.`,
        `Use <b>Export backup</b> before you change devices. Fortress stores everything on this phone and nowhere else.`,
        `Gaps in the series matter: a missing month makes every trend line step over a hole without saying so.`
      ]},
    set: {
      lead:`Your data lives only on this device. There is no account, no server, and no copy anywhere else.`,
      points:[
        `Set a passcode and everything is scrambled before it is stored, so a stolen phone does not hand over your balances.`,
        `<b>If you forget the passcode there is no reset.</b> The data cannot be recovered. Export a backup first.`,
        `Clearing your browser data deletes Fortress's data too.`,
        `The lending value and alert level here change the warnings on the dashboard, not the underlying facts.`
      ]}
  };
  const t = T[tab]; if(!t) return null;
  const points = (t.points||[]).filter(Boolean);
  return { lead:t.lead, points, gapCount:G.length, highGaps:hi };
}

function plainCard(tab){
  if(!state.settings.simple) return '';
  const P = plainSummary(tab); if(!P) return '';
  return `
  <div class="card plain">
    <h2>In plain English</h2>
    <p class="lead">${P.lead}</p>
    ${P.points.length?`<ul>${P.points.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
    ${P.gapCount?`<p class="note" style="margin-top:10px">Fortress is missing <b>${fmt(P.gapCount,0)}</b> piece${P.gapCount>1?'s':''} of information for this tab${P.highGaps?`, ${P.highGaps} of them important`:''}. They are listed at the bottom of the page.</p>`:''}
  </div>`;
}

/* Collapse the explanatory prose into one expandable block per card, so the numbers
   read first and the reasoning is one tap away rather than gone. Runs after render
   rather than being baked into each card, so no card had to be rewritten for it. */
function simplify(){
  const root = document.getElementById('main');
  root.classList.toggle('simple', !!state.settings.simple);
  if(!state.settings.simple) return;
  root.querySelectorAll('.card').forEach(card=>{
    if(card.classList.contains('plain')) return;
    if(card.querySelector('details.gap')) return;              // the gaps card collapses itself
    if(card.querySelector('details.more')) return;             // already done
    const detail = [...card.children].filter(el =>
      el.classList && (el.classList.contains('note') || el.classList.contains('warnbox')));
    if(detail.length < 1) return;
    const keep = card.querySelectorAll('.kv, table, svg, .banner').length;
    if(!keep) return;                                          // a card that is ONLY prose stays open
    const d = document.createElement('details');
    d.className = 'more';
    const sum = document.createElement('summary');
    sum.textContent = detail.length===1 ? 'Show the detail' : `Show the detail (${detail.length})`;
    d.appendChild(sum);
    detail.forEach(el=>d.appendChild(el));
    card.appendChild(d);
  });
}

function toggleSimple(){ state.settings.simple = !state.settings.simple; saveAll(); render(); }

/* Every tab ends with the same honest footer: what Fortress does not know about it. */
function gapsCard(tab){
  const g = gapsFor(tab); if(!g.length) return '';
  const dot = s => s==='high' ? '<span style="color:var(--serious)">&#9679;</span>'
                 : s==='medium' ? '<span style="color:var(--warn,#b8860b)">&#9679;</span>'
                 : '<span style="color:var(--muted)">&#9679;</span>';
  const high = g.filter(x=>x.severity==='high').length;
  return `
  <div class="card">
    <h2>What Fortress doesn't know<span class="pill">${g.length} gap${g.length>1?'s':''}${high?' · '+high+' major':''}</span></h2>
    <p class="note" style="margin-top:0">Every item is a real hole in the data Fortress holds, not a hypothetical. Each one disappears from this list the moment the missing figure is entered.</p>
    ${g.map(x=>`
    <details class="gap">
      <summary>${dot(x.severity)} ${esc(x.title)}</summary>
      <p class="note" style="margin:6px 0 0"><b>What it stops Fortress saying:</b> ${x.blocks}</p>
      <p class="note" style="margin:4px 0 0"><b>How to close it:</b> ${x.fix}</p>
      ${x.source?`<p class="note" style="margin:4px 0 0;font-size:11px">Source: ${x.source}</p>`:''}
    </details>`).join('')}
  </div>`;
}

function render(){
  renderTabs();
  document.getElementById('stamp').textContent = VERSION;
  const v={dash:viewDash,prop:viewProp,cpf:viewCpf,retire:viewRetire,al:viewAl,trends:viewTrends,fx:viewFX,hist:viewHist,set:viewSet}[state.settings.tab]||viewDash;
  const tab = state.settings.tab;
  document.getElementById('main').innerHTML = plainCard(tab) + v() + gapsCard(tab)
    + `<p class="fine">Monitoring aid only — verify against your official DBS statements. ${VERSION}</p>`;
  simplify();
  const btn = document.getElementById('simpleBtn');
  if(btn){ btn.textContent = state.settings.simple ? 'Plain English' : 'Full detail';
           btn.classList.toggle('on', !!state.settings.simple); }
}

/* ================= actions ================= */
function saveSettings(){
  const lv=document.getElementById('setLV').value;
  const al=document.getElementById('setAlert').value;
  const hv=document.getElementById('setHome');
  state.settings.lendingValue = lv===''?null:Math.min(95,Math.max(1,+lv));
  state.settings.ltvAlert = al===''?35:Math.min(95,Math.max(5,+al));
  if(hv){ const nv = hv.value===''?null:Math.max(0,+hv.value);
    if(state.settings.homeVal && nv !== state.settings.homeVal.value){
      /* the range and the comparables belonged to the estimate that was replaced */
      state.settings.homeVal = { ...state.settings.homeVal, basis:'own', userEdited:true, low:null, high:null,
        asOf:new Date().toISOString().slice(0,7), source:'entered by you on the Settings tab',
        basisNote:'Your own figure. No range and no comparables travel with it.' };
    }
    state.settings.homeValue = nv; }
  saveAll(); go('dash');
}
function addComparable(){
  const V = propertyValue(); if(!V) return;
  const d = (document.getElementById('cmpDate').value||'').trim();
  const sq = +document.getElementById('cmpSqft').value;
  const px = +document.getElementById('cmpPrice').value;
  if(!/^\d{4}-\d{2}$/.test(d)){ alert('Month must be YYYY-MM, e.g. 2026-11'); return; }
  if(!(sq>0)){ alert('Floor area must be a positive number.'); return; }
  if(!(px>0)){ alert('Price must be a positive number.'); return; }
  const H = { ...state.settings.homeVal };
  H.comps = (H.comps||[]).concat([{ date:d, sqft:sq, price:px }]);
  /* it only becomes the reference if it is genuinely equivalent AND newer */
  const equivalent = sq === H.sqft;
  const newer = d > (H.valueDate || H.asOf || '');
  if(equivalent && newer){
    H.value = px; H.valueDate = d; H.asOf = d; H.basis = 'lastTransaction';
    H.source = 'URA / HDB transacted price, '+H.beds+'-bedroom '+sq+' sqft at the same project, '+d;
    state.settings.homeValue = px;
  }
  state.settings.homeVal = H; saveAll(); render();
  if(!equivalent) alert('Stored as a comparable. It is '+sq+' sqft against your '+H.sqft+' sqft, so it does not replace the reference.');
  else if(!newer) alert('Stored as a comparable. It is not newer than the current reference, so it does not replace it.');
}
function savePropCost(){
  const n=id=>{ const e=document.getElementById(id); if(!e) return undefined;
                return e.value===''? null : +e.value; };
  const price=n('pPrice'), yr=n('pYear'), costs=n('pCosts');
  if(price!==null && price!==undefined && !(price>0)){ alert('Purchase price must be a positive number, or blank.'); return; }
  if(yr!==null && yr!==undefined && !(yr>=1960 && yr<=new Date().getFullYear())){ alert('Year bought looks wrong.'); return; }
  if(costs!==null && costs!==undefined && costs<0){ alert('Running costs cannot be negative.'); return; }
  if(price!==undefined) state.settings.homePurchasePrice = price;
  if(yr!==undefined)    state.settings.homeBoughtYear    = yr;
  if(costs!==undefined) state.settings.homeAnnualCosts   = costs;
  saveAll(); render();
}
function saveManual(){
  const m=document.getElementById('mMonth').value.trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM, e.g. 2026-08'); return; }
  const num=id=>{ const v=document.getElementById(id).value; return v===''?null:+v; };
  const bal=num('mBal');
  if(bal===null){ alert('Outstanding balance is required — without it there is nothing to track.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev, mortgageBalance:bal,
    mortgagePayment:num('mPay') ?? prev.mortgagePayment ?? null,
    mortgageRatePct:num('mRate') ?? prev.mortgageRatePct ?? null,
    deposits:num('mDep') ?? prev.deposits ?? null };
  saveAll(); go('prop');
}
function delManual(m){
  if(confirm('Delete home-loan entry '+m+'?')){ delete state.manual[m]; saveAll(); render(); }
}
function addIncome(){
  const label=(document.getElementById('incLabel').value||'').trim();
  const amt=document.getElementById('incAmt').value;
  if(!label || amt===''){ alert('Label and monthly amount are both needed.'); return; }
  state.income=state.income||[];
  state.income.push({ id:'inc-'+state.income.length, label, amount:+amt, ccy:'SGD', frequency:'monthly',
    payer:(document.getElementById('incPayer').value||'').trim()||null, endMonth:null, source:'manual entry' });
  saveAll(); render();
}
function saveLvOverrides(){
  Object.keys(state.lv||{}).forEach(pid=>{
    const el=document.getElementById('lvo_'+pid.replace(/[^A-Za-z0-9]/g,'_'));
    if(!el) return;
    if(el.value===''){ delete state.lv[pid].ratioPct; state.lv[pid].basis='derived'; }
    else { state.lv[pid].ratioPct=Math.min(95,Math.max(1,+el.value)); state.lv[pid].basis='entered'; }
    const pl=document.getElementById('lvp_'+pid.replace(/[^A-Za-z0-9]/g,'_'));
    if(pl) state.lv[pid].pledged=pl.checked;
  });
  saveAll(); go('dash');
}
function addReported(){
  const pct_=document.getElementById('repPct').value;
  const from=(document.getElementById('repFrom').value||'').trim();
  const to=(document.getElementById('repTo').value||'').trim();
  if(pct_===''){ alert('Enter the return %.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from) || !/^\d{4}-\d{2}-\d{2}$/.test(to)){ alert('Both dates must be YYYY-MM-DD — the period is what makes the number meaningful.'); return; }
  if(from>=to){ alert('The "from" date must be before the "to" date.'); return; }

/* ================= PDF import flow ================= */
let pdfjsReady=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  const tryLoad=(src,worker)=>new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker; res(); };
    s.onerror=()=>rej(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
  pdfjsReady=tryLoad(PDFJS_URL,PDFJS_WORKER)
    .catch(()=>tryLoad(PDFJS_CDN+'pdf.min.js',PDFJS_CDN+'pdf.worker.min.js'))
    .catch(()=>{ pdfjsReady=null; throw new Error('Could not load the PDF engine. If you opened index.html without the pdf.min.js files beside it, re-download the full app folder.'); });
  return pdfjsReady;
}

let tessReady=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessReady) return tessReady;
  tessReady=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the OCR engine (needs a network connection the first time). Use “Paste text instead” — on iPhone, copy the text straight off the screenshot in Photos.'));
    document.head.appendChild(s);
  }).catch(e=>{ tessReady=null; throw e; });
  return tessReady;
}
async function pdfText(file){
  await loadPdfjs();
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    pages.push(DBSParser.itemsToLines(tc.items));
  }
  return pages;
}
/* OCR on a phone photo fails for two ordinary reasons: the page is sideways, and
   the file is huge. Tesseract does not auto-rotate, so we try the image as-is first
   (unchanged behaviour for the screenshots that already worked) and only if the
   recognisers can't place the text do we retry rotated. The winner is whichever
   pass the recognisers score highest — not a guess about orientation. */
function loadImageEl(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not open that image.')); };
    img.src=url;
  });
}
function rotatedCanvas(img, rot){
  const maxDim=2600;                       // bound memory on 12MP phone photos
  const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*scale), h=Math.round(img.naturalHeight*scale);
  const swap = rot===90 || rot===270;
  const c=document.createElement('canvas');
  c.width = swap?h:w; c.height = swap?w:h;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2, c.height/2); x.rotate(rot*Math.PI/180);
  x.drawImage(img,-w/2,-h/2,w,h);
  return c;
}
function ocrScore(text){
  if(!text || !text.trim()) return -1;
  try{ const r=FortressRecognizers.detect(text);
       return (r.kind==='generic'?0:1) + (r.confidence||0) + Math.min(text.length,4000)/100000; }
  catch(e){ return 0; }
}
async function ocrOnce(src){
  const { data } = await Tesseract.recognize(src,'eng');
  return data.text||'';
}
async function ocrImage(file){
  await loadTesseract();
  let best={ text:'', score:-1, rot:0 };
  const take=(text,rot)=>{ const sc=ocrScore(text); if(sc>best.score) best={text,score:sc,rot}; return sc; };
  if(take(await ocrOnce(file), 0) >= 1) return best;      // recognised straight away
  let img; try{ img=await loadImageEl(file); }catch(e){ return best; }
  for(const rot of [90,270,180]){
    busy('Reading image with OCR… trying '+rot+'°');
    if(take(await ocrOnce(rotatedCanvas(img,rot)), rot) >= 1) return best;
  }
  return best;
}

document.getElementById('anyInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      busy('Reading PDF…');
      const pages=await pdfText(f);
      // a DBS investment statement has its own rich parser — prefer it
      const dbs=DBSParser.parseLines(pages);
      if(dbs.portfolios.length){ reviewParse(dbs); return; }
      routeText(pages.map(p=>p.join('\n')).join('\n'), f.name);
      return;
    }
    if(/^image\//.test(f.type)){
      busy('Reading image with OCR…');
      const best = await ocrImage(f);
      routeText(best.text, f.name + (best.rot? ' · rotated '+best.rot+'°':''), true);
      return;
    }
    busy('Reading file…');
    routeText(await f.text(), f.name);
  }catch(err){
    showModal(`<h2>Import failed</h2><p class="note" style="font-size:13px">${esc(err.message)}</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`);
  }
});
function routeText(text, sourceName, viaOcr){
  if(!text || !text.trim()){ showModal(`<h2>Nothing to read</h2><p class="note">No text came out of that. If it's a photo of a screen, try the paste route instead.</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`); return; }
  const r=FortressRecognizers.detect(text);
  r.sourceName=sourceName; r.viaOcr=!!viaOcr; r.rawText=text;
  window.__rec=r;
  reviewRecognized(r);
}

    ${fld('rPR','Portfolio risk rating (as shown)',f.riskRating,'0.1')}
    <label class="fld">As-of date</label><input type="text" id="rAsOf" value="${new Date().toISOString().slice(0,10)}" placeholder="YYYY-MM-DD">
    ${lvNow!=null?`<div class="card" style="margin:12px 0"><div class="kv"><span class="k">Lending value this implies</span><span class="v">${pct(lvNow,2)}</span></div>
      <p class="note" style="margin:6px 0 0">Borrowing potential ÷ total assets, both from this one screen — no date mismatch.</p></div>`:''}
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="savePortfolioSummary()">Save</button></div>`);
    return;
  }
  if(r.kind==='dbsMrtl'){
    showModal(head+`
    ${fld('rBP','Borrowing potential (SGD)',f.borrowingPotential)}
    ${fld('rDrawn','Amount drawn (SGD)',f.amountDrawn)}
    ${fld('rAvail','Available for drawdown (SGD)',f.availableForDrawdown)}
    ${fld('rLimit','Approved credit limit (SGD)',f.creditLimit)}
    <label class="fld">As-of date</label><input type="text" id="rAsOf" value="${new Date().toISOString().slice(0,10)}" placeholder="YYYY-MM-DD">
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveMrtlFromReview()">Save MRTL figures</button></div>`);
    return;
  }
  if(r.kind==='uobLoanScreen' || r.kind==='uobStatement'){
    const month=f.month || new Date().toISOString().slice(0,7);
    const rent=(f.rentCredits||[]).find(c=>c.amount);
    showModal(head+`
    <label class="fld">Month (YYYY-MM)</label><input type="text" id="rMonth" value="${esc(month)}">
    ${fld('rBal','Home-loan outstanding balance (SGD)',f.mortgageBalance)}
    ${fld('rPay','Monthly instalment (SGD)',f.mortgagePayment ?? latestManual()?.mortgagePayment)}
    ${fld('rRate','Interest rate (% p.a.)',f.mortgageRatePct ?? latestManual()?.mortgageRatePct)}
    ${fld('rDep','Bank deposits / cash (SGD)',f.deposits)}
    ${rent?`<div class="card" style="margin:12px 0"><h2>Rent credit found</h2>
      <div class="kv"><span class="k">${esc(rent.payer||'payer')} · ${esc(rent.reference||'')}</span><span class="v">${money(rent.amount,2)}</span></div>
      <label class="fld"><input type="checkbox" id="rUseRent" checked style="width:auto;margin-right:6px">Update the recurring rent amount to ${money(rent.amount,2)}/mo</label></div>`:''}
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveLoanFromReview()">Save</button></div>`);
    return;
  }
  // unrecognised — show what was found, let CK map it by hand
  const cands=(r.fields.candidates||[]);
  showModal(head+`
  <p class="note">Fortress didn't recognise this format, so it is not guessing. Here are the money-shaped values it found — pick what each one is, or cancel and paste a cleaner extract.</p>
  <div class="card" style="margin:8px 0;max-height:200px;overflow:auto">
    ${cands.length?cands.map(c=>`<div class="kv"><span class="k" style="font-size:11px">${esc(c.line)}</span><span class="v">${c.values.map(v=>money(v,2)).join(' · ')}</span></div>`).join(''):'<p class="note">No money-formatted values found at all.</p>'}
  </div>
  <details style="margin:8px 0"><summary class="note" style="cursor:pointer">Show exactly what was read${r.viaOcr?' by OCR':''}</summary>
    <pre style="white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto;background:var(--page);border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px">${esc((r.rawText||'').slice(0,4000))||'(nothing)'}</pre>
    ${r.viaOcr?`<p class="note">If that text is garbled, OCR could not read the photo. Best fix on iPhone: open the photo in Photos, tap the text-selection icon, copy, then use “Paste text instead”.</p>`:''}
  </details>
  <label class="fld">Month (YYYY-MM)</label><input type="text" id="rMonth" value="${new Date().toISOString().slice(0,7)}">
  ${fld('rBal','Home-loan outstanding balance (SGD) — leave blank to skip',null)}
  ${fld('rDep','Bank deposits / cash (SGD) — optional',null)}
  <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn" onclick="saveLoanFromReview()">Save what I entered</button></div>`);
}
const gv=id=>{ const el=document.getElementById(id); if(!el) return null; const v=el.value; return v===''?null:(+v); };
function saveRateChange(){
  const rate=gv('rRate'), inst=gv('rInst');
  const rf=(document.getElementById('rRateFrom').value||'').trim();
  const inf=(document.getElementById('rInstFrom').value||'').trim();
  if(rate==null && inst==null){ alert('Enter at least the new rate or the new instalment.'); return; }
  if(inf && !/^\d{4}-\d{2}-\d{2}$/.test(inf)){ alert('Instalment effective date must be YYYY-MM-DD.'); return; }
  if(rf && !/^\d{4}-\d{2}-\d{2}$/.test(rf)){ alert('Rate effective date must be YYYY-MM-DD.'); return; }
  state.rateChanges=state.rateChanges||[];
  state.rateChanges.push({ id:'rc-'+state.rateChanges.length, lender:'UOB',
    ratePct:rate, rateEffective:rf||null, instalment:inst, instalmentEffective:inf||null,
    previousRatePct:(window.__rec?.fields?.previousRatePct)??null,
    recordedOn:new Date().toISOString().slice(0,10),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') });
  // the rate applies from its own date. Only write onto a month that has ARRIVED —
  // creating a future month here would make it latestManual() and blank the balance.
  const nowM = new Date().toISOString().slice(0,7);
  if(rate!=null && rf){ const m=rf.slice(0,7); if(m<=nowM) state.manual[m]={...(state.manual[m]||{}), mortgageRatePct:rate}; }
  if(inst!=null && inf){ const m=inf.slice(0,7); if(m<=nowM) state.manual[m]={...(state.manual[m]||{}), mortgagePayment:inst}; }
  saveAll(); closeModal(); go('dash');
}
function usePrevRate(month, rate){
  if(!state.manual[month]) return;
  if(!confirm('Set the rate recorded for '+monthLabel(month)+' to '+rate+'%? This changes only that month\'s rate.')) return;
  state.manual[month]={...state.manual[month], mortgageRatePct:rate,
    rateSource:'UOB rate-revision letter (rate in force before the revision)'};
  saveAll(); render();
}
function delRateChange(ix){ if(confirm('Remove this rate change?')){ state.rateChanges.splice(ix,1); saveAll(); render(); } }
function saveReportedFromReview(){
  const from=(document.getElementById('rFrom').value||'').trim();
  const to=(document.getElementById('rTo').value||'').trim();
  const v=gv('rPct');
  if(v==null){ alert('Enter the return %.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||from>=to){ alert('Enter a valid period — from must be before to, both YYYY-MM-DD.'); return; }
  state.reported=state.reported||[];
  state.reported.push({ id:'rep-'+state.reported.length, portfolioId:document.getElementById('rPid').value,
    metric:document.getElementById('rMetric').value, pct:v, from, to,
    capturedOn:new Date().toISOString().slice(0,10),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') });
  saveAll(); closeModal(); go('dash');
}
function savePortfolioSummary(){
  const sel=document.getElementById('rPid').value;
  const pid = sel==='__new' ? (document.getElementById('rPidNew').value||'').trim() : sel;
  if(!pid){ alert('Enter a portfolio id.'); return; }
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const assets=gv('rAssets'), bp=gv('rBP'), drawn=gv('rDrawn');
  if(assets==null || bp==null){ alert('Total assets and borrowing potential are both needed to derive the lending value.'); return; }
  const src=(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)');
  state.lv=state.lv||{};
  state.lv[pid]={ asOf, borrowingPotential:bp, totalAssets:assets, basis:'derived', source:src };
  if(drawn!=null){
    state.mrtl[asOf]={ asOf, portfolioId:pid, borrowingPotential:bp, amountDrawn:drawn,
      availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
      totalAssets:assets, totalLoans:gv('rLoans'),
      leverageFactor:gv('rLF'), riskRating:gv('rPR'), leverageThreshold:6, riskThreshold:5, source:src };
  }
  saveAll(); closeModal(); go('dash');
}
function saveMrtlFromReview(){
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const rec={ asOf, borrowingPotential:gv('rBP'), amountDrawn:gv('rDrawn'),
    availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') };
  if(rec.amountDrawn==null || rec.borrowingPotential==null){ alert('Amount drawn and borrowing potential are both needed for the margin metric.'); return; }
  state.mrtl[asOf]=rec; saveAll(); closeModal(); go('dash');
}
function saveLoanFromReview(){
  const m=(document.getElementById('rMonth').value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM.'); return; }
  const bal=gv('rBal'), pay=gv('rPay'), rate=gv('rRate'), dep=gv('rDep');
  if(bal==null && dep==null){ alert('Nothing to save — enter at least a balance or a deposits figure.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev,
    ...(bal!=null?{mortgageBalance:bal}:{}),
    ...(pay!=null?{mortgagePayment:pay}:{}),
    ...(rate!=null?{mortgageRatePct:rate}:{}),
    ...(dep!=null?{deposits:dep}:{}) };
  const useRent=document.getElementById('rUseRent');
  if(useRent && useRent.checked){
    const c=(window.__rec?.fields?.rentCredits||[]).find(x=>x.amount);
    const entry=(state.income||[]).find(i=>i.id==='rent-atelier') || (state.income||[])[0];
    if(c && entry) entry.amount=c.amount;
  }
  saveAll(); closeModal(); go('dash');
}
function reviewParse(res){
  const a=agg(res);
  const exists=!!state.snapshots[res.statementDate];
  window.__pending=res;
  showModal(`
  <h2>Review parsed statement</h2>
  <p class="note" style="margin-bottom:8px">Statement date <b style="color:var(--ink)">${esc(res.statementDate||'?')}</b> · ${res.portfolios.length} portfolio(s): ${res.portfolios.map(p=>esc(p.id)).join(', ')}</p>
  ${res.warnings.length?`<div class="warnbox"><b>Check these:</b><br>${res.warnings.map(esc).join('<br>')}</div>`:''}
  ${exists?`<div class="warnbox">A snapshot for ${esc(res.statementDate)} already exists — saving will replace it.</div>`:''}
  <div class="card" style="margin:8px 0">
    <div class="kv"><span class="k">Total assets</span><span class="v">${money(a.assets,2)}</span></div>
    <div class="kv"><span class="k">Loans</span><span class="v">${money(-a.debt,2)}</span></div>
    <div class="kv"><span class="k">Net assets</span><span class="v">${money(a.net,2)}</span></div>
    <div class="kv"><span class="k">LTV</span><span class="v">${pct(a.ltv,2)}</span></div>
    <div class="kv"><span class="k">MTD / YTD P&L</span><span class="v">${money(a.plMtd,0)} / ${money(a.plYtd,0)}</span></div>
    <div class="kv"><span class="k">Interest paid YTD</span><span class="v">${money(a.intPaidYtd,2)}</span></div>
    <div class="kv"><span class="k">Dividends YTD</span><span class="v">${money(a.divYtd,2)}</span></div>
    <div class="kv"><span class="k">Loans found</span><span class="v">${a.loans.length}</span></div>
    <div class="kv"><span class="k">FX forwards found</span><span class="v">${a.forwards.length}</span></div>
  </div>
  <p class="note">Cross-check these against the statement's Portfolio Summary page before saving. If anything is off, cancel and tell me — the parser can be adjusted.</p>
  <div class="row2" style="margin-top:12px">
    <button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="confirmSave()">Save snapshot</button>
  </div>`);
}
function confirmSave(){
  const res=window.__pending; if(!res) return;
  res.source='Imported '+new Date().toISOString().slice(0,10);
  state.snapshots[res.statementDate]=res; saveAll();
  closeModal(); go('dash');
}
function showModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; window.__pending=null; }

/* ================= boot ================= */
let booted=false;
(function boot(){
  try{ window.__seedFixes = runSeedMigrations(); }catch(e){ console.error('seed migration failed', e); }
  if(isLocked()){ lockScreen(); return; }
  booted=true; render();
})();
/* Secure contexts only — https, or localhost while testing the update path. */
if('serviceWorker' in navigator && (location.protocol==='https:' || ['localhost','127.0.0.1'].includes(location.hostname))){
  navigator.serviceWorker.register('sw.js').catch(()=>{});   // the browser re-checks sw.js on each navigation
}
</script>
