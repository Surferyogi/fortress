<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<title>Fortress — Debt &amp; Margin Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --delta-good:#006300;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
    --delta-good:#0ca30c;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:76px;max-width:760px;margin:0 auto}
header{padding:18px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
header .stamp{font-size:11px;color:var(--muted)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:40;max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:none;border:none;color:var(--muted);font:inherit;font-size:11px;padding:10px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.hero{font-size:34px;font-weight:700;letter-spacing:-.02em}
.hero-sub{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile .l{font-size:11px;color:var(--muted);margin-top:2px}
.tile .d{font-size:11px;margin-top:2px;color:var(--ink2)}
.pos{color:var(--delta-good)} .neg{color:var(--critical)}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.banner b{display:block;font-size:14px}
.banner .ic{font-size:16px;line-height:1.3}
.b-good{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.b-warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.b-serious{background:color-mix(in srgb,var(--serious) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--serious) 45%,transparent)}
.b-critical{background:color-mix(in srgb,var(--critical) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--critical) 45%,transparent)}
.gauge{margin:6px 0 2px}
.gauge .track{position:relative;height:22px;border-radius:6px;background:var(--grid);overflow:visible}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--s1)}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.gauge .mark.actual{background:var(--critical);width:3px}
.gauge .mlab{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.gauge .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px;gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)} .kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;fill:var(--muted);font-size:10px}
svg.chart .lab{fill:var(--ink2);font-size:10.5px}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .axisline{stroke:var(--axis);stroke-width:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--page);border:none;border-radius:12px;padding:12px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
input[type=number],input[type=text]{width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
label.fld{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
table.hist{width:100%;border-collapse:collapse;font-size:12px}
table.hist th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--axis);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
table.hist td{padding:8px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
table.hist th:first-child,table.hist td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--page);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin-bottom:10px}
.hidden{display:none !important}
.spin{width:18px;height:18px;border:2px solid var(--page);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-left:6px;vertical-align:middle}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:10px;font-size:12px;margin:8px 0}
.fine{font-size:10.5px;color:var(--muted);line-height:1.5;margin:14px 4px 20px}
</style>
</head>

<script>
'use strict';
/* ================= constants / helpers ================= */
const VERSION = 'v2026:AUG:19-04:35';
const PDFJS_URL = 'pdf.min.js';           // vendored — no CDN dependency
const PDFJS_WORKER = 'pdf.worker.min.js';
const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';  // fallback only
const ILLUSTRATIVE_LV = [50,60,70]; // % — labelled illustrative, NOT DBS figures

const fmt = (n,dp=0)=> n===null||n===undefined||isNaN(n) ? '—' :
  n.toLocaleString('en-SG',{minimumFractionDigits:dp,maximumFractionDigits:dp});
const money = (n,dp=0)=> n===null||n===undefined||isNaN(n) ? '—' : (n<0?'-':'')+'S$'+fmt(Math.abs(n),dp);
const pct = (n,dp=2)=> n===null||n===undefined||isNaN(n) ? '—' : fmt(n,dp)+'%';
const esc = s=> String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const monthLabel = iso=>{ const [y,m]=iso.split('-'); return new Date(+y,+m-1,1).toLocaleString('en',{month:'short'})+'-'+y.slice(2); };
const daysUntil = iso=>{ if(!iso) return null; return Math.ceil((new Date(iso+'T00:00:00')-new Date())/86400000); };

/* ================= storage (guarded — works without localStorage) ================= */
const memStore = {};
const store = {
  get(k,fb){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return memStore[k]??fb; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ memStore[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
};
/* migrate data saved under the app's former name — runs once, keeps your history */
(function migrate(){
  try{
    ['snapshots','manual','income','mrtl','lv','settings'].forEach(key=>{
      const oldK='dw.'+key, newK='fortress.'+key;
      if(localStorage.getItem(oldK) && !localStorage.getItem(newK)){
        localStorage.setItem(newK, localStorage.getItem(oldK));
      }
    });
  }catch(e){}
})();

/* ================= seed: parsed from the 31-Jul-2026 DBS statement ================= */
const SEED = {"statementDate":"2026-07-31","source":"DBS eStatement S/N S-6075227990332902 (seeded)","portfolios":[{"id":"S-607522-0","refCurrency":"SGD","totalAssets":2697000.94,"totalCash":58732.22,"totalEquity":2638268.72,"netAssets":2129445.83,"totalLoans":-567555.11,"loans":[{"ccy":"SGD","principal":-565472.93,"description":"MRTL SGD, 2.10%, 28/05/2026-31/08/2026","ratePct":2.1,"startDate":"2026-05-28","maturityDate":"2026-08-31","accrIntSGD":-2082.18,"valueSGD":-565472.93}],"ccyAlloc":{"USD":2002259.39,"SGD":454608.92,"HKD":191043.71,"JPY":28128.14,"EUR":20960.78},"perf":{"startMtd":2200678.77,"startYtd":1981070.61,"addWithMtd":1585.34,"addWithYtd":-127104.04,"end":2130397.76,"plMtd":-71866.35,"plYtd":276431.19,"pctMtd":-3.27,"pctYtd":15.06},"income":{"divMtd":876.86,"divYtd":17054.57,"intRecMtd":1.56,"intRecYtd":1426.33},"expenses":{"custodyMtd":0,"custodyYtd":1962.31,"txnMtd":146,"txnYtd":1827.52,"intPaidMtd":0,"intPaidYtd":8354.34},"leverageFactor":1.3,"leverageThreshold":6,"riskRating":4.2,"riskThreshold":5,"fxForwards":[{"buyCcy":"SGD","buyAmt":568563.67,"pair":"CHF/SGD","contractRate":1.6334936,"maturityDate":"2026-08-31","sellCcy":"CHF","sellAmt":-348066.05,"mtmSGD":15387.54}]},{"id":"S-607522-1","refCurrency":"SGD","totalAssets":40157.73,"totalCash":2.67,"totalEquity":40155.06,"netAssets":40157.73,"totalLoans":0,"loans":[],"ccyAlloc":{"USD":40155.07,"SGD":2.66},"perf":{"startMtd":40379.45,"startYtd":360839.25,"addWithMtd":-1585.25,"addWithYtd":-355972.7,"end":40157.73,"plMtd":1363.53,"plYtd":35291.18,"pctMtd":3.38,"pctYtd":13.71},"income":{"divMtd":125.7,"divYtd":429.77,"intRecMtd":0.04,"intRecYtd":6706.31},"expenses":{"custodyMtd":0,"custodyYtd":227.48,"txnMtd":0,"txnYtd":458.06,"intPaidMtd":0,"intPaidYtd":0},"leverageFactor":1,"leverageThreshold":6,"riskRating":4,"riskThreshold":5,"fxForwards":[]}],"fxRates":{"AUD":0.901837,"CAD":0.914943,"CHF":1.58766,"EUR":1.476189,"GBP":1.723823,"HKD":0.1635941503966831,"JPY":0.008003,"USD":1.28275}};

/* ================= other-bank debts (manual) — seeded from CK's UOB screenshots ================= */
const MANUAL_SEED = {
  "2026-05": { mortgageBalance:1347500.00, deposits:25073.57 },
  "2026-06": { mortgageBalance:1343116.85, deposits:25387.90 },
  "2026-07": { mortgageBalance:1338729.99, deposits:17702.23, mortgageRatePct:1.13, mortgagePayment:5485.67 },
  "2026-08": { mortgageBalance:1334490.74, mortgageRatePct:1.13, mortgagePayment:5485.67, nextDue:"2026-09-01",
               note:"Balance after the 03-Aug-2026 instalment (UOB app) — not a month-end statement figure" }
};
const MORTGAGE_META = { bank:'UOB', account:'168-821-222-2', original:1347500.00, tenorMonths:276, type:'SGD Housing Loan, floating rate' };

/* recurring income — seeded from the GIRO credits in CK's UOB statements */
const INCOME_SEED = [{
  id:'rent-atelier', label:'Rent — The Atelier', payer:'PLOETNER MATHIAS ALE',
  amount:5800.00, ccy:'SGD', frequency:'monthly', dayOfMonth:11,
  account:'UOB 372-304-221-4', startMonth:'2026-05', endMonth:null,
  source:'Inward CR - GIRO, observed on the May and Jun 2026 UOB statements'
}];

/* DBS's own wording for its two capacity figures — verbatim from the app's (i) tooltips.
   They are NOT the same quantity, which is why they don't reconcile. */
const CAPACITY_DEFS = {
  borrowingPotential:'This is the indicative amount you can borrow based on your current assets, subject to credit approval. It’s not an offer or a commitment to provide you credit facilities. To assess your actual credit limit, we’ll consider your account diversification needs, concentration limits, availability of qualifying collateral, and more.',
  availableForDrawdown:'This is the maximum you can draw down on your MRTL (Multi-Currency Revolving Term Loan). It’s an indicative amount based on your existing portfolio.'
};

/* DBS MRTL facility + live portfolio position — from the iBanking Portfolio Summary screen */
const MRTL_SEED = { '2026-08-19': {
  asOf:'2026-08-19', portfolioId:'S-607522-0',
  borrowingPotential:1240212.07, creditLimit:3000000.00,
  amountDrawn:567326.23, availableForDrawdown:1120577.90,
  totalAssets:2789261.47, totalLoans:568140.72, totalDerivatives:0,
  riskRating:4.2, riskThreshold:5.0, leverageFactor:1.2, leverageThreshold:6.0,
  source:'DBS iBanking — Portfolio Summary, 19-Aug-2026 12:05'
}};

/* Lending value (advance ratio) per portfolio.
   Derived = borrowing potential ÷ total assets, both read off the SAME screen at the SAME time. */
const LV_SEED = {
  'S-607522-0': { asOf:'2026-08-19', borrowingPotential:1240212.07, totalAssets:2789261.47,
                  basis:'derived', source:'DBS iBanking Portfolio Summary 19-Aug-2026 12:05' },
  'S-607522-1': { asOf:'2026-08-19', borrowingPotential:22970.17,   totalAssets:41085.73,
                  basis:'derived', source:'DBS iBanking Portfolio Summary 19-Aug-2026 12:05 ("Your borrowing potential (indicative)")' }
};

/* ================= state ================= */
let state = {
  snapshots: store.get('fortress.snapshots', null),
  manual: store.get('fortress.manual', null),
  income: store.get('fortress.income', null),
  mrtl: store.get('fortress.mrtl', null),
  lv: store.get('fortress.lv', null),
  settings: store.get('fortress.settings', { lendingValue:null, ltvAlert:35, homeValue:null, tab:'dash' })
};
if(!state.snapshots){ state.snapshots = { [SEED.statementDate]: SEED }; store.set('fortress.snapshots', state.snapshots); }
if(!state.manual){ state.manual = MANUAL_SEED; store.set('fortress.manual', state.manual); }
if(!state.income){ state.income = INCOME_SEED; store.set('fortress.income', state.income); }
if(!state.mrtl){ state.mrtl = MRTL_SEED; store.set('fortress.mrtl', state.mrtl); }
if(!state.lv){ state.lv = LV_SEED; store.set('fortress.lv', state.lv); }
function saveAll(){ store.set('fortress.snapshots', state.snapshots); store.set('fortress.manual', state.manual);
  store.set('fortress.income', state.income); store.set('fortress.mrtl', state.mrtl);
  store.set('fortress.lv', state.lv); store.set('fortress.settings', state.settings); }

/* lending value per portfolio: an entered ratio wins; otherwise derive it from
   borrowing potential ÷ total assets read off the same screen at the same time. */
function lvFor(pid){
  const e=(state.lv||{})[pid]; if(!e) return null;
  if(e.ratioPct!=null) return {pct:e.ratioPct, basis:'entered', asOf:e.asOf, source:e.source};
  if(e.borrowingPotential!=null && e.totalAssets>0)
    return {pct:e.borrowingPotential/e.totalAssets*100, basis:'derived', asOf:e.asOf, source:e.source,
            borrowingPotential:e.borrowingPotential, totalAssets:e.totalAssets};
  return null;
}

/* ---- income + MRTL helpers ---- */
const monthlyIncome = ()=> (state.income||[]).filter(i=>i.endMonth==null)
  .reduce((s,i)=> s + (i.frequency==='monthly'? i.amount : i.frequency==='quarterly'? i.amount/3 : i.amount/12), 0);
const latestDate = ()=>{ const d=dates(); return d[d.length-1]; };
const mrtlDates = ()=> Object.keys(state.mrtl||{}).sort();
const latestMrtl = ()=>{ const d=mrtlDates(); return d.length? state.mrtl[d[d.length-1]] : null; };
// conservative: a call bites when drawn exceeds the collateral's lending value.
// DBS gives two candidate capacity figures that don't agree — always use the smaller.
function mrtlCapacity(m){
  if(!m) return null;
  // Two different quantities, per DBS's own tooltips:
  //  A) borrowing potential — asset-based, "subject to credit approval"; ignores the approved facility
  //  B) available for drawdown + already drawn — total drawable on the EXISTING approved MRTL
  const A=m.borrowingPotential;
  const B=(m.availableForDrawdown!=null&&m.amountDrawn!=null)? m.availableForDrawdown+m.amountDrawn : null;
  const cands=[A,B].filter(v=>v!=null&&v>0);
  if(!cands.length) return null;
  return { capacity:Math.min(...cands), optimistic:Math.max(...cands),
           assetBased:A, facilityBased:B, differ:cands.length>1 && Math.abs(A-B)>1 };
}
const dates = ()=> Object.keys(state.snapshots).sort();
const latest = ()=> state.snapshots[dates()[dates().length-1]];
const manualMonths = ()=> Object.keys(state.manual).sort();
const latestManual = ()=>{ const m=manualMonths(); return m.length? {month:m[m.length-1], ...state.manual[m[m.length-1]]} : null; };
// implied interest for a month = that month's payment − principal reduction vs previous month (both stated; no estimates)
function impliedMortgageInterest(month){
  const ms=manualMonths(); const i=ms.indexOf(month);
  if(i<1) return null;
  const cur=state.manual[ms[i]], prev=state.manual[ms[i-1]];
  if(cur.mortgagePayment==null || cur.mortgageBalance==null || prev.mortgageBalance==null) return null;
  return cur.mortgagePayment - (prev.mortgageBalance - cur.mortgageBalance);
}

/* ================= derived metrics ================= */
function agg(snap){
  const a = { assets:0, cash:0, equity:0, net:0, debt:0, plMtd:0, plYtd:0,
    divMtd:0, divYtd:0, intRecMtd:0, intRecYtd:0, intPaidMtd:0, intPaidYtd:0, feesYtd:0,
    loans:[], forwards:[], ccy:{} };
  for(const p of snap.portfolios){
    a.assets += p.totalAssets||0; a.cash += p.totalCash||0; a.equity += p.totalEquity||0;
    a.net += p.netAssets||0; a.debt += Math.abs(p.totalLoans||0);
    a.plMtd += p.perf.plMtd||0; a.plYtd += p.perf.plYtd||0;
    a.divMtd += p.income.divMtd||0; a.divYtd += p.income.divYtd||0;
    a.intRecMtd += p.income.intRecMtd||0; a.intRecYtd += p.income.intRecYtd||0;
    a.intPaidMtd += p.expenses.intPaidMtd||0; a.intPaidYtd += p.expenses.intPaidYtd||0;
    a.custodyYtd = (a.custodyYtd||0)+(p.expenses.custodyYtd||0);
    a.custodyMtd = (a.custodyMtd||0)+(p.expenses.custodyMtd||0);
    a.txnYtd = (a.txnYtd||0)+(p.expenses.txnYtd||0);
    a.feesYtd += (p.expenses.custodyYtd||0)+(p.expenses.txnYtd||0);
    a.loans.push(...p.loans.map(l=>({...l, pf:p.id})));
    a.forwards.push(...p.fxForwards.map(f=>({...f, pf:p.id})));
    for(const [c,v] of Object.entries(p.ccyAlloc||{})) a.ccy[c]=(a.ccy[c]||0)+v;
  }
  a.ltv = a.assets>0 ? a.debt/a.assets*100 : null;
  a.estMonthlyInterest = a.loans.reduce((s,l)=> s + Math.abs(l.principal||0)*(l.ratePct||0)/100/12, 0);
  a.carryYtd = a.divYtd + a.intRecYtd - a.intPaidYtd - a.feesYtd;
  a.gainsVsInterest = a.intPaidYtd>0 ? a.plYtd/a.intPaidYtd : null;
  a.divCover = a.intPaidYtd>0 ? a.divYtd/a.intPaidYtd : null;
  return a;
}
// drawdown (%) until debt exceeds lendingValue% of remaining assets
function drawdownToTrigger(debt, assets, lvPct){
  if(!debt || !assets || !lvPct) return null;
  const trigAssets = debt/(lvPct/100);
  return Math.max(0,(1 - trigAssets/assets)*100);
}
function marginStatus(a){
  const lv = state.settings.lendingValue;
  if(a.debt<=0) return {cls:'b-good', ic:'✔', title:'No outstanding loans', body:'No margin-call exposure this month.'};
  // DBS's own borrowing-potential figure beats any assumed ratio — use it when we have it
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  if(mr && cap && mr.amountDrawn!=null){
    const util=mr.amountDrawn/cap.capacity*100, fall=100-util;
    const body=`Drawn ${money(mr.amountDrawn,0)} against DBS's assessed capacity of ${money(cap.capacity,0)} (as of ${mr.asOf}). Your collateral's lending value can fall ${pct(fall,1)} before the loan exceeds it.`;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Drawn amount exceeds capacity', body};
    if(util>=85)  return {cls:'b-serious',  ic:'⚠', title:'Margin buffer thin', body};
    if(util>=65)  return {cls:'b-warn',     ic:'⚠', title:'Watch the buffer', body};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body};
  }
  if(lv){
    const dd = drawdownToTrigger(a.debt,a.assets,lv);
    const util = a.ltv/lv*100;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Loan exceeds lending value', body:`LTV ${pct(a.ltv,1)} is above your configured lending value of ${lv}%. Expect a margin call — contact your RM.`};
    if(util>=85) return {cls:'b-serious', ic:'⚠', title:'Margin buffer thin', body:`LTV ${pct(a.ltv,1)} is at ${fmt(util,0)}% of your ${lv}% lending value. A further ${pct(dd,1)} portfolio fall triggers a call.`};
    if(util>=65) return {cls:'b-warn', ic:'⚠', title:'Watch the buffer', body:`LTV ${pct(a.ltv,1)} vs lending value ${lv}%. Portfolio can fall ${pct(dd,1)} before a margin call.`};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body:`LTV ${pct(a.ltv,1)} vs your configured lending value ${lv}%. Portfolio would need to fall ${pct(dd,1)} before a call.`};
  }
  // no configured LV — use conservative illustrative 50%
  const dd50 = drawdownToTrigger(a.debt,a.assets,50);
  return {cls: a.ltv<35 ? 'b-good':'b-warn', ic: a.ltv<35?'✔':'⚠',
    title: a.ltv<35 ? 'No margin-call risk in sight' : 'Leverage building — verify buffer',
    body:`LTV ${pct(a.ltv,1)}. DBS lending values are not in the statement — even at an illustrative 50% lending value the portfolio must fall ${pct(dd50,1)} before a call. Enter the actual ratio from your RM in Settings for a precise trigger.`};
}

/* ================= SVG chart helpers (hand-rolled, dataviz method) ================= */
function svgEl(w,h){ return `viewBox="0 0 ${w} ${h}" class="chart" role="img"`; }
function niceTicks(min,max,n=4){
  if(min===max){ max=min+1; }
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)|| step0;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+1e-9;v+=step) t.push(+v.toFixed(10));
  return t;
}
// series: [{name,color,values:[{x:label,y}] }] — single shared y axis
function lineChart(series, {h=190, yFmt=v=>fmt(v), refLines=[]}={}){
  const W=340, padL=44, padR=12, padT=14, padB=26;
  const labels = series[0].values.map(v=>v.x);
  const all = series.flatMap(s=>s.values.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  refLines.forEach(r=>all.push(r.y));
  if(!all.length) return '<p class="note">No data yet.</p>';
  let ticks = niceTicks(Math.min(...all,0), Math.max(...all));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const X=i=> labels.length===1 ? (padL+(W-padL-padR)/2) : padL + i*(W-padL-padR)/(labels.length-1);
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  labels.forEach((l,i)=>{ if(labels.length<=8 || i%Math.ceil(labels.length/8)===0) g+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle">${l}</text>`; });
  refLines.forEach(r=>{ g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-padR}" y="${Y(r.y)-4}" text-anchor="end" style="fill:${r.color}">${r.label}</text>`; });
  for(const s of series){
    const pts=s.values.map((v,i)=>[X(i),Y(v.y)]);
    if(pts.length>1) g+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length===1?5:3.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.name)} ${labels[i]}: ${yFmt(s.values[i].y)}</title></circle>`; });
    const lp=pts[pts.length-1];
    g+=`<text class="lab" x="${Math.min(lp[0]+6,W-padR-2)}" y="${lp[1]-7}" text-anchor="${lp[0]>W-70?'end':'start'}">${yFmt(s.values[s.values.length-1].y)}</text>`;
  }
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// diverging / grouped bars: groups=[{x, vals:[{name,color,y}]}]
function barChart(groups,{h=190,yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=10, padT=14, padB=26;
  const all=groups.flatMap(gr=>gr.vals.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  if(!all.length) return '<p class="note">No data yet.</p>';
  const ticks=niceTicks(Math.min(...all,0),Math.max(...all,0));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  const gw=(W-padL-padR)/groups.length, n=groups[0].vals.length;
  const bw=Math.min(26,(gw-8)/n);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  g+=`<line class="axisline" x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  groups.forEach((gr,gi)=>{
    const cx=padL+gw*gi+gw/2;
    gr.vals.forEach((v,vi)=>{
      if(v.y===null||isNaN(v.y)) return;
      const x=cx-(n*bw+(n-1)*2)/2+vi*(bw+2);
      const yA=Y(Math.max(0,v.y)), yB=Y(Math.min(0,v.y));
      const hh=Math.max(2,yB-yA);
      const rTop=v.y>=0?4:0, rBot=v.y<0?4:0;
      g+=`<path d="M${x},${yA+rTop} q0,-${rTop} ${rTop},-${rTop} h${bw-2*rTop} q${rTop},0 ${rTop},${rTop} v${hh-rTop-rBot} q0,${rBot} -${rBot},${rBot} h-${bw-2*rBot} q-${rBot},0 -${rBot},-${rBot} z" fill="${v.color}"><title>${esc(v.name)} ${esc(gr.x)}: ${yFmt(v.y)}</title></path>`;
    });
    if(groups.length<=8 || gi%Math.ceil(groups.length/8)===0) g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${esc(gr.x)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// horizontal bars for currency exposure
function hBars(items,{yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=54, rowH=26, padT=4;
  const max=Math.max(...items.map(i=>Math.abs(i.v)));
  const h=padT+items.length*rowH+4;
  let g='';
  items.forEach((it,i)=>{
    const y=padT+i*rowH, bw=Math.max(6,Math.abs(it.v)/max*(W-padL-padR));
    g+=`<text class="lab" x="${padL-6}" y="${y+15}" text-anchor="end" style="font-weight:600">${esc(it.label)}</text>`;
    g+=`<path d="M${padL},${y+4} h${bw-4} q4,0 4,4 v8 q0,4 -4,4 h-${bw-4} z" fill="${it.color}"><title>${esc(it.label)}: ${yFmt(it.v)} (${pct(it.pct,1)})</title></path>`;
    g+=`<text x="${padL+bw+5}" y="${y+15}">${pct(it.pct,1)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}

  const out=[];
  for(const l of a.loans){

    if(d!==null&&d<=45) out.push({cls:d<=14?'b-warn':'b-good',ic:'⏳',t:`Loan matures in ${d} day${d===1?'':'s'} (${l.maturityDate})`,b:`${l.ccy} ${fmt(Math.abs(l.principal),2)} @ ${l.ratePct}% — decide rollover vs repay before maturity.`});
  }

    if(d!==null&&d<=45) out.push({cls:'b-warn',ic:'⇄',t:`FX forward ${f.pair} settles in ${d} day${d===1?'':'s'}`,b:`Sell ${f.sellCcy} ${fmt(Math.abs(f.sellAmt),0)} / buy ${f.buyCcy} ${fmt(f.buyAmt,0)} @ ${f.contractRate}. Current MTM ${money(f.mtmSGD,0)}. Ensure the ${f.sellCcy} leg is funded at settlement.`});
  }
  if(a.ltv!==null && a.ltv>=state.settings.ltvAlert) out.push({cls:'b-serious',ic:'⚠',t:`LTV ${pct(a.ltv,1)} above your ${state.settings.ltvAlert}% alert level`,b:'Consider partial repayment or trimming positions.'});
  if(!state.settings.lendingValue && a.debt>0 && !latestMrtl()) out.push({cls:'b-warn',ic:'ℹ',t:'Lending value not set',b:'DBS statements don’t disclose per-security lending values. Ask your RM for the portfolio’s lending value and enter it in Settings — until then margin lines are illustrative.'});
  {(function(){ const m=latestMrtl(), c=mrtlCapacity(m);
    if(m && c && c.disputed) out.push({cls:'b-warn',ic:'ℹ',t:'DBS shows two different capacity figures',b:`Borrowing potential ${money(m.borrowingPotential,0)} vs available-for-drawdown implying ${money(c.optimistic,0)}. Fortress uses the smaller. Worth one question to Mark Chen.`});

  return out;
}

        <div class="fill" style="width:${Math.min(100,a.ltv/gaugeMax*100)}%"></div>
        ${marks.map(m=>`<div class="mark ${m.actual?'actual':''}" style="left:${m.v/gaugeMax*100}%"></div><div class="mlab" style="left:${m.v/gaugeMax*100}%">${m.label}</div>`).join('')}
      </div>
      <div class="axis"><span>0%</span><span>LTV ${pct(a.ltv,1)}</span><span>${gaugeMax}%</span></div>
    </div>
    ${(()=>{ const m=latestMrtl(), c=mrtlCapacity(m);
      if(m && c && m.amountDrawn!=null){
        // prefer the same-screen ratio (no date mismatch); fall back to statement assets
        const pidL = lvFor(m.portfolioId||'') || null;
        const impliedLV = pidL ? pidL.pct : (a.assets>0 ? c.capacity/a.assets*100 : null);
        const lvSameScreen = !!pidL;
        const gap = (lv!=null && impliedLV!=null) ? Math.abs(impliedLV-lv) : null;
        return `<div class="kv"><span class="k">Fall in collateral value before a call <b>(DBS figures)</b></span><span class="v">${pct(100-m.amountDrawn/c.capacity*100,1)}</span></div>
        ${impliedLV!=null?`<div class="kv"><span class="k">Implied average advance ratio${lvSameScreen?'':' <em>(dates differ)</em>'}</span><span class="v">${pct(impliedLV,2)}</span></div>`:''}
        ${lv!=null?`<div class="kv"><span class="k">Your entered lending value (cross-check)</span><span class="v">${pct(lv,1)} → call after −${pct(drawdownToTrigger(a.debt,a.assets,lv),1)}</span></div>`:''}
        ${gap!=null && gap>5?`<div class="warnbox">Your entered lending value (${pct(lv,1)}) and the ratio implied by DBS's borrowing potential (${pct(impliedLV,1)}) differ by ${fmt(gap,1)} points. Fortress leads with DBS's own figure — worth reconciling with your RM.</div>`:''}`;
      }
      return lv
        ? `<div class="kv"><span class="k">Drawdown before margin call (at your ${lv}% LV)</span><span class="v">${pct(drawdownToTrigger(a.debt,a.assets,lv),1)}</span></div>`
        : ILLUSTRATIVE_LV.map(v=>`<div class="kv"><span class="k">If lending value were ${v}% <em>(illustrative)</em></span><span class="v">call after −${pct(drawdownToTrigger(a.debt,a.assets,v),1)}</span></div>`).join('');
    })()}
    <p class="note">A margin call occurs when the loan exceeds the portfolio's lending value (advance ratio × market value). ${(()=>{ const m=latestMrtl(), c=mrtlCapacity(m);
      if(m&&c){ const same=!!lvFor(m.portfolioId||'');
        return `The headline figure above comes from DBS's own borrowing-potential number (${esc(m.asOf)}), not an assumption. ${same?'The advance ratio uses the assets shown on that same screen, so there is no date mismatch.':'The implied ratio divides that capacity by the '+esc(latestDate())+' portfolio value — the dates differ, so treat it as approximate.'}`; }
      return `The DBS statement does not publish these ratios${lv?'; the '+lv+'% figure is the one you entered in Settings':' — get them from your RM, or import the MRTL draw-down screen, which states your capacity directly'}.`;
    })()}</p>
  </div>
  <div class="card">
    <h2>Interest vs portfolio gains (YTD)</h2>
    <div class="kv"><span class="k">Portfolio P&L</span><span class="v ${a.plYtd>=0?'pos':'neg'}">${money(a.plYtd)}</span></div>
    <div class="kv"><span class="k">Dividends + interest received</span><span class="v">${money(a.divYtd+a.intRecYtd,0)}</span></div>
    <div class="kv"><span class="k">Margin loan interest paid</span><span class="v">${money(-a.intPaidYtd,0)}</span></div>
    <div class="kv"><span class="k">DBS custody fees</span><span class="v">${money(-a.custodyYtd,0)}</span></div>
    <div class="kv"><span class="k">Transaction costs</span><span class="v">${money(-a.txnYtd,0)}</span></div>
    <div class="kv"><span class="k">Gains ÷ margin interest</span><span class="v">${a.gainsVsInterest===null?'—':fmt(a.gainsVsInterest,1)+'×'}</span></div>
    <div class="kv"><span class="k">Dividend cover of margin interest</span><span class="v">${a.divCover===null?'—':fmt(a.divCover,1)+'×'}</span></div>
    ${(()=>{ const mm=latestManual(); if(!mm) return '';
      const impInt = impliedMortgageInterest(mm.month);
      const annAllIn = (a.estMonthlyInterest + (impInt ?? (mm.mortgageRatePct!=null&&mm.mortgageBalance!=null? mm.mortgageBalance*mm.mortgageRatePct/100/12 : 0)))*12;
      return `<div class="kv"><span class="k">Gains ÷ all-in interest (incl. mortgage, annualised)</span><span class="v">${annAllIn>0?fmt(a.plYtd/annAllIn,1)+'×':'—'}</span></div>`; })()}
  </div>
  ${(()=>{ const mm=latestManual(); if(!mm) return '';
    const impInt = impliedMortgageInterest(mm.month);
    const paidOff = MORTGAGE_META.original && mm.mortgageBalance!=null ? MORTGAGE_META.original - mm.mortgageBalance : null;

    <h2>Home loan — ${esc(MORTGAGE_META.bank)} ${esc(MORTGAGE_META.account)}<span class="pill">manual entry</span></h2>

    <div class="kv"><span class="k">Original / repaid so far</span><span class="v">${money(MORTGAGE_META.original,0)} / ${paidOff!==null?money(paidOff,0):'—'}</span></div>

    <div class="kv"><span class="k">Monthly instalment</span><span class="v">${mm.mortgagePayment!=null?money(mm.mortgagePayment,2):'—'}</span></div>
    <div class="kv"><span class="k">Interest portion this month (implied)</span><span class="v">${impInt!==null?money(impInt,2):'— (needs prior month + instalment)'}</span></div>

    ${mm.note?`<p class="note" style="margin-top:6px">${esc(mm.note)}</p>`:''}
    ${state.settings.homeValue?`<div class="kv"><span class="k">Mortgage LTV vs your entered property value</span><span class="v">${pct(mm.mortgageBalance/state.settings.homeValue*100,1)}</span></div>`:''}
    <p class="note">Implied interest = instalment − principal reduction between your two latest entries (pure arithmetic from UOB statements, no assumptions). A property loan has no market-linked margin call, but its interest is part of the hurdle your portfolio must beat. Update monthly in Settings → Home loan.</p>
  </div>`; })()}
  ${a.loans.map(l=>{const d=daysUntil(l.maturityDate);return `
  <div class="card">
    <h2>Loan — ${esc(l.pf)}</h2>

  ${alertList(snap,a).map(x=>`<div class="banner ${x.cls}"><span class="ic">${x.ic}</span><div><b>${x.t}</b>${x.b}</div></div>`).join('')}

function viewTrends(){
  const ds=dates(); const snaps=ds.map(d=>({d, a:agg(state.snapshots[d])}));
  const lv=state.settings.lendingValue;
  const one = ds.length===1;
  const ltvSeries=[{name:'LTV',color:'var(--s1)',values:snaps.map(s=>({x:monthLabel(s.d),y:+s.a.ltv.toFixed(2)}))}];
  const refs = lv? [{y:lv,color:'var(--critical)',label:`LV ${lv}%`}] : [{y:50,color:'var(--muted)',label:'50% (illustrative)'}];
  return `
  ${one?'<div class="banner b-warn"><span class="ic">ℹ</span><div><b>One month of data so far</b>Trends build as you import each monthly statement.</div></div>':''}
  <div class="card"><h2>Loan-to-assets over time</h2>${lineChart(ltvSeries,{yFmt:v=>fmt(v,0)+'%',refLines:refs})}</div>
  <div class="card"><h2>Monthly portfolio P&L (S$)</h2>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[{name:'Monthly P&L',color:s.a.plMtd>=0?'var(--div-pos)':'var(--div-neg)',y:Math.round(s.a.plMtd)}]})),{yFmt:v=>fmt(v/1000,0)+'k'})}
    <p class="note">Blue = gain, red = loss. Compare against ~${money(agg(latest()).estMonthlyInterest)} of monthly interest — the bar you can barely see.</p></div>
  <div class="card"><h2>Income vs debt cost (YTD, S$)</h2>
    <div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Dividends + interest received</span><span><span class="sw" style="background:var(--s2)"></span>Interest paid + fees</span></div>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[
      {name:'Income YTD',color:'var(--s1)',y:Math.round(s.a.divYtd+s.a.intRecYtd)},
      {name:'Debt cost YTD',color:'var(--s2)',y:Math.round(s.a.intPaidYtd+s.a.feesYtd)}]})),{yFmt:v=>fmt(v/1000,1)+'k'})}
    <p class="note">Positive carry = the portfolio's cash income alone outruns all financing and account costs.</p></div>
  <div class="card"><h2>Net assets (S$)</h2>${lineChart([{name:'Net assets',color:'var(--s3)',values:snaps.map(s=>({x:monthLabel(s.d),y:Math.round(s.a.net)}))}],{yFmt:v=>fmt(v/1e6,2)+'M'})}</div>
  ${(()=>{ const mm=manualMonths(); if(!mm.length) return '';
    const withBal=mm.filter(m=>state.manual[m].mortgageBalance!=null);
    if(withBal.length<2) return '';
    const series=[{name:'Home loan balance',color:'var(--s2)',values:withBal.map(m=>({x:monthLabel(m+'-01'),y:Math.round(state.manual[m].mortgageBalance)}))}];
    const first=state.manual[withBal[0]].mortgageBalance, last=state.manual[withBal[withBal.length-1]].mortgageBalance;
    return `
  <div class="card"><h2>Home loan balance (S$)</h2>
    ${lineChart(series,{yFmt:v=>fmt(v/1e6,3)+'M'})}
    <p class="note">Down ${money(first-last,0)} across ${withBal.length} months — amortising, and it shrinks whether or not markets cooperate. Add each month in Settings → Home loan.</p></div>`; })()}`;
}

function viewFX(){
  const snap=latest(), a=agg(snap);
  const ccys=Object.entries(a.ccy).sort((x,y)=>y[1]-x[1]);
  const palette=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--muted)','var(--axis)'];
  const items=ccys.map(([c,v],i)=>({label:c,v,pct:v/a.assets*100,color:palette[Math.min(i,palette.length-1)]}));
  const loanCcy={}; a.loans.forEach(l=>{loanCcy[l.ccy]=(loanCcy[l.ccy]||0)+Math.abs(l.principal);});
  const rates=snap.fxRates||{};
  const shocks=[-10,-5,5,10];
  const nonSgd=ccys.filter(([c])=>c!=='SGD');
  const stressRows=nonSgd.map(([c,v])=>{
    const cells=shocks.map(s=>{ const dA=v*s/100; const ltv2=a.debt/(a.assets+dA)*100; return `<td>${money(dA/1000,0).replace('S$','')}k<br><span style="color:var(--muted)">${fmt(ltv2,1)}%</span></td>`; }).join('');
    return `<tr><td><b>${c}</b><br><span style="color:var(--muted)">${pct(v/a.assets*100,1)} of assets</span></td>${cells}</tr>`;
  }).join('');
  return `
  <div class="card"><h2>Currency exposure (assets, SGD-equivalent)</h2>
    ${hBars(items,{yFmt:v=>money(v)})}
    <p class="note">Loans by currency: ${Object.entries(loanCcy).map(([c,v])=>`${c} ${money(v)}`).join(', ')||'none'}. ${(()=>{const usd=a.ccy.USD||0; return usd/a.assets>0.5 && !loanCcy.USD ? `Mismatch: ${pct(usd/a.assets*100,1)} of assets are USD while the loan is ${Object.keys(loanCcy).join('/')||'—'} — a USD fall shrinks assets but not the debt, so LTV and net worth both take the hit.`:''})()}</p>
  </div>
  <div class="card"><h2>FX stress — asset impact & resulting LTV</h2>
    <table class="hist"><tr><th>vs SGD</th>${shocks.map(s=>`<th>${s>0?'+':''}${s}%</th>`).join('')}</tr>${stressRows}</table>
    <p class="note">Each cell: change in asset value (S$ thousands) and the LTV after the move, holding the loan constant. Computed from this statement's currency allocation — indicative rates as printed by DBS.</p>
  </div>
  ${a.forwards.length?`<div class="card"><h2>FX forwards</h2>
    ${a.forwards.map(f=>{
      const d=daysUntil(f.maturityDate);
      const spot=rates[f.sellCcy]||null;
      const sellAbs=Math.abs(f.sellAmt);
      const shock=spot? [5,10].map(s=>`${f.sellCcy} +${s}% → MTM ${money(f.buyAmt - sellAbs*spot*(1+s/100),0)}`).join(' · ') : '';
      const loan=a.loans[0];
      const fundsLoan = loan && f.buyCcy===loan.ccy && Math.abs(f.buyAmt-(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0)))<Math.abs(loan.principal)*0.02 && f.maturityDate===loan.maturityDate;
      return `<div class="kv"><span class="k">Position</span><span class="v">Sell ${f.sellCcy} ${fmt(sellAbs,0)} / Buy ${f.buyCcy} ${fmt(f.buyAmt,0)}</span></div>
      <div class="kv"><span class="k">Contract rate</span><span class="v">${f.contractRate}</span></div>
      <div class="kv"><span class="k">Settles</span><span class="v">${f.maturityDate}${d!==null?` (${d>=0?d+' days':'settled'})`:''}</span></div>
      <div class="kv"><span class="k">Mark-to-market</span><span class="v ${f.mtmSGD>=0?'pos':'neg'}">${money(f.mtmSGD,0)}</span></div>
      ${shock?`<div class="kv"><span class="k">Sensitivity</span><span class="v" style="font-weight:400;font-size:12px">${shock}</span></div>`:''}
      ${fundsLoan?`<p class="note">This forward's ${f.buyCcy} leg (${money(f.buyAmt)}) matches the ${loan.ccy} loan + accrued interest (${money(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0))}) and settles on the loan's maturity date — it looks structured to fund the loan repayment. Confirm the ${f.sellCcy} you must deliver at settlement is available, since this statement shows no ${f.sellCcy} assets.`:''}`;
    }).join('')}
  </div>`:''}
  <div class="card"><h2>Indicative FX rates (statement)</h2>
    ${Object.entries(rates).sort().map(([c,v])=>`<div class="kv"><span class="k">1 ${c}</span><span class="v">${fmt(v,c==='JPY'||c==='HKD'?4:4)} SGD</span></div>`).join('')}
  </div>`;
}

    <p class="note">Fortress is a personal monitoring tool, not financial advice. Margin-call estimates depend on lending values that only DBS can confirm; scenario lines shown without a configured lending value are illustrative arithmetic, not DBS figures.</p>
  </div>`;
}

function render(){
  renderTabs();
  document.getElementById('stamp').textContent = VERSION;
  const v={dash:viewDash,trends:viewTrends,fx:viewFX,hist:viewHist,set:viewSet}[state.settings.tab]||viewDash;
  document.getElementById('main').innerHTML = v() + `<p class="fine">Monitoring aid only — verify against your official DBS statements. ${VERSION}</p>`;
}

/* ================= actions ================= */
function saveSettings(){
  const lv=document.getElementById('setLV').value;
  const al=document.getElementById('setAlert').value;
  const hv=document.getElementById('setHome');
  state.settings.lendingValue = lv===''?null:Math.min(95,Math.max(1,+lv));
  state.settings.ltvAlert = al===''?35:Math.min(95,Math.max(5,+al));
  if(hv) state.settings.homeValue = hv.value===''?null:Math.max(0,+hv.value);
  saveAll(); go('dash');
}
function saveManual(){
  const m=document.getElementById('mMonth').value.trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM, e.g. 2026-08'); return; }
  const num=id=>{ const v=document.getElementById(id).value; return v===''?null:+v; };
  const bal=num('mBal');
  if(bal===null){ alert('Outstanding balance is required — without it there is nothing to track.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev, mortgageBalance:bal,
    mortgagePayment:num('mPay') ?? prev.mortgagePayment ?? null,
    mortgageRatePct:num('mRate') ?? prev.mortgageRatePct ?? null,
    deposits:num('mDep') ?? prev.deposits ?? null };
  saveAll(); go('dash');
}
function delManual(m){
  if(confirm('Delete home-loan entry '+m+'?')){ delete state.manual[m]; saveAll(); render(); }
}
function addIncome(){
  const label=(document.getElementById('incLabel').value||'').trim();
  const amt=document.getElementById('incAmt').value;
  if(!label || amt===''){ alert('Label and monthly amount are both needed.'); return; }
  state.income=state.income||[];
  state.income.push({ id:'inc-'+state.income.length, label, amount:+amt, ccy:'SGD', frequency:'monthly',
    payer:(document.getElementById('incPayer').value||'').trim()||null, endMonth:null, source:'manual entry' });
  saveAll(); render();
}
function saveLvOverrides(){
  Object.keys(state.lv||{}).forEach(pid=>{
    const el=document.getElementById('lvo_'+pid.replace(/[^A-Za-z0-9]/g,'_'));
    if(!el) return;
    if(el.value===''){ delete state.lv[pid].ratioPct; state.lv[pid].basis='derived'; }
    else { state.lv[pid].ratioPct=Math.min(95,Math.max(1,+el.value)); state.lv[pid].basis='entered'; }
  });
  saveAll(); go('dash');
}
function delIncome(ix){ if(confirm('Remove this income entry?')){ state.income.splice(ix,1); saveAll(); render(); } }
function delMrtl(d){ if(confirm('Delete MRTL entry '+d+'?')){ delete state.mrtl[d]; saveAll(); render(); } }
function delSnap(d){
  if(dates().length<=1){ alert('Keep at least one snapshot.'); return; }
  if(confirm('Delete snapshot '+d+'?')){ delete state.snapshots[d]; saveAll(); render(); }
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'Fortress',snapshots:state.snapshots,manual:state.manual,income:state.income,mrtl:state.mrtl,lv:state.lv,settings:state.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='fortress-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  f.text().then(t=>{ const d=JSON.parse(t);
    if(!d.snapshots) throw new Error('not a Fortress backup');
    state.snapshots=d.snapshots; if(d.manual) state.manual=d.manual; if(d.income) state.income=d.income; if(d.mrtl) state.mrtl=d.mrtl; if(d.lv) state.lv=d.lv; if(d.settings) state.settings={...state.settings,...d.settings};
    saveAll(); render(); alert('Backup restored: '+Object.keys(d.snapshots).length+' snapshot(s).');
  }).catch(e=>alert('Could not restore: '+e.message));
  inp.value='';
}

/* ================= PDF import flow ================= */
let pdfjsReady=null;
function loadPdfjs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsReady) return pdfjsReady;
  const tryLoad=(src,worker)=>new Promise((res,rej)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker; res(); };
    s.onerror=()=>rej(new Error('load failed: '+src));
    document.head.appendChild(s);
  });
  pdfjsReady=tryLoad(PDFJS_URL,PDFJS_WORKER)
    .catch(()=>tryLoad(PDFJS_CDN+'pdf.min.js',PDFJS_CDN+'pdf.worker.min.js'))
    .catch(()=>{ pdfjsReady=null; throw new Error('Could not load the PDF engine. If you opened index.html without the pdf.min.js files beside it, re-download the full app folder.'); });
  return pdfjsReady;
}
/* ---------- universal import: PDF · image (OCR) · text · paste ---------- */
function startImport(){
  showModal(`
  <h2>Add data</h2>
  <p class="note" style="margin:0 0 12px">Fortress reads the file on this device and always shows you the numbers before saving. Nothing is uploaded.</p>
  <button class="btn" onclick="pickFile()">Choose a file — PDF, screenshot or text</button>
  <button class="btn ghost" style="margin-top:10px" onclick="pasteSheet()">Paste text instead</button>
  <p class="note">Recognises: DBS investment eStatement (PDF) · UOB Statement of Account · UOB home-loan screen · DBS MRTL draw-down screen. Anything else lands in a manual-mapping screen rather than being guessed at.</p>
  <p class="note"><b>On iPhone, pasting is more accurate than OCR:</b> open the screenshot in Photos, long-press the text, Copy, then use Paste text here.</p>
  <button class="btn ghost" style="margin-top:10px" onclick="closeModal()">Cancel</button>`);
}
function pickFile(){ document.getElementById('anyInput').click(); }
function pasteSheet(){
  showModal(`
  <h2>Paste text</h2>
  <p class="note" style="margin:0 0 8px">Paste anything containing the figures — a copied screenshot's text, a statement extract, an email.</p>
  <textarea id="pasteBox" rows="10" style="width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:13px" placeholder="Paste here…"></textarea>
  <div class="row2" style="margin-top:12px">
    <button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="routeText(document.getElementById('pasteBox').value,'pasted text')">Read it</button>
  </div>`);
  setTimeout(()=>document.getElementById('pasteBox')?.focus(),50);
}
const busy = msg=>showModal(`<h2>${esc(msg)}</h2><div style="display:flex;justify-content:center;padding:26px"><div class="spin" style="border-color:var(--ink);border-top-color:transparent"></div></div>`);

let tessReady=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessReady) return tessReady;
  tessReady=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the OCR engine (needs a network connection the first time). Use “Paste text instead” — on iPhone, copy the text straight off the screenshot in Photos.'));
    document.head.appendChild(s);
  }).catch(e=>{ tessReady=null; throw e; });
  return tessReady;
}
async function pdfText(file){
  await loadPdfjs();
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    pages.push(DBSParser.itemsToLines(tc.items));
  }
  return pages;
}
document.getElementById('anyInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      busy('Reading PDF…');
      const pages=await pdfText(f);
      // a DBS investment statement has its own rich parser — prefer it
      const dbs=DBSParser.parseLines(pages);
      if(dbs.portfolios.length){ reviewParse(dbs); return; }
      routeText(pages.map(p=>p.join('\n')).join('\n'), f.name);
      return;
    }
    if(/^image\//.test(f.type)){
      busy('Reading image with OCR…');
      await loadTesseract();
      const { data } = await Tesseract.recognize(f,'eng');
      routeText(data.text, f.name, true);
      return;
    }
    busy('Reading file…');
    routeText(await f.text(), f.name);
  }catch(err){
    showModal(`<h2>Import failed</h2><p class="note" style="font-size:13px">${esc(err.message)}</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`);
  }
});
function routeText(text, sourceName, viaOcr){
  if(!text || !text.trim()){ showModal(`<h2>Nothing to read</h2><p class="note">No text came out of that. If it's a photo of a screen, try the paste route instead.</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`); return; }
  const r=FortressRecognizers.detect(text);
  r.sourceName=sourceName; r.viaOcr=!!viaOcr;
  window.__rec=r;
  reviewRecognized(r);
}

const KINDLABEL={ dbsMrtl:'DBS MRTL draw-down screen', dbsPortfolioSummary:'DBS Portfolio Summary screen', uobLoanScreen:'UOB home-loan screen', uobStatement:'UOB Statement of Account', generic:'Unrecognised document' };
const fld=(id,label,val,step)=>`<label class="fld">${label}</label><input type="${typeof val==='string'&&!/^-?[\d.]*$/.test(val||'')?'text':'number'}" id="${id}" step="${step||'0.01'}" inputmode="decimal" value="${val==null?'':esc(String(val))}">`;

function reviewRecognized(r){
  const f=r.fields;
  const head=`
  <h2>Review — ${esc(KINDLABEL[r.kind]||r.kind)}</h2>
  <p class="note" style="margin:0 0 8px">From ${esc(r.sourceName||'input')}${r.viaOcr?' · read by OCR':''}. Every value is editable — check them against the source before saving.</p>
  ${r.viaOcr?`<div class="warnbox"><b>OCR can misread digits.</b> Compare each number with the screenshot before you save.</div>`:''}
  ${r.warnings.length?`<div class="warnbox"><b>Check these:</b><br>${r.warnings.map(esc).join('<br>')}</div>`:''}`;

  if(r.kind==='dbsPortfolioSummary'){
    const known=Object.keys(state.lv||{});
    const lvNow=f.lendingValuePct;
    showModal(head+`
    <label class="fld">Which portfolio is this screen for?</label>
    <select id="rPid" style="width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px">
      ${known.map(k=>`<option value="${esc(k)}"${f.hasFacility && k.endsWith('-0')?' selected':''}${!f.hasFacility && k.endsWith('-1')?' selected':''}>${esc(k)}</option>`).join('')}
      <option value="__new">Another portfolio…</option>
    </select>
    <input type="text" id="rPidNew" placeholder="Portfolio id, e.g. S-607522-2" style="margin-top:8px">
    ${fld('rAssets','Total assets (SGD)',f.totalAssets)}
    ${fld('rLoans','Total loans (SGD, positive number)',f.totalLoans)}
    ${fld('rBP','Borrowing potential (SGD)',f.borrowingPotential)}
    ${f.hasFacility?`${fld('rDrawn','Amount drawn (SGD)',f.amountDrawn)}
    ${fld('rAvail','Available for drawdown (SGD)',f.availableForDrawdown)}
    ${fld('rLimit','Approved MRTL credit limit (SGD)',f.creditLimit)}`:''}
    ${fld('rLF','Leverage factor (as shown)',f.leverageFactor,'0.1')}
    ${fld('rPR','Portfolio risk rating (as shown)',f.riskRating,'0.1')}
    <label class="fld">As-of date</label><input type="text" id="rAsOf" value="${new Date().toISOString().slice(0,10)}" placeholder="YYYY-MM-DD">
    ${lvNow!=null?`<div class="card" style="margin:12px 0"><div class="kv"><span class="k">Lending value this implies</span><span class="v">${pct(lvNow,2)}</span></div>
      <p class="note" style="margin:6px 0 0">Borrowing potential ÷ total assets, both from this one screen — no date mismatch.</p></div>`:''}
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="savePortfolioSummary()">Save</button></div>`);
    return;
  }
  if(r.kind==='dbsMrtl'){
    showModal(head+`
    ${fld('rBP','Borrowing potential (SGD)',f.borrowingPotential)}
    ${fld('rDrawn','Amount drawn (SGD)',f.amountDrawn)}
    ${fld('rAvail','Available for drawdown (SGD)',f.availableForDrawdown)}
    ${fld('rLimit','Approved credit limit (SGD)',f.creditLimit)}
    <label class="fld">As-of date</label><input type="text" id="rAsOf" value="${new Date().toISOString().slice(0,10)}" placeholder="YYYY-MM-DD">
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveMrtlFromReview()">Save MRTL figures</button></div>`);
    return;
  }
  if(r.kind==='uobLoanScreen' || r.kind==='uobStatement'){
    const month=f.month || new Date().toISOString().slice(0,7);
    const rent=(f.rentCredits||[]).find(c=>c.amount);
    showModal(head+`
    <label class="fld">Month (YYYY-MM)</label><input type="text" id="rMonth" value="${esc(month)}">
    ${fld('rBal','Home-loan outstanding balance (SGD)',f.mortgageBalance)}
    ${fld('rPay','Monthly instalment (SGD)',f.mortgagePayment ?? latestManual()?.mortgagePayment)}
    ${fld('rRate','Interest rate (% p.a.)',f.mortgageRatePct ?? latestManual()?.mortgageRatePct)}
    ${fld('rDep','Bank deposits / cash (SGD)',f.deposits)}
    ${rent?`<div class="card" style="margin:12px 0"><h2>Rent credit found</h2>
      <div class="kv"><span class="k">${esc(rent.payer||'payer')} · ${esc(rent.reference||'')}</span><span class="v">${money(rent.amount,2)}</span></div>
      <label class="fld"><input type="checkbox" id="rUseRent" checked style="width:auto;margin-right:6px">Update the recurring rent amount to ${money(rent.amount,2)}/mo</label></div>`:''}
    <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="saveLoanFromReview()">Save</button></div>`);
    return;
  }
  // unrecognised — show what was found, let CK map it by hand
  const cands=(r.fields.candidates||[]);
  showModal(head+`
  <p class="note">Fortress didn't recognise this format, so it is not guessing. Here are the money-shaped values it found — pick what each one is, or cancel and paste a cleaner extract.</p>
  <div class="card" style="margin:8px 0;max-height:200px;overflow:auto">
    ${cands.length?cands.map(c=>`<div class="kv"><span class="k" style="font-size:11px">${esc(c.line)}</span><span class="v">${c.values.map(v=>money(v,2)).join(' · ')}</span></div>`).join(''):'<p class="note">No money-formatted values found at all.</p>'}
  </div>
  <label class="fld">Month (YYYY-MM)</label><input type="text" id="rMonth" value="${new Date().toISOString().slice(0,7)}">
  ${fld('rBal','Home-loan outstanding balance (SGD) — leave blank to skip',null)}
  ${fld('rDep','Bank deposits / cash (SGD) — optional',null)}
  <div class="row2" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancel</button>
  <button class="btn" onclick="saveLoanFromReview()">Save what I entered</button></div>`);
}
const gv=id=>{ const el=document.getElementById(id); if(!el) return null; const v=el.value; return v===''?null:(+v); };
function savePortfolioSummary(){
  const sel=document.getElementById('rPid').value;
  const pid = sel==='__new' ? (document.getElementById('rPidNew').value||'').trim() : sel;
  if(!pid){ alert('Enter a portfolio id.'); return; }
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const assets=gv('rAssets'), bp=gv('rBP'), drawn=gv('rDrawn');
  if(assets==null || bp==null){ alert('Total assets and borrowing potential are both needed to derive the lending value.'); return; }
  const src=(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)');
  state.lv=state.lv||{};
  state.lv[pid]={ asOf, borrowingPotential:bp, totalAssets:assets, basis:'derived', source:src };
  if(drawn!=null){
    state.mrtl[asOf]={ asOf, portfolioId:pid, borrowingPotential:bp, amountDrawn:drawn,
      availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
      totalAssets:assets, totalLoans:gv('rLoans'),
      leverageFactor:gv('rLF'), riskRating:gv('rPR'), leverageThreshold:6, riskThreshold:5, source:src };
  }
  saveAll(); closeModal(); go('dash');
}
function saveMrtlFromReview(){
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const rec={ asOf, borrowingPotential:gv('rBP'), amountDrawn:gv('rDrawn'),
    availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') };
  if(rec.amountDrawn==null || rec.borrowingPotential==null){ alert('Amount drawn and borrowing potential are both needed for the margin metric.'); return; }
  state.mrtl[asOf]=rec; saveAll(); closeModal(); go('dash');
}
function saveLoanFromReview(){
  const m=(document.getElementById('rMonth').value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM.'); return; }
  const bal=gv('rBal'), pay=gv('rPay'), rate=gv('rRate'), dep=gv('rDep');
  if(bal==null && dep==null){ alert('Nothing to save — enter at least a balance or a deposits figure.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev,
    ...(bal!=null?{mortgageBalance:bal}:{}),
    ...(pay!=null?{mortgagePayment:pay}:{}),
    ...(rate!=null?{mortgageRatePct:rate}:{}),
    ...(dep!=null?{deposits:dep}:{}) };
  const useRent=document.getElementById('rUseRent');
  if(useRent && useRent.checked){
    const c=(window.__rec?.fields?.rentCredits||[]).find(x=>x.amount);
    const entry=(state.income||[]).find(i=>i.id==='rent-atelier') || (state.income||[])[0];
    if(c && entry) entry.amount=c.amount;
  }
  saveAll(); closeModal(); go('dash');
}
function reviewParse(res){
  const a=agg(res);
  const exists=!!state.snapshots[res.statementDate];
  window.__pending=res;
  showModal(`
  <h2>Review parsed statement</h2>
  <p class="note" style="margin-bottom:8px">Statement date <b style="color:var(--ink)">${esc(res.statementDate||'?')}</b> · ${res.portfolios.length} portfolio(s): ${res.portfolios.map(p=>esc(p.id)).join(', ')}</p>
  ${res.warnings.length?`<div class="warnbox"><b>Check these:</b><br>${res.warnings.map(esc).join('<br>')}</div>`:''}
  ${exists?`<div class="warnbox">A snapshot for ${esc(res.statementDate)} already exists — saving will replace it.</div>`:''}
  <div class="card" style="margin:8px 0">
    <div class="kv"><span class="k">Total assets</span><span class="v">${money(a.assets,2)}</span></div>
    <div class="kv"><span class="k">Loans</span><span class="v">${money(-a.debt,2)}</span></div>
    <div class="kv"><span class="k">Net assets</span><span class="v">${money(a.net,2)}</span></div>
    <div class="kv"><span class="k">LTV</span><span class="v">${pct(a.ltv,2)}</span></div>
    <div class="kv"><span class="k">MTD / YTD P&L</span><span class="v">${money(a.plMtd,0)} / ${money(a.plYtd,0)}</span></div>
    <div class="kv"><span class="k">Interest paid YTD</span><span class="v">${money(a.intPaidYtd,2)}</span></div>
    <div class="kv"><span class="k">Dividends YTD</span><span class="v">${money(a.divYtd,2)}</span></div>
    <div class="kv"><span class="k">Loans found</span><span class="v">${a.loans.length}</span></div>
    <div class="kv"><span class="k">FX forwards found</span><span class="v">${a.forwards.length}</span></div>
  </div>
  <p class="note">Cross-check these against the statement's Portfolio Summary page before saving. If anything is off, cancel and tell me — the parser can be adjusted.</p>
  <div class="row2" style="margin-top:12px">
    <button class="btn ghost" onclick="closeModal()">Cancel</button>
    <button class="btn" onclick="confirmSave()">Save snapshot</button>
  </div>`);
}
function confirmSave(){
  const res=window.__pending; if(!res) return;
  res.source='Imported '+new Date().toISOString().slice(0,10);
  state.snapshots[res.statementDate]=res; saveAll();
  closeModal(); go('dash');
}
function showModal(html){ document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">${html}</div></div>`; }
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; window.__pending=null; }

/* ================= boot ================= */
render();
if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
