<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<title>Fortress — Debt &amp; Margin Monitor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --div-pos:#2a78d6; --div-neg:#e34948; --div-mid:#f0efec;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --delta-good:#006300;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --div-pos:#3987e5; --div-neg:#e66767; --div-mid:#383835;
    --delta-good:#0ca30c;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:76px;max-width:760px;margin:0 auto}
header{padding:18px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
header .stamp{font-size:11px;color:var(--muted)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--border);z-index:40;max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1 1 0;min-width:0;background:none;border:none;color:var(--muted);font:inherit;font-size:9.5px;letter-spacing:-.01em;padding:10px 0 8px;white-space:nowrap;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.hero{font-size:34px;font-weight:700;letter-spacing:-.02em}
.hero-sub{font-size:12px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px}
.tile .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile .l{font-size:11px;color:var(--muted);margin-top:2px}
.tile .d{font-size:11px;margin-top:2px;color:var(--ink2)}
.pos{color:var(--delta-good)} .neg{color:var(--critical)}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45}
.banner b{display:block;font-size:14px}
.banner .ic{font-size:16px;line-height:1.3}
.b-good{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.b-warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.b-serious{background:color-mix(in srgb,var(--serious) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--serious) 45%,transparent)}
.b-critical{background:color-mix(in srgb,var(--critical) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--critical) 45%,transparent)}
.gauge{margin:6px 0 2px}
.gauge .track{position:relative;height:22px;border-radius:6px;background:var(--grid);overflow:visible}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:var(--s1)}
.gauge .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink2)}
.gauge .mark.actual{background:var(--critical);width:3px}
.gauge .mlab{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.gauge .axis{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px;gap:10px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink2)} .kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin:2px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;fill:var(--muted);font-size:10px}
svg.chart .lab{fill:var(--ink2);font-size:10.5px}
svg.chart .grid{stroke:var(--grid);stroke-width:1}
svg.chart .axisline{stroke:var(--axis);stroke-width:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--page);border:none;border-radius:12px;padding:12px 18px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
input[type=number],input[type=text]{width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px}
label.fld{display:block;font-size:12px;color:var(--ink2);margin:10px 0 4px}
table.hist{width:100%;border-collapse:collapse;font-size:12px}
table.hist th{color:var(--muted);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--axis);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
table.hist td{padding:8px 4px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums}
table.hist th:first-child,table.hist td:first-child{text-align:left}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:var(--page);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font-size:17px;margin-bottom:10px}
.hidden{display:none !important}
.spin{width:18px;height:18px;border:2px solid var(--page);border-top-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--border);color:var(--ink2);margin-left:6px;vertical-align:middle}
.warnbox{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;padding:10px;font-size:12px;margin:8px 0}
.fine{font-size:10.5px;color:var(--muted);line-height:1.5;margin:14px 4px 20px}
</style>
</head>

/* ---- seed migrations ----------------------------------------------------
   A first install copies the seeds above. But an app that keeps gaining seeded
   readings needs those to reach devices that already installed an older build,
   WITHOUT touching anything the user entered. Each migration is additive and
   idempotent: it fills gaps and repairs missing fields, and never deletes.  */
const SEED_VERSION = 7;
function runSeedMigrations(){
  const from = store.get('fortress.seedVersion', 0);
  if(from >= SEED_VERSION) return 0;
  let changed = 0;

  // v2 — readings seeded after the first build (all four TWRR windows)
  state.reported = state.reported || [];
  REPORTED_SEED.forEach(seed=>{
    const dup = state.reported.some(r =>
      r.id===seed.id || (r.portfolioId===seed.portfolioId && r.metric===seed.metric && r.from===seed.from && r.to===seed.to));
    if(!dup){ state.reported.push({...seed, seeded:true}); changed++; }
  });

  // v3 — older MRTL entries predate portfolioId, which the advance-ratio lookup needs
  Object.values(state.mrtl||{}).forEach(m=>{
    if(!m.portfolioId){
      const withFacility = Object.keys(state.lv||{}).find(pid=>(state.lv[pid]||{}).hasFacility);
      m.portfolioId = withFacility || MRTL_SEED[Object.keys(MRTL_SEED)[0]].portfolioId;
      changed++;
    }
  });
  // v3 — older LV entries predate the pledged / hasFacility flags
  Object.keys(LV_SEED).forEach(pid=>{
    const cur=(state.lv||{})[pid], seed=LV_SEED[pid];
    if(!cur) return;
    if(cur.pledged===undefined){ cur.pledged = seed.pledged; changed++; }
    if(cur.hasFacility===undefined){ cur.hasFacility = seed.hasFacility; changed++; }
  });

  // v4 — rate-revision letters seeded after the first build
  state.rateChanges = state.rateChanges || [];
  RATE_CHANGE_SEED.forEach(seed=>{
    const dup = state.rateChanges.some(r =>
      r.id===seed.id ||
      (r.lender===seed.lender && r.rateEffective===seed.rateEffective && r.instalmentEffective===seed.instalmentEffective));
    if(!dup){ state.rateChanges.push({...seed, seeded:true}); changed++; }
  });

  // v5 — CPF balances and the housing withdrawal, added after the first build
  state.cpf = state.cpf || {};
  Object.keys(CPF_SEED).forEach(d=>{ if(!state.cpf[d]){ state.cpf[d]={...CPF_SEED[d], seeded:true}; changed++; } });
  state.cpfHome = state.cpfHome || {};
  Object.keys(CPF_HOME_SEED).forEach(d=>{ if(!state.cpfHome[d]){ state.cpfHome[d]={...CPF_HOME_SEED[d], seeded:true}; changed++; } });

  // v6 — the CPF transaction ledger
  state.cpfTxns = state.cpfTxns || [];
  if(!state.cpfTxns.length){ state.cpfTxns = CPF_TXN_SEED.slice(); changed++; }

  // v7 — figures CK gave directly: the property valuation and his date of birth.
  // Only filled when empty, so anything he has since typed always wins.
  if(state.settings.homeValue == null){ state.settings.homeValue = 2450000; changed++; }
  if(!state.settings.birthDate){ state.settings.birthDate = '1973-08-27'; changed++; }

  store.set('fortress.seedVersion', SEED_VERSION);
  if(changed) saveAll();
  return changed;
}

/* Borrowing capacity across EVERY portfolio, pledged or not — answers "how much could I
   borrow in total". Kept separate from the margin basis, which may only count pledged assets. */
function groupCapacity(){
  const ids=Object.keys(state.lv||{});
  if(!ids.length) return null;
  let total=0, assets=0, pledged=0, pledgedAssets=0, parts=[];
  ids.forEach(pid=>{
    const e=state.lv[pid]; const bp=e.borrowingPotential; if(bp==null) return;
    const p=(latest().portfolios||[]).find(x=>x.id===pid);
    const isP=isPledged(pid,p);

    if(isP){ pledged+=bp; pledgedAssets+=e.totalAssets||0; }
    parts.push({pid, bp, assets:e.totalAssets, pledged:isP});
  });

  return { total, assets, pledged, pledgedAssets, parts,
           groupLvPct: assets>0? total/assets*100 : null,
           unpledged: total-pledged };

/* Net assets across both banks. DBS net assets (from the statement) + UOB cash − UOB home loan.

function netWorth(a){

const dayMon = iso=>{ const d=new Date(iso+'T00:00:00'); return d.getDate()+' '+d.toLocaleString('en',{month:'short'}); };
const dayMonYr = iso=>{ const d=new Date(iso+'T00:00:00'); return dayMon(iso)+' '+d.getFullYear(); };
function rangeLabel(fromIso,toIso){

function periodOf(statementDate, period){
  if(!statementDate) return null;

const monthsBetween=(a,b)=> (new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000/30.4375;

// conservative: a call bites when drawn exceeds the collateral's lending value.
// DBS gives two candidate capacity figures that don't agree — always use the smaller.
function mrtlCapacity(m){
  if(!m) return null;
  // Two different quantities, per DBS's own tooltips:
  //  A) borrowing potential — asset-based, "subject to credit approval"; ignores the approved facility
  //  B) available for drawdown + already drawn — total drawable on the EXISTING approved MRTL
  const A=m.borrowingPotential;
  const B=(m.availableForDrawdown!=null&&m.amountDrawn!=null)? m.availableForDrawdown+m.amountDrawn : null;
  const cands=[A,B].filter(v=>v!=null&&v>0);
  if(!cands.length) return null;
  return { capacity:Math.min(...cands), optimistic:Math.max(...cands),
           assetBased:A, facilityBased:B, differ:cands.length>1 && Math.abs(A-B)>1 };
}

// implied interest for a month = that month's payment − principal reduction vs previous month (both stated; no estimates)
function impliedMortgageInterest(month){
  const ms=manualMonths(); const i=ms.indexOf(month);
  if(i<1) return null;
  const cur=state.manual[ms[i]], prev=state.manual[ms[i-1]];
  if(cur.mortgagePayment==null || cur.mortgageBalance==null || prev.mortgageBalance==null) return null;
  return cur.mortgagePayment - (prev.mortgageBalance - cur.mortgageBalance);
}

function effectiveLoanTerms(onDate){

function rateChangeBlock(mm, instNow){
  const list = state.rateChanges||[];

      const pending = instPending || ratePending;
      // the instalment in force the day before this one starts

      // the letter's "previous rate" is a fact worth checking against what Fortress already held

        for(let i=ms.length-1;i>=0;i--){ if(state.manual[ms[i]].mortgageRatePct!=null) return {m:ms[i], v:state.manual[ms[i]].mortgageRatePct}; } return null; })() : null;
      const conflict = heldBefore && rc.previousRatePct!=null && Math.abs(heldBefore.v-rc.previousRatePct)>0.005;

        <div class="kv"><span class="k"><b>${esc(rc.lender||'Lender')} revision</b> <span class="pill">${!pending?'in force':(ratePending&&instPending?'upcoming':(instPending?'instalment upcoming':'rate upcoming'))}</span></span>

        ${rc.instalment!=null?`<div class="kv"><span class="k">Monthly instalment${instPending?' (from '+esc(dayLabel(rc.instalmentEffective))+(days!=null&&days>=0?', in '+days+' days':'')+')':''}</span><span class="v">${prevInst!=null?money(prevInst,2)+' → ':''}<b>${money(rc.instalment,2)}</b></span></div>`:''}
        ${d!=null?`<div class="kv"><span class="k">Change</span><span class="v ${d>=0?'neg':'pos'}">${d>=0?'+':''}${money(d,2)}/mo · ${d>=0?'+':''}${money(d*12,2)}/yr</span></div>`:''}
        ${(rentM>0&&rc.instalment!=null)?`<div class="kv"><span class="k">Rent cover of the instalment</span><span class="v">${prevInst!=null?pct(rentM/prevInst*100,1)+' → ':''}<b class="${rentM>=rc.instalment?'pos':'neg'}">${pct(rentM/rc.instalment*100,1)}</b></span></div>`:''}

/* ================= CPF =================
   Balances grow under rules CPF publishes; Fortress applies them literally and
   models nothing else. No contributions, no top-ups, no withdrawals, no forecast
   of future BHS or retirement sums — those are CPF policy, announced yearly, and
   guessing them would turn a calculation into a story. */
const cpfDates = ()=> Object.keys(state.cpf||{}).sort();
const cpfHomeDates = ()=> Object.keys(state.cpfHome||{}).sort();
function latestCpf(){ const k=cpfDates(); return k.length? state.cpf[k[k.length-1]] : null; }
function latestCpfHome(){ const k=cpfHomeDates(); return k.length? state.cpfHome[k[k.length-1]] : null; }
const cpfTotal = c => c ? (c.oa||0)+(c.sa||0)+(c.ma||0) : null;

/* one year of interest at the published floor rates, including extra interest.
   Extra interest counts OA first (capped), then SA, then MA. */
function cpfYearInterest(oa, sa, ma, from55){
  const R = CPF_RULES;
  const base = { oa: oa*R.oaPct/100, sa: sa*R.saPct/100, ma: ma*R.maPct/100 };
  const cap = from55 ? R.extraFrom55.oaCap : R.extraBelow55.oaCap;
  const pool = Math.min(oa, cap) + sa + ma;
  let extra = 0;
  if(!from55){
    extra = Math.min(pool, R.extraBelow55.onFirst) * R.extraBelow55.pct/100;
  } else {
    let prev = 0;
    R.extraFrom55.tiers.forEach(t=>{ const slice = Math.max(0, Math.min(pool, t.upTo) - prev); extra += slice*t.pct/100; prev = t.upTo; });
  }
  return { ...base, extra, total: base.oa+base.sa+base.ma+extra };
}

/* ---- age, and the dates CPF cares about ---- */
function cpfAge(){
  const b = state.settings.birthDate; if(!b) return null;
  const [by,bm,bd] = b.split('-').map(Number);
  const now = new Date();
  let age = now.getFullYear() - by;
  if(now.getMonth()+1 < bm || (now.getMonth()+1===bm && now.getDate() < bd)) age--;
  const at = n => by+n+'-'+String(bm).padStart(2,'0')+'-'+String(bd).padStart(2,'0');
  return { age, birthDate:b, year55: by+55, date55: at(55), days55: daysUntil(at(55)),
           year65: by+65, date65: at(65) };
}
/* the Full Retirement Sum for a cohort: published where CPF has announced it, otherwise
   whatever CK chooses to assume — never a number Fortress invents for him. */
function frsFor(year){
  const R = CPF_RULES;
  if(R.frsByYear[year] != null) return { value:R.frsByYear[year], published:true };
  if(state.settings.frsOverride != null) return { value:state.settings.frsOverride, published:false, chosen:true };
  return { value:R.frsByYear[R.frsLastPublished], published:false, chosen:false, fallbackYear:R.frsLastPublished };
}
/* how the published series has actually moved — history, offered as context, not a forecast */
function frsTrend(){
  const ys = Object.keys(CPF_RULES.frsByYear).map(Number).sort();
  const g = [];
  for(let i=1;i<ys.length;i++) g.push((CPF_RULES.frsByYear[ys[i]]/CPF_RULES.frsByYear[ys[i-1]]-1)*100);
  return { years:ys, growth:g, min:Math.min(...g), max:Math.max(...g),
           avg:g.reduce((a,b)=>a+b,0)/g.length, last:ys[ys.length-1] };
}

/* ---- the ledger: what CPF actually did, month by month ---- */
const cpfTxns = ()=> (state.cpfTxns||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
const cpfTxnSum = code => cpfTxns().filter(t=>t.code===code)
  .reduce((a,t)=>({oa:a.oa+(t.oa||0), sa:a.sa+(t.sa||0), ma:a.ma+(t.ma||0), n:a.n+1}), {oa:0,sa:0,ma:0,n:0});
/* the most recent employer contribution — the observed run-rate, not an assumption */
function cpfLastContribution(){
  const c = cpfTxns().filter(t=>t.code==='CON');
  if(!c.length) return null;
  const last = c[c.length-1];
  const total = (last.oa||0)+(last.sa||0)+(last.ma||0);
  // the typical month, ignoring bonus months that run above the usual figure
  const totals = c.map(t=>(t.oa||0)+(t.sa||0)+(t.ma||0)).sort((a,b)=>a-b);
  const median = totals[Math.floor(totals.length/2)];
  return { ...last, total, median, count:c.length };
}
/* does SA already exceed the Full Retirement Sum? It decides where MediSave overflows. */
function cpfSaOverFrs(){
  const c = latestCpf(); if(!c) return null;
  return (c.sa||0) > CPF_RULES.frs;
}
/* CPF's own ledger is the proof: this TFR moved MediSave's excess, and where it went
   tells us which overflow rule applies to CK today. */
function cpfOverflowEvidence(){
  const t = cpfTxns().find(x=>x.code==='TFR' && (x.ma||0)<0);
  if(!t) return null;
  return { date:t.date, amount:Math.abs(t.ma), toOa:(t.oa||0)>0, toSa:(t.sa||0)>0 };
}
/* housing flows both ways: a refund when a property is sold, a withdrawal when one is bought */
function cpfHousingFlows(){
  const h = cpfTxns().filter(t=>t.code==='HSE');
  if(!h.length) return null;
  const byDate={};
  h.forEach(t=>{ const k=t.date; byDate[k]=byDate[k]||{date:k, amount:0, n:0}; byDate[k].amount+=(t.oa||0); byDate[k].n++; });
  const groups=Object.values(byDate).sort((a,b)=>a.date.localeCompare(b.date));
  return { groups, refunded:groups.filter(g=>g.amount>0).reduce((a,g)=>a+g.amount,0),
           withdrawn:groups.filter(g=>g.amount<0).reduce((a,g)=>a+g.amount,0),
           net:groups.reduce((a,g)=>a+g.amount,0) };
}

/* Balances after every ledger row. CPF publishes only opening and closing balances;
   the path between them is arithmetic on the movements, which is why the reconciliation
   check matters — if it fails, this curve is fiction. */
function cpfBalanceHistory(){
  const t = cpfTxns(); if(t.length < 2) return null;
  const open = t.find(x=>x.code==='BAL'); if(!open) return null;
  let oa=open.oa, sa=open.sa, ma=open.ma;
  const pts = [{ date:open.date, oa, sa, ma, total:oa+sa+ma, code:'BAL' }];
  t.forEach(x=>{
    if(x===open || x.code==='BAL') return;
    oa+=x.oa||0; sa+=x.sa||0; ma+=x.ma||0;
    pts.push({ date:x.date, oa, sa, ma, total:oa+sa+ma, code:x.code });
  });
  const closing = t.filter(x=>x.code==='BAL').slice(-1)[0];
  const drift = closing ? Math.max(Math.abs(oa-closing.oa), Math.abs(sa-closing.sa), Math.abs(ma-closing.ma)) : null;
  return { pts, closing, drift, exact: drift!=null && drift < 0.02,
           startTotal: pts[0].total, endTotal: pts[pts.length-1].total };
}

/* year-by-year projection of today's balances.
   Interest is credited the way CPF credits it, and MediSave above the Basic Healthcare
   Sum overflows — to the SA below 55, but to the OA once the SA already exceeds the Full
   Retirement Sum. CK's ledger shows the 1 Jan 2026 transfer landing in the OA, which is
   what fixes the rule for him. That matters: the overflow then earns 2.5%, not 4%.
   Contributions are included only when asked for, and only at the rate his own
   payslips have actually produced. */
function cpfProject(years, withContrib, age55Year){
  const c = latestCpf(); if(!c) return null;
  const R = CPF_RULES;
  const overflowToOa = cpfSaOverFrs();
  let oa=c.oa||0, sa=c.sa||0, ma=c.ma||0, ra=0;
  const con = withContrib ? cpfLastContribution() : null;
  const startYear = +(c.asOf||'').slice(0,4) || new Date().getFullYear();
  const rows = [{ y:0, year:startYear, oa, sa, ma, ra, total:oa+sa+ma, interest:0, contrib:0 }];
  for(let y=1; y<=years; y++){
    const year = startYear+y;
    const from55 = age55Year!=null && year > age55Year;
    // SA is closed after 55; the RA carries the retirement savings at the same 4%
    const i = cpfYearInterest(oa, from55 ? ra : sa, ma, from55);
    oa += i.oa; ma += i.ma;
    if(from55){ ra += i.sa + i.extra; } else { sa += i.sa + i.extra; }
    let contrib = 0;
    // contributions stop at 55 unless CK tells Fortress otherwise: the rates and the
    // allocation both change, and his own payslips can no longer stand in for them
    if(con && !from55){ oa += (con.oa||0)*12; sa += (con.sa||0)*12; ma += (con.ma||0)*12; contrib = con.total*12; }
    if(R.bhs && ma > R.bhs){ const over = ma - R.bhs; ma = R.bhs;
      if(from55) ra += over; else if(overflowToOa) oa += over; else sa += over; }
    let event = null;
    if(age55Year!=null && year === age55Year){
      // SA closes: SA first, then OA, fills the RA up to the Full Retirement Sum. The rest stays in OA.
      const F = frsFor(year);
      const frs = F.published ? F.value : null;
      const target = F.value;
      const fromSa = Math.min(sa, target);
      ra = fromSa; sa -= fromSa;
      const fromOa = Math.min(oa, target - ra);
      ra += fromOa; oa -= fromOa;
      oa += sa; sa = 0;                                   // anything left in the SA moves to the OA
      event = { turns55:true, frs:target, frsPublished: frs!=null, frsChosen: !!frsFor(year).chosen, ra, oa };
    }
    rows.push({ y, year, oa, sa, ma, ra, total:oa+sa+ma+ra, interest:i.total, contrib, from55, event });
  }
  return rows;
}

/* the housing withdrawal, and what it will cost to unwind.
   Accrued interest is charged at the OA rate on the principal still withdrawn. */
function cpfHomeClaim(onDate){
  const h = latestCpfHome(); if(!h) return null;
  const prin = h.principalWithdrawn||0, accr = h.accruedInterest||0;
  const monthly = prin * CPF_RULES.oaPct/100/12;
  const claim = prin + accr;
  // how long the accrual has been running, read back out of CPF's own figure
  const monthsRun = prin>0 ? accr / monthly : null;
  return { asOf:h.asOf, properties:h.properties, principal:prin, accrued:accr, claim, monthlyAccrual:monthly,
           monthsRun, yearlyAccrual:prin*CPF_RULES.oaPct/100, source:h.source };
}
function cpfClaimIn(years){
  const h = latestCpfHome(); if(!h) return null;
  const prin=h.principalWithdrawn||0, accr=h.accruedInterest||0;
  return (prin+accr) * Math.pow(1+CPF_RULES.oaPct/100, years);
}

/* ================= derived metrics ================= */
/* Is this portfolio's collateral actually securing the margin loan?
   Explicit setting wins; otherwise: it carries loans, or it has an MRTL facility on record. */
function isPledged(pid, p){
  const e=(state.lv||{})[pid];
  if(e && typeof e.pledged==='boolean') return e.pledged;
  if(p && Math.abs(p.totalLoans||0)>0) return true;
  return Object.values(state.mrtl||{}).some(m=>m.portfolioId===pid && (m.amountDrawn!=null||m.creditLimit!=null));
}
function agg(snap){
  const a = { assets:0, cash:0, equity:0, net:0, debt:0, plMtd:0, plYtd:0,
    divMtd:0, divYtd:0, intRecMtd:0, intRecYtd:0, intPaidMtd:0, intPaidYtd:0, feesYtd:0,
    loans:[], forwards:[], ccy:{}, pledgedCcy:{}, pledgedAssets:0, unpledgedAssets:0, unpledgedIds:[] };
  for(const p of snap.portfolios){
    a.assets += p.totalAssets||0; a.cash += p.totalCash||0; a.equity += p.totalEquity||0;
    a.net += p.netAssets||0; a.debt += Math.abs(p.totalLoans||0);
    a.plMtd += p.perf.plMtd||0; a.plYtd += p.perf.plYtd||0;
    a.divMtd += p.income.divMtd||0; a.divYtd += p.income.divYtd||0;
    a.intRecMtd += p.income.intRecMtd||0; a.intRecYtd += p.income.intRecYtd||0;
    a.intPaidMtd += p.expenses.intPaidMtd||0; a.intPaidYtd += p.expenses.intPaidYtd||0;
    a.custodyYtd = (a.custodyYtd||0)+(p.expenses.custodyYtd||0);
    a.custodyMtd = (a.custodyMtd||0)+(p.expenses.custodyMtd||0);
    a.txnYtd = (a.txnYtd||0)+(p.expenses.txnYtd||0);
    a.feesYtd += (p.expenses.custodyYtd||0)+(p.expenses.txnYtd||0);
    a.loans.push(...p.loans.map(l=>({...l, pf:p.id})));
    a.forwards.push(...p.fxForwards.map(f=>({...f, pf:p.id})));
    for(const [c,v] of Object.entries(p.ccyAlloc||{})) a.ccy[c]=(a.ccy[c]||0)+v;
    // currency mix of the PLEDGED collateral only — the stress test must not mix bases
    if(isPledged(p.id,p)) for(const [c,v] of Object.entries(p.ccyAlloc||{})) a.pledgedCcy[c]=(a.pledgedCcy[c]||0)+v;
    // Only collateral that actually secures the margin loan belongs in the LTV denominator.
    // DBS assesses each portfolio standalone: the -0 screen's asset total excludes -1,
    // and -1 offers "Apply with RM" (no facility) rather than "Contact RM to draw down".
    if(isPledged(p.id, p)) a.pledgedAssets += p.totalAssets||0;
    else { a.unpledgedAssets += p.totalAssets||0; a.unpledgedIds.push(p.id); }
  }
  a.ltv = a.pledgedAssets>0 ? a.debt/a.pledgedAssets*100 : null;
  a.ltvAllAssets = a.assets>0 ? a.debt/a.assets*100 : null;
  a.estMonthlyInterest = a.loans.reduce((s,l)=> s + Math.abs(l.principal||0)*(l.ratePct||0)/100/12, 0);
  a.carryYtd = a.divYtd + a.intRecYtd - a.intPaidYtd - a.feesYtd;
  a.gainsVsInterest = a.intPaidYtd>0 ? a.plYtd/a.intPaidYtd : null;
  a.divCover = a.intPaidYtd>0 ? a.divYtd/a.intPaidYtd : null;
  return a;
}
// drawdown (%) until debt exceeds lendingValue% of remaining assets
function drawdownToTrigger(debt, assets, lvPct){
  if(!debt || !assets || !lvPct) return null;
  const trigAssets = debt/(lvPct/100);
  return Math.max(0,(1 - trigAssets/assets)*100);
}
function marginStatus(a){
  const lv = state.settings.lendingValue;
  if(a.debt<=0) return {cls:'b-good', ic:'✔', title:'No outstanding loans', body:'No margin-call exposure this month.'};
  // DBS's own borrowing-potential figure beats any assumed ratio — use it when we have it
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  if(mr && cap && mr.amountDrawn!=null){
    const util=mr.amountDrawn/cap.capacity*100, fall=100-util;
    const body=`Drawn ${money(mr.amountDrawn,0)} against DBS's assessed capacity of ${money(cap.capacity,0)} (as of ${mr.asOf}). Your collateral's lending value can fall ${pct(fall,1)} before the loan exceeds it.`;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Drawn amount exceeds capacity', body};
    if(util>=85)  return {cls:'b-serious',  ic:'⚠', title:'Margin buffer thin', body};
    if(util>=65)  return {cls:'b-warn',     ic:'⚠', title:'Watch the buffer', body};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body};
  }
  if(lv){
    const dd = drawdownToTrigger(a.debt,a.assets,lv);
    const util = a.ltv/lv*100;
    if(util>=100) return {cls:'b-critical', ic:'⛔', title:'Loan exceeds lending value', body:`LTV ${pct(a.ltv,1)} is above your configured lending value of ${lv}%. Expect a margin call — contact your RM.`};
    if(util>=85) return {cls:'b-serious', ic:'⚠', title:'Margin buffer thin', body:`LTV ${pct(a.ltv,1)} is at ${fmt(util,0)}% of your ${lv}% lending value. A further ${pct(dd,1)} portfolio fall triggers a call.`};
    if(util>=65) return {cls:'b-warn', ic:'⚠', title:'Watch the buffer', body:`LTV ${pct(a.ltv,1)} vs lending value ${lv}%. Portfolio can fall ${pct(dd,1)} before a margin call.`};
    return {cls:'b-good', ic:'✔', title:'No margin-call risk in sight', body:`LTV ${pct(a.ltv,1)} vs your configured lending value ${lv}%. Portfolio would need to fall ${pct(dd,1)} before a call.`};
  }
  // no configured LV — use conservative illustrative 50%
  const dd50 = drawdownToTrigger(a.debt,a.assets,50);
  return {cls: a.ltv<35 ? 'b-good':'b-warn', ic: a.ltv<35?'✔':'⚠',
    title: a.ltv<35 ? 'No margin-call risk in sight' : 'Leverage building — verify buffer',
    body:`LTV ${pct(a.ltv,1)}. DBS lending values are not in the statement — even at an illustrative 50% lending value the portfolio must fall ${pct(dd50,1)} before a call. Enter the actual ratio from your RM in Settings for a precise trigger.`};
}

/* ================= SVG chart helpers (hand-rolled, dataviz method) ================= */
function svgEl(w,h){ return `viewBox="0 0 ${w} ${h}" class="chart" role="img"`; }
function niceTicks(min,max,n=4){
  if(min===max){ max=min+1; }
  const span=max-min, step0=span/n, mag=Math.pow(10,Math.floor(Math.log10(step0)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>span/s<=n)|| step0;
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, t=[];
  for(let v=lo;v<=hi+1e-9;v+=step) t.push(+v.toFixed(10));
  return t;
}
// series: [{name,color,values:[{x:label,y}] }] — single shared y axis
function lineChart(series, {h=190, yFmt=v=>fmt(v), refLines=[], zero=true}={}){
  const W=340, padL=44, padR=12, padT=14, padB=26;
  const labels = series[0].values.map(v=>v.x);
  const all = series.flatMap(s=>s.values.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  refLines.forEach(r=>all.push(r.y));
  if(!all.length) return '<p class="note">No data yet.</p>';
  let ticks = niceTicks(zero?Math.min(...all,0):Math.min(...all), Math.max(...all));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const X=i=> labels.length===1 ? (padL+(W-padL-padR)/2) : padL + i*(W-padL-padR)/(labels.length-1);
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  labels.forEach((l,i)=>{ if(labels.length<=8 || i%Math.ceil(labels.length/8)===0){
    // clamp the end labels inward so the first and last month are never clipped
    const anc = i===0 ? 'start' : (i===labels.length-1 ? 'end' : 'middle');
    const x = i===0 ? padL-6 : (i===labels.length-1 ? W-padR+4 : X(i));
    g+=`<text x="${x}" y="${h-8}" text-anchor="${anc}">${l}</text>`; } });
  refLines.forEach(r=>{ g+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-padR}" y="${Y(r.y)-4}" text-anchor="end" style="fill:${r.color}">${r.label}</text>`; });
  const usedLabelY=[];
  for(const s of series){
    const pts=s.values.map((v,i)=>[X(i),Y(v.y)]);
    if(pts.length>1) g+=`<path d="M${pts.map(p=>p.join(',')).join('L')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${pts.length===1?5:3.5}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"><title>${esc(s.name)} ${labels[i]}: ${yFmt(s.values[i].y)}</title></circle>`; });
    const lp=pts[pts.length-1];
    // stagger end labels that would land on top of each other (several series, close values)
    let ly=lp[1]-7;
    while(usedLabelY.some(u=>Math.abs(u-ly)<11)) ly -= 11;
    usedLabelY.push(ly);
    g+=`<text class="lab" x="${Math.min(lp[0]+6,W-padR-2)}" y="${ly}" text-anchor="${lp[0]>W-70?'end':'start'}">${yFmt(s.values[s.values.length-1].y)}</text>`;
  }
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// diverging / grouped bars: groups=[{x, vals:[{name,color,y}]}]
function barChart(groups,{h=190,yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=10, padT=14, padB=26;
  const all=groups.flatMap(gr=>gr.vals.map(v=>v.y)).filter(v=>v!==null&&!isNaN(v));
  if(!all.length) return '<p class="note">No data yet.</p>';
  const ticks=niceTicks(Math.min(...all,0),Math.max(...all,0));
  const y0=ticks[0], y1=ticks[ticks.length-1];
  const Y=v=> padT + (1-(v-y0)/(y1-y0))*(h-padT-padB);
  const gw=(W-padL-padR)/groups.length, n=groups[0].vals.length;
  const bw=Math.min(26,(gw-8)/n);
  let g='';
  ticks.forEach(t=>{ g+=`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${padL-6}" y="${Y(t)+3}" text-anchor="end">${yFmt(t)}</text>`; });
  g+=`<line class="axisline" x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  groups.forEach((gr,gi)=>{
    const cx=padL+gw*gi+gw/2;
    gr.vals.forEach((v,vi)=>{
      if(v.y===null||isNaN(v.y)) return;
      const x=cx-(n*bw+(n-1)*2)/2+vi*(bw+2);
      const yA=Y(Math.max(0,v.y)), yB=Y(Math.min(0,v.y));
      const hh=Math.max(2,yB-yA);
      const rTop=v.y>=0?4:0, rBot=v.y<0?4:0;
      g+=`<path d="M${x},${yA+rTop} q0,-${rTop} ${rTop},-${rTop} h${bw-2*rTop} q${rTop},0 ${rTop},${rTop} v${hh-rTop-rBot} q0,${rBot} -${rBot},${rBot} h-${bw-2*rBot} q-${rBot},0 -${rBot},-${rBot} z" fill="${v.color}"><title>${esc(v.name)} ${esc(gr.x)}: ${yFmt(v.y)}${v.label?' ('+esc(v.label)+')':''}</title></path>`;
      if(v.label) g+=`<text class="lab" x="${x+bw/2}" y="${(v.y>=0?yA:yB+hh)-5}" text-anchor="middle" style="font-size:9px">${esc(v.label)}</text>`;
    });
    if(groups.length<=8 || gi%Math.ceil(groups.length/8)===0) g+=`<text x="${cx}" y="${h-8}" text-anchor="middle">${esc(gr.x)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}
// horizontal bars for currency exposure
function hBars(items,{yFmt=v=>fmt(v)}={}){
  const W=340, padL=44, padR=54, rowH=26, padT=4;
  const max=Math.max(...items.map(i=>Math.abs(i.v)));
  const h=padT+items.length*rowH+4;
  let g='';
  items.forEach((it,i)=>{
    const y=padT+i*rowH, bw=Math.max(6,Math.abs(it.v)/max*(W-padL-padR));
    g+=`<text class="lab" x="${padL-6}" y="${y+15}" text-anchor="end" style="font-weight:600">${esc(it.label)}</text>`;
    g+=`<path d="M${padL},${y+4} h${bw-4} q4,0 4,4 v8 q0,4 -4,4 h-${bw-4} z" fill="${it.color}"><title>${esc(it.label)}: ${yFmt(it.v)} (${pct(it.pct,1)})</title></path>`;
    g+=`<text x="${padL+bw+5}" y="${y+15}">${pct(it.pct,1)}</text>`;
  });
  return `<svg ${svgEl(W,h)}>${g}</svg>`;
}

/* ================= passcode lock =================
   The passphrase derives an AES-GCM key (PBKDF2-SHA256, 310k iterations) that
   encrypts the whole data blob in localStorage. Without it the stored data is
   unreadable. This protects DATA AT REST on this device; it is not a server
   login, and the app's own code is public on GitHub Pages. */
const LOCK_KEY='fortress.lock', VAULT_KEY='fortress.vault', PBKDF2_ITER=310000;
var cryptoKey=null;   // var, not let: saveAll() may run before this line executes
const enc=new TextEncoder(), dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const lockCfg=()=>{ try{ return JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); }catch(e){ return null; } };
const isLocked=()=>!!lockCfg();

async function deriveKey(pass, saltB64, iter){
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:unb64(saltB64),iterations:iter||PBKDF2_ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptBlob(obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv),ct:b64(ct)};
}
async function decryptBlob(blob){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},cryptoKey,unb64(blob.ct));
  return JSON.parse(dec.decode(pt));
}
const DATA_KEYS=['snapshots','manual','income','mrtl','lv','reported','rateChanges','cpf','cpfHome','cpfTxns','settings'];
function collectState(){ const o={}; DATA_KEYS.forEach(k=>o[k]=state[k]); return o; }

async function persistVault(){
  if(!cryptoKey) return;
  try{ localStorage.setItem(VAULT_KEY, JSON.stringify(await encryptBlob(collectState()))); }
  catch(e){ console.error('vault write failed', e); }
}
async function setupLock(pass){
  if(!pass || pass.length<6) throw new Error('Use at least 6 characters.');
  if(!crypto.subtle) throw new Error('This browser cannot encrypt here — needs HTTPS (or localhost).');
  const salt=b64(crypto.getRandomValues(new Uint8Array(16)));
  cryptoKey=await deriveKey(pass,salt,PBKDF2_ITER);
  localStorage.setItem(LOCK_KEY, JSON.stringify({salt,iter:PBKDF2_ITER,v:1}));
  await persistVault();
  DATA_KEYS.forEach(k=>store.del('fortress.'+k));   // remove the plaintext copies
  store.del('dw.'+ 'snapshots');
}
async function unlock(pass){
  const cfg=lockCfg(); if(!cfg) return false;
  cryptoKey=await deriveKey(pass,cfg.salt,cfg.iter);
  const raw=localStorage.getItem(VAULT_KEY);
  if(!raw){ return true; }                          // locked but empty — treat as fresh
  const obj=await decryptBlob(JSON.parse(raw));     // throws on wrong passphrase
  DATA_KEYS.forEach(k=>{ if(obj[k]!==undefined) state[k]=obj[k]; });
  return true;
}
async function removeLock(){
  if(!cryptoKey) throw new Error('Unlock first.');
  DATA_KEYS.forEach(k=>store.set('fortress.'+k, state[k]));
  localStorage.removeItem(LOCK_KEY); localStorage.removeItem(VAULT_KEY);
  cryptoKey=null;
}
function lockScreen(err){
  document.getElementById('main').innerHTML=`
  <div class="card" style="margin-top:60px;text-align:center">
    <div style="font-size:44px;line-height:1">🛡️</div>
    <h2 style="margin-top:10px">Fortress is locked</h2>
    <p class="note">Enter your passphrase to decrypt this device's data.</p>
    ${err?`<div class="warnbox">${esc(err)}</div>`:''}
    <input type="password" id="lockPass" placeholder="Passphrase" style="margin-top:10px;text-align:center"
      onkeydown="if(event.key==='Enter')doUnlock()">
    <button class="btn" style="margin-top:12px" onclick="doUnlock()">Unlock</button>
    <p class="note">Forgotten it? There is no recovery — the passphrase is never stored, only a value derived from it. Restore from a JSON backup instead.</p>
  </div>`;
  document.getElementById('tabs').innerHTML='';
  setTimeout(()=>document.getElementById('lockPass')?.focus(),60);
}
async function doUnlock(){
  const el=document.getElementById('lockPass'); const pass=el?el.value:'';
  if(!pass) return;
  try{ await unlock(pass);
    try{ window.__seedFixes = runSeedMigrations(); }catch(e){ console.error('seed migration failed', e); }
    booted=true; render(); }
  catch(e){ lockScreen('That passphrase did not work. Try again.'); }
}
async function enableLock(){
  const p1=document.getElementById('lkPass').value, p2=document.getElementById('lkPass2').value;
  if(p1!==p2){ alert('The two entries do not match.'); return; }
  try{ await setupLock(p1); alert('Lock enabled. Fortress will ask for this passphrase from now on. There is no recovery — keep a JSON backup.'); render(); }
  catch(e){ alert(e.message); }
}
async function disableLock(){
  if(!confirm('Turn the lock off? Your data goes back to being stored unencrypted in this browser.')) return;
  try{ await removeLock(); render(); }catch(e){ alert(e.message); }
}

/* ===== Fortress strength: how much punishment can this structure absorb? ===== */
const HIST_DRAWDOWNS=[{y:'2022',pct:25.4},{y:'2020 COVID',pct:33.9},{y:'2000-02 dot-com',pct:49.1},{y:'2008 GFC',pct:56.8}];
function fortressStrength(snap,a){
  const m=latestMrtl(), c=mrtlCapacity(m), w=netWorth(a), mm=latestManual();
  if(!m||!c||m.amountDrawn==null) return null;
  const P=[];
  const band=(v,t)=>{ for(let i=0;i<t.length;i++) if(v>=t[i][0]) return t[i][1]; return t[t.length-1][1]; };

  // A — how far markets can fall before a call
  const buf=100-m.amountDrawn/c.capacity*100;
  const survives=HIST_DRAWDOWNS.filter(d=>d.pct<buf), breaks=HIST_DRAWDOWNS.filter(d=>d.pct>=buf);
  P.push({k:'Market shock',score:band(buf,[[50,4],[35,3],[25,2],[15,1],[0,0]]),
    v:pct(buf,1)+' fall absorbed',
    d:`Survives ${survives.map(d=>d.y).join(', ')||'no historical analogue'}${breaks.length?'; breached by '+breaks.map(d=>d.y+' (−'+d.pct+'%)').join(', '):''}.`});

  // B — can income service the debt without selling anything
  const marginInt=a.estMonthlyInterest*12;
  const mortInt=(impliedMortgageInterest(mm&&mm.month)??0)*12;
  const inst=(mm&&mm.mortgagePayment?mm.mortgagePayment:0)*12;
  const months=snap.statementDate?(+snap.statementDate.slice(5,7)):12;
  const income=monthlyIncome()*12 + (a.divYtd+a.intRecYtd)*12/months;
  const intOnly=marginInt+mortInt, fullSvc=marginInt+inst;
  const cover=intOnly>0?income/intOnly:null, svcCover=fullSvc>0?income/fullSvc:null;
  P.push({k:'Debt service',score:band(cover||0,[[3,4],[2,3],[1.5,2],[1,1],[0,0]]),
    v:fmt(cover,2)+'× interest cover',
    d:`Income ${money(income,0)}/yr against ${money(intOnly,0)} of interest. Including mortgage principal the cover is ${fmt(svcCover,2)}×, a surplus of ${money(income-fullSvc,0)}/yr — nothing has to be sold to stay current.`});

  // C — dry powder that is not pledged
  const reserve=(a.unpledgedAssets||0)+(w.uobCash||0);
  const mo=fullSvc>0?reserve/(fullSvc/12):null;
  P.push({k:'Free reserves',score:band(mo||0,[[24,4],[12,3],[6,2],[3,1],[0,0]]),
    v:money(reserve,0),
    d:`Unencumbered assets DBS has no claim on: ${fmt(mo,1)} months of full debt service. This is what you sell in a call instead of liquidating pledged collateral at the worst possible prices.`});

  // D — concentration
  const top=Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
  const share=top?top[1]/a.pledgedAssets*100:0;
  P.push({k:'Concentration',score:band(100-share,[[60,4],[45,3],[35,2],[25,1],[0,0]]),
    v:top?pct(share,1)+' '+top[0]:'—',
    d:top?`${top[0]} is ${pct(share,1)} of the collateral. It would have to fall ${pct(buf/(share/100),1)} alone to cause a call, so this is a wealth risk more than a margin risk — but it is one bet, not five.`:''});

  // E — floating-rate headroom
  const rentY=monthlyIncome()*12, mtg=mm&&mm.mortgageBalance?mm.mortgageBalance:0;
  const mortBreak=mtg>0?rentY/mtg*100:null;
  const divY=a.divYtd*12/months, mp=Math.abs((a.loans[0]||{}).principal||0);
  const marginBreak=mp>0?divY/mp*100:null;
  P.push({k:'Rate rises',score:band(Math.min(mortBreak||0,marginBreak||0),[[5,4],[4,3],[3,2],[2,1],[0,0]]),
    v:'safe to ~'+fmt(Math.min(mortBreak||99,marginBreak||99),1)+'%',
    d:`Rent covers the mortgage until its rate passes ${pct(mortBreak,2)} (now ${mm&&mm.mortgageRatePct?pct(mm.mortgageRatePct,2):'—'}); dividends cover the margin loan until ${pct(marginBreak,2)} (now ${a.loans[0]?pct(a.loans[0].ratePct,2):'—'}). Both are floating, and that gap is the real cushion.`});

  // F — rollover
  const L=a.loans[0], dd=L?daysUntil(L.maturityDate):null;
  P.push({k:'Rollover',score:dd==null?2:band(dd,[[90,4],[30,3],[14,2],[0,1]]),
    v:dd==null?'—':dd+' days',
    d:L?`The ${money(Math.abs(L.principal),0)} MRTL matures ${L.maturityDate} and is revolving — it depends on DBS renewing, not on your solvency. Facility limit ${money(m.creditLimit,0)} is not the constraint; renewal is. Cheap to eliminate: repay from the unpledged reserve if you ever want the dependency gone.`:''});

  const tot=P.reduce((s,p)=>s+p.score,0), max=P.length*4;
  const grade = tot/max>=0.85?'Very strong': tot/max>=0.7?'Strong': tot/max>=0.55?'Solid': tot/max>=0.4?'Adequate':'Fragile';
  const weakest=P.slice().sort((x,y)=>x.score-y.score)[0];
  return {P,tot,max,grade,weakest,buf,breaks};
}
const SCORE_LABEL=['Weak','Thin','Adequate','Solid','Strong'];
const SCORE_COLOR=['var(--critical)','var(--serious)','var(--warn)','var(--s1)','var(--good)'];

/* ===== FX candlestick + moving averages (hand-rolled SVG) ===== */
function sma(arr, n){
  const out=new Array(arr.length).fill(null); let sum=0;
  for(let i=0;i<arr.length;i++){ sum+=arr[i]; if(i>=n) sum-=arr[i-n]; if(i>=n-1) out[i]=sum/n; }
  return out;
}
function candleChart(series, opts){
  opts=opts||{};
  const W=760, H=340, L=8, R=62, T=10, B=26;
  const n=series.dates.length;
  const show=Math.min(opts.bars||250, n);
  const s0=n-show;                                   // first visible index
  const ma50=sma(series.c,50), ma150=sma(series.c,150), ma200=sma(series.c,200);
  let lo=Infinity, hi=-Infinity;
  for(let i=s0;i<n;i++){ lo=Math.min(lo,series.l[i]); hi=Math.max(hi,series.h[i]); }
  [ma50,ma150,ma200].forEach(m=>{ for(let i=s0;i<n;i++) if(m[i]!=null){ lo=Math.min(lo,m[i]); hi=Math.max(hi,m[i]); } });
  const pad=(hi-lo)*0.06||hi*0.01; lo-=pad; hi+=pad;
  const x=i=>L+(i-s0)*(W-L-R)/Math.max(show-1,1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const bw=Math.max(1.2,(W-L-R)/show*0.62);
  const dp = hi<10 ? 4 : (hi<100 ? 3 : 2);

  let bars='';
  for(let i=s0;i<n;i++){
    const up=series.c[i]>=series.o[i];
    const col=up?'var(--delta-good)':'var(--critical)';
    const yo=y(series.o[i]), yc=y(series.c[i]);
    const top=Math.min(yo,yc), h=Math.max(Math.abs(yc-yo),0.8);
    bars+=`<line x1="${x(i).toFixed(1)}" y1="${y(series.h[i]).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(series.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
        + `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
  }
  const path=(m,col,w)=>{
    let d='',started=false;
    for(let i=s0;i<n;i++){ if(m[i]==null) continue; d+=(started?'L':'M')+x(i).toFixed(1)+','+y(m[i]).toFixed(1); started=true; }
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`:'';
  };
  // gridlines + right-hand price axis
  let grid='',ticks=5;
  for(let t=0;t<=ticks;t++){
    const v=lo+(hi-lo)*t/ticks, yy=y(v);
    grid+=`<line class="grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`
        + `<text x="${W-R+5}" y="${(yy+3).toFixed(1)}">${v.toFixed(dp)}</text>`;
  }
  // date labels
  let xlab='';
  for(let k=0;k<=4;k++){
    const i=Math.round(s0+(n-1-s0)*k/4);
    const d=series.dates[i];
    xlab+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===4?'end':'middle')}">${d.slice(2,7)}</text>`;
  }
  const last=series.c[n-1], first=series.c[s0];
  const chg=(last/first-1)*100;
  return {
    svg:`<svg ${svgEl(W,H)}>${grid}${bars}${path(ma50,'var(--s1)',1.8)}${path(ma150,'var(--s4)',1.8)}${path(ma200,'var(--s2)',1.8)}
      <line class="axisline" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>${xlab}</svg>`,
    last, first, chg, from:series.dates[s0], to:series.dates[n-1],
    ma:{ m50:ma50[n-1], m150:ma150[n-1], m200:ma200[n-1] }, dp
  };
}

/* ================= reminders =================
   Every item here is either a dated fact from CK's own documents, or a rule test
   recomputed from live balances — never a note typed once and left to rot. A test
   that says "closed" today flips itself to "open" the moment the numbers change. */
const REMINDER_SOURCES = {
  topupCap:'CPF Board — "What is the maximum amount of top-ups I can receive?": below 55 the cap is the current FRS less SA savings less amounts withdrawn from SA for investment',
  ers:'CPF Board — "Top up to enjoy higher retirement payouts": from 55 you may transfer OA savings to the RA, up to the Enhanced Retirement Sum',
  sale55:'CPF Board — "Selling your home: before vs after age 55": below 55 refunds go to the OA; from 55 they top the RA to the FRS and the balance stays in the OA, withdrawable',
  bhs:'CPF Board — Basic Healthcare Sum; it stops rising once you turn 65',
  frs:'CPF Board — Full Retirement Sum by year of 55th birthday'
};

function retirementChecks(){
  const out = [];
  const A = cpfAge(), c = latestCpf(), R = CPF_RULES;
  const snap = latest(), a = agg(snap), mm = latestManual();
  const hc = cpfHomeClaim();
  const add = o => out.push(o);
  const today = new Date().toISOString().slice(0,10);

  /* ---------- dated ---------- */
  const L = (a.loans||[])[0];
  if(L && L.maturityDate){
    const d = daysUntil(L.maturityDate);
    add({ id:'mrtl-maturity', cat:'dated', date:L.maturityDate, days:d,
      tone: d<=14?'serious':(d<=45?'warn':'info'),
      title:'Margin loan matures', head:`${money(Math.abs(L.principal),0)} at ${pct(L.ratePct,2)}`,
      detail:`Roll it or repay it. This is a revolving facility, so renewal depends on DBS, not on your solvency — which is why Fortress scores rollover as the thinnest pillar. Repaying from the unpledged reserve removes the dependency entirely.`,
      source:`DBS statement ${esc(snap.statementDate)}: ${esc(L.description||'MRTL')}` });
  }
  pendingRateChanges().forEach((rc,i)=>{
    if(rc.instalment==null || !rc.instalmentEffective) return;
    const d = daysUntil(rc.instalmentEffective);
    const prev = mm?.mortgagePayment;
    add({ id:'instalment-'+i, cat:'dated', date:rc.instalmentEffective, days:d,
      tone: d<=45?'warn':'info',
      title:'Home-loan instalment rises', head:`${prev!=null?money(prev,2)+' → ':''}${money(rc.instalment,2)}`,
      detail:`${prev!=null?`Up ${money(rc.instalment-prev,2)}/mo, ${money((rc.instalment-prev)*12,2)}/yr. `:''}Rent cover falls to ${monthlyIncome()>0?pct(monthlyIncome()/rc.instalment*100,1):'—'}. Check the GIRO deduction clears the month it changes.`,
      source: rc.source||'UOB rate-revision letter' });
  });
  if(A){
    add({ id:'age-55', cat:'dated', date:A.date55, days:A.days55,
      tone: A.days55>0 && A.days55<=1095 ? 'warn':'info',
      title:'You turn 55 — the CPF rules change', head:`${money(R.ers-R.frs,0)} decision`,
      detail:`The Special Account closes. ${money(frsFor(A.year55).value,0)} moves into a Retirement Account; the surplus lands in your OA at ${pct(R.oaPct,1)} instead of ${pct(R.saPct,1)} and becomes withdrawable. From that date you may transfer OA→RA up to the Enhanced Retirement Sum — ${money(R.ers,0)} on ${R.sumsYear} figures — swapping ${pct(R.oaPct,1)} for ${pct(R.saPct,1)} on roughly ${money(R.ers-R.frs,0)}. That is about ${money((R.ers-R.frs)*(R.saPct-R.oaPct)/100,0)}/yr of rate differential plus a larger lifelong payout, against giving up access to the money. Decide before the date, not on it.`,
      source: REMINDER_SOURCES.ers });
    add({ id:'bhs-65', cat:'dated', date:A.date65, days:daysUntil(A.date65), tone:'info',
      title:'MediSave cap stops rising', head:`at 65, in ${A.year65}`,
      detail:`Your Basic Healthcare Sum is fixed for life in the year you turn 65. Until then it rises most years — it went ${money(R.prevBhs,0)} (${R.prevBhsYear}) → ${money(R.bhs,0)} (${R.bhsYear}) — and each rise quietly re-opens a little MediSave headroom.`,
      source: REMINDER_SOURCES.bhs });
    const F = frsFor(A.year55);
    if(!F.published) add({ id:'frs-unpublished', cat:'dated', date:null, days:null, tone:'warn',
      title:`Enter the ${A.year55} Full Retirement Sum when CPF announces it`, head:`using ${money(F.value,0)} — too low`,
      detail:`CPF publishes retirement sums a few years ahead; the series currently stops at ${R.frsLastPublished}. Until your cohort's figure is out, the projection understates what gets locked into the RA and overstates what stays liquid in the OA. Set it on the CPF tab the moment it is published.`,
      source: REMINDER_SOURCES.frs });
  }
  { const age = daysUntil(R.checkedOn);
    if(age!==null && age < -180) add({ id:'cpf-rules-stale', cat:'dated', date:null, days:null, tone:'warn',
      title:'Re-check the CPF rates and caps', head:`last checked ${esc(R.checkedOn)}`,
      detail:`Rates are announced quarterly and the BHS yearly. Everything on the CPF tab is built on figures read on ${esc(R.checkedOn)}; ${fmt(Math.abs(age),0)} days have passed.`,
      source:'CPF Board publishes interest rates each quarter and the BHS each January' });
  }

  /* ---------- standing rule tests, recomputed every time ---------- */
  if(c){
    const cap = R.frs - (c.sa||0);
    add({ id:'sa-topup', cat:'standing', tone: cap>0?'good':'info',
      title:'Cash top-up to your Special Account', head: cap>0?`${money(cap,0)} of room`:'closed to you',
      detail: cap>0
        ? `The cap is the current FRS less your SA. You have ${money(cap,0)} of headroom, and cash top-ups carry up to ${money(8000,0)} of tax relief a year.`
        : `The cap is the current FRS (${money(R.frs,0)}) less your SA (${money(c.sa,0)}) — that is ${money(cap,0)}, so there is no room. The standard advice to "top up your SA for the 4% and the ${money(8000,0)} relief" does not apply to you. This test re-runs on every render: if the FRS ever overtakes your SA it will say so.`,
      source: REMINDER_SOURCES.topupCap });
    const maCap = R.bhs - (c.ma||0);
    add({ id:'ma-vc', cat:'standing', tone: maCap>0.005?'good':'info',
      title:'Voluntary MediSave contribution', head: maCap>0.005?`${money(maCap,0)} of room`:'closed — at the cap',
      detail: maCap>0.005
        ? `MediSave sits ${money(maCap,0)} below the ${R.bhsYear} Basic Healthcare Sum, so that much can still go in.`
        : `MediSave is exactly at the ${R.bhsYear} Basic Healthcare Sum of ${money(R.bhs,0)}. Nothing more fits until the BHS rises in January.`,
      source: REMINDER_SOURCES.bhs });
    add({ id:'loved-ones', cat:'standing', tone:'good',
      title:'Top-ups for someone else still carry relief', head:`up to ${money(8000,0)}/yr`,
      detail:`Your own top-up route is shut, but cash top-ups to a parent, spouse or sibling's CPF are a separate allowance with its own tax relief. Whether it is worth doing depends on who you would top up and your tax bracket — neither of which Fortress knows.`,
      source:'CPF Board — up to $8,000 relief for self and another $8,000 for loved ones each calendar year' });
  }
  if(hc){
    add({ id:'housing-refund', cat:'standing', tone:'info',
      title:'A voluntary housing refund is close to net-worth-neutral', head:`${money(hc.yearlyAccrual,0)}/yr accruing`,
      detail:`The accrual is interest you owe <em>yourself</em> — it lowers your proceeds on a sale and raises your CPF by the same amount. Refunding moves cash into the OA at ${pct(CPF_RULES.oaPct,1)} and removes an internal claim that was compounding at ${pct(CPF_RULES.oaPct,1)}. Net worth barely moves; liquidity falls until 55. Not the same as paying down a loan, though it is often described that way.`,
      source:`CPF Home ownership dashboard, ${esc(hc.asOf)}` });
    if(A) add({ id:'sale-timing', cat:'standing', tone:'info',
      title:'If you ever sell, which side of 55 decides the liquidity', head:`${money(hc.claim,0)} at stake`,
      detail:`Sell before ${esc(dayLabel(A.date55))} and the refund lands in your OA, locked until 55. Sell on or after, and it tops the RA to the FRS — already covered by your SA — with the balance staying in the OA, withdrawable in cash. Same sale, same money, very different access.`,
      source: REMINDER_SOURCES.sale55 });
  }
  { const rates = [];
    if((a.loans||[]).length) rates.push({ what:'DBS margin', pct:a.loans[0].ratePct, amt:Math.abs(a.loans[0].principal) });
    const eff = effectiveLoanTerms();
    const mRate = eff.ratePct ?? mm?.mortgageRatePct;
    if(mRate!=null && mm?.mortgageBalance!=null) rates.push({ what:'UOB mortgage', pct:mRate, amt:mm.mortgageBalance });
    const dearest = rates.length ? Math.max(...rates.map(r=>r.pct)) : null;
    if(dearest!=null) add({ id:'debt-vs-cpf', cat:'standing', tone: dearest < R.oaPct ? 'good':'warn',
      title:'Your borrowing costs against what CPF pays you', head: dearest < R.oaPct ? 'spread is in your favour' : 'a loan now costs more than CPF pays',
      detail:`${rates.map(r=>`${r.what} ${money(r.amt,0)} at ${pct(r.pct,r.pct%1===0?2:5)}`).join('; ')}. CPF pays ${pct(R.oaPct,1)} in the OA and ${pct(R.saPct,1)} in the SA. ${dearest < R.oaPct
        ? `Every loan you carry is cheaper than your own risk-free CPF return, so leaving money in CPF rather than prepaying is arithmetically defensible — the spread is positive. That flips the day a rate rises above ${pct(R.oaPct,1)}, and this line will say so.`
        : `The dearest loan now runs above the OA rate. Prepaying starts to compete with leaving money in CPF.`}`,
      source:`DBS statement ${esc(snap.statementDate)}; UOB rate letter; CPF published rates` });
  }
  { const top = Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
    const share = top ? top[1]/a.pledgedAssets*100 : 0;
    if(top) add({ id:'concentration', cat:'standing', tone: share>60?'warn':'info',
      title:'Single-currency concentration', head:`${pct(share,1)} ${esc(top[0])}`,
      detail:`${esc(top[0])} is ${pct(share,1)} of the pledged collateral, against liabilities and living costs that are entirely SGD. Fortress scores this as a wealth risk rather than a margin risk — the FX tab shows why a move of this size barely shifts the LTV — but it is one bet, not five.`,
      source:`DBS statement ${esc(snap.statementDate)}, currency allocation` });
  }
  { const hv = state.settings.homeValue, nw = netWorth(a);
    if(hv){ const total = nw.dbsUob + hv + (nw.cpf||0);
      const share = hv/total*100;
      if(share>50) add({ id:'property-share', cat:'standing', tone:'info',
        title:'Share of net worth in one property', head:`${pct(share,1)}`,
        detail:`The house is ${money(hv,0)} of a ${money(total,0)} balance sheet. It is illiquid, it takes months to sell, and ${money((cpfHomeClaim()||{}).claim||0,0)} of any sale goes to CPF rather than to you.`,
        source:'your own valuation, entered on the Property tab' });
    }
  }

  const done = state.settings.remindersDone || {};

function alertList(snap,a){
  const out=[];
  for(const l of a.loans){
    const d=daysUntil(l.maturityDate);
    if(d!==null&&d<=45) out.push({cls:d<=14?'b-warn':'b-good',ic:'⏳',t:`Loan matures in ${d} day${d===1?'':'s'} (${l.maturityDate})`,b:`${l.ccy} ${fmt(Math.abs(l.principal),2)} @ ${l.ratePct}% — decide rollover vs repay before maturity.`});
  }
  for(const f of a.forwards){
    const d=daysUntil(f.maturityDate);
    if(d!==null&&d<=45) out.push({cls:'b-warn',ic:'⇄',t:`FX forward ${f.pair} settles in ${d} day${d===1?'':'s'}`,b:`Sell ${f.sellCcy} ${fmt(Math.abs(f.sellAmt),0)} / buy ${f.buyCcy} ${fmt(f.buyAmt,0)} @ ${f.contractRate}. Current MTM ${money(f.mtmSGD,0)}. Ensure the ${f.sellCcy} leg is funded at settlement.`});
  }
  if(a.ltv!==null && a.ltv>=state.settings.ltvAlert) out.push({cls:'b-serious',ic:'⚠',t:`LTV ${pct(a.ltv,1)} above your ${state.settings.ltvAlert}% alert level`,b:'Consider partial repayment or trimming positions.'});
  if(!state.settings.lendingValue && a.debt>0 && !latestMrtl()) out.push({cls:'b-warn',ic:'ℹ',t:'Lending value not set',b:'DBS statements don’t disclose per-security lending values. Ask your RM for the portfolio’s lending value and enter it in Settings — until then margin lines are illustrative.'});
  {(function(){ const m=latestMrtl(), c=mrtlCapacity(m);
    if(m && c && c.disputed) out.push({cls:'b-warn',ic:'ℹ',t:'DBS shows two different capacity figures',b:`Borrowing potential ${money(m.borrowingPotential,0)} vs available-for-drawdown implying ${money(c.optimistic,0)}. Fortress uses the smaller. Worth one question to Mark Chen.`});
  })();}
  if(a.estMonthlyInterest>0 && a.plMtd < -6*a.estMonthlyInterest) out.push({cls:'b-warn',ic:'📉',t:`This month’s P&L (${money(a.plMtd,0)}) is ${fmt(Math.abs(a.plMtd)/a.estMonthlyInterest,0)}× your monthly interest`,b:'Market risk, not the loan, is the dominant driver of your net worth.'});
  return out;
}

function reminderRow(r){
  const cls = r.tone==='serious'?'neg':(r.tone==='warn'?'neg':(r.tone==='good'?'pos':''));
  const when = r.date ? `${esc(dayLabel(r.date))}${r.days!=null?` · ${r.days>=0?fmt(r.days,0)+' days':'passed '+fmt(-r.days,0)+' days ago'}`:''}` : '';

    <div class="kv" style="border:none;padding:0">
      <span class="k"><b>${esc(r.title)}</b>${when?`<br><span style="font-size:11px">${when}</span>`:''}</span>
      <span class="v ${cls}">${r.head||''}</span>
    </div>
    <details style="margin-top:4px">
      <summary class="note" style="cursor:pointer;font-size:12px">${r.done?'Dismissed — reopen':'Why this is here'}</summary>
      <p class="note" style="margin-top:6px">${r.detail}</p>
      <p class="note" style="font-size:11px">Source: ${esc(r.source)}</p>
      <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="toggleReminder('${esc(r.id)}')">${r.done?'Bring it back':'Dismiss — I have dealt with this'}</button>
    </details>
  </div>`;
}
function remindersCard(){
  const all = retirementChecks();
  if(!all.length) return '';
  const live = all.filter(r=>!r.done), dismissed = all.filter(r=>r.done);
  const dated = live.filter(r=>r.cat==='dated').sort((a,b)=>{
    if(a.days==null) return 1; if(b.days==null) return -1; return a.days-b.days; });
  const standing = live.filter(r=>r.cat==='standing');
  const urgent = live.filter(r=>r.tone==='serious'||r.tone==='warn').length;
  return `
  <div class="card">
    <h2>Reminders<span class="pill">${urgent?urgent+' need attention · ':''}${live.length} live</span></h2>
    <p class="note" style="margin:0 0 4px">Dated items count down from your own documents. The rest are rule tests re-run every time this screen draws — a "closed" here becomes an "open" the moment the numbers change, without anyone editing a note.</p>
    ${dated.length?`<div style="margin-top:8px"><span class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Dated</span>${dated.map(reminderRow).join('')}</div>`:''}
    ${standing.length?`<div style="margin-top:14px"><span class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Standing — tested against today's numbers</span>${standing.map(reminderRow).join('')}</div>`:''}
    ${dismissed.length?`<details style="margin-top:14px"><summary class="note" style="cursor:pointer">${dismissed.length} dismissed</summary>${dismissed.map(reminderRow).join('')}</details>`:''}
    <p class="note" style="margin-top:12px"><b>These are prompts, not advice.</b> Fortress does not know your income needs, tax position, family or how long you intend to work — and the age-55 choice in particular turns on all four. Take the arithmetic to someone licensed before acting on it.</p>
  </div>`;
}

      <div class="kv"><span class="k">Group lending value</span><span class="v">${pct(g.groupLvPct,2)} of ${money(g.assets,0)}</span></div>
      <p class="note" style="margin:6px 0 4px">That total answers “how much could I borrow in all”. It is <b>not</b> the margin-call basis below: ${money(g.unpledged,0)} of it sits in an account that isn't pledged, so it cannot absorb a call on the drawn loan unless you pledge it. On the combined basis the buffer would read ${pct(100-m.amountDrawn/g.total*100,1)} instead of ${pct(fall,1)} — ${fmt(Math.abs((100-m.amountDrawn/g.total*100)-fall),2)} points, which is why Fortress leads with the conservative one.</p>`; })()}
    <h2 style="margin-top:14px">The two capacity figures <span style="font-weight:400;text-transform:none;letter-spacing:0">(pledged account)</span></h2>
    <div class="kv"><span class="k"><b>A · Borrowing potential</b><br><span style="font-size:11px">asset-based, subject to credit approval</span></span><span class="v">${money(c.assetBased,2)}</span></div>
    <div class="kv"><span class="k"><b>B · Drawable on the existing facility</b><br><span style="font-size:11px">available ${money(m.availableForDrawdown,0)} + already drawn ${money(m.amountDrawn,0)}</span></span><span class="v">${money(c.facilityBased,2)}</span></div>
    ${c.differ?`<div class="warnbox"><b>These measure different things — that's why they don't add up.</b>
      DBS defines <b>borrowing potential</b> as “the indicative amount you can borrow based on your current assets, <em>subject to credit approval</em>… not an offer or a commitment”, with the actual limit depending on diversification, concentration limits and qualifying collateral.
      <b>Available for drawdown</b> is “the maximum you can draw down on your MRTL… based on your existing portfolio” — i.e. inside the facility already approved.
      A is ${money(Math.abs(c.optimistic-c.capacity),0)} ${c.assetBased<c.facilityBased?'lower':'higher'} than B. Fortress uses the smaller (${money(c.capacity,2)}) for the margin metric, so the buffer is never overstated.</div>`:''}
    <p class="note">This is the real margin metric — it uses DBS's own assessment of what your collateral supports, not an assumed advance ratio. On B's more generous basis the buffer would be ${pct(100-m.amountDrawn/c.optimistic*100,1)} rather than ${pct(fall,1)}. Update by importing the Portfolio Summary screen.</p>
    <p class="note"><b>Is ${pct(util,1)} a sensible place to sit?</b> There is no published Singapore benchmark for this — securities-backed lending is a private-bank product, and the overwhelming majority of Singaporean households have <em>no</em> margin borrowing at all, so "vs a typical Singaporean" has no meaningful answer. The comparison that does mean something is against the mechanics: at ${pct(util,1)} used, the collateral can fall ${pct(fall,1)} before a call. Private-bank practice generally treats utilisation under 50% as conservative, 50–70% as needing attention, and 70%+ as leaving little room for a fast drawdown — because the trigger is not the fall itself but being forced to sell into it. You sit in the first band. What would move you up is not markets alone but drawing more.</p>
  </div>`; })()}
  ${(()=>{ const ids=Object.keys(state.lv||{}); if(!ids.length) return '';
    const rows=ids.map(pid=>{
      const L=lvFor(pid); if(!L) return '';
      const p=(latest().portfolios||[]).find(x=>x.id===pid);
      const loan=p? Math.abs(p.totalLoans||0) : 0;
      const trigger = L.pct>0 ? (loan>0 ? 100 - loan/(L.borrowingPotential ?? (L.pct/100*(L.totalAssets||0))) *100 : null) : null;
      const pledged=isPledged(pid,p);
      return `<div class="kv"><span class="k"><b>${esc(pid)}</b> <span class="pill">${pledged?'pledged':'not pledged'}</span><br><span style="font-size:11px">${L.basis==='derived'
          ? money(L.borrowingPotential,0)+' ÷ '+money(L.totalAssets,0)+' assets · same screen, same time'

    }).join('');
    const free=ids.filter(pid=>!isPledged(pid,(latest().portfolios||[]).find(x=>x.id===pid)));

  <div class="card">

      Its ${money(freeAssets,0)} of assets do <em>not</em> secure the margin loan, so Fortress leaves them out of the LTV denominator — the DBS screen for the borrowing account shows its own assets only, and this account offers “Apply with RM” rather than “Contact RM to draw down”.

  <div class="card">

      }

    ${missing?`<p class="note" style="margin-top:10px"><b>${missing} reading${missing>1?'s are':' is'} missing above.</b> Fortress will not fill a gap with an estimate. To close one: DBS app → switch to that portfolio → Performance → set the same range → TWRR → then Add data → Paste text.</p>`:''}
    <p class="note" style="margin-top:14px"><b>TWRR</b> — ${esc(METRIC_NOTE.TWRR)} It is the fair way to judge the holdings, and the only basis Fortress reports.</p>
    <p class="note">Readings are grouped by window because that is the only way they mean anything — the same portfolio reads 32.91% over one year and 20.69% year-to-date, and a single day's shift in the endpoints moved the 1Y figure by two points. The S&P line is dividend-reinvested total return converted to SGD at spot, which is what a Singapore investor actually banks.</p>
    <p class="note"><b>Two caveats before you feel too good.</b> Your returns are struck on <em>net</em> assets and are therefore levered; the index is not. And a portfolio that is ${pct((a.pledgedCcy.USD||0)/a.pledgedAssets*100,0)} USD will track US equities closely by construction — beating the index by a few points is a stock-selection result, not proof of diversification.</p>

  <div class="card">

        <b>Gains ÷ interest of ${fmt(gv,1)}×</b> is flattering and fragile: it divides a volatile mark-to-market gain by a near-fixed cost, so it soars in a good year and goes <em>negative</em> in a bad one. July alone was ${money(a.plMtd,0)} — on a full month like that the ratio is meaningless. Treat ${fmt(gv,1)}× as evidence the strategy is working this year, not as a safety margin.</p>

    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[

    <p class="note">Positive carry = the portfolio's cash income alone outruns all financing and account costs.</p></div>

`;

/* ================= Property tab =================
   Everything about the house in one place: the UOB loan, the rate letters that
   reprice it, the rent that services it, and the equity behind it. The dashboard
   keeps the consolidated debt totals — this tab holds the detail. */
function viewProp(){
  const mm = latestManual();
  const hv = state.settings.homeValue;
  const eff = effectiveLoanTerms();
  const rentM = monthlyIncome();
  const bal = mm?.mortgageBalance ?? null;
  const rateNow = eff.ratePct ?? mm?.mortgageRatePct ?? null;
  const instNow = eff.instalment ?? mm?.mortgagePayment ?? null;
  const impInt = mm ? impliedMortgageInterest(mm.month) : null;
  const paidOff = (MORTGAGE_META.original!=null && bal!=null) ? MORTGAGE_META.original - bal : null;
  // average principal per recorded month — arithmetic on your own entries, never a projection
  const withBal = manualMonths().filter(m=>state.manual[m].mortgageBalance!=null);
  const avgPrin = withBal.length>1
    ? (state.manual[withBal[0]].mortgageBalance - state.manual[withBal[withBal.length-1]].mortgageBalance)/(withBal.length-1)
    : null;
  const pend = pendingRateChanges();
  const today = new Date().toISOString().slice(0,10);
  const hc = cpfHomeClaim();                      // CPF's claim on this same house
  const claims = (bal||0) + (hc? hc.claim : 0);   // everything that must be settled on a sale
  const cashOut = (hv!=null && bal!=null) ? hv - claims : null;
  const pendInst = pend.find(r=>r.instalment!=null && r.instalmentEffective>today) || null;

  if(!mm) return `<div class="banner b-warn"><span class="ic">&#8505;</span><div><b>No home-loan data yet</b>Add a month below, or import a UOB statement, screenshot or rate letter through Add data.</div></div>${propForms()}`;

  return `
  ${pend.length?`<div class="banner b-warn"><span class="ic">&#8599;</span><div><b>${pend.length} rate change not yet in force</b>${pend.map(rc=>{

/* An offline-capable app can serve yesterday's code from cache. This is the escape hatch:
   drop the code caches, drop the service worker, reload past the HTTP cache. Data lives in
   localStorage and is not touched by any of it. */
async function forceUpdate(){
  if(!confirm('Clear the cached app code and reload from the server?\n\nYour data (balances, snapshots, settings) is not affected.')) return;
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); } }catch(e){}
  location.replace(location.pathname.replace(/[^/]*$/,'') + '?u=' + Date.now());
}

}

    ${con?`<label class="fld"><input type="checkbox" ${withC?'checked':''} onchange="setCpfContrib(this.checked)" style="width:auto;margin-right:6px">Include contributions at ${money(con.median,2)}/month — the figure your own payslips have produced in ${con.count-1} of the last ${con.count} months</label>`:''}

    <label class="fld">Year you turn 55${A?' — from your date of birth':' — optional, but it is the biggest single thing this projection turns on'}</label>

    ${con.n?`<p class="note">Contributions run at ${money((cpfLastContribution()||{}).median||0,2)}/month, which is ${pct(((cpfLastContribution()||{}).median||0)/CPF_RULES.owCeiling*100,1)} of the ${money(CPF_RULES.owCeiling,0)} Ordinary Wage ceiling — the pattern of someone earning at or above it, so the figure is stable rather than pay-dependent. The split across OA/SA/MA matches CPF's <b>above 50 to 55</b> allocation band exactly. ${esc(CPF_RULES.allocSource)}.</p>`:''}
    <div style="margin-top:10px">${t.slice().reverse().slice(0,8).map(x=>`<div class="kv"><span class="k">${esc(dayLabel(x.date))} &middot; ${esc(x.code)}${x.forMonth?' &middot; '+esc(x.forMonth):''}</span><span class="v" style="font-weight:400">${['oa','sa','ma'].filter(k=>x[k]).map(k=>k.toUpperCase()+' '+money(x[k],2)).join(' &middot; ')||'—'}</span></div>`).join('')}</div>
    <p class="note">Latest 8 of ${t.length} rows. Source: ${esc(M.source)}.</p>
  </div>`; })()}

  ${(()=>{ const f=cpfHousingFlows(); if(!f||!f.groups.length) return '';
    return `

    ${f.groups.map(g=>`<div class="kv"><span class="k">${esc(dayLabel(g.date))}${g.n>1?` <span style="font-size:11px">(${g.n} entries)</span>`:''}</span><span class="v ${g.amount>=0?'pos':'neg'}">${g.amount>=0?'+':''}${money(g.amount,2)}</span></div>`).join('')}
    <div class="kv"><span class="k"><b>Net</b></span><span class="v ${f.net>=0?'pos':'neg'}"><b>${f.net>=0?'+':''}${money(f.net,2)}</b></span></div>
    <p class="note"><b>This is the refund mechanic, in your own numbers.</b> ${money(f.refunded,0)} came back into your CPF when the earlier property was sold, and ${money(Math.abs(f.withdrawn),0)} went out again for the current one — a net ${money(Math.abs(f.net),0)} ${f.net<0?'out':'in'} across both. Money used for housing is not spent; it is parked in the property and returns to CPF on sale, with interest owed on top.</p>
  </div>`; })()}

  ${hc?`
  <div class="card">
    <h2>Your CPF is also in the house</h2>
    <div class="kv"><span class="k">Principal withdrawn for the property</span><span class="v">${money(hc.principal,2)}</span></div>

    <div class="kv"><span class="k">Growing by</span><span class="v neg">${money(hc.monthlyAccrual,2)}/mo &middot; ${money(hc.yearlyAccrual,2)}/yr</span></div>
    <p class="note">That is more than half of your CPF again, sitting in the property rather than earning ${pct(R.oaPct,1)} in the OA. The Property tab shows what it does to your equity and to what you would actually receive on a sale.</p>
    <button class="btn ghost" onclick="go('prop')">Open the Property tab</button>

${cpfForms()}
  <button class="btn" onclick="startImport()">&#10514; Add data — CPF dashboard screenshot</button>
  <p class="note" style="text-align:center">Read entirely on this device — nothing is uploaded.</p>`;

    <label class="fld">As at (YYYY-MM-DD)</label><input type="text" id="cpfDate" value="${new Date().toISOString().slice(0,10)}">
    ${fld('cpfOA','Ordinary Account (S$)', c?c.oa:null)}
    ${fld('cpfSA','Special Account (S$)', c?c.sa:null)}
    ${fld('cpfMA','MediSave Account (S$)', c?c.ma:null)}
    <button class="btn" style="margin-top:12px" onclick="saveCpf()">Save balances</button>
    ${cpfDates().length?`<div style="margin-top:12px">${cpfDates().slice().reverse().map(d=>`<div class="kv"><span class="k">${esc(d)}</span><span class="v">${money(cpfTotal(state.cpf[d]),2)} <button class="btn ghost" style="width:auto;padding:2px 8px;font-size:11px;margin-left:8px" onclick="delCpf('${esc(d)}')">×</button></span></div>`).join('')}</div>`:''}
  </div>

    ${cpfHomeDates().length?`<div style="margin-top:12px">${cpfHomeDates().slice().reverse().map(d=>`<div class="kv"><span class="k">${esc(d)}</span><span class="v">${money((state.cpfHome[d].principalWithdrawn||0)+(state.cpfHome[d].accruedInterest||0),2)} <button class="btn ghost" style="width:auto;padding:2px 8px;font-size:11px;margin-left:8px" onclick="delCpfHome('${esc(d)}')">×</button></span></div>`).join('')}</div>`:''}
