let tessReady=null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tessReady) return tessReady;
  tessReady=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=()=>res(); s.onerror=()=>rej(new Error('Could not load the OCR engine (needs a network connection the first time). Use “Paste text instead” — on iPhone, copy the text straight off the screenshot in Photos.'));
    document.head.appendChild(s);
  }).catch(e=>{ tessReady=null; throw e; });
  return tessReady;
}
async function pdfText(file){
  await loadPdfjs();
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    pages.push(DBSParser.itemsToLines(tc.items));
  }
  return pages;
}
/* OCR on a phone photo fails for two ordinary reasons: the page is sideways, and
   the file is huge. Tesseract does not auto-rotate, so we try the image as-is first
   (unchanged behaviour for the screenshots that already worked) and only if the
   recognisers can't place the text do we retry rotated. The winner is whichever
   pass the recognisers score highest — not a guess about orientation. */
function loadImageEl(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Could not open that image.')); };
    img.src=url;
  });
}
function rotatedCanvas(img, rot){
  const maxDim=2600;                       // bound memory on 12MP phone photos
  const scale=Math.min(1, maxDim/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*scale), h=Math.round(img.naturalHeight*scale);
  const swap = rot===90 || rot===270;
  const c=document.createElement('canvas');
  c.width = swap?h:w; c.height = swap?w:h;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2, c.height/2); x.rotate(rot*Math.PI/180);
  x.drawImage(img,-w/2,-h/2,w,h);
  return c;
}
function ocrScore(text){
  if(!text || !text.trim()) return -1;
  try{ const r=FortressRecognizers.detect(text);
       return (r.kind==='generic'?0:1) + (r.confidence||0) + Math.min(text.length,4000)/100000; }
  catch(e){ return 0; }
}
async function ocrOnce(src){
  const { data } = await Tesseract.recognize(src,'eng');
  return data.text||'';
}
async function ocrImage(file){
  await loadTesseract();
  let best={ text:'', score:-1, rot:0 };
  const take=(text,rot)=>{ const sc=ocrScore(text); if(sc>best.score) best={text,score:sc,rot}; return sc; };
  if(take(await ocrOnce(file), 0) >= 1) return best;      // recognised straight away
  let img; try{ img=await loadImageEl(file); }catch(e){ return best; }
  for(const rot of [90,270,180]){
    busy('Reading image with OCR… trying '+rot+'°');
    if(take(await ocrOnce(rotatedCanvas(img,rot)), rot) >= 1) return best;
  }
  return best;
}

document.getElementById('anyInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  try{
    if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){
      busy('Reading PDF…');
      const pages=await pdfText(f);
      // a DBS investment statement has its own rich parser — prefer it
      const dbs=DBSParser.parseLines(pages);
      if(dbs.portfolios.length){ reviewParse(dbs); return; }
      routeText(pages.map(p=>p.join('\n')).join('\n'), f.name);
      return;
    }
    if(/^image\//.test(f.type)){
      busy('Reading image with OCR…');
      const best = await ocrImage(f);
      routeText(best.text, f.name + (best.rot? ' · rotated '+best.rot+'°':''), true);
      return;
    }
    busy('Reading file…');
    routeText(await f.text(), f.name);
  }catch(err){
    showModal(`<h2>Import failed</h2><p class="note" style="font-size:13px">${esc(err.message)}</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`);
  }
});
function routeText(text, sourceName, viaOcr){
  if(!text || !text.trim()){ showModal(`<h2>Nothing to read</h2><p class="note">No text came out of that. If it's a photo of a screen, try the paste route instead.</p><button class="btn" style="margin-top:14px" onclick="closeModal()">Close</button>`); return; }
  const r=FortressRecognizers.detect(text);
  r.sourceName=sourceName; r.viaOcr=!!viaOcr; r.rawText=text;
  window.__rec=r;
  reviewRecognized(r);
}

const KINDLABEL={ uobRateChange:'UOB loan rate-revision letter', dbsPerformance:'DBS Performance summary', dbsMrtl:'DBS MRTL draw-down screen', dbsPortfolioSummary:'DBS Portfolio Summary screen', uobLoanScreen:'UOB home-loan screen', uobStatement:'UOB Statement of Account', generic:'Unrecognised document' };

const gv=id=>{ const el=document.getElementById(id); if(!el) return null; const v=el.value; return v===''?null:(+v); };
function saveRateChange(){
  const rate=gv('rRate'), inst=gv('rInst');
  const rf=(document.getElementById('rRateFrom').value||'').trim();
  const inf=(document.getElementById('rInstFrom').value||'').trim();
  if(rate==null && inst==null){ alert('Enter at least the new rate or the new instalment.'); return; }
  if(inf && !/^\d{4}-\d{2}-\d{2}$/.test(inf)){ alert('Instalment effective date must be YYYY-MM-DD.'); return; }
  if(rf && !/^\d{4}-\d{2}-\d{2}$/.test(rf)){ alert('Rate effective date must be YYYY-MM-DD.'); return; }
  state.rateChanges=state.rateChanges||[];
  state.rateChanges.push({ id:'rc-'+state.rateChanges.length, lender:'UOB',
    ratePct:rate, rateEffective:rf||null, instalment:inst, instalmentEffective:inf||null,
    previousRatePct:(window.__rec?.fields?.previousRatePct)??null,
    recordedOn:new Date().toISOString().slice(0,10),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') });
  // the rate applies from its own date. Only write onto a month that has ARRIVED —
  // creating a future month here would make it latestManual() and blank the balance.
  const nowM = new Date().toISOString().slice(0,7);
  if(rate!=null && rf){ const m=rf.slice(0,7); if(m<=nowM) state.manual[m]={...(state.manual[m]||{}), mortgageRatePct:rate}; }
  if(inst!=null && inf){ const m=inf.slice(0,7); if(m<=nowM) state.manual[m]={...(state.manual[m]||{}), mortgagePayment:inst}; }
  saveAll(); closeModal(); go('dash');
}
function usePrevRate(month, rate){
  if(!state.manual[month]) return;
  if(!confirm('Set the rate recorded for '+monthLabel(month)+' to '+rate+'%? This changes only that month\'s rate.')) return;
  state.manual[month]={...state.manual[month], mortgageRatePct:rate,
    rateSource:'UOB rate-revision letter (rate in force before the revision)'};
  saveAll(); render();
}
function delRateChange(ix){ if(confirm('Remove this rate change?')){ state.rateChanges.splice(ix,1); saveAll(); render(); } }
function saveReportedFromReview(){
  const from=(document.getElementById('rFrom').value||'').trim();
  const to=(document.getElementById('rTo').value||'').trim();
  const v=gv('rPct');
  if(v==null){ alert('Enter the return %.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)||from>=to){ alert('Enter a valid period — from must be before to, both YYYY-MM-DD.'); return; }
  state.reported=state.reported||[];
  state.reported.push({ id:'rep-'+state.reported.length, portfolioId:document.getElementById('rPid').value,
    metric:document.getElementById('rMetric').value, pct:v, from, to,
    capturedOn:new Date().toISOString().slice(0,10),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') });
  saveAll(); closeModal(); go('dash');
}
function savePortfolioSummary(){
  const sel=document.getElementById('rPid').value;
  const pid = sel==='__new' ? (document.getElementById('rPidNew').value||'').trim() : sel;
  if(!pid){ alert('Enter a portfolio id.'); return; }
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const assets=gv('rAssets'), bp=gv('rBP'), drawn=gv('rDrawn');
  if(assets==null || bp==null){ alert('Total assets and borrowing potential are both needed to derive the lending value.'); return; }
  const src=(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)');
  state.lv=state.lv||{};
  state.lv[pid]={ asOf, borrowingPotential:bp, totalAssets:assets, basis:'derived', source:src };
  if(drawn!=null){
    state.mrtl[asOf]={ asOf, portfolioId:pid, borrowingPotential:bp, amountDrawn:drawn,
      availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
      totalAssets:assets, totalLoans:gv('rLoans'),
      leverageFactor:gv('rLF'), riskRating:gv('rPR'), leverageThreshold:6, riskThreshold:5, source:src };
  }
  saveAll(); closeModal(); go('dash');
}
function saveMrtlFromReview(){
  const asOf=(document.getElementById('rAsOf').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(asOf)){ alert('As-of date must be YYYY-MM-DD.'); return; }
  const rec={ asOf, borrowingPotential:gv('rBP'), amountDrawn:gv('rDrawn'),
    availableForDrawdown:gv('rAvail'), creditLimit:gv('rLimit'),
    source:(window.__rec?.sourceName||'manual')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') };
  if(rec.amountDrawn==null || rec.borrowingPotential==null){ alert('Amount drawn and borrowing potential are both needed for the margin metric.'); return; }
  state.mrtl[asOf]=rec; saveAll(); closeModal(); go('dash');
}
function saveLoanFromReview(){
  const m=(document.getElementById('rMonth').value||'').trim();
  if(!/^\d{4}-\d{2}$/.test(m)){ alert('Month must be YYYY-MM.'); return; }
  const bal=gv('rBal'), pay=gv('rPay'), rate=gv('rRate'), dep=gv('rDep');
  if(bal==null && dep==null){ alert('Nothing to save — enter at least a balance or a deposits figure.'); return; }
  const prev=state.manual[m]||{};
  state.manual[m]={ ...prev,
    ...(bal!=null?{mortgageBalance:bal}:{}),
    ...(pay!=null?{mortgagePayment:pay}:{}),
    ...(rate!=null?{mortgageRatePct:rate}:{}),
    ...(dep!=null?{deposits:dep}:{}) };
  const useRent=document.getElementById('rUseRent');
  if(useRent && useRent.checked){
    const c=(window.__rec?.fields?.rentCredits||[]).find(x=>x.amount);
    const entry=(state.income||[]).find(i=>i.id==='rent-atelier') || (state.income||[])[0];
    if(c && entry) entry.amount=c.amount;
  }
  saveAll(); closeModal(); go('dash');
}

  ${res.warnings.length?`<div class="warnbox"><b>Check these:</b><br>${res.warnings.map(esc).join('<br>')}</div>`:''}
  ${exists?`<div class="warnbox">A snapshot for ${esc(res.statementDate)} already exists — saving will replace it.</div>`:''}
  <div class="card" style="margin:8px 0">
    <div class="kv"><span class="k">Total assets</span><span class="v">${money(a.assets,2)}</span></div>
    <div class="kv"><span class="k">Loans</span><span class="v">${money(-a.debt,2)}</span></div>

  </div>
  <p class="note">Cross-check these against the statement's Portfolio Summary page before saving. If anything is off, cancel and tell me — the parser can be adjusted.</p>

function confirmSave(){
  const res=window.__pending; if(!res) return;
  res.source='Imported '+new Date().toISOString().slice(0,10);
  state.snapshots[res.statementDate]=res; saveAll();
  closeModal(); go('dash');
}
