/* ===== Fortress strength: how much punishment can this structure absorb? ===== */
const HIST_DRAWDOWNS=[{y:'2022',pct:25.4},{y:'2020 COVID',pct:33.9},{y:'2000-02 dot-com',pct:49.1},{y:'2008 GFC',pct:56.8}];
function fortressStrength(snap,a){
  const m=latestMrtl(), c=mrtlCapacity(m), w=netWorth(a), mm=latestManual();
  if(!m||!c||m.amountDrawn==null) return null;
  const P=[];
  const band=(v,t)=>{ for(let i=0;i<t.length;i++) if(v>=t[i][0]) return t[i][1]; return t[t.length-1][1]; };

  // A — how far markets can fall before a call
  const buf=100-m.amountDrawn/c.capacity*100;
  const survives=HIST_DRAWDOWNS.filter(d=>d.pct<buf), breaks=HIST_DRAWDOWNS.filter(d=>d.pct>=buf);
  P.push({k:'Market shock',score:band(buf,[[50,4],[35,3],[25,2],[15,1],[0,0]]),
    v:pct(buf,1)+' fall absorbed',
    d:`Survives ${survives.map(d=>d.y).join(', ')||'no historical analogue'}${breaks.length?'; breached by '+breaks.map(d=>d.y+' (−'+d.pct+'%)').join(', '):''}.`});

  // B — can income service the debt without selling anything
  const marginInt=a.estMonthlyInterest*12;
  const mortInt=(impliedMortgageInterest(mm&&mm.month)??0)*12;
  const inst=(mm&&mm.mortgagePayment?mm.mortgagePayment:0)*12;
  const months=snap.statementDate?(+snap.statementDate.slice(5,7)):12;
  const income=monthlyIncome()*12 + (a.divYtd+a.intRecYtd)*12/months;
  const intOnly=marginInt+mortInt, fullSvc=marginInt+inst;
  const cover=intOnly>0?income/intOnly:null, svcCover=fullSvc>0?income/fullSvc:null;
  P.push({k:'Debt service',score:band(cover||0,[[3,4],[2,3],[1.5,2],[1,1],[0,0]]),
    v:fmt(cover,2)+'× interest cover',
    d:`<b>This rests on an income figure Fortress assembled, not one you gave it:</b> ${money(income,0)}/yr is the rent you entered plus DBS portfolio income annualised from a part-year figure. It excludes your salary entirely and knows nothing of your spending, so read it as debt against <em>asset</em> income, not as household affordability. On that basis: ${money(income,0)}/yr against ${money(intOnly,0)} of interest. Including mortgage principal the cover is ${fmt(svcCover,2)}×, a surplus of ${money(income-fullSvc,0)}/yr — nothing has to be sold to stay current.`});

  // C — dry powder that is not pledged
  const reserve=(a.unpledgedAssets||0)+(w.uobCash||0);
  const mo=fullSvc>0?reserve/(fullSvc/12):null;
  P.push({k:'Free reserves',score:band(mo||0,[[24,4],[12,3],[6,2],[3,1],[0,0]]),
    v:money(reserve,0),
    d:`Unencumbered assets DBS has no claim on: ${fmt(mo,1)} months of full debt service. This is what you sell in a call instead of liquidating pledged collateral at the worst possible prices.`});

  // D — concentration
  const top=Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
  const share=top?top[1]/a.pledgedAssets*100:0;
  P.push({k:'Concentration',score:band(100-share,[[60,4],[45,3],[35,2],[25,1],[0,0]]),
    v:top?pct(share,1)+' '+top[0]:'—',
    d:top?`${top[0]} is ${pct(share,1)} of the collateral. It would have to fall ${pct(buf/(share/100),1)} alone to cause a call, so this is a wealth risk more than a margin risk — but it is one bet, not five.`:''});

  // E — floating-rate headroom
  const rentY=monthlyIncome()*12, mtg=mm&&mm.mortgageBalance?mm.mortgageBalance:0;
  const mortBreak=mtg>0?rentY/mtg*100:null;
  const divY=a.divYtd*12/months, mp=Math.abs((a.loans[0]||{}).principal||0);
  const marginBreak=mp>0?divY/mp*100:null;
  P.push({k:'Rate rises',score:band(Math.min(mortBreak||0,marginBreak||0),[[5,4],[4,3],[3,2],[2,1],[0,0]]),
    v:'safe to ~'+fmt(Math.min(mortBreak||99,marginBreak||99),1)+'%',
    d:`Rent covers the mortgage until its rate passes ${pct(mortBreak,2)} (now ${mm&&mm.mortgageRatePct?pct(mm.mortgageRatePct,2):'—'}); dividends cover the margin loan until ${pct(marginBreak,2)} (now ${a.loans[0]?pct(a.loans[0].ratePct,2):'—'}). Both are floating, and that gap is the real cushion.`});

  // F — rollover
  const L=a.loans[0], dd=L?daysUntil(L.maturityDate):null;
  P.push({k:'Rollover',score:dd==null?2:band(dd,[[90,4],[30,3],[14,2],[0,1]]),
    v:dd==null?'—':dd+' days',
    d:L?`The ${money(Math.abs(L.principal),0)} MRTL matures ${L.maturityDate} and is revolving — it depends on DBS renewing, not on your solvency. Facility limit ${money(m.creditLimit,0)} is not the constraint; renewal is. Cheap to eliminate: repay from the unpledged reserve if you ever want the dependency gone.`:''});

  const tot=P.reduce((s,p)=>s+p.score,0), max=P.length*4;
  const grade = tot/max>=0.85?'Very strong': tot/max>=0.7?'Strong': tot/max>=0.55?'Solid': tot/max>=0.4?'Adequate':'Fragile';
  const weakest=P.slice().sort((x,y)=>x.score-y.score)[0];
  return {P,tot,max,grade,weakest,buf,breaks};
}
const SCORE_LABEL=['Weak','Thin','Adequate','Solid','Strong'];
const SCORE_COLOR=['var(--critical)','var(--serious)','var(--warn)','var(--s1)','var(--good)'];

/* ===== FX candlestick + moving averages (hand-rolled SVG) ===== */
function sma(arr, n){
  const out=new Array(arr.length).fill(null); let sum=0;
  for(let i=0;i<arr.length;i++){ sum+=arr[i]; if(i>=n) sum-=arr[i-n]; if(i>=n-1) out[i]=sum/n; }
  return out;
}
function candleChart(series, opts){
  opts=opts||{};
  const W=760, H=340, L=8, R=62, T=10, B=26;
  const n=series.dates.length;
  const show=Math.min(opts.bars||250, n);
  const s0=n-show;                                   // first visible index
  const ma50=sma(series.c,50), ma150=sma(series.c,150), ma200=sma(series.c,200);
  let lo=Infinity, hi=-Infinity;
  for(let i=s0;i<n;i++){ lo=Math.min(lo,series.l[i]); hi=Math.max(hi,series.h[i]); }
  [ma50,ma150,ma200].forEach(m=>{ for(let i=s0;i<n;i++) if(m[i]!=null){ lo=Math.min(lo,m[i]); hi=Math.max(hi,m[i]); } });
  const pad=(hi-lo)*0.06||hi*0.01; lo-=pad; hi+=pad;
  const x=i=>L+(i-s0)*(W-L-R)/Math.max(show-1,1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const bw=Math.max(1.2,(W-L-R)/show*0.62);
  const dp = hi<10 ? 4 : (hi<100 ? 3 : 2);

  let bars='';
  for(let i=s0;i<n;i++){
    const up=series.c[i]>=series.o[i];
    const col=up?'var(--delta-good)':'var(--critical)';
    const yo=y(series.o[i]), yc=y(series.c[i]);
    const top=Math.min(yo,yc), h=Math.max(Math.abs(yc-yo),0.8);
    bars+=`<line x1="${x(i).toFixed(1)}" y1="${y(series.h[i]).toFixed(1)}" x2="${x(i).toFixed(1)}" y2="${y(series.l[i]).toFixed(1)}" stroke="${col}" stroke-width="1"/>`
        + `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}"/>`;
  }
  const path=(m,col,w)=>{
    let d='',started=false;
    for(let i=s0;i<n;i++){ if(m[i]==null) continue; d+=(started?'L':'M')+x(i).toFixed(1)+','+y(m[i]).toFixed(1); started=true; }
    return d?`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round"/>`:'';
  };
  // gridlines + right-hand price axis
  let grid='',ticks=5;
  for(let t=0;t<=ticks;t++){
    const v=lo+(hi-lo)*t/ticks, yy=y(v);
    grid+=`<line class="grid" x1="${L}" y1="${yy.toFixed(1)}" x2="${W-R}" y2="${yy.toFixed(1)}"/>`
        + `<text x="${W-R+5}" y="${(yy+3).toFixed(1)}">${v.toFixed(dp)}</text>`;
  }
  // date labels
  let xlab='';
  for(let k=0;k<=4;k++){
    const i=Math.round(s0+(n-1-s0)*k/4);
    const d=series.dates[i];
    xlab+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="${k===0?'start':(k===4?'end':'middle')}">${d.slice(2,7)}</text>`;
  }
  const last=series.c[n-1], first=series.c[s0];
  const chg=(last/first-1)*100;
  return {
    svg:`<svg ${svgEl(W,H)}>${grid}${bars}${path(ma50,'var(--s1)',1.8)}${path(ma150,'var(--s4)',1.8)}${path(ma200,'var(--s2)',1.8)}
      <line class="axisline" x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}"/>${xlab}</svg>`,
    last, first, chg, from:series.dates[s0], to:series.dates[n-1],
    ma:{ m50:ma50[n-1], m150:ma150[n-1], m200:ma200[n-1] }, dp
  };
}

/* ================= Air Liquide =================
   One employer, three exposures: the salary, the shares, and the CPF contributions
   the salary generates. Fortress keeps the shares out of every margin calculation —
   they are not pledged to DBS — but counts them in net worth, and says how big the
   single-name bet has become. */
const alDates = ()=> Object.keys(state.al||{}).sort();
function latestAl(){ const k=alDates(); return k.length? state.al[k[k.length-1]] : null; }
function alFx(){ const f=(latest().fxRates||{}).EUR; return f||null; }

function alPosition(){
  const A = latestAl(); if(!A) return null;
  const lines = A.lines||[];
  const sum = f => lines.filter(f).reduce((t,l)=>t+l.qty,0);
  const total = sum(()=>true);
  const price = AL_PRICE_META.last ?? A.priceEur;
  const fx = alFx();
  const byType = ['Performance','ESPP','Ordinary'].map(t=>({ t, qty:sum(l=>l.type===t) })).filter(x=>x.qty);
  const byBonus = [...new Set(lines.map(l=>l.bonusYear))].sort().map(y=>({
    y, isin:(lines.find(l=>l.bonusYear===y)||{}).isin, qty:sum(l=>l.bonusYear===y),
    qualified: y <= new Date().getFullYear() }));
  const blocked = sum(l=>!l.available), available = sum(l=>l.available);
  const vintages = [...new Set(lines.map(l=>l.vintage))].sort();
  const eur = total*price, sgd = fx? eur*fx : null;
  return { asOf:A.asOf, lines, total, price, priceDate:AL_PRICE_META.lastDate, fx, eur, sgd,
           byType, byBonus, blocked, available, vintages,
           blockedEur: blocked*price, oldest:vintages[0], newest:vintages[vintages.length-1],
           statedTotal:A.statedTotal, statedValueEur:A.statedValueEur, statementPrice:A.priceEur,
           statementPriceDate:A.priceDate, source:A.source };
}
/* the statement and the portal disagreed; this says by how much and why */
function alReconcile(){
  const p = alPosition(); if(!p) return null;
  const portalPrice = AL_PORTAL.totalShares ? AL_PORTAL.valuationEur/AL_PORTAL.totalShares : null;
  const dayOf = px => (AL_DAILY.find(d=>Math.abs(d[4]-px)<0.005)||[])[0] || null;
  return {
    countsMatch: p.total === AL_PORTAL.totalShares && p.total === p.statedTotal,
    total:p.total, stated:p.statedTotal, portal:AL_PORTAL.totalShares,
    blockedMatch: p.blocked === AL_PORTAL.blocked, blocked:p.blocked, portalBlocked:AL_PORTAL.blocked,
    statementPrice:p.statementPrice, statementPriceDay:dayOf(p.statementPrice),
    portalPrice, portalPriceDay: portalPrice!=null? dayOf(+portalPrice.toFixed(2)) : null,
    gapEur: AL_PORTAL.valuationEur - p.statedValueEur
  };
}
/* price behaviour, straight off the series — no smoothing, no interpretation */
function alPriceStats(){
  const d = AL_DAILY; if(!d||d.length<2) return null;
  const last = d[d.length-1][4];
  const hi = Math.max(...d.map(x=>x[2])), lo = Math.min(...d.map(x=>x[3]));
  const hiRow = d.find(x=>x[2]===hi), loRow = d.find(x=>x[3]===lo);
  const m = AL_MONTHLY;
  const at = iso => { const r = m.filter(x=>x[0]<=iso).slice(-1)[0]; return r? r[1] : null; };
  const back = yrs => { const y=(+AL_PRICE_META.lastDate.slice(0,4))-yrs;
    return at(y+AL_PRICE_META.lastDate.slice(4)); };
  const perf = yrs => { const p0=back(yrs); return p0? { yrs, from:p0, pct:(last/p0-1)*100, cagr:(Math.pow(last/p0,1/yrs)-1)*100 } : null; };
  return { last, hi, lo, hiDate:hiRow&&hiRow[0], loDate:loRow&&loRow[0],
           offHigh:(last/hi-1)*100, offLow:(last/lo-1)*100,
           windows:[1,3,5,10,15].map(perf).filter(Boolean),
           firstDay:d[0][0], lastDay:d[d.length-1][0] };
}
/* what the performance-share plans delivered, and when */
function alVesting(){
  if(!AL_VESTING.length) return null;
  const rows = AL_VESTING.slice().sort((a,b)=>a.vested.localeCompare(b.vested));
  const qty = rows.reduce((a,r)=>a+r.qty,0), gain = rows.reduce((a,r)=>a+r.gain,0);
  const lags = rows.map(r=>+r.vested.slice(0,4) - +r.plan.slice(6,10));
  return { rows, qty, gain, first:rows[0], last:rows[rows.length-1],
           lagYears:[...new Set(lags)], atToday: qty*AL_PRICE_META.last };
}
/* The June 2026 attribution is visible in his own line counts. Two tranches vested in
   2024 and 2025, neither old enough for the loyalty bonus, and both land exactly on the
   plain 1-for-10 rounded down — which is how the entitlement is settled. Nothing here is
   asserted from the rulebook; it is arithmetic on two numbers he already had. */
function alAttributionProof(){
  const p = alPosition(), V = alVesting();
  if(!p || !V) return null;
  const out = [];
  V.rows.forEach(r=>{
    const vy = +r.vested.slice(0,4);
    const held = p.lines.filter(l=>l.type==='Performance' && l.vintage===vy).reduce((a,l)=>a+l.qty,0);
    if(!held) return;
    const plain = Math.floor(r.qty*1.10), loyal = Math.floor(r.qty*1.11);
    out.push({ vestedYear:vy, vested:r.qty, held, plain, loyal,
               fits: held===plain ? 'plain' : (held===loyal ? 'loyalty' : null),
               qualifiedThen: vy <= (+AL_PRICE_META.attribution.date.slice(0,4)) - 3 });
  });
  // Only tranches through exactly one attribution can be checked in a single step. Older
  // lines have seen several, and may have been sold into as well, so their counts carry no
  // clean signal — they are dropped rather than reported as anomalies.
  return { checkable: out.filter(o=>o.fits), skipped: out.filter(o=>!o.fits) };
}

/* the dividend record, and what it is running at now */
function alDividends(){
  if(!AL_DIVIDENDS.length) return null;
  const rows = AL_DIVIDENDS.slice().sort((a,b)=>b.year-a.year).map(d=>{
    const gross = d.baseGross + d.loyaltyGross, net = d.baseNet + d.loyaltyNet;
    return { ...d, gross, net, withheldPct:(1-net/gross)*100,
             loyaltyPctOfBase: d.baseUnit? d.loyaltyUnit/d.baseUnit*100 : null,
             qualifiedPct: d.baseCoupons? d.loyaltyCoupons/d.baseCoupons*100 : null };
  });
  const last = rows[0], first = rows[rows.length-1];
  const yrs = rows.length - 1;
  const p = alPosition();

  /* Withholding is not one constant across the whole record. Group the years by the
     rate actually applied (to 2 dp) and report the regimes, rather than averaging
     two different rates into a number that was never charged. */
  const regimes = [];
  rows.slice().reverse().forEach(r=>{
    const k = Math.round(r.withheldPct);           // group on the headline rate...
    const cur = regimes[regimes.length-1];
    if(cur && cur.key===k){ cur.to = r.year; cur.years.push(r); }
    else regimes.push({ key:k, from:r.year, to:r.year, years:[r] });
  });
  regimes.forEach(g=>{                             // ...but report what was ACTUALLY charged
    const p = g.years.map(r=>r.withheldPct);
    g.lo = Math.min(...p); g.hi = Math.max(...p);
    g.mean = p.reduce((a,x)=>a+x,0)/p.length;
    g.exact = (g.hi-g.lo) < 0.01;                  // every year in the run charged the same rate?
    g.pct = g.exact ? g.mean : null;
    g.gross = g.years.reduce((a,r)=>a+r.gross,0);
    g.withheld = g.years.reduce((a,r)=>a+r.gross-r.net,0);
    g.label = g.exact ? fmt(g.mean,2)+'%' : fmt(g.lo,2)+'\u2013'+fmt(g.hi,2)+'%';
    g.span = g.from===g.to ? String(g.from) : g.from+'\u2013'+g.to;
  });
  regimes.reverse();                               // newest regime first
  const rateChanged = regimes.length > 1;
  const prevRegime = rateChanged ? regimes[1] : null;
  /* the step against the regime immediately before it, on the years actually charged */
  const stepPp = rateChanged ? regimes[0].mean - prevRegime.mean : null;
  const stepCost = rateChanged ? regimes[0].gross * stepPp/100 : null;
  /* the single worst run, measured against the cheapest rate ever applied to him */
  const bestPct = Math.min(...regimes.map(g=>g.mean));
  const worst = regimes.slice().sort((a,b)=>(b.mean-bestPct)*b.gross-(a.mean-bestPct)*a.gross)[0];
  const worstExcess = worst ? worst.gross*(worst.mean-bestPct)/100 : null;
  const worstIsCurrent = worst === regimes[0];
  const blendedPct = (rows.reduce((a,r)=>a+r.gross-r.net,0)/rows.reduce((a,r)=>a+r.gross,0))*100;
  /* years whose effective rate does not land on a round figure */
  /* A year is "odd" when it does not match the headline rate of its OWN run - an internal
     inconsistency in the deduction, not a deviation from some rate we assume it should be. */
  const odd = [];
  regimes.forEach(g=>g.years.forEach(r=>{
    if(Math.abs(r.withheldPct-g.hi) > 0.01)
      odd.push({ year:r.year, pct:r.withheldPct, headline:g.hi, span:g.span,
                 shortfall:(g.hi-r.withheldPct)/100*r.gross });
  }));

  /* Coupon counts are NOT monotonic - a fall means shares left registered form. */
  const asc = rows.slice().reverse();
  const drops = asc.map((r,i)=> i? { year:r.year, delta:r.baseCoupons-asc[i-1].baseCoupons,
                                     loyaltyDelta:r.loyaltyCoupons-asc[i-1].loyaltyCoupons } : null)
                   .filter(d=>d && d.delta<0);

  /* the loyalty unit is the base truncated to the cent, not rounded - 10/10 years agree */
  const truncAll = rows.every(r=> Math.floor(r.baseUnit*10)/100 === r.loyaltyUnit);
  const roundAll = rows.every(r=> Math.round(r.baseUnit*10)/100 === r.loyaltyUnit);
  // the run-rate is today's share count at the LAST DECLARED rate — next year's is not announced
  const runBase = p ? p.total * last.baseUnit : null;
  const runLoyal = p ? p.byBonus.filter(b=>b.qualified).reduce((a,b)=>a+b.qty,0) * last.loyaltyUnit : null;
  const runGross = runBase!=null ? runBase + runLoyal : null;
  const withheld = last.withheldPct/100;
  const onClock = p ? p.byBonus.filter(b=>!b.qualified).reduce((a,b)=>a+b.qty,0) : 0;
  return { rows, last, first, yrs,
    totalGross: rows.reduce((a,r)=>a+r.gross,0), totalNet: rows.reduce((a,r)=>a+r.net,0),
    loyaltyTotalGross: rows.reduce((a,r)=>a+r.loyaltyGross,0),
    netCagr: yrs>0 ? (Math.pow(last.net/first.net, 1/yrs)-1)*100 : null,
    dpsChangePct: (last.baseUnit/first.baseUnit-1)*100,
    couponChangePct: (last.baseCoupons/first.baseCoupons-1)*100,
    runBase, runLoyal, runGross, runNet: runGross!=null? runGross*(1-withheld) : null,
    runNetSgd: (runGross!=null && p && p.fx) ? runGross*(1-withheld)*p.fx : null,
    onClock, onClockValue: onClock * last.loyaltyUnit,
    regimes, rateChanged, prevRegime, worstIsCurrent, stepPp, stepCost, bestPct, worst, worstExcess, blendedPct, odd, drops, truncAll, roundAll,
    totalWithheld: rows.reduce((a,r)=>a+r.gross-r.net,0),
    yieldGross: p ? last.baseUnit/p.price*100 : null,
    yieldWithLoyalty: p ? (last.baseUnit+last.loyaltyUnit)/p.price*100 : null };
}

/* Cost basis per tranche, and the cross-check against the vesting record.
   Every figure below is derived from the portal's own numbers - nothing is assumed. */
function alBasis(){
  if(!AL_BASIS.length) return null;
  const p = alPosition(), px = p ? p.price : null;
  const V = (typeof AL_VESTING!=='undefined') ? AL_VESTING : [];
  const snapLines = (()=>{ const k=Object.keys(AL_SEED).sort().pop();
    return k ? (AL_SEED[k].lines||[]).filter(l=>l.type==='Performance') : []; })();

  const rows = AL_BASIS.map(b=>{
    const cost = b.qty * b.adjPrice;
    /* tie to the vesting History by attribution date, where one has been loaded */
    const plan = (b.source.match(/(\d{2}\/\d{2}\/\d{4})/)||[])[1] || null;
    const v = plan ? V.find(x=>x.plan.indexOf(plan)===0) : null;
    /* if nothing left the tranche, quantity x adjusted price must still equal the original outlay,
       so the count we SHOULD see today is the original outlay divided by the adjusted price */
    const expectedQty = v ? v.qty*v.price/b.adjPrice : null;
    const shortQty = expectedQty!=null ? expectedQty - b.qty : null;
    const short = shortQty!=null && Math.abs(shortQty) > 2;
    /* tie to the portfolio holding, read from a different document */
    const held = snapLines.find(l=>l.vintage === +b.grant.slice(0,4) && l.qty === b.qty) || null;
    return { ...b, cost, plan, vest:v, expectedQty, shortQty, short,
      shortBasis: short ? shortQty*b.adjPrice : null,
      shortOriginal: (short && v) ? shortQty*b.adjPrice/v.price : null,
      origCost: v ? v.qty*v.price : null,
      costGap: v ? cost - v.qty*v.price : null,
      costGapPct: v ? (cost - v.qty*v.price)/(v.qty*v.price)*100 : null,
      qtyRatio: v ? b.qty/v.qty : null,
      priceRatio: v ? v.price/b.adjPrice : null,
      addsUp: Math.abs(cost + b.unrealised - b.valuation) < 0.005,
      atQuote: px!=null && Math.abs(b.qty*px - b.valuation) < 0.005,
      inPortfolio: !!held,
      gainPct: cost ? b.unrealised/cost*100 : null,
      multiple: cost ? b.valuation/cost : null };
  });

  const qty  = rows.reduce((a,r)=>a+r.qty,0);
  const cost = rows.reduce((a,r)=>a+r.cost,0);
  const val  = rows.reduce((a,r)=>a+r.valuation,0);
  const gain = rows.reduce((a,r)=>a+r.unrealised,0);
  const ties  = rows.filter(r=>r.vest);
  const clean = ties.filter(r=>!r.short);
  const shortRows = rows.filter(r=>r.short);
  const portfolioQty = snapLines.reduce((a,l)=>a+l.qty,0);

  return { rows, qty, cost, val, gain, ties, clean, shortRows, price:px,
    allAddUp:  rows.every(r=>r.addsUp),
    allAtQuote:rows.every(r=>r.atQuote),
    allHeld:   rows.every(r=>r.inPortfolio),
    portfolioQty, portfolioMatches: portfolioQty === qty && snapLines.length === rows.length,
    gainPct: cost ? gain/cost*100 : null,
    perShare: qty ? cost/qty : null,
    pctOfHolding: (p && p.total) ? qty/p.total*100 : null,
    byBonus: [ { label:'qualifying now', qty: rows.filter(r=>!r.bonusYear).reduce((a,r)=>a+r.qty,0) } ]
      .concat([...new Set(rows.filter(r=>r.bonusYear).map(r=>r.bonusYear))].sort()
        .map(y=>({ label:'from '+y, qty: rows.filter(r=>r.bonusYear===y).reduce((a,r)=>a+r.qty,0) }))) };
}

/* ---- currency exposure at TWO levels -------------------------------------
   Margin level: only what DBS holds as collateral can answer a margin call, so only
   that belongs in the LTV and buffer maths. The Air Liquide shares are registered with
   the company, not pledged - they raise no lending value and are deliberately excluded.
   Wealth level: a euro move hits them all the same, pledged or not. Fortress reports
   both and never mixes them, because confusing the two is how a currency risk gets
   either ignored or double-counted. */
function fxExposure(){
  const a = agg(latest());
  const pledged = { ...(a.pledgedCcy||{}) };
  const p = (typeof alPosition==='function') ? alPosition() : null;
  const alSgd = (p && p.sgd!=null) ? p.sgd : 0;
  const alCcy = p ? AL_META.ccy : null;                      // EUR, from the holding itself
  const w = netWorth(a);
  const wealthBase = w.dbsUob + (state.settings.homeValue||0) + (w.cpf||0) + alSgd;

  /* Build wealth-by-currency so the parts actually sum to net worth. Foreign currencies
     are carried at their asset value; SGD absorbs everything else - the house, CPF, UOB
     cash - less every liability, since every liability is SGD. */
  /* Currency must come from ALL portfolios, not just the pledged one. Using pledgedCcy
     alone swept the unpledged portfolio's foreign holdings into the SGD residual - the
     exact misattribution this function exists to prevent. */
  const allCcy = {};
  (latest().portfolios||[]).forEach(pf=>Object.entries(pf.ccyAlloc||{}).forEach(([c,v])=>{
    allCcy[c] = (allCcy[c]||0) + v; }));
  const wealth = {};
  Object.keys(allCcy).filter(c=>c!=='SGD').forEach(c=>{ wealth[c] = allCcy[c]; });
  if(alCcy && alSgd) wealth[alCcy] = (wealth[alCcy]||0) + alSgd;
  const nonSgdTotal = Object.keys(wealth).reduce((t,c)=>t+wealth[c],0);
  wealth.SGD = wealthBase - nonSgdTotal;      // the residual, by construction

  const rows = Object.keys(wealth).sort((x,y)=>wealth[y]-wealth[x]).map(c=>({
    ccy:c,
    pledged: pledged[c]||0,
    unpledged: (wealth[c]||0) - (pledged[c]||0),
    allPortfolios: allCcy[c]||0,
    total: wealth[c]||0,
    pctOfCollateral: a.pledgedAssets ? (pledged[c]||0)/a.pledgedAssets*100 : null,
    pctOfWealth: wealthBase ? (wealth[c]||0)/wealthBase*100 : null,
    marginRelevant: (pledged[c]||0) > 0
  }));
  const eur = rows.find(r=>r.ccy===alCcy) || null;
  const nonSgdWealth = nonSgdTotal;
  const sumsToBase = Math.abs(rows.reduce((t,r)=>t+r.total,0) - wealthBase) < 0.01;
  return { rows, eur, alSgd, alCcy, wealthBase, pledgedAssets:a.pledgedAssets,
    nonSgdWealth, sumsToBase, sgdWealth: wealth.SGD, nonSgdWealthPct: wealthBase ? nonSgdWealth/wealthBase*100 : null,
    /* how much bigger the wealth exposure is than the collateral exposure, for that currency */
    eurMultiple: (eur && eur.pledged) ? eur.total/eur.pledged : null,
    /* a move of x% in the currency, in SGD, at each level */
    move: (c,pctMove) => { const r = rows.find(x=>x.ccy===c); if(!r) return null;
      return { onCollateral: r.pledged*pctMove/100, onWealth: r.total*pctMove/100 }; } };
}

/* ---- should the shares move to DBS? ------------------------------------------
   Registered ("nominatif") shares earn +10% on dividends AND +10% on free-share
   attributions. Bearer shares earn neither. A transfer into a broker's custody
   normally converts them to bearer, so the whole decision is a recurring, permanent
   income loss weighed against collateral capacity. Every figure here is computed
   from his own holding; the two things Fortress cannot know - DBS's advance ratio
   and whether DBS can hold registered form - are shown as open questions, not filled in. */
const AL_TRANSFER = {
  bonusPct:10,
  qualifyYears:'more than two full calendar years (1 January to 31 December), and you must still hold the shares the day before the dividend is paid or the free shares are attributed',
  bearerRule:'Bearer shares do not qualify for the loyalty bonus at all.',
  forms:'Air Liquide recognises two registered forms that both earn the bonus: nominatif pur, held directly with Air Liquide, and nominatif administr\u00e9, registered in your name at Air Liquide but administered by your own financial institution.',
  attributionRatio:10,          // 1 free share for every 10 held
  attributionEveryYears:2,      // AL states 10 attributions in the last 20 years
  horizonNote:'modelled with NO growth in the share price or the dividend - a deliberate floor, not a forecast',
  source:'Air Liquide \u2014 "Loyalty bonus": +10% on the amount of dividends received and +10% in free shares, for shares held in registered form for more than two full calendar years; bearer shares do not qualify',
  sourceFiche:'Air Liquide \u2014 Fiche pratique "Prime de fid\u00e9lit\u00e9": plus de deux ann\u00e9es civiles pleines, and you must be the holder the day before payment or attribution',
  unknowns:[
    'Whether DBS can hold Air Liquide shares in nominatif administr\u00e9, with you named in the French register. Air Liquide\u2019s own documents do not say, and Fortress will not assume. If DBS can, you could consolidate custody AND keep the bonus.',
    'Whether DBS would instead take a pledge (nantissement) over shares that stay in nominatif pur \u2014 collateral without a transfer of custody. That is the outcome worth chasing.',
    'What advance ratio DBS would apply to a single-name Euronext Paris large cap. The range below is a sensitivity, not a DBS quote.',
    'Whether a transfer to nominatif administr\u00e9 preserves your existing two-year clock or restarts it \u2014 a question for Air Liquide.',
    'The tax treatment of a custody transfer or a later disposal, in France or Singapore. Fortress holds no tax rules for you and states none.',
    'Whether your performance shares carry transfer restrictions beyond the ESPP lock-ups.'
  ]
};

function alTransferDecision(){
  const p = alPosition(); if(!p) return null;
  const D = (typeof alDividends==='function') ? alDividends() : null;
  const T = AL_TRANSFER;
  const price = p.price, fx = p.fx;
  const sgd = e => (fx!=null && e!=null) ? e*fx : null;

  /* --- what registration is worth, per year --- */
  const loyUnit = D ? D.last.loyaltyUnit : null;      // the declared loyalty rate, not a guess
  const baseUnit = D ? D.last.baseUnit : null;
  const wht = D ? D.last.withheldPct/100 : null;
  const qualNow = p.byBonus.filter(b=>b.qualified).reduce((a,b)=>a+b.qty,0);

  const divGrossAll = loyUnit!=null ? p.total*loyUnit : null;         // once every share qualifies
  const divNetAll   = divGrossAll!=null ? divGrossAll*(1-wht) : null;
  const divGrossNow = loyUnit!=null ? qualNow*loyUnit : null;
  const divNetNow   = divGrossNow!=null ? divGrossNow*(1-wht) : null;

  /* free shares: the bonus is +10% on the NUMBER of free shares attributed */
  const plainFree = Math.floor(p.total/T.attributionRatio);
  const bonusFree = Math.floor(p.total/T.attributionRatio*(1+T.bonusPct/100));
  const extraFree = bonusFree - plainFree;
  const extraFreeEur = extraFree*price;
  const freePerYear = extraFreeEur/T.attributionEveryYears;

  const annualEur = (divNetAll||0) + freePerYear;
  const annualSgd = sgd(annualEur);
  const pctOfPosition = p.sgd ? annualSgd/p.sgd*100 : null;

  /* --- the floor case: no growth at all, to age 65 --- */
  const A = cpfAge();
  const years = A ? Math.max(1, A.year65 - new Date().getFullYear()) : 12;
  const run = loyal => { let sh=p.total, cash=0;
    for(let y=1;y<=years;y++){
      cash += sh*(baseUnit + (loyal?loyUnit:0))*(1-wht);
      if(y%T.attributionEveryYears===0)
        sh += loyal ? Math.floor(sh/T.attributionRatio*(1+T.bonusPct/100))
                    : Math.floor(sh/T.attributionRatio);
    }
    return { sh, cash, total: sh*price + cash }; };
  const stay = (baseUnit!=null) ? run(true) : null;
  const move = (baseUnit!=null) ? run(false) : null;
  const gapEur = (stay&&move) ? stay.total - move.total : null;

  /* --- what DBS would give: capacity he mostly already has --- */
  const mr = latestMrtl(), cap = mrtlCapacity(mr);
  const undrawnAsset = (cap&&mr&&mr.amountDrawn!=null) ? cap.capacity - mr.amountDrawn : null;
  const undrawnStated = mr ? mr.availableForDrawdown : null;
  const util = (cap&&mr&&mr.amountDrawn!=null) ? mr.amountDrawn/cap.capacity*100 : null;
  const blendedLv = (cap && (typeof agg==='function')) ? cap.capacity/agg(latest()).pledgedAssets*100 : null;
  const lvRange = [40,50,60,70].map(lv=>({ lv, adds: p.sgd!=null ? p.sgd*lv/100 : null }));

  const C = (typeof alConcentration==='function') ? alConcentration() : null;
  return { p, D, T, price, fx, qualNow, onClock: p.total - qualNow,
    divGrossAll, divNetAll, divNetAllSgd: sgd(divNetAll), divNetNow, divNetNowSgd: sgd(divNetNow),
    plainFree, bonusFree, extraFree, extraFreeEur, extraFreeSgd: sgd(extraFreeEur),
    freePerYear, freePerYearSgd: sgd(freePerYear),
    annualEur, annualSgd, pctOfPosition,
    years, stay, move, gapEur, gapSgd: sgd(gapEur),
    undrawnAsset, undrawnStated, util, blendedLv, lvRange,
    blocked: p.blocked, concentration: C ? C.pctOfNet : null,
    verdict: (annualSgd!=null && undrawnAsset!=null && undrawnAsset>0) ? 'stay' : 'unknown' };
}

/* what the home is worth, and how confident anyone should be about it */
function propertyValue(){
  const H = state.settings.homeVal || null;
  const v = state.settings.homeValue;
  if(v==null) return null;
  const isTxn = (H&&H.basis)==='lastTransaction';
  const sqft = H ? H.sqft : null;
  const psf = x => (sqft && x!=null) ? x/sqft : null;
  const comps = (H && H.comps ? H.comps : []).map(c=>({ ...c, psf:c.price/c.sqft,
    sameSize: sqft!=null && c.sqft===sqft }));
  const sameSize = comps.filter(c=>c.sameSize);
  const allPsf = comps.map(c=>c.psf);
  const meanPsf = allPsf.length ? allPsf.reduce((a,b)=>a+b,0)/allPsf.length : null;
  const newest = comps.length ? comps.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;
  const newestSame = sameSize.length ? sameSize.slice().sort((a,b)=>b.date.localeCompare(a.date))[0] : null;

  const a = agg(latest()), w = netWorth(a);
  const nwAt = hv => w.dbsUob + hv + (w.cpf||0) + (w.al||0);
  const mm = latestManual(), mortgage = mm ? (mm.mortgageBalance||0) : 0;
  const claim = (typeof cpfHomeClaim==='function' && cpfHomeClaim()) ? cpfHomeClaim().claim : 0;

  /* how old the reference trade is, and what the portal thinks instead */
  const monthsSince = (H&&H.valueDate) ? (()=>{ const [y,m]=H.valueDate.split('-').map(Number);
      const now=new Date(); return (now.getFullYear()-y)*12 + (now.getMonth()+1-m); })() : null;
  const avm = (H&&H.avm) ? { ...H.avm, psf:psf(H.avm.value),
      vsRef:(H.avm.value/v-1)*100, nw:nwAt(H.avm.value),
      lowNw:nwAt(H.avm.low), highNw:nwAt(H.avm.high),
      swing:nwAt(H.avm.high)-nwAt(H.avm.low) } : null;
  /* the spread the evidence itself shows - derived, not invented */
  const evid = allPsf.length ? { loPsf:Math.min(...allPsf), hiPsf:Math.max(...allPsf),
      lo:Math.min(...allPsf)*sqft, hi:Math.max(...allPsf)*sqft } : null;

  const band = (H && H.low!=null && H.high!=null) ? { low:H.low, high:H.high,
    width:H.high-H.low, widthPct:(H.high-H.low)/v*100,
    lowPct:(H.low/v-1)*100, highPct:(H.high/v-1)*100,
    nwLow:nwAt(H.low), nwHigh:nwAt(H.high), nwSwing:nwAt(H.high)-nwAt(H.low) } : null;

  return { ...(H||{}), value:v, sqft, psf:psf(v), lowPsf:psf(H&&H.low), highPsf:psf(H&&H.high),
    isTxn, monthsSince, avm, evid,
    comps, sameSize, meanPsf, newest, newestSame,
    vsNewestSame: newestSame ? (psf(v)/newestSame.psf-1)*100 : null,
    abovePsf: allPsf.filter(x=>psf(v)>x).length, belowPsf: allPsf.filter(x=>psf(v)<x).length,
    band, netWorth:nwAt(v), pctOfNet: nwAt(v)? v/nwAt(v)*100 : null,
    nwAt,
    equity: v - mortgage, mortgage, claim,
    afterAll: v - mortgage - claim,
    isAvm: (H&&H.basis)==='avm' };
}

/* how much of everything is now one company */
function alConcentration(){
  const p = alPosition(); if(!p||p.sgd==null) return null;
  const a = agg(latest()), w = netWorth(a);
  const base = w.dbsUob + (state.settings.homeValue||0) + (w.cpf||0);
  const total = base + p.sgd;
  return { sgd:p.sgd, base, total, pctOfNet: p.sgd/total*100,
           pctOfLiquid: p.sgd/(a.assets + p.sgd)*100,
           dbsUsdPct: (()=>{ const t=Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
             return t? t[1]/a.pledgedAssets*100 : null; })() };
}

/* ================= retirement engine =================
   Three questions, answered from CK's own balances and the rules above:
   what happens at each age, what the age-55 choice is actually worth, and which
   levers are open to him TODAY. Every eligibility test is recomputed on every
   render, so a scheme that is shut today reopens itself the moment it applies. */

function brsFor(year){
  const B = RETIRE_RULES.brsByYear;
  if(B[year] != null) return { value:B[year], published:true };
  const last = Math.max(...Object.keys(B).map(Number));
  return { value:B[last], published:false, fallbackYear:last };
}

/* The age-55 split, run on his actual OA and SA. This is arithmetic on published
   rules, not a projection: given a balance and an FRS, the allocation is determined. */
function age55Split(oa, sa, frs){
  const min = RETIRE_RULES.minWithdraw;
  const combined = oa + sa;
  /* If OA and SA together fall short of the FRS, CPF still leaves up to $5,000 in the
     Ordinary Account rather than sweeping every cent into the Retirement Account. The
     $5,000 is HELD BACK from the transfer - it is not taken out of an OA that may
     already be empty, which is the trap this used to fall into. */
  const target = combined < frs ? Math.max(0, combined - min) : frs;
  let ra = 0, remSa = sa, remOa = oa;
  const fromSa = Math.min(remSa, target);         // Special Account goes first
  ra += fromSa; remSa -= fromSa;
  const fromOa = Math.min(remOa, target - ra);    // then the Ordinary Account
  ra += fromOa; remOa -= fromOa;
  const oaAfter = remOa + remSa;                  // whatever is left of the SA joins the OA
  return { ra, fromSa, fromOa, oaAfter, target,
           shortOfFrs: combined < frs,
           withdrawable: oaAfter };               // everything left in the OA is withdrawable
}

function retireAt55(){
  const A = cpfAge(), c = latestCpf(); if(!A || !c) return null;
  const R = RETIRE_RULES;
  const F = frsFor(A.year55), B = brsFor(A.year55);
  const ersRule = B.value * 4;                    // from 2025 the ERS is 4x the BRS
  const oa = c.oa||0, sa = c.sa||0;

  /* (a) what the split would look like on TODAY's balances - no growth assumed */
  const now = age55Split(oa, sa, F.value);

  /* (b) what it looks like on the projection. This READS the shared CPF plan and does
         not build its own: the settings that drive it - the year 55 falls in, and
         whether contributions continue - live on the CPF tab and are obeyed here. */
  const P = (typeof cpfPlan==='function') ? cpfPlan() : null;
  const yrs = Math.max(0, A.year55 - new Date().getFullYear());
  const ev = P ? P.at55 : null;
  const at55 = ev ? { ra:ev.ra, oaAfter:ev.oa, withdrawable: ev.ra >= F.value ? ev.oa
                       : Math.min(ev.oa, R.minWithdraw), shortOfFrs: ev.ra < F.value } : null;

  /* (c) the property-pledge alternative. With a property you may set aside as little as
         the BRS. Since the FRS is exactly twice the BRS, pledging frees precisely
         (FRS - BRS) = one BRS more into the OA - but ONLY if the RA would otherwise
         have reached the full FRS. If it would not, there is less to free. */
  const raFrs = at55 ? at55.ra : now.ra;
  const oaFrs = at55 ? at55.oaAfter : now.oaAfter;
  const freed = Math.max(0, Math.min(F.value, raFrs) - B.value);
  const pledged = { ra: raFrs - freed, oaAfter: oaFrs + freed, withdrawable: oaFrs + freed };
  const extraIfPledged = freed;

  /* (d) the ERS lever: moving OA into the RA swaps the OA rate for the RA rate */
  const ersHeadroom = Math.max(0, ersRule - F.value);
  const ersFundable = Math.min(ersHeadroom, oaFrs);
  const rateGap = (CPF_RULES.raPct - CPF_RULES.oaPct)/100;

  return { A, F, B, ersRule, sumsPublished: B.published && F.published, plan:P,
    oa, sa, now, at55, pledged, freed, extraIfPledged, yrs, rows:(P?P.rows:null), ev,
    raFrs, oaFrs, ersHeadroom, ersFundable, ersYearlyGain: ersFundable * rateGap, rateGap,
    reliefOnErs: 0,                                // relief stops at the FRS - verified
    saAlreadyOverFrs: sa > F.value };
}

/* ---- CPF LIFE payouts, derived ONLY from CPF's published illustration ----------
   Fortress holds exactly one payout dataset: CPF's own worked table for the members
   who turn 65 in 2035, on the Standard Plan. It interpolates BETWEEN those published
   points and says so; above the top point it extrapolates and says THAT, loudly.
   It never invents a rate, and it never presents the result as CPF's own figure for
   CK, because his cohort's table has not been published. */
function cpfLifeEstimate(amount){
  const P = RETIRE_RULES.payoutTable, T = P.rows;
  if(amount==null || !(amount>0)) return null;
  const mk = (lo,hi,basis,how) => ({ amount, lo, hi, basis, how,
    perLakhLo: lo/amount*100000, perLakhHi: hi/amount*100000,
    interpolated: how==='interpolated', extrapolated: how==='extrapolated',
    plan:P.plan, cohort55:P.cohort55, cohort65:P.cohort65 });
  if(amount <= T[0].set){
    const f = amount/T[0].set;
    return mk(T[0].lo*f, T[0].hi*f, `scaled down from the lowest published point (${fmt(T[0].set,0)})`, 'extrapolated');
  }
  for(let i=1;i<T.length;i++){
    if(amount <= T[i].set){
      const a=T[i-1], b=T[i], f=(amount-a.set)/(b.set-a.set);
      return mk(a.lo+f*(b.lo-a.lo), a.hi+f*(b.hi-a.hi),
        `between CPF's published ${fmt(a.set,0)} and ${fmt(b.set,0)} points`, 'interpolated');
    }
  }
  const a=T[T.length-2], b=T[T.length-1], f=(amount-a.set)/(b.set-a.set);
  return mk(a.lo+f*(b.lo-a.lo), a.hi+f*(b.hi-a.hi),
    `ABOVE CPF's highest published point (${fmt(b.set,0)})`, 'extrapolated');
}

/* ---- what an untouched balance earns, at the published rates ----------------------
   Every balance the Retire tab shows is money that keeps earning if it is left alone.
   This states the rate, the yearly interest, and - where it applies - the extra
   interest tiers, so "withdrawable" is never quoted without its opportunity cost. */
function cpfEarns(amount, account, age){
  if(amount==null) return null;
  const R = CPF_RULES;
  const rate = account==='OA' ? R.oaPct : R.saPct;   // SA, MA and RA all pay the same floor
  const base = amount * rate/100;
  /* extra interest is on COMBINED balances, so it is shown as the tier structure
     rather than silently added to one account's number */
  const from55 = age!=null && age>=55;
  const tiers = from55 ? R.extraFrom55.tiers : [{pct:R.extraBelow55.pct, upTo:R.extraBelow55.onFirst}];
  return { amount, account, rate, base, monthly:base/12,
    over10: amount*Math.pow(1+rate/100,10) - amount,
    doubles: Math.log(2)/Math.log(1+rate/100),
    from55, tiers,
    extraNote: from55
      ? `plus ${pct(R.extraFrom55.tiers[0].pct,0)} on the first ${money(R.extraFrom55.tiers[0].upTo,0)} of combined balances and ${pct(R.extraFrom55.tiers[1].pct,0)} on the next ${money(R.extraFrom55.tiers[1].upTo-R.extraFrom55.tiers[0].upTo,0)}, at most ${money(R.extraFrom55.oaCap,0)} of it from the OA`
      : `plus ${pct(R.extraBelow55.pct,0)} on the first ${money(R.extraBelow55.onFirst,0)} of combined balances, at most ${money(R.extraBelow55.oaCap,0)} of it from the OA`,
    source: R.ratesSource };
}

/* ---- SRS, and the two days that mattered ---------------------------------------- */
function srsPosition(){
  const S = state.settings.srs || SRS_SEED; if(!S || !S.firstContribution) return null;
  const R = RETIRE_RULES, A = cpfAge();
  /* the withdrawal age is the statutory retirement age in force ON THE DAY of the
     first contribution - so the date is looked up against the history, not assumed */
  const era = R.retirementAgeHistory.find(h =>
    S.firstContribution >= h.from && (h.to===null || S.firstContribution <= h.to));
  const lockedAge = era ? era.age : null;
  const current = R.retirementAgeHistory[R.retirementAgeHistory.length-1].age;
  const beat = lockedAge!=null && lockedAge < current;
  const nextEra = beat ? R.retirementAgeHistory.find(h=>h.age===current) : null;
  const daysSpare = (beat && nextEra) ? Math.round(
      (new Date(nextEra.from) - new Date(S.firstContribution)) / 86400000) : null;

  const withdrawFrom = (A && lockedAge!=null)
    ? (+A.birthDate.slice(0,4)+lockedAge)+A.birthDate.slice(4) : null;
  const headroom = (S.yearCap!=null && S.usedThisYear!=null) ? S.yearCap - S.usedThisYear : null;

  return { ...S, era, lockedAge, currentAge:current, beat, daysSpare, nextEraFrom: nextEra?nextEra.from:null,
    withdrawFrom, withdrawYear: withdrawFrom? +withdrawFrom.slice(0,4) : null,
    daysToWithdraw: withdrawFrom? daysUntil(withdrawFrom) : null,
    headroom, uninvested: (S.cashBalance||0) - 0,
    /* The window is NOT a fixed calendar deadline. It starts on the first withdrawal at
       or after the locked age, so the only date Fortress can state is the EARLIEST one
       - the case where he draws on the first day he is allowed to. */
    earliestWindowStart: withdrawFrom,
    earliestWindowEnd: withdrawFrom ? (+withdrawFrom.slice(0,4)+R.srs.window)+withdrawFrom.slice(4) : null,
    windowIsConditional: true };
}

/* Which levers are actually open. Each returns open/closed with the TEST that decided it,
   so a "no" is auditable rather than an opinion. */
function retireLevers(){
  const R = RETIRE_RULES, c = latestCpf(), A = cpfAge();
  const out = [];
  const total = c ? cpfTotal(c) : null;
  const oaSa = c ? (c.oa||0)+(c.sa||0) : null;
  const F = A ? frsFor(A.year55) : null;

  const push = (id,name,open,test,detail,action,source,unknown) =>
    out.push({ id, name, open, unknown:!!unknown, test, detail, action, source });

  /* 1. cash top-up to his own SA — already known closed, restated here in one place */
  if(c && F){
    const room = CPF_RULES.frs - (c.sa||0);
    push('sa-topup','Cash top-up to your own CPF', room>0,
      `cap is the prevailing FRS (${money(CPF_RULES.frs,0)}) less your SA (${money(c.sa,0)}) = ${money(room,0)}`,
      room>0 ? `There is ${money(room,0)} of room, and up to ${money(R.reliefSelf,0)} of tax relief a year.`
             : `Your Special Account is already above the Full Retirement Sum, so the room is ${money(room,0)}. The standard advice to "top up your SA for the 4% and the tax relief" does not apply to you, and will not until the FRS overtakes your SA.`,
      room>0?'Top up early in the year so it earns interest for the full year.':'Nothing to do. This test re-runs on every render.',
      CPF_RULES.frsSource);
  }
  /* 2. top-ups for other people — the one relief route still open */
  push('loved-ones','Cash top-up for a parent, spouse or sibling', true,
    'a separate allowance from your own, with its own relief cap',
    `Your own route is shut but this one is not: up to ${money(R.reliefLovedOnes,0)} of relief a year for top-ups to someone else's CPF, subject to their own FRS cap. Whether it is worth doing depends on who you would top up and your marginal tax rate — neither of which Fortress knows.`,
    'Worth pricing against your tax bracket before year end.',
    R.reliefSource);
  /* 3. voluntary MediSave contribution */
  if(c){ const room = CPF_RULES.bhs - (c.ma||0);
    push('ma-vc','Voluntary MediSave contribution', room>0.005,
      `${CPF_RULES.bhsYear} BHS (${money(CPF_RULES.bhs,0)}) less your MediSave (${money(c.ma,0)}) = ${money(room,0)}`,
      room>0.005 ? `${money(room,0)} still fits, at ${pct(CPF_RULES.maPct,1)}.`
                 : `MediSave is exactly at the ${CPF_RULES.bhsYear} Basic Healthcare Sum. Nothing more fits until the BHS rises in January — it went ${money(CPF_RULES.prevBhs,0)} to ${money(CPF_RULES.bhs,0)} this year.`,
      room>0.005?'Contribute before year end for the relief.':'Re-check each January when the BHS is raised.',
      CPF_RULES.bhsSource);
  }
  /* 4. MRSS — testable on his own balances */
  if(c){ const m = R.mrss;
    const savingsFail = oaSa >= m.savingsBelow;
    const ageFail = A ? A.age < m.fromAge : false;
    push('mrss', m.name, false,
      `needs OA+SA below ${money(m.savingsBelow,0)}; yours is ${money(oaSa,0)}${ageFail?`, and it starts at ${m.fromAge} unless MSF has verified a disability`:''}`,
      `Closed on the savings test alone — you are ${money(oaSa-m.savingsBelow,0)} above the ceiling${ageFail?`, and you do not reach ${m.fromAge} until ${A.year55}`:''}. It also requires income of no more than ${money(m.incomeAtMost,0)} a month and a residence with an annual value of no more than ${money(m.avAtMost,0)}, neither of which Fortress holds — but neither matters while the savings test fails.`,
      'Nothing to do. Listed so you know it was checked, not overlooked.',
      m.source);
  }
  /* 5. Budget 2026 senior top-up — same shape */
  if(c){ const t = R.seniorTopUp, top = t.bands[t.bands.length-1];
    push('senior-topup', t.name, false,
      `highest band is retirement savings below ${money(top.below,0)}; yours is ${money(oaSa,0)}`,
      `You are the right age — it covers Singaporeans aged 50 and above in 2026 — but the payment is scaled by retirement savings and the top band published stops at ${money(top.below,0)}. Yours is well above it. It is also scaled by the annual value of your residence — the full amount up to ${money(t.avAtMost,0)}, a reduced ${money(t.avUpperAmount,0)} between that and ${money(t.avUpperTier,0)} — which Fortress does not hold. On the figures it does hold, you fall outside.`,
      `Nothing to do. Paid in ${t.paidIn} if it applies.`,
      t.source);
  }
  /* 6. the ERS transfer — open only from 55 */
  { const Rt = retireAt55();
    const openNow = A ? A.age >= R.raAge : false;
    push('ers', 'Transfer OA into the Retirement Account, up to the ERS', openNow,
      `only available from age ${R.raAge}${A?`; you are ${A.age}`:''}`,
      Rt ? `From ${A?dayLabel(A.date55):'55'} you may move Ordinary Account money into the Retirement Account up to the Enhanced Retirement Sum — ${Rt.B.published?money(Rt.ersRule,0):'4x the Basic Retirement Sum, which is not published for your cohort yet'}. That swaps ${pct(CPF_RULES.oaPct,1)} for ${pct(CPF_RULES.raPct,1)} on the amount moved and buys a larger lifelong payout. <b>It carries no tax relief</b> — relief stops at the FRS. And it is one-way: the money is committed to payouts.`
         : 'Available from 55.',
      openNow?'Decide before the money is swept, not after.':`Decide before ${A?dayLabel(A.date55):'55'}, not on the day.`,
      R.reliefSource);
  }
  /* 7. SRS — no longer a guess: his own account statement answers it */
  { const srs = R.srs, S = srsPosition();
    if(!S){
      push('srs','Supplementary Retirement Scheme', true,
        'Fortress holds no SRS account for you',
        `Up to ${money(srs.capCitizen,0)} a year, deductible, with only ${srs.taxablePct}% of withdrawals taxable at or after your retirement age. Your penalty-free age is fixed at the statutory retirement age <em>prevailing when you make your first contribution</em>.`,
        'Tell Fortress whether an account exists and when it was first funded.', srs.source, true);
    } else {
      push('srs','Supplementary Retirement Scheme — this year\'s allowance', S.headroom>0,
        `${money(S.yearCap,0)} cap for ${S.capYear} less ${money(S.usedThisYear,0)} used = ${money(S.headroom,0)}`,
        `You have <b>${money(S.headroom,0)}</b> of ${S.capYear} allowance left, and the yearly cap does not carry forward — unused room is gone on 31 December. Every dollar contributed is deducted from your assessable income. <b>Fortress does not know your marginal tax rate</b>, so it states the deduction and refuses to compute the tax saved.`,
        `Decide before 31 December ${S.capYear}. Contributing early in a year also gives the money longer to work.`,
        srs.source);
    }
  }
  return out;
}

/* The age-by-age map. Dates come from his birth date; every rule is sourced. */
function retireTimeline(){
  const A = cpfAge(); if(!A) return null;
  const R = RETIRE_RULES, c = latestCpf();
  const yearAt = n => A.year55 - 55 + n;
  const dateAt = n => { const [ , bm, bd ] = A.birthDate.split('-'); return yearAt(n)+'-'+bm+'-'+bd; };
  const row = (age, title, what, source) => ({
    age, year: yearAt(age), date: dateAt(age), days: daysUntil(dateAt(age)),
    past: age < A.age, now: age === A.age, title, what, source });

  const F = frsFor(A.year55), B = brsFor(A.year55);
  return [
    row(A.age, 'You are here', `Contributions run at the full ${R.contribNow[0].total}% rate (${R.contribNow[0].er}% employer, ${R.contribNow[0].ee}% employee) on wages up to ${money(CPF_RULES.owCeiling,0)} a month. OA earns ${pct(CPF_RULES.oaPct,1)}, SA and MediSave ${pct(CPF_RULES.saPct,1)}, plus extra interest on the first ${money(CPF_RULES.extraBelow55.onFirst,0)} of combined balances.`, R.contribSource),
    row(55, 'The Retirement Account is created and the Special Account closes',
      `${R.age55Order.join('; ')}. ${F.published?`Your cohort's Full Retirement Sum is ${money(F.value,0)}.`:`<b>Your cohort's Full Retirement Sum has not been published</b> — the series stops at ${CPF_RULES.frsLastPublished}, so Fortress uses ${money(F.value,0)} and says so.`} You may withdraw whatever sits above it, and at least ${money(R.minWithdraw,0)} even if you are short. From this date you may also top up the Retirement Account to the Enhanced Retirement Sum. Contribution rates step down from ${R.contribNow[0].total}% — <b>to at least ${fmt(R.contrib2027[0].to,1)}%, not the ${R.contribNow[1].total}% shown in today's table</b>, because the senior rates rise on 1 January 2027 and may rise again before you get there.`,
      R.age55Source),
    row(60, 'Contribution rates step down again',
      `Rates fall to ${R.contribNow[2].total}% (${R.contribNow[2].er}% employer, ${R.contribNow[2].ee}% employee) above 60. Note that the senior rates are <em>rising</em>, not falling, on 1 January 2027: ${R.contrib2027.map(x=>`${x.band} from ${x.from}% to ${x.to}%`).join(', ')}.`,
      R.contrib2027Source),
    row(R.retirementAge, 'The statutory retirement age',
      `Your employer cannot dismiss you on grounds of age before ${R.retirementAge}, and must offer re-employment to ${R.reemploymentAge} if you meet the criteria. Both ages rose on ${dayLabel(R.empAgesFrom)}. <b>Do not read these as settled for your year.</b> The published intention is to reach 65 and 70 by 2030, well before you get here, so the ages on this row are today's law and not a forecast of the law you will meet. This is employment law, not CPF — it does not release any money.`,
      R.empSource),
    row(65, 'CPF LIFE payouts can start, and the MediSave cap stops rising',
      `${R.payoutAge} is the payout eligibility age. Your Basic Healthcare Sum is also fixed for life in the year you turn 65 — until then it rises most years (${money(CPF_RULES.prevBhs,0)} in ${CPF_RULES.prevBhsYear} to ${money(CPF_RULES.bhs,0)} in ${CPF_RULES.bhsYear}), and each rise quietly reopens a little MediSave headroom.`,
      R.deferSource),
    row(R.reemploymentAge, 'Re-employment protection ends', `Beyond ${R.reemploymentAge} there is no statutory obligation on an employer to re-employ you.`, R.empSource),
    row(70, 'Payouts start whether you ask or not',
      `If you have given no instruction by ${R.payoutLatest}, payouts begin automatically on the CPF LIFE Standard Plan. Every year you defer between ${R.payoutAge} and ${R.payoutLatest} raises the payout by up to ${R.deferMaxPct}% — but you draw nothing in the meantime, so deferring is a bet on your own longevity, not free money.`,
      R.deferSource)
  ];
}

/* ================= gaps =================
   What Fortress does NOT know, tab by tab. Every entry is a real hole in the data it
   holds - not a hypothetical - and each one is recomputed, so an item disappears the
   moment the missing figure is entered. `blocks` says what the gap actually stops
   Fortress from telling you; `fix` says how to close it. Nothing here is invented:
   if a number is unavailable it is named as unavailable rather than estimated. */
function gaps(){
  const out = [];
  const add = (tab, severity, title, blocks, fix, source) =>
    out.push({ tab, severity, title, blocks, fix, source: source||null });

  const snap = latest(), a = agg(snap), mm = latestManual(), w = netWorth(a);
  const A = cpfAge(), c = latestCpf(), R = CPF_RULES;
  const hc = cpfHomeClaim();
  const p = (typeof alPosition==='function') ? alPosition() : null;
  const BA = (typeof alBasis==='function') ? alBasis() : null;
  const D = (typeof alDividends==='function') ? alDividends() : null;

  /* ---------- Property ---------- */
  if(!state.settings.homePurchasePrice)
    add('prop','high','The purchase price of the house is not recorded',
      'Fortress cannot tell you what the property has actually returned. It shows a valuation and a mortgage, but with no cost it cannot compute a gain, a holding-period return, or how much of your net worth is appreciation versus repayment.',
      'Enter it under \u201cWhat the house cost you\u201d on the Property tab, with the year you bought.');
  { const V=(typeof propertyValue==='function')?propertyValue():null;
    if(V && V.isTxn)
      add('prop', V.monthsSince>12?'high':'medium',
        'The home is carried at a single transaction from '+dayMonthLabel(V.valueDate)+', now '+fmt(V.monthsSince,0)+' months old',
        'One sale of one unit is the whole basis. It is real evidence rather than an estimate, but it knows nothing of your floor, facing or condition, and it does not move until another equivalent unit trades. The portal\u2019s algorithm currently reads '+pct(V.avm?V.avm.vsRef:0,1)+' against it, and its own range spans '+money(V.avm?V.avm.swing:0,0)+' of net worth.'+(V.monthsSince>12?' At over a year old this is now stale.':''),
        'Add the next equivalent sale on the Property tab the moment you see one \u2014 same project, same '+fmt(V.sqft,0)+' sqft.',
        V.source);
    else if(V && V.isAvm && V.band)
      add('prop','high','The home is carried at an automated estimate with a '+money(V.band.width,0)+' range',
        'Fortress must carry one number into net worth, but the honest figure is a band: '+money(V.band.low,0)+' to '+money(V.band.high,0)+'.',
        'A formal valuation would close it.', V.source);
    else if(state.settings.homeValue)
      add('prop','medium','The S$'+fmt(state.settings.homeValue,0)+' valuation is your own figure, not a valuation',
        'Every property percentage on the dashboard moves with this number, including the share of net worth and the CPF claim as a fraction of proceeds.',
        'Re-check it against recent transacted prices in the same development and update the date it was set.',
        'entered by you'); }
  if(!monthlyIncome())
    add('prop','high','No rental income is recorded',
      'Rent cover against the mortgage instalment cannot be computed, so Fortress cannot say whether the property funds itself.',
      'Add the monthly rent on the Property tab.');
  if(state.settings.homeAnnualCosts==null) add('prop','medium','Property running costs are not captured',
    'Rent cover is measured against the instalment alone. Property tax, maintenance, agent fees, insurance and vacancy are not in Fortress, so the true net yield is lower than anything shown.',
    'Add the annual total under \u201cWhat the house cost you\u201d on the Property tab.');

  /* ---------- CPF ---------- */
  if(A){ const F = frsFor(A.year55);
    if(!F.published) add('cpf','high','The '+A.year55+' Full Retirement Sum has not been published',
      'The projection to 55 uses '+money(F.value,0)+', the last published figure. Your cohort\'s sum will be higher, so Fortress currently understates what gets locked into the Retirement Account and overstates what stays liquid in the OA.',
      'Enter it on the CPF tab the moment CPF announces it.',
      'CPF publishes retirement sums a few years ahead; the series stops at '+R.frsLastPublished); }
  add('cpf','medium','Future CPF contributions are an assumption, not a fact',
    'The projection can run with or without contributions, but Fortress does not know your salary, your employer\'s rate, or how long you intend to work. The contribution figure it uses is derived from your recent ledger, not from anything you have told it.',
    'Confirm the monthly contribution and the year you expect it to stop.');
  add('cpf','medium','CPF interest rates are treated as fixed at today\'s floors',
    'OA at '+pct(R.oaPct,1)+' and SA at '+pct(R.saPct,1)+' are statutory floors, reviewed quarterly. A long projection compounds whatever rate it is given, so a change of a quarter-point moves the 55 figure materially.',
    'Re-check the rates each quarter; the CPF tab records when they were last verified ('+esc(R.checkedOn)+').',
    'CPF Board publishes interest rates quarterly');

  /* ---------- Retire ---------- */
  if(A){ const RR=RETIRE_RULES, F=frsFor(A.year55), B=brsFor(A.year55);
    if(!F.published || !B.published)
      add('retire','high','The '+A.year55+' retirement sums have not been published',
        'Both the Full and the Basic Retirement Sum for your cohort are unknown, so the split at 55, the amount withdrawable, and the size of the property-pledge lever are all computed on the last published year and are therefore too low.',
        'Enter them on the CPF tab as soon as CPF announces your cohort.',
        'CPF publishes retirement sums a few years ahead; the series stops at '+CPF_RULES.frsLastPublished);
    { const S=(typeof srsPosition==='function')?srsPosition():null;
      if(!S) add('retire','high','Fortress does not know whether you have an SRS account',
        'The penalty-free withdrawal age is fixed at the statutory retirement age prevailing when you make your FIRST contribution. Fortress cannot say whether that clock has been started for you.',
        'Check with your bank whether an SRS account exists and when it was first funded.', RR.srs.source);

            detail:`The ${esc(r.plan)} attribution vested as ${fmt(r.vest.qty,0)} shares at &euro;${fmt(r.vest.price,2)}. Its adjusted basis is now &euro;${fmt(r.adjPrice,2)}, which everywhere else means the count rose in exact proportion — here it should be about ${fmt(r.expectedQty,0)} shares and the portal shows ${fmt(r.qty,0)}. Roughly ${fmt(Math.abs(r.shortOriginal),0)} of the original ${fmt(r.vest.qty,0)} have left, taking &euro;${fmt(Math.abs(r.shortBasis),2)} of cost basis with them. A sale, a transfer, or a plan adjustment would all look identical from the portal, and Fortress will not guess which. <b>If it was a sale you should have a contract note and a cost basis for it</b> — worth locating before you need it. The other ${fmt(BA.clean.length,0)} checkable tranches tie to within &euro;2, so this is specific to that plan, not a flaw in the method.`,
            source: AL_BASIS_META.source + '; vesting History cross-check' }));
        if(BA) add({ id:'al-unrealised', cat:'standing', tone:'info',
          title:'Unrealised gain sitting in the performance shares',
          head:`€${fmt(BA.gain,0)} on €${fmt(BA.cost,0)} of cost`,
          detail:`${fmt(BA.qty,0)} shares carried at a blended &euro;${fmt(BA.perShare,2)}, worth &euro;${fmt(BA.val,2)} at &euro;${fmt(BA.price,2)} — ${pct(BA.gainPct,1)} on cost, and ${pct(BA.pctOfHolding,1)} of your Air Liquide holding. Every line is marked available, so none of it is blocked from sale. Fortress does <b>not</b> know what tax would fall due on a disposal, in France or in Singapore, and does not estimate it. That is the number to establish before any decision to sell, not after.`,
          source: AL_BASIS_META.source });
      }
      const C = alConcentration();
      if(C) add({ id:'al-concentration', cat:'standing', tone: C.pctOfNet>15?'warn':'info',
        title:'Everything that depends on one employer', head:`${pct(C.pctOfNet,1)} of net worth`,
        detail:`${money(C.sgd,0)} of Air Liquide shares, plus the salary, plus the ${money((cpfLastContribution()||{}).median||0,0)}/month of CPF that salary generates. Three exposures, one company. Nothing you do inside the DBS portfolio diversifies this. The ${fmt(p.blocked,0)} blocked shares cannot be sold at all right now.`,
        source:`Air Liquide account statement, ${esc(p.asOf)}` });
    }
  }
  { const top = Object.entries(a.pledgedCcy||{}).filter(([k])=>k!=='SGD').sort((x,y)=>y[1]-x[1])[0];
    const share = top ? top[1]/a.pledgedAssets*100 : 0;
    if(top) add({ id:'concentration', cat:'standing', tone: share>60?'warn':'info',
      title:'Single-currency concentration', head:`${pct(share,1)} ${esc(top[0])}`,
      detail:`${esc(top[0])} is ${pct(share,1)} of the pledged collateral, against liabilities and living costs that are entirely SGD. Fortress scores this as a wealth risk rather than a margin risk — the FX tab shows why a move of this size barely shifts the LTV — but it is one bet, not five.`,
      source:`DBS statement ${esc(snap.statementDate)}, currency allocation` });
  }
  { const hv = state.settings.homeValue, nw = netWorth(a);
    /* the SAME base the concentration card uses - it must include the Air Liquide shares,
       or the two cards divide by different totals and neither percentage can be trusted */
    if(hv){ const total = nw.dbsUob + hv + (nw.cpf||0) + (nw.al||0);
      const share = hv/total*100;
      if(share>50) add({ id:'property-share', cat:'standing', tone:'info',
        title:'Share of net worth in one property', head:`${pct(share,1)}`,
        detail:`The house is ${money(hv,0)} of a ${money(total,0)} balance sheet. It is illiquid, it takes months to sell, and ${money((cpfHomeClaim()||{}).claim||0,0)} of any sale goes to CPF rather than to you.`,
        source:'your own valuation, entered on the Property tab' });
    }
  }

  const done = state.settings.remindersDone || {};
  return out.map(o=>({ ...o, done: !!done[o.id], doneOn: done[o.id]||null }));
}

function alertList(snap,a){
  const out=[];
  for(const l of a.loans){
    const d=daysUntil(l.maturityDate);
    if(d!==null&&d<=45) out.push({cls:d<=14?'b-warn':'b-good',ic:'⏳',t:`Loan matures in ${d} day${d===1?'':'s'} (${l.maturityDate})`,b:`${l.ccy} ${fmt(Math.abs(l.principal),2)} @ ${l.ratePct}% — decide rollover vs repay before maturity.`});
  }
  for(const f of a.forwards){
    const d=daysUntil(f.maturityDate);
    if(d!==null&&d<=45) out.push({cls:'b-warn',ic:'⇄',t:`FX forward ${f.pair} settles in ${d} day${d===1?'':'s'}`,b:`Sell ${f.sellCcy} ${fmt(Math.abs(f.sellAmt),0)} / buy ${f.buyCcy} ${fmt(f.buyAmt,0)} @ ${f.contractRate}. Current MTM ${money(f.mtmSGD,0)}. Ensure the ${f.sellCcy} leg is funded at settlement.`});
  }
  if(a.ltv!==null && a.ltv>=state.settings.ltvAlert) out.push({cls:'b-serious',ic:'⚠',t:`LTV ${pct(a.ltv,1)} above your ${state.settings.ltvAlert}% alert level`,b:'Consider partial repayment or trimming positions.'});
  if(!state.settings.lendingValue && a.debt>0 && !latestMrtl()) out.push({cls:'b-warn',ic:'ℹ',t:'Lending value not set',b:'DBS statements don’t disclose per-security lending values. Ask your RM for the portfolio’s lending value and enter it in Settings — until then margin lines are illustrative.'});
  {(function(){ const m=latestMrtl(), c=mrtlCapacity(m);
    if(m && c && c.disputed) out.push({cls:'b-warn',ic:'ℹ',t:'DBS shows two different capacity figures',b:`Borrowing potential ${money(m.borrowingPotential,0)} vs available-for-drawdown implying ${money(c.optimistic,0)}. Fortress uses the smaller. Worth one question to Mark Chen.`});
  })();}
  if(a.estMonthlyInterest>0 && a.plMtd < -6*a.estMonthlyInterest) out.push({cls:'b-warn',ic:'📉',t:`This month’s P&L (${money(a.plMtd,0)}) is ${fmt(Math.abs(a.plMtd)/a.estMonthlyInterest,0)}× your monthly interest`,b:'Market risk, not the loan, is the dominant driver of your net worth.'});
  return out;
}

function reminderRow(r){

  const when = r.date ? `${esc(dayLabel(r.date))}${r.days!=null?` · ${r.days>=0?fmt(r.days,0)+' days':'passed '+fmt(-r.days,0)+' days ago'}`:''}` : '';
  return `

    <div class="kv" style="border:none;padding:0">
      <span class="k"><b>${esc(r.title)}</b>${when?`<br><span style="font-size:11px">${when}</span>`:''}</span>
      <span class="v ${cls}">${r.head||''}</span>
    </div>
    <details style="margin-top:4px">
      <summary class="note" style="cursor:pointer;font-size:12px">${r.done?'Dismissed — reopen':'Why this is here'}</summary>
      <p class="note" style="margin-top:6px">${r.detail}</p>
      <p class="note" style="font-size:11px">Source: ${esc(r.source)}</p>
      <button class="btn ghost" style="padding:4px 10px;font-size:12px" onclick="toggleReminder('${esc(r.id)}')">${r.done?'Bring it back':'Dismiss — I have dealt with this'}</button>
    </details>
  </div>`;
}
function remindersCard(){
  const all = retirementChecks();
  if(!all.length) return '';
  const live = all.filter(r=>!r.done), dismissed = all.filter(r=>r.done);
  const dated = live.filter(r=>r.cat==='dated').sort((a,b)=>{
    if(a.days==null) return 1; if(b.days==null) return -1; return a.days-b.days; });
  const standing = live.filter(r=>r.cat==='standing');
  const urgent = live.filter(r=>r.tone==='serious'||r.tone==='warn').length;
  return `
  <div class="card">
    <h2>Reminders<span class="pill">${urgent?urgent+' need attention · ':''}${live.length} live</span></h2>
    <p class="note" style="margin:0 0 4px">Dated items count down from your own documents. The rest are rule tests re-run every time this screen draws — a "closed" here becomes an "open" the moment the numbers change, without anyone editing a note.</p>
    ${dated.length?`<div style="margin-top:8px"><span class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Dated</span>${dated.map(reminderRow).join('')}</div>`:''}
    ${standing.length?`<div style="margin-top:14px"><span class="k" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em">Standing — tested against today's numbers</span>${standing.map(reminderRow).join('')}</div>`:''}
    ${dismissed.length?`<details style="margin-top:14px"><summary class="note" style="cursor:pointer">${dismissed.length} dismissed</summary>${dismissed.map(reminderRow).join('')}</details>`:''}
    <p class="note" style="margin-top:12px"><b>These are prompts, not advice.</b> Fortress does not know your income needs, tax position, family or how long you intend to work — and the age-55 choice in particular turns on all four. Take the arithmetic to someone licensed before acting on it.</p>
  </div>`;
}

    ${c.differ?`<div class="warnbox"><b>These measure different things — that's why they don't add up.</b>

      A is ${money(Math.abs(c.optimistic-c.capacity),0)} ${c.assetBased<c.facilityBased?'lower':'higher'} than B. Fortress uses the smaller (${money(c.capacity,2)}) for the margin metric, so the buffer is never overstated.</div>`:''}
    <p class="note">This is the real margin metric — it uses DBS's own assessment of what your collateral supports, not an assumed advance ratio. On B's more generous basis the buffer would be ${pct(100-m.amountDrawn/c.optimistic*100,1)} rather than ${pct(fall,1)}. Update by importing the Portfolio Summary screen.</p>
    <p class="note"><b>Is ${pct(util,1)} a sensible place to sit?</b> There is no published Singapore benchmark for this — securities-backed lending is a private-bank product, and the overwhelming majority of Singaporean households have <em>no</em> margin borrowing at all, so "vs a typical Singaporean" has no meaningful answer. The comparison that does mean something is against the mechanics: at ${pct(util,1)} used, the collateral can fall ${pct(fall,1)} before a call. Private-bank practice generally treats utilisation under 50% as conservative, 50–70% as needing attention, and 70%+ as leaving little room for a fast drawdown — because the trigger is not the fall itself but being forced to sell into it. You sit in the first band. What would move you up is not markets alone but drawing more.</p>
