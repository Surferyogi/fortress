function viewTrends(){
  const ds=dates(); const snaps=ds.map(d=>({d, a:agg(state.snapshots[d])}));
  const lv=state.settings.lendingValue;
  const one = ds.length===1;
  const ltvSeries=[{name:'LTV',color:'var(--s1)',values:snaps.map(s=>({x:monthLabel(s.d),y:+s.a.ltv.toFixed(2)}))}];
  const refs = lv? [{y:lv,color:'var(--critical)',label:`LV ${lv}%`}] : [{y:50,color:'var(--muted)',label:'50% (illustrative)'}];
  return `
  ${one?'<div class="banner b-warn"><span class="ic">ℹ</span><div><b>One month of data so far</b>Trends build as you import each monthly statement.</div></div>':''}
  <div class="card"><h2>Loan-to-assets over time</h2>${lineChart(ltvSeries,{yFmt:v=>fmt(v,0)+'%',refLines:refs})}</div>
  <div class="card"><h2>Monthly portfolio P&L (S$)</h2>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[{name:'Monthly P&L',color:s.a.plMtd>=0?'var(--div-pos)':'var(--div-neg)',y:Math.round(s.a.plMtd)}]})),{yFmt:v=>fmt(v/1000,0)+'k'})}
    <p class="note">Blue = gain, red = loss. Compare against ~${money(agg(latest()).estMonthlyInterest)} of monthly interest — the bar you can barely see.</p></div>
  <div class="card"><h2>Income vs debt cost (YTD, S$)</h2>
    <div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Dividends + interest received</span><span><span class="sw" style="background:var(--s2)"></span>Interest paid + fees</span></div>
    ${barChart(snaps.map(s=>({x:monthLabel(s.d),vals:[
      {name:'Income YTD',color:'var(--s1)',y:Math.round(s.a.divYtd+s.a.intRecYtd)},
      {name:'Debt cost YTD',color:'var(--s2)',y:Math.round(s.a.intPaidYtd+s.a.feesYtd)}]})),{yFmt:v=>fmt(v/1000,1)+'k'})}
    <p class="note">Positive carry = the portfolio's cash income alone outruns all financing and account costs.</p></div>
  <div class="card"><h2>Net assets (S$)</h2>${lineChart([{name:'Net assets',color:'var(--s3)',values:snaps.map(s=>({x:monthLabel(s.d),y:Math.round(s.a.net)}))}],{yFmt:v=>fmt(v/1e6,2)+'M'})}</div>
`;
}

/* ================= Property tab =================
   Everything about the house in one place: the UOB loan, the rate letters that
   reprice it, the rent that services it, and the equity behind it. The dashboard
   keeps the consolidated debt totals — this tab holds the detail. */
function viewProp(){
  const mm = latestManual();
  const hv = state.settings.homeValue;
  const eff = effectiveLoanTerms();
  const rentM = monthlyIncome();
  const bal = mm?.mortgageBalance ?? null;
  const rateNow = eff.ratePct ?? mm?.mortgageRatePct ?? null;
  const instNow = eff.instalment ?? mm?.mortgagePayment ?? null;
  const impInt = mm ? impliedMortgageInterest(mm.month) : null;
  const paidOff = (MORTGAGE_META.original!=null && bal!=null) ? MORTGAGE_META.original - bal : null;
  // average principal per recorded month — arithmetic on your own entries, never a projection
  const withBal = manualMonths().filter(m=>state.manual[m].mortgageBalance!=null);
  const avgPrin = withBal.length>1
    ? (state.manual[withBal[0]].mortgageBalance - state.manual[withBal[withBal.length-1]].mortgageBalance)/(withBal.length-1)
    : null;
  const pend = pendingRateChanges();
  const today = new Date().toISOString().slice(0,10);
  const hc = cpfHomeClaim();                      // CPF's claim on this same house
  const claims = (bal||0) + (hc? hc.claim : 0);   // everything that must be settled on a sale
  const cashOut = (hv!=null && bal!=null) ? hv - claims : null;
  const pendInst = pend.find(r=>r.instalment!=null && r.instalmentEffective>today) || null;

  if(!mm) return `<div class="banner b-warn"><span class="ic">&#8505;</span><div><b>No home-loan data yet</b>Add a month below, or import a UOB statement, screenshot or rate letter through Add data.</div></div>${propForms()}`;

  return `
  ${(()=>{ const V=propertyValue(); if(!V) return '';
    return `
  <div class="card">
    <h2>What it's worth${V.project?`<span class="pill">${esc(V.project)}${V.unit?' &middot; '+esc(V.unit):''}</span>`:''}</h2>
    <div class="hero">${money(V.value,0)}</div>
    <div class="hero-sub">${V.sqft?`${fmt(V.sqft,0)} sqft &middot; ${money(V.psf,0)} psf &middot; `:''}${V.isTxn?`last equivalent sale, ${esc(dayMonthLabel(V.valueDate))}`:`estimated ${esc(dayMonthLabel(V.asOf||''))}`}</div>

    ${V.isTxn?`
    <div class="warnbox" style="margin-top:12px"><b>This is a transacted price, not an estimate.</b>
      A ${fmt(V.sqft,0)} sqft unit in this project sold for <b>${money(V.value,0)}</b> in ${esc(dayMonthLabel(V.valueDate))} &mdash; the same floor area as yours. Fortress uses it as the reference and will keep using it until a newer equivalent sale replaces it: ${esc(V.equivalentRule||'')}
      <br><br><b>It carries no range, because one sale is one sale.</b> That is a feature of the method, not a claim of precision: a single trade tells you what one buyer paid for one unit on one day, and says nothing about floor, facing or condition &mdash; yours is ${esc(V.unit||'a different unit')}.</div>`:''}

    ${V.monthsSince!=null?`<div class="kv" style="margin-top:12px"><span class="k">Age of the reference</span><span class="v ${V.monthsSince>12?'neg':''}">${fmt(V.monthsSince,0)} month${V.monthsSince===1?'':'s'}<br><span class="k" style="font-size:11px">${V.monthsSince>12?'stale &mdash; a year without a comparable sale':'still recent'}</span></span></div>`:''}

    ${V.avm?`
    <div style="margin-top:12px"><b style="font-size:13px">Cross-check: what the portal's algorithm says</b></div>
    <div class="kv"><span class="k">Estimated value, ${esc(dayMonthLabel(V.avm.asOf))}</span><span class="v">${money(V.avm.value,0)}<br><span class="k" style="font-size:11px">${money(V.avm.psf,0)} psf &middot; <b>${pct(V.avm.vsRef,1)}</b> against the reference</span></span></div>
    <div class="kv"><span class="k">...with its own range<br><span style="font-size:11px">a ${money(V.avm.high-V.avm.low,0)} spread, ${money(V.avm.swing,0)} of net worth</span></span><span class="v" style="font-size:13px">${money(V.avm.low,0)} &ndash; ${money(V.avm.high,0)}</span></div>
    <p class="note">The estimate sits ${pct(Math.abs(V.avm.vsRef),1)} <b>below</b> the last equivalent sale, and the reference sits inside the estimate's own range. The two do not contradict each other &mdash; an algorithm blending ${fmt(V.comps.length,0)} transactions of two different sizes will land under a same-size trade when the smaller units fetch a lower psf, which is what they do here. Fortress leads with the transaction because it is evidence rather than inference, and shows the estimate so you can see the disagreement rather than have it hidden.</p>`:''}

    <div style="margin-top:12px"><b style="font-size:13px">The evidence</b></div>
    <table class="hist" style="margin-top:6px"><tr><th>Sold</th><th>Size</th><th>Price</th><th>psf</th></tr>
      ${V.comps.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>{
        const isRef = V.isTxn && c.date===V.valueDate && c.price===V.value;
        return `<tr${c.sameSize?' style="font-weight:600"':''}>
        <td>${esc(dayMonthLabel(c.date))}${isRef?' <span style="font-size:10px;color:var(--s1)">&#9679; reference</span>':''}</td>
        <td>${fmt(c.sqft,0)} sqft${c.sameSize?' &middot; <span style="font-size:10px">same as yours</span>':''}</td>
        <td>${money(c.price,0)}</td><td>${money(c.psf,0)}</td></tr>`; }).join('')}
    </table>
    <p class="note">${V.sameSize.length>1?`<b>${fmt(V.sameSize.length,0)} of the ${fmt(V.comps.length,0)} match your floor area.</b> ${V.sameSize.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`${esc(dayMonthLabel(c.date))} at ${money(c.psf,0)} psf`).join(' and ')} &mdash; only ${money(Math.abs(V.sameSize[0].psf-V.sameSize[1].psf),0)} psf apart across nearly three years. `:''}The ${fmt(V.comps.length,0)} together span ${money(V.evid.loPsf,0)}&ndash;${money(V.evid.hiPsf,0)} psf, which on ${fmt(V.sqft,0)} sqft is ${money(V.evid.lo,0)}&ndash;${money(V.evid.hi,0)}. That spread is what the market actually shows; it is not a confidence interval and Fortress does not present it as one. Source: ${esc(V.compSource||'')}.</p>

    <div class="kv" style="margin-top:12px"><span class="k">Less the mortgage</span><span class="v">${money(V.equity,0)}<br><span class="k" style="font-size:11px">after ${money(V.mortgage,0)} outstanding</span></span></div>
    ${V.claim?`<div class="kv"><span class="k">Less the CPF refund too<br><span style="font-size:11px">what actually reaches your bank account on a sale</span></span><span class="v">${money(V.afterAll,0)}<br><span class="k" style="font-size:11px">after ${money(V.claim,0)} back to CPF</span></span></div>
    <p class="note">Both the mortgage and the CPF claim are fixed in dollars, so every dollar of valuation uncertainty lands on that last figure. On the portal's low case it would be ${money(V.avm?V.avm.low-V.mortgage-V.claim:0,0)}.</p>`:''}
    <p class="note">Source: ${esc(V.source||'')}. ${esc(V.basisNote||'')}</p>
  </div>

  <div class="card">
    <h2>A newer equivalent sale<span class="pill">replaces the reference</span></h2>
    <p class="note" style="margin-top:0">Enter one when you see it. Fortress only accepts it as the reference if the floor area matches yours (${fmt(V.sqft,0)} sqft) and the date is newer than ${esc(dayMonthLabel(V.valueDate||V.asOf))} &mdash; anything else is stored as a comparable but does not move the headline.</p>
    <label class="fld">Month sold (YYYY-MM)</label>
    <input type="text" id="cmpDate" placeholder="e.g. 2026-11" inputmode="numeric">
    <label class="fld">Floor area (sqft)</label>
    <input type="number" id="cmpSqft" inputmode="numeric" value="${V.sqft||''}">
    <label class="fld">Price (S$)</label>
    <input type="number" id="cmpPrice" step="1" inputmode="decimal" placeholder="e.g. 2500000">
    <button class="btn" style="margin-top:12px" onclick="addComparable()">Add transaction</button>
  </div>`; })()}
  ${pend.length?`<div class="banner b-warn"><span class="ic">&#8599;</span><div><b>${pend.length} rate change not yet in force</b>${pend.map(rc=>{
      const bits=[];
      if(rc.ratePct!=null && rc.rateEffective>today) bits.push('rate '+pct(rc.ratePct,5)+' from '+dayLabel(rc.rateEffective));
      if(rc.instalment!=null && rc.instalmentEffective>today) bits.push('instalment '+money(rc.instalment,2)+' from '+dayLabel(rc.instalmentEffective)+(daysUntil(rc.instalmentEffective)!=null?' ('+daysUntil(rc.instalmentEffective)+' days)':''));
      return esc(rc.lender||'')+': '+bits.join(' &middot; ');
    }).join('<br>')}</div></div>`:''}
  <div class="card">
    <div class="hero">${cashOut!=null?money(cashOut):money(bal,2)}</div>
    <div class="hero-sub">${cashOut!=null
      ? `Cash to you if sold today &middot; ${money(hv)} &minus; loan ${money(bal)}${hc?` &minus; CPF refund ${money(hc.claim)}`:''} &middot; before selling costs`
      : `Home-loan outstanding &middot; ${esc(MORTGAGE_META.bank)} ${esc(MORTGAGE_META.account)} &middot; ${esc(mm.month)} &middot; property value not entered, so equity is not shown`}</div>
    ${cashOut!=null&&hc?`<div class="kv" style="margin-top:10px"><span class="k">Equity before the CPF refund</span><span class="v">${money(hv-bal,2)}</span></div>
    <div class="kv"><span class="k">Of which returns to your CPF</span><span class="v neg">-${money(hc.claim,2)}</span></div>
    <div class="kv"><span class="k"><b>Reaches your bank</b></span><span class="v"><b>${money(cashOut,2)}</b></span></div>`:''}
  </div>
  <div class="tiles">
    ${hv!=null&&bal!=null
      ? `<div class="tile"><div class="v">${money(bal,0)}</div><div class="l">Loan outstanding (${esc(mm.month)})</div><div class="d">${paidOff!==null?money(paidOff,0)+' repaid so far':''}</div></div>`
      : `<div class="tile"><div class="v">${paidOff!==null?money(paidOff,0):'—'}</div><div class="l">Repaid so far</div><div class="d">of ${money(MORTGAGE_META.original,0)} borrowed</div></div>`}
    <div class="tile"><div class="v">${rateNow!=null?pct(rateNow,Number.isInteger(rateNow*100)?2:5):'—'}</div><div class="l">Rate in force</div><div class="d">${eff.rateFrom?'since '+esc(dayLabel(eff.rateFrom)):'floating'}</div></div>
    <div class="tile"><div class="v">${money(instNow,2)}</div><div class="l">Monthly instalment</div><div class="d">${pendInst?`<span class="neg">${money(pendInst.instalment,2)} from ${esc(dayLabel(pendInst.instalmentEffective))}</span>`:(eff.instalmentFrom?'since '+esc(dayLabel(eff.instalmentFrom)):'')}</div></div>
    <div class="tile"><div class="v">${impInt!==null?money(impInt,2):'—'}</div><div class="l">Interest portion this month</div><div class="d">${impInt!==null&&instNow!=null?'principal '+money(instNow-impInt,2):'needs two recorded months + the instalment'}</div></div>
    <div class="tile"><div class="v ${rentM>0?'pos':''}">${rentM>0?money(rentM,2):'—'}</div><div class="l">Rent received / month</div><div class="d">${rentM>0&&instNow?money(rentM-instNow,2)+' left after the instalment':'no recurring rent recorded'}</div></div>
    <div class="tile"><div class="v ${instNow&&rentM>=instNow?'pos':'neg'}">${instNow?pct(rentM/instNow*100,1):'—'}</div><div class="l">Rent cover of instalment</div><div class="d">${instNow&&rentM>=instNow?'self-funding at today&rsquo;s rate':'shortfall comes from your own cash'}</div></div>
    <div class="tile"><div class="v">${avgPrin!=null?money(avgPrin,0):'—'}</div><div class="l">Principal repaid / month</div><div class="d">${avgPrin!=null?'average across '+withBal.length+' recorded months':'needs two recorded months'}</div></div>
    <div class="tile"><div class="v">${hv!=null&&bal!=null?pct(bal/hv*100,1):'—'}</div><div class="l">Mortgage LTV</div><div class="d">${hv!=null?(hc?'loan only &middot; '+pct(claims/hv*100,1)+' incl. CPF':'against the value you entered'):'enter a property value below'}</div></div>
    ${hc?`<div class="tile"><div class="v neg">${money(hc.claim,0)}</div><div class="l">CPF refund due on sale</div><div class="d">growing ${money(hc.monthlyAccrual,2)}/mo</div></div>
    <div class="tile"><div class="v">${avgPrin!=null?money(avgPrin-hc.monthlyAccrual,0):'—'}</div><div class="l">Net equity build / month</div><div class="d">${avgPrin!=null?money(avgPrin,0)+' repaid &minus; '+money(hc.monthlyAccrual,0)+' CPF accrual':''}</div></div>`:''}
  </div>
  ${(()=>{ const mm=latestManual(); if(!mm) return '';
    const impInt = impliedMortgageInterest(mm.month);
    const paidOff = MORTGAGE_META.original && mm.mortgageBalance!=null ? MORTGAGE_META.original - mm.mortgageBalance : null;
    const eff = effectiveLoanTerms();
    const rateNow = eff.ratePct!=null ? eff.ratePct : mm.mortgageRatePct;
    const instNow = eff.instalment!=null ? eff.instalment : mm.mortgagePayment;
    return `
  <div class="card">
    <h2>Home loan — ${esc(MORTGAGE_META.bank)} ${esc(MORTGAGE_META.account)}<span class="pill">manual entry</span></h2>
    <div class="kv"><span class="k">Original loan / term on the UOB screen</span><span class="v">${money(MORTGAGE_META.original,2)} · ${MORTGAGE_META.tenorMonths} months</span></div>
    <div class="kv"><span class="k">Type</span><span class="v">${esc(MORTGAGE_META.type)}</span></div>
    <div class="kv"><span class="k">Repayment account cash (UOB)</span><span class="v">${mm.deposits!=null?money(mm.deposits,2):'— (not entered for '+esc(mm.month)+')'}</span></div>
    ${mm.nextDue?`<div class="kv"><span class="k">Next payment due</span><span class="v">${esc(mm.nextDue)}</span></div>`:''}
    ${mm.note?`<p class="note" style="margin-top:6px">${esc(mm.note)}</p>`:''}
    ${rateChangeBlock(mm, instNow)}
    <p class="note">Implied interest = instalment − principal reduction between your two latest entries (pure arithmetic from UOB statements, no assumptions). A property loan has no market-linked margin call, but its interest is part of the hurdle your portfolio must beat. Update monthly in the form further down this tab.</p>
  </div>`; })()}
  ${(()=>{ const h=cpfHomeClaim(); if(!h) return '';
    const R=CPF_RULES;
    const fundTotal = MORTGAGE_META.original + h.principal;
    const monthsRun = h.monthsRun!=null ? h.monthsRun : null;
    const horizons=[1,5,10,15];
    return `
  <div class="card">
    <h2>CPF in this property<span class="pill">as at ${esc(h.asOf)}</span></h2>
    <div class="kv"><span class="k">Capital drawn from your CPF</span><span class="v">${money(h.principal,2)}</span></div>
    <div class="kv"><span class="k">Original UOB loan</span><span class="v">${money(MORTGAGE_META.original,2)}</span></div>
    <div class="kv"><span class="k"><b>Funded from these two sources</b></span><span class="v"><b>${money(fundTotal,2)}</b></span></div>
    <p class="note">Cash you put in on top of these, and the stamp duty, are not recorded — Fortress shows only what the two statements prove.</p>

    <div style="border-top:1px solid var(--grid);margin-top:12px;padding-top:12px"></div>
    <div class="kv"><span class="k">Accrued interest owed to CPF</span><span class="v neg">${money(h.accrued,2)}</span></div>
    <div class="kv"><span class="k"><b>Total refund on sale</b></span><span class="v"><b>${money(h.claim,2)}</b></span></div>
    <div class="kv"><span class="k">Accruing at ${pct(R.oaPct,1)} p.a.</span><span class="v neg">${money(h.monthlyAccrual,2)}/mo &middot; ${money(h.yearlyAccrual,2)}/yr</span></div>
    ${(()=>{ const f=cpfHousingFlows();
      const draw = f && f.groups.filter(g=>g.amount<0).slice(-1)[0];
      if(draw){
        const drawn = Math.abs(draw.amount);
        const match = Math.abs(drawn - h.principal) < 0.02;
        return `<p class="note">Your CPF ledger dates the withdrawal to <b>${esc(dayLabel(draw.date))}</b>${match?` and its ${money(drawn,2)} matches CPF's published principal to the cent`:` at ${money(drawn,2)}, which does <b>not</b> match the ${money(h.principal,2)} principal on the dashboard — worth checking`}. ${monthsRun!=null?`The accrued interest is ${fmt(monthsRun,1)} months' worth at ${pct(R.oaPct,1)}: CPF starts the meter the month after the money leaves, so ${fmt(monthsRun,0)} months have been charged and the current one is still pending.`:''}</p>`;
      }
      return monthsRun!=null?`<p class="note">CPF's accrued figure is ${fmt(monthsRun,1)} months of interest on ${money(h.principal,0)} at ${pct(R.oaPct,1)}. Import your CPF transaction history to date the withdrawal exactly instead of inferring it.</p>`:'';
    })()}

    <div class="warnbox" style="margin-top:10px"><b>This refund is not a loss of wealth.</b> It moves money from the house back into your CPF Ordinary Account, where it keeps earning ${pct(R.oaPct,1)}. What it costs you is <em>liquidity</em>: ${money(h.claim,0)} of a sale's proceeds never reaches your bank. Net worth is unchanged; cash at completion is ${money(h.claim,0)} lower. Fortress shows both rather than blurring them.</div>

    <div style="margin-top:12px">
      ${horizons.map(y=>`<div class="kv"><span class="k">Refund due in ${y} year${y>1?'s':''}</span><span class="v">${money(cpfClaimIn(y),0)} <span class="k" style="font-size:11px">accrued ${money(cpfClaimIn(y)-h.principal,0)}</span></span></div>`).join('')}
    </div>
    <p class="note">Compounded at the ${pct(R.oaPct,1)} OA rate on the principal still withdrawn. A voluntary refund to CPF stops the meter on whatever you repay; nothing else does. Source: ${esc(h.source)}.</p>
    <button class="btn ghost" style="margin-top:10px" onclick="go('cpf')">Open the CPF tab</button>
  </div>`; })()}
  ${(()=>{ const inc=(state.income||[]).filter(i=>i.endMonth==null); if(!inc.length) return '';
    const mm=latestMrtl?latestManual():null;
    const rentTotal=monthlyIncome();
    const inst=mm?.mortgagePayment ?? null;
    const cover=inst? rentTotal/inst*100 : null;
    return `
  <div class="card">
    <h2>Rental income vs debt service</h2>
    ${inc.map(i=>`<div class="kv"><span class="k">${esc(i.label)}${i.payer?' · '+esc(i.payer):''}</span><span class="v">${money(i.amount,2)}/mo</span></div>`).join('')}
    <p class="note">${cover!=null && cover>=100
      ? 'The tenant services the entire mortgage payment — principal and interest — with '+money(rentTotal-inst,2)+' left over each month. The home loan is self-funding at the current rent and rate; it is the floating rate, not the balance, that would break that.'
      : 'Rent does not fully cover the instalment — the shortfall comes from your own cash flow.'}</p>
    <p class="note">Credited around day ${esc(String(inc[0].dayOfMonth||'?'))} each month to ${esc(inc[0].account||'')}. Source: ${esc(inc[0].source||'manual entry')}.</p>
  </div>`; })()}
  ${(()=>{ const mm=manualMonths(); if(!mm.length) return '';
    const withBal=mm.filter(m=>state.manual[m].mortgageBalance!=null);
    if(withBal.length<2) return '';
    const series=[{name:'Home loan balance',color:'var(--s2)',values:withBal.map(m=>({x:monthLabel(m+'-01'),y:Math.round(state.manual[m].mortgageBalance)}))}];
    const first=state.manual[withBal[0]].mortgageBalance, last=state.manual[withBal[withBal.length-1]].mortgageBalance;
    return `
  <div class="card"><h2>Home loan balance (S$)</h2>
    ${lineChart(series,{yFmt:v=>fmt(v/1e6,3)+'M',zero:false})}
    <p class="note">Down ${money(first-last,0)} across ${withBal.length} months — amortising, and it shrinks whether or not markets cooperate. <b>The axis starts at the range, not at zero</b>, so a ${pct((first-last)/first*100,2)} move is visible at all; read the slope, not the drop. Add each month in the form below.</p></div>`; })()}
  ${(()=>{ const ms=manualMonths().filter(m=>state.manual[m].mortgageBalance!=null);
    const rows=[];
    for(let i=1;i<ms.length;i++){
      const cur=state.manual[ms[i]], prev=state.manual[ms[i-1]];
      if(cur.mortgagePayment==null) continue;
      const prin=prev.mortgageBalance-cur.mortgageBalance, int=cur.mortgagePayment-prin;
      if(!isFinite(prin)||!isFinite(int)) continue;
      const pay=cur.mortgagePayment;
      rows.push({x:monthLabel(ms[i]+'-01'),pay,prin,int,vals:[
        {name:'Principal',color:'var(--s1)',y:Math.round(prin),label:pct(prin/pay*100,1)},
        {name:'Interest',color:'var(--s2)',y:Math.round(int),label:pct(int/pay*100,1)}]});
    }
    if(rows.length<2) return '';
    return `
  <div class="card"><h2>Where each instalment goes (S$)</h2>
    <div class="legend"><span><span class="sw" style="background:var(--s1)"></span>Principal &mdash; becomes your equity</span><span><span class="sw" style="background:var(--s2)"></span>Interest &mdash; the cost</span></div>
    ${barChart(rows,{yFmt:v=>fmt(v,0)})}
    ${rows.map(r=>`<div class="kv"><span class="k">${esc(r.x)} · instalment ${money(r.pay,2)}</span><span class="v" style="font-weight:400">principal ${money(r.prin,2)} · interest <b class="neg">${money(r.int,2)}</b></span></div>`).join('')}

/* An offline-capable app can serve yesterday's code from cache. This is the escape hatch:
   drop the code caches, drop the service worker, reload past the HTTP cache. Data lives in
   localStorage and is not touched by any of it. */
async function forceUpdate(){
  if(!confirm('Clear the cached app code and reload from the server?\n\nYour data (balances, snapshots, settings) is not affected.')) return;
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  try{ if(navigator.serviceWorker){ const rs=await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r=>r.unregister())); } }catch(e){}
  location.replace(location.pathname.replace(/[^/]*$/,'') + '?u=' + Date.now());
}

/* ================= the CPF forward path =================
   THE single source of truth for everything that depends on the age-55 transition.
   Both the CPF tab and the Retire tab read this; neither derives it again. All the
   settings it obeys live on the CPF tab, so there is one place to change them and
   one answer everywhere. This function exists because there used to be two
   projections with different settings, and the two tabs disagreed about the most
   important date in the app without either of them saying so. */
function cpfPlan(){
  const c = latestCpf(); if(!c) return null;
  const A = cpfAge();
  const startYear = +(c.asOf||'').slice(0,4) || new Date().getFullYear();

  /* The year you turn 55 is arithmetic on your date of birth, not a preference. When a
     date of birth is known it wins outright and the stored override is ignored - a value
     that can only ever be set WRONG should not be settable. The override survives solely
     as a fallback for a member who has not given a date of birth. */
  const override = state.settings.cpfAge55Year || null;
  const y55 = A ? A.year55 : override;
  const y55Source = A ? 'birthdate' : (override ? 'override' : 'unset');
  const y55Mismatch = false;                       // no longer reachable: the DOB decides
  const staleOverride = !!(A && override && override !== A.year55);

  /* Contributions ON is the headline: he is working and contributing. The OFF case is
     a stress case, computed here too so the CPF tab can show it as one rather than as
     a rival headline. */
  const withContrib = state.settings.cpfContrib !== false;
  const years = state.settings.cpfYears || 10;

  /* the horizon must always reach 55, or the Retire tab has no transition to read */
  const need = y55 ? Math.max(years, y55 - startYear + 1) : years;
  const rows  = cpfProject(need, withContrib, y55);
  const other = cpfProject(need, !withContrib, y55);

  const at55      = rows.find(r=>r.event && r.event.turns55) || null;
  const at55Other = other.find(r=>r.event && r.event.turns55) || null;

  return { c, A, startYear, y55, y55Source, y55Mismatch, override, staleOverride,
    date55: A ? A.date55 : null,
    withContrib, years, need, rows, other,
    shown: rows.slice(0, years+1),
    at55: at55 ? at55.event : null,
    at55Other: at55Other ? at55Other.event : null,
    /* the gap the two settings produce, so it can be named instead of hidden */
    contribGap: (at55 && at55Other) ? Math.abs(at55.event.oa - at55Other.event.oa) : null,
    last: rows[Math.min(years, rows.length-1)],
    settingsTab:'cpf' };
}

  const c = latestCpf(), h = latestCpfHome();
  return `

    <label class="fld">As at (YYYY-MM-DD)</label><input type="text" id="cpfDate" value="${new Date().toISOString().slice(0,10)}">
    ${fld('cpfOA','Ordinary Account (S$)', c?c.oa:null)}
    ${fld('cpfSA','Special Account (S$)', c?c.sa:null)}
    ${fld('cpfMA','MediSave Account (S$)', c?c.ma:null)}
    <button class="btn" style="margin-top:12px" onclick="saveCpf()">Save balances</button>
    ${cpfDates().length?`<div style="margin-top:12px">${cpfDates().slice().reverse().map(d=>`<div class="kv"><span class="k">${esc(d)}</span><span class="v">${money(cpfTotal(state.cpf[d]),2)} <button class="btn ghost" style="width:auto;padding:2px 8px;font-size:11px;margin-left:8px" onclick="delCpf('${esc(d)}')">×</button></span></div>`).join('')}</div>`:''}
  </div>
  <div class="card"><h2>Update the housing withdrawal</h2>
    <p class="note" style="margin-top:0">From the CPF Home ownership dashboard. Both figures are published there — Fortress never estimates them.</p>
    <label class="fld">As at (YYYY-MM-DD)</label><input type="text" id="cpfHDate" value="${new Date().toISOString().slice(0,10)}">
    ${fld('cpfHPrin','Total principal amount withdrawn (S$)', h?h.principalWithdrawn:null)}
    ${fld('cpfHAccr','Total accrued interest (S$)', h?h.accruedInterest:null)}
    <button class="btn" style="margin-top:12px" onclick="saveCpfHome()">Save</button>
    ${cpfHomeDates().length?`<div style="margin-top:12px">${cpfHomeDates().slice().reverse().map(d=>`<div class="kv"><span class="k">${esc(d)}</span><span class="v">${money((state.cpfHome[d].principalWithdrawn||0)+(state.cpfHome[d].accruedInterest||0),2)} <button class="btn ghost" style="width:auto;padding:2px 8px;font-size:11px;margin-left:8px" onclick="delCpfHome('${esc(d)}')">×</button></span></div>`).join('')}</div>`:''}

function setCpfYears(v){ state.settings.cpfYears = +v||10; saveAll(); render(); }
function setCpfContrib(on){ state.settings.cpfContrib = !!on; saveAll(); render(); }
function setCpf55(v){ state.settings.cpfAge55Year = v===''?null:+v; saveAll(); render(); }
function setBirthDate(v){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){ alert('Date of birth must be a real date.'); return; }
  const y = +v.slice(0,4), now = new Date().getFullYear();
  if(y < 1900 || y > now){ alert('That date of birth looks wrong.'); return; }
  state.settings.birthDate = v;
  state.settings.cpfAge55Year = null;   // the derived year is the only truth from here
  saveAll(); render();
}
function saveFrsOverride(){
  const el=document.getElementById('frsOv'); if(!el) return;
  const v = el.value===''?null:+el.value;
  if(v!==null && (v<50000 || v>2000000)){ alert('That does not look like a Full Retirement Sum.'); return; }
  state.settings.frsOverride = v; saveAll(); render();
}
function saveCpf(){
  const d=(document.getElementById('cpfDate').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('Date must be YYYY-MM-DD.'); return; }
  const oa=gv('cpfOA'), sa=gv('cpfSA'), ma=gv('cpfMA');
  if(oa===null && sa===null && ma===null){ alert('Enter at least one balance.'); return; }
  state.cpf=state.cpf||{};
  state.cpf[d]={ asOf:d, oa, sa, ma, source:(window.__rec?.sourceName||'manual entry') };
  saveAll(); closeModal(); go('cpf');
}
function saveCpfHome(){
  const d=(document.getElementById('cpfHDate').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('Date must be YYYY-MM-DD.'); return; }
  const p=gv('cpfHPrin'), a=gv('cpfHAccr');
  if(p===null){ alert('The principal withdrawn is required.'); return; }
  state.cpfHome=state.cpfHome||{};
  state.cpfHome[d]={ asOf:d, properties:(latestCpfHome()?.properties)??1, principalWithdrawn:p, accruedInterest:a??0,
    source:(window.__rec?.sourceName||'manual entry') };
  saveAll(); closeModal(); go('cpf');
}
function saveCpfHistory(){
  const f=window.__rec?.fields; if(!f||!f.rows?.length){ alert('Nothing to save.'); return; }
  state.cpfTxns = f.rows.slice();
  const also=document.getElementById('cpfAlsoBal');
  if(also && also.checked && f.closing){
    state.cpf = state.cpf||{};
    state.cpf[f.closing.date] = { asOf:f.closing.date, oa:f.closing.oa, sa:f.closing.sa, ma:f.closing.ma,
      source:(window.__rec?.sourceName||'CPF transaction history')+' — closing balance row' };
  }
  saveAll(); closeModal(); go('cpf');
}
function delCpf(d){ if(confirm('Delete CPF balances for '+d+'?')){ delete state.cpf[d]; saveAll(); render(); } }
function delCpfHome(d){ if(confirm('Delete the CPF housing entry for '+d+'?')){ delete state.cpfHome[d]; saveAll(); render(); } }

function saveAl(){
  const d=(document.getElementById('alDate').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('Date must be YYYY-MM-DD.'); return; }
  const tot=gv('alTotal'), blk=gv('alBlocked'), px=gv('alPrice');
  if(tot===null){ alert('Total shares is required.'); return; }
  const prev=latestAl();
  state.al=state.al||{};
  // a hand-entered total replaces the line detail with a single line, and says so
  state.al[d]={ asOf:d, priceEur:px??(prev?prev.priceEur:null), priceDate:d,
    lines:[{ isin:'—', bonusYear:new Date().getFullYear(), type:'Total as entered',
             vintage:new Date().getFullYear(), available:true, qty:tot-(blk||0) },
           ...((blk||0)>0?[{ isin:'—', bonusYear:new Date().getFullYear(), type:'Total as entered',
             vintage:new Date().getFullYear(), available:false, qty:blk }]:[])],
    statedTotal:tot, statedValueEur: px!=null? tot*px : null,
    source:(window.__rec?.sourceName||'manual entry')+' — totals only, line detail not captured' };
  saveAll(); closeModal(); go('al');
}
/* an imported statement carries its line detail; keep it rather than flattening to a total */
function saveAlFromReview(){
  const f=window.__rec?.fields; if(!f){ alert('Nothing to save.'); return; }
  const d=(document.getElementById('alDate').value||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('Date must be YYYY-MM-DD.'); return; }
  const px=gv('alPrice'), tot=gv('alTotal');
  state.al=state.al||{};
  state.al[d]={ asOf:d, priceEur:px, priceDate:d,
    lines: f.lines.length ? f.lines.map(l=>({ isin:l.isin||'—', bonusYear:l.bonusYear||new Date().getFullYear(),
      type:l.type, vintage:l.vintage, available:l.available, qty:l.qty }))
      : [{ isin:'—', bonusYear:new Date().getFullYear(), type:'Total as entered',
           vintage:new Date().getFullYear(), available:true, qty:tot }],
    statedTotal: f.statedTotal ?? tot, statedValueEur: f.value ?? (px!=null&&tot!=null? tot*px : null),
    source:(window.__rec?.sourceName||'imported')+(window.__rec?.viaOcr?' (OCR, reviewed)':' (reviewed)') };
  saveAll(); closeModal(); go('al');
}

function viewFX(){
  const snap=latest(), a=agg(snap);
  const ccys=Object.entries(a.pledgedCcy).sort((x,y)=>y[1]-x[1]);
  const palette=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--muted)','var(--axis)'];
  /* these amounts are the PLEDGED allocation, so they must be divided by pledged assets;
     dividing by total assets made the bars sum to 98.5% and disagreed with every other
     collateral percentage on the tab */
  const items=ccys.map(([c,v],i)=>({label:c,v,pct:v/a.pledgedAssets*100,color:palette[Math.min(i,palette.length-1)]}));
  const loanCcy={}; a.loans.forEach(l=>{loanCcy[l.ccy]=(loanCcy[l.ccy]||0)+Math.abs(l.principal);});
  const rates=snap.fxRates||{};
  const shocks=[-10,-5,5,10];
  const nonSgd=ccys.filter(([c])=>c!=='SGD');
  // margin-call proximity, not just LTV: a shock shrinks the collateral, which shrinks its
  // lending value proportionally, which eats into the buffer between drawn and capacity.
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  const baseBuf = (mr&&cap&&mr.amountDrawn!=null) ? 100-mr.amountDrawn/cap.capacity*100 : null;
  const bufAfter = drop => (baseBuf==null)?null:100-mr.amountDrawn/(cap.capacity*(1-drop))*100;
  const stressRows=nonSgd.map(([c,v])=>{
    const cells=shocks.map(s=>{
      const dA=v*s/100, ltv2=a.debt/(a.pledgedAssets+dA)*100;
      const nb=bufAfter(-dA/a.pledgedAssets);
      return `<td>${money(dA/1000,0).replace('S$','')}k<br><span style="color:var(--muted)">LTV ${fmt(ltv2,1)}%</span>${nb!=null?`<br><span style="color:${s<0?'var(--serious)':'var(--delta-good)'}">buf ${fmt(nb,1)}%</span>`:''}</td>`;
    }).join('');
    return `<tr><td><b>${c}</b><br><span style="color:var(--muted)">${pct(v/a.pledgedAssets*100,1)} of collateral</span></td>${cells}</tr>`;
  }).join('');
  const killRows=nonSgd.map(([c,v])=>{
    const share=v/a.pledgedAssets;
    const need=baseBuf==null?null:baseBuf/share;
    return `<div class="kv"><span class="k"><b>${c}</b> · ${pct(share*100,2)} of collateral</span><span class="v ${need!=null&&need>100?'pos':''}">${need==null?'—':(need>100?'cannot — would need −'+fmt(need,0)+'%':'falls −'+fmt(need,1)+'%')}</span></div>`;
  }).join('');
  const allShare=nonSgd.reduce((t,[,v])=>t+v,0)/a.pledgedAssets;
  const FXS = window.FX_SERIES||{}, avail=Object.keys(FXS);
  const sel = avail.includes(state.settings.fxCcy)? state.settings.fxCcy : avail[0];
  const held = new Set(Object.keys(a.pledgedCcy));
  const chartCard = (()=>{
    if(!sel) return '';
    const bars = state.settings.fxBars||250;
    const ch = candleChart(FXS[sel], {bars});
    const above = k=> ch.ma[k]!=null ? (ch.last>=ch.ma[k]) : null;
    const badge = (k,lbl,col)=> ch.ma[k]==null? '' :
      `<span><span class="sw" style="background:${col}"></span>${lbl} ${ch.ma[k].toFixed(ch.dp)} <b class="${above(k)?'pos':'neg'}">${above(k)?'above':'below'}</b></span>`;
    return `
  <div class="card">
    <h2>1 SGD = ${esc(sel)}<span class="pill">daily · ${esc(ch.from)} → ${esc(ch.to)}</span></h2>
    <select onchange="setFxCcy(this.value)" style="width:100%;background:var(--page);border:1px solid var(--border);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:14px;margin-bottom:4px">
      ${avail.map(c=>`<option value="${esc(c)}"${c===sel?' selected':''}>${esc(c)} — 1 SGD = ${FXS[c].c[FXS[c].c.length-1]} ${esc(c)}${held.has(c)?'  ·  you hold '+money(a.pledgedCcy[c],0):''}</option>`).join('')}
    </select>
    <div class="row2" style="margin:8px 0 6px">
      ${[[120,'6M'],[250,'1Y'],[400,'Max']].map(([b,l])=>`<button class="btn ghost" style="padding:6px 0;font-size:12px;${bars===b?'border-color:var(--ink)':''}" onclick="setFxBars(${b})">${l}</button>`).join('')}
    </div>
    <div class="legend">${badge('m50','MA50','var(--s1)')}${badge('m150','MA150','var(--s4)')}${badge('m200','MA200','var(--s2)')}</div>
    ${ch.svg}
    <div class="kv" style="margin-top:6px"><span class="k">Close · change over window</span><span class="v">${ch.last.toFixed(ch.dp)} <span class="${ch.chg>=0?'pos':'neg'}">${ch.chg>=0?'+':''}${fmt(ch.chg,2)}%</span></span></div>
    <div class="kv"><span class="k">Inverse (1 ${esc(sel)} = ? SGD)</span><span class="v">${(1/ch.last).toFixed(5)}</span></div>
    ${held.has(sel)?`<div class="kv"><span class="k">Your ${esc(sel)} collateral</span><span class="v">${money(a.pledgedCcy[sel],0)} · ${pct(a.pledgedCcy[sel]/a.pledgedAssets*100,1)}</span></div>`:''}
    <p class="note">Quoted as <b>1 SGD = X ${esc(sel)}</b>, so a <b>rising</b> line means SGD strengthening — which makes your ${esc(sel)} assets worth <em>less</em> in SGD. Candles are daily open/high/low/close; green closes up, red closes down. ${esc((window.FX_META||{}).source||'')}. This is an embedded snapshot, not a live feed.</p>
  </div>`;
  })();
  return `
  ${chartCard}
  ${(()=>{ const X=fxExposure(); if(!X||!X.eur||!X.alSgd) return '';
    const E=X.eur, m10=X.move(X.alCcy,-10);
    const items2=X.rows.filter(r=>r.total>0).map((r,i)=>({label:r.ccy, v:r.total, pct:r.pctOfWealth,
      color:['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--muted)','var(--axis)'][Math.min(i,5)]}));
    return `
  <div class="card">
    <h2>Euro exposure<span class="pill">two different things</span></h2>
    <div class="kv"><span class="k">${esc(X.alCcy)} pledged at DBS<br><span style="font-size:11px">collateral — this is what a margin call can reach</span></span><span class="v">${money(E.pledged,0)}<br><span class="k" style="font-size:11px">${pct(E.pctOfCollateral,2)} of collateral</span></span></div>
    <div class="kv"><span class="k">Air Liquide shares<br><span style="font-size:11px">${esc(X.alCcy)}-denominated, <b>not</b> pledged to anyone</span></span><span class="v">${money(X.alSgd,0)}</span></div>
    <div class="kv"><span class="k"><b>Total ${esc(X.alCcy)} you actually own</b></span><span class="v"><b>${money(E.total,0)}</b><br><span class="k" style="font-size:11px">${pct(E.pctOfWealth,1)} of everything you own</span></span></div>

    <div class="warnbox" style="margin-top:10px"><b>The FX tab has been understating your euro exposure by a factor of ${fmt(X.eurMultiple,0)}.</b>
      Every stress table below is built on <em>collateral</em>, because collateral is the only thing that can answer a margin call — and on that measure ${esc(X.alCcy)} is a rounding error at ${pct(E.pctOfCollateral,2)}. But you own ${money(X.alSgd,0)} of Air Liquide shares priced in ${esc(X.alCcy)}, which on its own is ${fmt(X.alSgd/E.pledged,0)}&times; the ${money(E.pledged,0)} sitting at DBS, and takes your total ${esc(X.alCcy)} to ${fmt(X.eurMultiple,1)}&times; the pledged amount. A ${esc(X.alCcy)} fall does not touch your LTV; it takes ${money(Math.abs(m10.onWealth),0)} off your net worth for every 10% it moves, against ${money(Math.abs(m10.onCollateral),0)} of collateral damage.
      <br><br><b>Both statements are true and they are not in conflict.</b> ${esc(X.alCcy)} is a wealth risk, not a margin risk. Fortress keeps the two apart deliberately: folding the shares into the collateral figures would flatter your borrowing capacity with assets DBS cannot lend against, and that is a worse error than understating the currency.</div>

    <div style="margin-top:12px"><b style="font-size:13px">Everything you own, by currency</b></div>
    ${hBars(items2,{yFmt:v=>money(v)})}
    <p class="note">This chart is <b>wealth</b>, not collateral, and the bars sum to your ${money(X.wealthBase,0)} net worth${X.sumsToBase?'':' — <b>except they do not, which is a bug worth reporting</b>'}. Foreign currencies are carried at their asset value; the SGD bar is everything else — the house${state.settings.homeValue?` at ${money(state.settings.homeValue,0)}`:''}, CPF and UOB cash — <em>less every liability</em>, because the mortgage and the margin loan are both SGD. <b>Non-SGD is ${pct(X.nonSgdWealthPct,1)} of your net worth</b>, against ${pct(X.rows.find(r=>r.ccy==='SGD').pctOfWealth,1)} in SGD, while every liability and every living cost you have is SGD. The collateral chart below is a different measure and will not match this one.</p>
    <p class="note">${esc(AL_META.company)} trades in ${esc(X.alCcy)} on ${esc(AL_META.exchange)}; converted at ${fmt((alPosition()||{}).fx,6)} SGD/${esc(X.alCcy)} from the DBS statement's indicative rate. Source: Air Liquide account statement and the DBS statement's FX table.</p>
  </div>`; })()}

  <div class="card"><h2>Currency exposure (collateral, SGD-equivalent)</h2>
    ${hBars(items,{yFmt:v=>money(v)})}
    <p class="note">Loans by currency: ${Object.entries(loanCcy).map(([c,v])=>`${c} ${money(v)}`).join(', ')||'none'}. ${(()=>{const usd=a.pledgedCcy.USD||0; return usd/a.pledgedAssets>0.5 && !loanCcy.USD ? `Mismatch: ${pct(usd/a.pledgedAssets*100,1)} of assets are USD while the loan is ${Object.keys(loanCcy).join('/')||'—'} — a USD fall shrinks assets but not the debt, so LTV and net worth both take the hit.`:''})()}</p>
  </div>
  ${baseBuf!=null?`<div class="card"><h2>What would actually trigger a margin call?</h2>
    <div class="banner b-good" style="margin:0 0 10px"><span class="ic">✔</span><div>
      <b>Today's buffer: ${pct(baseBuf,1)}</b>
      Your collateral's lending value can fall that far before the drawn ${money(mr.amountDrawn,0)} exceeds it. FX is only dangerous to the extent it moves that number.</div></div>
    <p class="note" style="margin-top:0">If <b>only</b> this currency moved and everything else held still, here is the fall it would take — on its own — to consume the entire buffer:</p>
    ${killRows}
    <div class="kv"><span class="k"><b>All non-SGD together</b> · ${pct(allShare*100,2)}</span><span class="v">falls −${fmt(baseBuf/allShare,1)}%</span></div>
    <p class="note">This is why a −10% USD move and a −10% EUR move land so differently. Both cut the collateral by the same <em>proportion of their own exposure</em>, but USD is ${pct((a.pledgedCcy.USD||0)/a.pledgedAssets*100,1)} of the collateral and EUR is ${pct((a.pledgedCcy.EUR||0)/a.pledgedAssets*100,2)} — so the USD move is roughly ${fmt((a.pledgedCcy.USD||0)/Math.max(a.pledgedCcy.EUR||1,1),0)}× the size in dollars, and it eats ${fmt((a.pledgedCcy.USD||0)/Math.max(a.pledgedCcy.EUR||1,1),0)}× as much buffer. Currency risk here is really <b>one</b> risk — USD — wearing five labels.</p>
  </div>`:''}
  <div class="card"><h2>FX stress — collateral, LTV and buffer</h2>
    <table class="hist"><tr><th>vs SGD</th>${shocks.map(s=>`<th>${s>0?'+':''}${s}%</th>`).join('')}</tr>${stressRows}</table>
    <p class="note">Each cell: change in collateral value (S$ thousands), the resulting LTV, and the remaining margin-call buffer${baseBuf!=null?' (from '+pct(baseBuf,1)+' today)':''}.
    <b>Why the LTV barely moves:</b> LTV is debt ÷ collateral, and the debt is only ${pct(a.ltv,1)} of the collateral to begin with — so even a large loss moves the ratio by a point or two. The buffer line is the one to watch, because it measures distance to an actual call rather than a ratio. Loan held constant; computed from this statement's currency allocation at DBS's printed indicative rates.</p>
  </div>
  ${a.forwards.length?`<div class="card"><h2>FX forwards</h2>
    ${a.forwards.map(f=>{
      const d=daysUntil(f.maturityDate);
      const spot=rates[f.sellCcy]||null;
      const sellAbs=Math.abs(f.sellAmt);
      const shock=spot? [5,10].map(s=>`${f.sellCcy} +${s}% → MTM ${money(f.buyAmt - sellAbs*spot*(1+s/100),0)}`).join(' · ') : '';
      const loan=a.loans[0];
      const fundsLoan = loan && f.buyCcy===loan.ccy && Math.abs(f.buyAmt-(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0)))<Math.abs(loan.principal)*0.02 && f.maturityDate===loan.maturityDate;
      return `<div class="kv"><span class="k">Position</span><span class="v">Sell ${f.sellCcy} ${fmt(sellAbs,0)} / Buy ${f.buyCcy} ${fmt(f.buyAmt,0)}</span></div>
      <div class="kv"><span class="k">Contract rate</span><span class="v">${f.contractRate}</span></div>
      <div class="kv"><span class="k">Settles</span><span class="v">${f.maturityDate}${d!==null?` (${d>=0?d+' days':'settled'})`:''}</span></div>
      <div class="kv"><span class="k">Mark-to-market</span><span class="v ${f.mtmSGD>=0?'pos':'neg'}">${money(f.mtmSGD,0)}</span></div>
      ${shock?`<div class="kv"><span class="k">Sensitivity</span><span class="v" style="font-weight:400;font-size:12px">${shock}</span></div>`:''}
      ${fundsLoan?`<p class="note">This forward's ${f.buyCcy} leg (${money(f.buyAmt)}) matches the ${loan.ccy} loan + accrued interest (${money(Math.abs(loan.principal)+Math.abs(loan.accrIntSGD||0))}) and settles on the loan's maturity date — it looks structured to fund the loan repayment. Confirm the ${f.sellCcy} you must deliver at settlement is available, since this statement shows no ${f.sellCcy} assets.`:''}`;
    }).join('')}
  </div>`:''}
  <div class="card"><h2>Indicative FX rates (statement)</h2>
    ${Object.entries(rates).sort().map(([c,v])=>`<div class="kv"><span class="k">1 ${c}</span><span class="v">${fmt(v,c==='JPY'||c==='HKD'?4:4)} SGD</span></div>`).join('')}
  </div>`;
}

function viewRetire(){

  ${Rt?`

    <div class="kv"><span class="k">Enhanced Retirement Sum <span style="font-size:11px">(4&times; the BRS \u2014 <b>not</b> fixed by cohort)</span></span><span class="v">${money(Rt.ersRule,0)}<br><span class="k" style="font-size:11px">on ${CPF_RULES.frsLastPublished} figures; it rises yearly</span></span></div>

    ${Rt.saAlreadyOverFrs?`<div class="warnbox" style="margin-top:10px"><b>Your Special Account alone already covers the Full Retirement Sum.</b> ${money(Rt.sa,0)} against ${money(Rt.F.value,0)}. So at 55 the Retirement Account fills entirely from the SA, none of your Ordinary Account is touched, and the SA remainder of ${money(Math.max(0,Rt.sa-Rt.F.value),0)} joins the OA. On today's balances that leaves <b>${money(Rt.now.oaAfter,0)}</b> sitting in the Ordinary Account — <b>all of it withdrawable in cash.</b></div>`:''}

    ${Rt.at55?`
    <div style="margin-top:12px"><b style="font-size:13px">Projected to ${Rt.A.year55}</b></div>
    ${(()=>{ const ra=cpfEarns(Rt.at55.ra,'RA',55), oa=cpfEarns(Rt.at55.oaAfter,'OA',55);
      return `
    <div class="kv"><span class="k">Into the Retirement Account<br><span style="font-size:11px">earns ${pct(ra.rate,1)} &mdash; ${money(ra.base,0)}/yr, ${money(ra.monthly,0)}/mo</span></span><span class="v">${money(Rt.at55.ra,0)}</span></div>
    <div class="kv"><span class="k">Left in the Ordinary Account<br><span style="font-size:11px">earns ${pct(oa.rate,1)} &mdash; ${money(oa.base,0)}/yr, ${money(oa.monthly,0)}/mo, <b>if you leave it there</b></span></span><span class="v pos">${money(Rt.at55.oaAfter,0)}<br><span class="k" style="font-size:11px">withdrawable from 55</span></span></div>
    <div class="kv"><span class="k">The cost of withdrawing it all</span><span class="v neg">${money(oa.base,0)}/yr<br><span class="k" style="font-size:11px">${money(oa.over10,0)} over ten years</span></span></div>
    <p class="note">Rates are the published floors: OA ${pct(ra.rate===oa.rate?oa.rate:CPF_RULES.oaPct,1)}, RA ${pct(CPF_RULES.raPct,1)}, ${esc(oa.extraNote)}. At ${pct(CPF_RULES.oaPct,1)} money doubles in about ${fmt(oa.doubles,0)} years; at ${pct(CPF_RULES.raPct,1)}, about ${fmt(ra.doubles,0)}. Source: ${esc(oa.source)}.</p>`; })()}
    <p class="note">${(()=>{ const P=Rt.plan; if(!P) return '';
      return `These are <b>the CPF tab's projection</b>, not a second one — same engine, same settings, so the two tabs cannot disagree. It is currently running <b>${P.withContrib?'with':'without'}</b> contributions${P.withContrib&&cpfLastContribution()?` at ${money(cpfLastContribution().median,2)}/month`:''}, and treating your 55th birthday as falling in <b>${P.y55}</b> ${P.y55Source==='birthdate'?'(from your date of birth)':P.y55Source==='override-conflict'?'<b style="color:var(--serious)">(a manual override that disagrees with your date of birth — fix it on the CPF tab)</b>':'(manually set)'}.${P.contribGap?` Turning contributions off would leave ${money(P.contribGap,0)} less in the Ordinary Account at 55; the CPF tab shows that as a stress case.`:''} <b>Change either setting on the CPF tab</b> and this card follows. Neither setting makes it a promise: the rates are reviewed quarterly and your contributions depend on a salary Fortress does not know.`; })()}</p>`:''}

    <div class="warnbox" style="margin-top:10px"><b>Lever 1 — pledge the property and set aside only the Basic Retirement Sum.</b>
      You own a property, so you <em>may be able to</em> set aside as little as the BRS rather than the FRS, with the property covering the difference. <b>One condition Fortress cannot check:</b> ${esc(RETIRE_RULES.pledgeCondition)} Confirm it before counting on this lever at all. Because the FRS is exactly twice the BRS, that frees <b>${money(Rt.freed,0)}</b> more into your Ordinary Account, withdrawable in cash.
      <br><br>Fortress will not tell you to do it. That ${money(Rt.freed,0)} stops earning ${pct(CPF_RULES.raPct,1)} for life and stops producing a monthly payout; you are converting a guaranteed lifelong income into a lump sum today. It only makes sense if you have a better use for the money than a risk-free ${pct(CPF_RULES.raPct,1)} — and "better" has to beat it <em>after</em> tax and risk, not before.</div>

    <div class="warnbox"><b>Lever 2 — go the other way, and top up to the Enhanced Retirement Sum.</b>
      From 55 you may move Ordinary Account savings into the Retirement Account up to ${money(Rt.ersRule,0)}. That is up to <b>${money(Rt.ersHeadroom,0)}</b> of headroom above the FRS${Rt.oaFrs!=null?`, of which your projected OA could fund <b>${money(Rt.ersFundable,0)}</b>`:''}. Money moved swaps ${pct(CPF_RULES.oaPct,1)} for ${pct(CPF_RULES.raPct,1)} — about <b>${money(Rt.ersYearlyGain,0)} a year</b> of rate difference on that amount — and buys a larger lifelong payout.
      <br><br><b>It earns you no tax relief.</b> That is the part most write-ups get wrong: relief on cash top-ups stops at the prevailing Full Retirement Sum, and CPF's own worked example shows the relief as $0 once the recipient has reached it. Do this for the payout and the rate, never for the deduction.</div>

    <p class="note">The two levers point in opposite directions and you can only pick one. Pledging trades lifelong income for cash now; topping up to the ERS trades cash now for lifelong income. Fortress deliberately does not recommend either, because the right answer depends on your health, your other income and how much you value certainty — none of which it holds.</p>
    <p class="note">Sources: ${esc(R.age55Source)}; ${esc(R.pledgeSource)}; ${esc(R.ersSource)}.</p>
  </div>`:''}

  ${(()=>{ const Rt2=retireAt55(); if(!Rt2) return '';
    const P=RETIRE_RULES.payoutTable;
    const opts=[
      { k:'Pledge the property — set aside the BRS', amt:Rt2.B.value, note:'smallest lifelong payout, most cash now' },
      { k:'Do nothing — the FRS is set aside', amt:Rt2.F.value, note:'the default if you never act' },
      { k:'Top up to the ERS', amt:Rt2.ersRule, note:'largest lifelong payout, no cash out' }
    ].map(o=>({ ...o, e:cpfLifeEstimate(o.amt) }));
    const anyExtrap = opts.some(o=>o.e.extrapolated);
    return `
  <div class="card">
    <h2>What the monthly payout could be<span class="pill">derived, not CPF's figure for you</span></h2>
    <div class="warnbox" style="margin-bottom:10px"><b>Read this before the numbers.</b> CPF has published a payout illustration for <b>one</b> cohort — members turning 55 in ${P.cohort55} and 65 in ${P.cohort65} — on the <b>${esc(P.plan)}</b> only. You turn 55 in ${Rt2.A.year55} and 65 in ${Rt2.A.year55+10}. <b>Your cohort's table does not exist yet.</b> What follows is Fortress interpolating within CPF's published points and labelling every step. It is an <em>order of magnitude</em>, not your payout.</div>

    ${opts.map(o=>`
    <div class="kv"><span class="k">${esc(o.k)}<br><span style="font-size:11px">set aside ${money(o.amt,0)} &middot; ${esc(o.note)}</span></span><span class="v">${money(o.e.lo,0)}&ndash;${money(o.e.hi,0)}<br><span class="k" style="font-size:11px">a month, from 65</span></span></div>
    <p class="note" style="margin:2px 0 8px">${o.e.extrapolated?'<b style="color:var(--serious)">Extrapolated</b>':'Interpolated'} ${esc(o.e.basis)}. That works out at ${money(o.e.perLakhLo,0)}&ndash;${money(o.e.perLakhHi,0)} a month per ${money(100000,0)} set aside.</p>`).join('')}

    <p class="note"><b>The rate per dollar falls as the sum rises.</b> CPF's own table pays ${money(P.rows[0].lo/P.rows[0].set*100000,0)}&ndash;${money(P.rows[0].hi/P.rows[0].set*100000,0)} a month per ${money(100000,0)} at the ${money(P.rows[0].set,0)} point but only ${money(P.rows[P.rows.length-1].lo/P.rows[P.rows.length-1].set*100000,0)}&ndash;${money(P.rows[P.rows.length-1].hi/P.rows[P.rows.length-1].set*100000,0)} at the ${money(P.rows[P.rows.length-1].set,0)} point. So scaling one published figure up or down in a straight line gives the wrong answer, and Fortress interpolates between the points instead.</p>

    ${anyExtrap?`<div class="warnbox"><b>One of these is beyond CPF's published range.</b> ${money(Rt2.ersRule,0)} sits above CPF's highest published point of ${money(P.rows[P.rows.length-1].set,0)}, so that row is an extrapolation of the last segment rather than an interpolation between two known points. Treat it as the weakest number on this page.</div>`:''}

    <p class="note"><b>What would move these.</b> ${esc(P.caveat)}. The table ${esc(P.assumption)}. The Basic and Escalating plans pay differently and Fortress holds no table for either. And your ${Rt2.A.year55} retirement sums are themselves unpublished, so the amounts feeding this are the ${Rt2.F.published?'published':'last published'} figures.</p>
    <p class="note"><b>For a real number, use CPF's own planner.</b> It knows your cohort, your plan and your actual balance. Fortress will not reproduce its output as if it were its own.<br>Source: ${esc(P.source)}.</p>
  </div>`; })()}

  <div class="card">
    <h2>What you can do now<span class="pill">${L.filter(x=>x.open).length} of ${L.length} open</span></h2>
    <p class="note" style="margin-top:0">Each lever below is tested against your own balances every time this page renders. A "closed" here is a computation, not an opinion — and it reopens itself the moment the numbers change.</p>
    ${L.map(x=>`
    <div class="kv"><span class="k">${esc(x.name)}</span><span class="v ${x.open?'pos':''}" style="font-size:12px">${x.unknown?'needs a fact Fortress lacks':x.open?'OPEN':'closed'}</span></div>
    <p class="note" style="margin:2px 0 4px"><b>Test:</b> ${esc(x.test)}</p>
    <p class="note" style="margin:0 0 4px">${x.detail}</p>
    <p class="note" style="margin:0 0 12px"><b>Action:</b> ${esc(x.action)}<br><span style="font-size:10.5px">Source: ${esc(x.source)}</span></p>`).join('')}
  </div>

  ${(()=>{ const S=srsPosition(); if(!S) return '';
    const R=RETIRE_RULES, srs=R.srs;
    return `
  <div class="card">
    <h2>SRS<span class="pill">${esc(S.bank)} &middot; locked at ${S.lockedAge}</span></h2>
    ${S.beat?`
    <div class="warnbox" style="margin-bottom:10px"><b>You beat the change by ${fmt(S.daysSpare,0)} days.</b>
      Your first contribution was <b>${esc(dayLabel(S.firstContribution))}</b>. The statutory retirement age rose from <b>${S.lockedAge}</b> to <b>${S.currentAge}</b> on <b>${esc(dayLabel(S.nextEraFrom))}</b> — ${fmt(S.daysSpare,0)} days later. Because the SRS withdrawal age is fixed at the retirement age <em>prevailing on the day of your first contribution</em>, yours is locked at <b>${S.lockedAge}</b> for life. Anyone opening an account today is locked at ${S.currentAge}.
      <br><br>That is a whole year of earlier penalty-free access, bought with a ${money(S.totalContributed,2)} contribution. Fortress cannot tell you whether the timing was deliberate — a ${money(S.totalContributed,2)} contribution against a ${money(S.yearCap,0)} cap is the known way to start the clock, but intent is not something a bank statement records.</div>`:`
    <div class="kv"><span class="k">Withdrawal age, locked at first contribution</span><span class="v">${S.lockedAge}</span></div>`}

    <div class="kv"><span class="k">Account</span><span class="v" style="font-size:12px">${esc(S.bank)} ${esc(S.account)}</span></div>
    <div class="kv"><span class="k">First contribution</span><span class="v">${esc(dayLabel(S.firstContribution))}</span></div>
    <div class="kv"><span class="k">Contributed to date</span><span class="v">${money(S.totalContributed,2)}</span></div>
    <div class="kv"><span class="k">Penalty-free from age ${S.lockedAge}</span><span class="v">${esc(dayLabel(S.withdrawFrom))}<br><span class="k" style="font-size:11px">in ${fmt(S.daysToWithdraw/365.25,1)} years</span></span></div>
    <div class="kv"><span class="k">Ten-year window, <b>if</b> you draw on day one<br><span style="font-size:11px">${esc(dayLabel(S.earliestWindowStart))} &rarr; ${esc(dayLabel(S.earliestWindowEnd))}</span></span><span class="v" style="font-size:12px">earliest case only</span></div>

    <div class="warnbox"><b>The ten-year clock is not a calendar deadline.</b> ${esc(srs.windowRule)} If you take nothing until 68, the window runs from 68 to 78. So <b>${esc(dayLabel(S.earliestWindowEnd))} is only the date it would end if you withdrew on the very first day you were allowed to</b> &mdash; Fortress shows it as the earliest case, not as a deadline, because treating it as one would push you into drawing money earlier than you need to.
      <br><br><b>What the end of the window actually does:</b> ${esc(srs.deemedRule)} That is the reason to spread withdrawals across the ten years rather than leave a balance to the end &mdash; not the date itself, but the fact that the concession stops sheltering what is left.
      <br><br><b>One exception:</b> ${esc(srs.annuityRule)}</div>

    <div class="kv" style="margin-top:10px"><span class="k"><b>${S.capYear} allowance still unused</b><br><span style="font-size:11px">does not carry forward — gone on 31 Dec</span></span><span class="v pos"><b>${money(S.headroom,0)}</b><br><span class="k" style="font-size:11px">of a ${money(S.yearCap,0)} cap</span></span></div>

    <div class="warnbox"><b>What Fortress will not compute: your tax saving.</b> An SRS contribution is deducted from your assessable income, so what it is worth depends entirely on your marginal rate — which Fortress does not hold and will not guess. It can tell you the deduction is up to ${money(S.headroom,0)} this year; it cannot tell you what that is worth to you. On withdrawal only ${srs.taxablePct}% of what you take out is taxable, spread over up to ${srs.window} years, which is the other half of the arithmetic and equally dependent on your rate then.</div>

    ${S.cashBalance!=null && S.invested===0 ? `<div class="warnbox"><b>The balance is sitting in cash.</b> ${money(S.cashBalance,2)} uninvested. On ${money(S.cashBalance,2)} that is immaterial — but if you use the ${money(S.headroom,0)} of ${S.capYear} room, uninvested SRS cash earns a token deposit rate while your CPF pays ${pct(CPF_RULES.oaPct,1)}&ndash;${pct(CPF_RULES.saPct,1)}. Contributing for the deduction and then leaving it in cash is a common and expensive habit. What to invest it in is not something Fortress advises on.</div>`:''}

    <p class="note"><b>The rule, stated exactly:</b> ${esc(srs.ageRule)}</p>
    <p class="note">Early withdrawal — before ${S.lockedAge} — costs a ${srs.penaltyPct}% penalty <em>and</em> the whole amount is taxable, not half. Cap is ${money(srs.capCitizen,0)} a year for citizens and PRs.</p>
    <p class="note">Sources: ${esc(S.source)}. ${esc(srs.source)}. ${esc(srs.windowSource)} ${esc(R.retirementAgeHistorySource)}.</p>
  </div>`; })()}

  <div class="card">
    <h2>What Fortress will not tell you</h2>
    <p class="note" style="margin-top:0"><b>Your actual monthly payout.</b> The card above gives a range derived from CPF's published illustration for a <em>different</em> cohort on one plan, and labels every interpolation. It is not your payout and Fortress does not pretend otherwise: your cohort's table has not been published, the Basic and Escalating plans differ, and CPF says payouts may be adjusted for interest rates and life expectancy. Use CPF's own planner for a figure to rely on.</p>
    <p class="note"><b>Whether you can afford to retire.</b> That is income against spending over thirty years. Fortress measures balance sheets. It does not know your salary, your expenses, or what you intend your retirement to cost — so it cannot answer the only question that really matters here.</p>
    <p class="note"><b>What inflation does to any of this.</b> Every figure on this tab is in today's dollars. The retirement sums rise each year (roughly ${pct(frsTrend().avg,1)} a year across the published series), which is partly why they rise — but Fortress does not deflate anything, and you should read every long-dated number as nominal.</p>
    <p class="note"><b>Anything about tax.</b> Neither the tax on a CPF withdrawal, nor on an SRS withdrawal, nor on the Air Liquide shares. Fortress holds no tax rules for you and states none.</p>
  </div>`;
}

function viewHist(){

}

         <button class="btn ghost" onclick="disableLock()">Turn the lock off</button>`
      : `<p class="note" style="margin-top:0">Set a passphrase once. Fortress then encrypts everything it stores on this device and asks for it each time you open the app.</p>

         <button class="btn" style="margin-top:12px" onclick="enableLock()">Enable lock</button>`}
    <p class="note"><b>Be clear about what this does and does not do.</b> It encrypts your <em>data</em> at rest in this browser, so someone with your unlocked phone cannot read your balances by opening the app, and the localStorage contents are meaningless without the passphrase. It is <em>not</em> a server login: the app's own code sits on a public GitHub Pages URL, and anyone who reaches that URL gets the empty app. There is <b>no recovery</b> — the passphrase is never stored, so keep a JSON backup (History → Export) before you enable it.</p>

    <div class="kv"><span class="k">Seed version on this device</span><span class="v">${store.get('fortress.seedVersion',0)} of ${SEED_VERSION}</span></div>
    <button class="btn ghost" style="margin-top:10px" onclick="store.set('fortress.seedVersion',0);const n=runSeedMigrations();alert(n?n+' item(s) merged.':'Already up to date — nothing was missing.');render();">Re-run seed merge</button>
  </div>
  <div class="card"><h2>Data</h2>
    <p class="note">Everything is stored only in this browser (localStorage). Use Export in History for a backup before clearing browser data.</p>
    <button class="btn ghost" style="margin-top:8px" onclick="if(confirm('Delete all snapshots, home-loan entries and settings?')){['fortress.snapshots','fortress.manual','fortress.income','fortress.mrtl','fortress.lv','fortress.reported','fortress.rateChanges','fortress.cpf','fortress.cpfHome','fortress.cpfTxns','fortress.al','fortress.settings'].forEach(k=>localStorage.removeItem(k));location.reload();}">Clear all data</button>
  </div>
  <div class="card"><h2>About</h2>
    <div class="kv"><span class="k">Version</span><span class="v">${VERSION}</span></div>
    <div class="kv"><span class="k">Source of figures</span><span class="v" style="font-weight:400">DBS Treasures Private Client eStatements you import; parsed on-device</span></div>
    <button class="btn ghost" style="margin-top:10px" onclick="forceUpdate()">Check for an update now</button>
    <p class="note">Fortress installs as an offline app, so an old copy can keep running after you publish a new one. This clears the app's cached code and reloads from the server. <b>Your data is untouched</b> — balances, snapshots and settings live separately. The version number above is the check: compare it with the one in the release you published. You can also tap the version at the top of any screen.</p>
    <p class="note">Fortress is a personal monitoring tool, not financial advice. Margin-call estimates depend on lending values that only DBS can confirm; scenario lines shown without a configured lending value are illustrative arithmetic, not DBS figures.</p>
  </div>`;
}

/* ================= plain English =================
   The same facts as the rest of the app, said the way you would say them out loud.
   Every number is live - nothing here is a fixed sentence with a figure typed into it,
   so these summaries cannot drift away from the cards below them. Where Fortress does
   not know something, the plain version says "not known" rather than smoothing over it. */
function plainSummary(tab){
  const snap=latest(), a=agg(snap), mm=latestManual(), w=netWorth(a);
  const M = n => money(n,0);
  const nw = w.dbsUob + (state.settings.homeValue||0) + (w.cpf||0) + (w.al||0);
  const mr=latestMrtl(), cap=mrtlCapacity(mr);
  const buf = (mr&&cap&&mr.amountDrawn!=null) ? 100-mr.amountDrawn/cap.capacity*100 : null;
  const p=(typeof alPosition==='function')?alPosition():null;
  const C=(typeof alConcentration==='function')?alConcentration():null;
  const c=latestCpf(), A=cpfAge();
  const X=(typeof fxExposure==='function')?fxExposure():null;
  const inc=monthlyIncome(), eff=effectiveLoanTerms();
  const instal = eff.instalment ?? mm?.mortgagePayment ?? null;
  const D=(typeof alDividends==='function')?alDividends():null;
  const BA=(typeof alBasis==='function')?alBasis():null;
  const G=gapsFor(tab), hi=G.filter(g=>g.severity==='high').length;

  const T = {
    dash: {
      lead:`You are worth about <b>${M(nw)}</b>. The main thing to watch is how much you have borrowed against your investments.`,
      points:[
        `Your investments at DBS are worth <b>${M(a.pledgedAssets)}</b>, and you have borrowed <b>${M(a.debt)}</b> against them. That is <b>${pct(a.ltv,1)}</b> — for every $100 of investments, $${fmt(a.ltv,0)} is borrowed money.`,
        buf!=null?`If those investments fell about <b>${pct(buf,0)}</b>, the bank could demand you pay some of the loan back straight away. That is called a margin call. Right now you are a long way from it.`:null,
        `The house is worth <b>${M(state.settings.homeValue||0)}</b> and you still owe <b>${M(mm?.mortgageBalance||0)}</b> on it.`,
        `Your CPF is <b>${M(w.cpf||0)}</b>. You cannot spend most of it yet.`,
        p?`Your Air Liquide shares are <b>${M(p.sgd)}</b>${C?` — that is <b>${pct(C.pctOfNet,0)}</b> of everything you own, in the company that also pays your salary`:''}.`:null,
        `<b>The big unknown:</b> Fortress sees what you own, not what you earn or spend. It cannot tell you whether your income covers your bills.`
      ]},
    prop: {
      lead:`The house is worth about <b>${M(state.settings.homeValue||0)}</b>. You still owe <b>${M(mm?.mortgageBalance||0)}</b>, so your share of it is roughly <b>${M((state.settings.homeValue||0)-(mm?.mortgageBalance||0))}</b>.`,
      points:[
        instal!=null?`You pay <b>${money(instal,0)}</b> a month.${inc?` The rent brings in <b>${money(inc,0)}</b>, which covers <b>${pct(inc/instal*100,0)}</b> of it.`:''}`:null,
        eff.ratePct!=null?`The interest rate is <b>${pct(eff.ratePct,2)}</b> and it is <b>floating</b> — it can change, and the bank writes to tell you when it does.`:null,
        `Every payment splits two ways: part is interest, which is gone, and part reduces what you owe. Only the second part builds your wealth.`,
        (typeof cpfHomeClaim==='function'&&cpfHomeClaim())?`You used <b>${M(cpfHomeClaim().principal)}</b> of CPF to buy it. If you sell, <b>${M(cpfHomeClaim().claim)}</b> goes back to CPF, not to your bank account.`:null,
        state.settings.homePurchasePrice?null:`<b>Not known:</b> what you paid for it. Without that, Fortress cannot say whether the house has been a good investment.`
      ]},
    cpf: {
      lead:c?`You have <b>${M(cpfTotal(c))}</b> in CPF. It earns ${pct(CPF_RULES.oaPct,1)}–${pct(CPF_RULES.saPct,1)} a year risk-free, which is more than most savings accounts.`:`No CPF balances are loaded yet.`,
      points:c?[
        `It sits in three pots: <b>${M(c.oa)}</b> Ordinary (housing and some investing), <b>${M(c.sa)}</b> Special (retirement, higher interest), <b>${M(c.ma)}</b> MediSave (healthcare).`,
        A?`At <b>55</b>, in ${A.year55}, the rules change. The Special Account closes, a set amount moves into a Retirement Account, and whatever is left over becomes money you can actually withdraw.`:null,

        (typeof cpfSaOverFrs==='function'&&cpfSaOverFrs())?`Your Special Account is already above the current Full Retirement Sum, so the usual advice to "top up your SA for the tax relief" is <b>closed to you</b>. Fortress checks this every time it loads.`:null,
        `<b>Not known:</b> the retirement sum for your year. CPF has not published it yet, so the projection uses the last published figure and is therefore a little optimistic about how much stays liquid.`
      ]:[]},
    retire: (()=>{ const Rt=(typeof retireAt55==='function')?retireAt55():null;
      const RR=RETIRE_RULES, LL=(typeof retireLevers==='function')?retireLevers():[];
      if(!A||!c) return { lead:'Add your date of birth and a CPF balance and this fills itself in.', points:[] };

      points:[
